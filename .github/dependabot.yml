version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    # kfake is a separate pseudo-versioned test module; the updater incorrectly
    # follows parent franz-go semver tags that do not contain this package.
    ignore:
      - dependency-name: github.com/twmb/franz-go/pkg/kfake
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /cmd/dashboard/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
