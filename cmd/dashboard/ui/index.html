    <button className="brief-more" onClick=${onAll}>Read all findings <span>→</span></button>
  </aside>`;
}

function ClearOverview({ rep, g, onExplore }) {
  const steps = sel.steps(rep);
  const sum = key => steps.reduce((n, s) => n + (s[key] || 0), 0);
  const attempted = steps.reduce((n, s) => n + (s.calls_attempted ?? s.calls ?? 0), 0);
  const connectedKnown = steps.length > 0 && steps.every(s => Number.isFinite(s.calls_connected));
  const connected = sum("calls_connected");
  const j = rep.judge;
  const judged = !!(j && j.judged > 0);
  const passed = steps.filter(s => s.verdict === "pass");
  const capacity = passed.length ? Math.max(...passed.map(s => s.concurrency || 0)) : null;
  const peak = Math.max(0, ...steps.map(s => s.concurrency || 0));
  const failed = steps.find(s => s.verdict === "fail");
  const waits = steps.filter(s => s.ttfa && s.ttfa.n > 0 && Number.isFinite(s.ttfa.p95_ms)).map(s => s.ttfa.p95_ms);
  const title = !steps.length ? "No test results yet."
    : judged ? `${j.passed} of ${j.judged} reviewed calls completed the task.`
    : "Calls were tested. Task completion is still unknown.";
  const actions = [];
  if (g.degraded.length) actions.push({tab: "load", title: "Check the test setup before trusting the result", body: "The system placing test calls fell behind its schedule. This may affect the measurements."});
  if (judged && j.passed < j.judged) actions.push({tab: "quality", title: `Review ${j.judged - j.passed} calls that missed the task`, body: "See which requirements were missed and the conversation evidence behind each result."});
  if (failed) actions.push({tab: "load", title: `Investigate the failed stage at ${failed.concurrency} calls at once`, body: "A test check failed against the starting stage. Inspect reply speed and connection results to understand why."});
  else if (steps.some(s => s.verdict === "warn")) actions.push({tab: "load", title: "Review the stages with a warning", body: "Some test checks need a closer look before you increase the number of simultaneous calls."});
  if (!judged) actions.push({tab: "quality", title: "Measure whether callers got what they needed", body: "Task completion was not evaluated. Include a task review in the next test; connected calls alone do not prove success."});
  if (g.netBreaks.length) actions.push({tab: "network", title: "Review failures on poorer connections", body: "Some simulated connection conditions reached a failure point. Check which conditions changed the result."});
  return html`<div className="clear-overview">
    <section className="result-story" aria-label="Evaluation summary">
      <span className="eyebrow">AT A GLANCE</span>
      <h2>${title}</h2>
      <p>These are simulated callers speaking to your real phone assistant. Results describe this test, not every future customer call.</p>
      <div className="result-scope"><span>${judged ? `${j.judged} calls reviewed for task completion` : "Task completion: not measured"}</span><span>${peak ? `Tested up to ${peak} calls at once` : "Capacity: not measured"}</span></div>
    </section>

    <section className="outcome-grid" aria-label="Key results">
      <button className="outcome" onClick=${() => onExplore("quality")}><span>Tasks completed</span><strong>${judged ? pct(j.passed / j.judged) : "Not measured"}</strong><p>${judged ? `${j.passed} of ${j.judged} reviewed calls met all task requirements.` : "We cannot yet tell whether the assistant did what callers asked."}</p><span className="outcome-link">Review task results →</span></button>
      <button className="outcome" onClick=${() => onExplore("load")}><span>Calls handled at once</span><strong>${capacity === null ? "Not established" : capacity}</strong><p>Highest tested level that passed the checks against the starting stage. This is not a guaranteed capacity.</p><span className="outcome-link">Explore capacity →</span></button>
      <button className="outcome" onClick=${() => onExplore("load")}><span>Wait before a reply</span><strong>${waits.length ? (Math.max(...waits) / 1000).toFixed(2) + " sec" : "Not measured"}</strong><p>Slow-reply threshold in the worst test stage: 95% of measured replies started within this time.</p><span className="outcome-link">Explore reply speed →</span></button>
      <button className="outcome" onClick=${() => onExplore("cost")}><span>Cost per call attempt</span><strong>${g.stats[2].value === "—" ? "Not priced" : g.stats[2].value}</strong><p>${keyed(g.stats[2].note)}</p><span className="outcome-link">Review costs & assumptions →</span></button>
    </section>

    <div className="story-grid">
      <section className="test-story" aria-labelledby="what-happened"><h2 id="what-happened">What happened in this test</h2><p>Scenario: <strong>${rep.scenario || "Not specified"}</strong></p>
        <ol className="test-sequence"><li><strong>${attempted} calls attempted</strong><span>Simulated callers contacted the assistant across ${steps.length} test stages.</span></li><li><strong>${connectedKnown ? `${connected} calls connected` : "Connection count not recorded"}</strong><span>${connectedKnown ? `${Math.max(0, attempted - connected)} attempts did not connect. A connection does not mean the task was completed.` : "This report does not include a complete connection count."}</span></li><li><strong>${judged ? `${j.judged} calls reviewed · ${j.passed} completed the task` : "Task completion not reviewed"}</strong><span>${judged ? "Reviewed calls were checked against the scenario’s requirements." : "A task review is needed to establish what was achieved."}</span></li></ol>
        <button className="outline" onClick=${() => onExplore("calls")}>Read the conversations →</button>
      </section>
      <section className="attention-story" aria-labelledby="needs-attention"><h2 id="needs-attention">${actions.length ? "What to do next" : "What to check next"}</h2><p>${actions.length ? "Start here, then use the evidence to decide." : "No load or task issues were flagged in these checks. Other measurements may still need review."}</p>
        <div className="action-list">${actions.map((a, i) => html`<button key=${a.title} onClick=${() => onExplore(a.tab)}><span className="action-number">${i + 1}</span><span><strong>${a.title}</strong><span>${a.body}</span><em>View supporting results →</em></span></button>`)}</div>
        ${!actions.length && html`<button className="outline" onClick=${() => onExplore("conversation")}>Check speaking & listening →</button>`}
      </section>
    </div>
  </div>`;
}

function Report({ rep, id, refs, runs, prev, initialTab, initialDrawer, initialCalls, initialInsights, initialSuiteInsights, onOpenRuns, onPick }) {
  const [studioMode, setStudioMode] = useState(initialTab ? "evidence" : "overview");
  useEffect(() => { const overview = () => setStudioMode("overview"); window.addEventListener("studio-overview", overview); return () => window.removeEventListener("studio-overview", overview); }, []);
  const [tab, setTabRaw] = useState(initialTab || TABS[0].id);
  const [point, setPoint] = useState(0);
  const [criterion, setCriterion] = useState(null);
  const [metric, setMetric] = useState("p95");
  const [compare, setCompare] = useState(true);
  const [drawer, setDrawer] = useState(initialDrawer || null);
  // The calls file: undefined until read, null when the run kept none.
  const [calls, setCalls] = useState(initialCalls);
  const [callStep, setCallStep] = useState("");
  const [callCohort, setCallCohort] = useState("");
  const [query, setQuery] = useState("");
  const [selectedCall, setSelectedCall] = useState(0);
  const [callLimit, setCallLimit] = useState(30);
  const setTab = t => { setStudioMode("evidence"); setTabRaw(t); setPoint(0); };
  const closeDrawer = React.useCallback(() => setDrawer(null), []);

  // Pricing a run the harness did not price: the tier and rate the reader
  // chose, and the other parts' calls files when the run is part of a suite.
  const [tier, setTier] = useState("standard");
  const [rateOverride, setRate] = useState(null);
  const [suiteCalls, setSuiteCalls] = useState({});
  const [partReports, setPartReports] = useState({});

  // Unpriced reports need connection times on arrival so the overview can
  // show cost without a visit to the Cost tab. Priced reports load calls
  // when transcripts or the representative slow turn are requested.
  const unpriced = sel.cost(rep).length < 2;
  const needCalls = tab === "calls" || (drawer === "evidence" && tab === "load") || unpriced;
  useEffect(() => {
    if (!needCalls || calls !== undefined) return;
    fetch(API + `runs/${id}/calls.jsonl`)
      .then(r => r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status)))
      .then(text => setCalls(text.split("\n").filter(l => l.trim()).map(l => JSON.parse(l))))
      .catch(() => setCalls(null));
  }, [needCalls, calls, id]);
  const openCall = requestId => { setDrawer(null); setTab("calls"); setCallStep(""); setCallCohort(""); setQuery(requestId); setSelectedCall(0); };

  const me = runs.find(r => r.id === id);
  const parts = suiteParts(runs, me);

  // The written analyses: undefined until asked for, null when there is none.
  const [insights, setInsights] = useState(initialInsights);
  const [suiteInsights, setSuiteInsights] = useState(initialSuiteInsights);
  const suiteName = me && me.suite;
  useEffect(() => {
    if (insights !== undefined) return;
    let live = true;
    fetch(API + `runs/${id}/insights.json`).then(r => (r.ok ? r.json() : null))
      .then(j => { if (live) setInsights(j); }).catch(() => { if (live) setInsights(null); });
    return () => { live = false; };
  }, [id]);
  useEffect(() => {
    if (!suiteName || suiteInsights !== undefined) return;
    let live = true;
    fetch(API + `suites/${encodeURIComponent(suiteName)}/insights.json`).then(r => (r.ok ? r.json() : null))
      .then(j => { if (live) setSuiteInsights(j); }).catch(() => { if (live) setSuiteInsights(null); });
    return () => { live = false; };
  }, [suiteName]);

  // The other parts of a suite, read once the cost tab asks for a suite total.
  useEffect(() => {
    if (!(tab === "cost" && unpriced && parts.length > 1)) return;
    for (const p of parts) {
      if (p.id === id || p.id in suiteCalls) continue;
      setSuiteCalls(m => ({ ...m, [p.id]: undefined }));
      fetch(API + `runs/${p.id}/calls.jsonl`)
        .then(r => r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status)))
        .then(text => setSuiteCalls(m => ({ ...m, [p.id]: text.split("\n").filter(l => l.trim()).map(l => JSON.parse(l)) })))
        .catch(() => setSuiteCalls(m => ({ ...m, [p.id]: null })));
    }
  }, [tab, unpriced, parts.length, id]);

  // The other parts' reports, read once the scenario comparison is opened.
  useEffect(() => {
    if (studioMode !== "scenarios" || parts.length < 2) return;
    for (const p of parts) {
      if (p.id === id || p.id in partReports) continue;
      setPartReports(m => ({ ...m, [p.id]: undefined }));
      fetch(API + `runs/${p.id}.json`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
        .then(j => setPartReports(m => ({ ...m, [p.id]: j })))
        .catch(() => setPartReports(m => ({ ...m, [p.id]: null })));
    }
  }, [studioMode, parts.map(p => p.id).join(), id]);

  const rate = rateOverride !== null ? rateOverride : rateOn(tierOf(tier), rep.started_at);
  const estimate = unpriced && Array.isArray(calls) ? {
    tier, rate, rows: connectedRows(rep, calls, rate),
    suite: parts.length > 1 ? parts.map(p => {
      const cs = p.id === id ? calls : suiteCalls[p.id];
      return { id: p.id, scenario: p.scenario, calls: Array.isArray(cs) ? cs.length : cs === null ? 0 : null, minutes: Array.isArray(cs) ? minutesOf(cs) : cs === null ? 0 : null };
    }) : null,
  } : null;

  const prevIndex = runs.find(r => r.id !== id && r.profile === rep.profile && r.scenario === rep.scenario &&
    new Date(r.started_at) < new Date(rep.started_at)) || null;
  // A report keeps the lines it was read against; their citations come from the
  // current file, so a link found later reaches older reports too.
  const cited = new Map((refs || []).map(r => [r.id, r.cites]));
  const lines = rep.references ? rep.references.map(r => cited.has(r.id) ? { ...r, cites: cited.get(r.id) } : r) : refs;
  const g = glance(rep, prevIndex, prev, estimate);
  if (unpriced && calls === undefined && g.stats[2].value === "—") {
    g.stats[2] = { ...g.stats[2], value: "Calculating…", note: "Loading connection times to estimate this run’s cost." };
  }
  const all = findings(rep, lines);
  const take = tab === "calls"
    ? (Array.isArray(calls) ? readCalls(calls) : calls === null ? EMPTY.calls : EMPTY.loading)
    : tab === "cost" && estimate && estimate.rows.length >= 2 ? readCost(estimate.rows, estimate.rows)
    : (all.find(f => f.tab === tab) || all[0]);
  const v = view(tab, { rep, refs: lines, prev, point, setPoint, criterion, setCriterion, metric, setMetric, compare: compare && !!prev,
    calls, callStep, setCallStep, callCohort, setCallCohort, query, setQuery, selectedCall, setSelectedCall, callLimit, setCallLimit,
    estimate, setTier, setRate, rateOverride });
  const steps = sel.steps(rep);
  const turns = steps.reduce((a, s) => a + (s.turns_total || 0), 0);
  const callCount = steps.reduce((a, s) => a + (s.calls_attempted || s.calls || 0), 0);
  const latest = runs[0] && runs[0].id === id;
  const drawerTitle = drawer === "evidence" ? `${tabOf(tab).label.toUpperCase()} EVIDENCE · ${id}`
    : drawer === "method" ? "METRIC DEFINITIONS" : `FINDINGS · ${id}`;

  return html`
    <${Frag}>
      <div className="heading-row">
        <div>
          <div className="eyebrow">CALLSTORM / TEST RESULTS</div>
          <h1>Your assistant, under review.</h1>
          <p className="subheading">${rep.profile} <span>·</span> ${rep.scenario} <span>·</span> <span title="Target">${rep.target || "deepgram voice agent"}</span></p>
        </div>
        <button className="outline" onClick=${onOpenRuns}>↗ <span>Run history</span></button>
      </div>

      <div className="context-row">
        <button className="run-picker" onClick=${onOpenRuns} aria-haspopup="dialog">
          <span className="run-dot"></span>
          <span>${parts.length ? `Suite part ${parts.findIndex(p => p.id === id) + 1} of ${parts.length}` : latest ? "Latest run" : "Run"} · ${id}</span>
          <span className="chevron">⌄</span>
        </button>
        <span className="run-meta">${when(rep.started_at)} · ${steps.length} test stages · ${callCount} call attempts · ${turns} replies tested · ${Math.round(rep.duration_s)}s</span>
        <span className="sample-note">Measured data · synthetic callers</span>
      </div>

      ${parts.length > 0 && html`<details className="supporting-details suite-context scenario-switcher"><summary>
        <span className="scenario-count" aria-hidden="true">${new Set(parts.map(p => p.scenario)).size}</span>
        <span className="scenario-description"><strong>${new Set(parts.map(p => p.scenario)).size} ${new Set(parts.map(p => p.scenario)).size === 1 ? "scenario" : "scenarios"} in this test group</strong><small>Viewing ${rep.scenario} · Part ${parts.findIndex(p => p.id === id) + 1} of ${parts.length}. Select another scenario to see its results.</small></span>
        <span className="scenario-toggle"><span className="scenario-show">View all scenarios</span><span className="scenario-hide">Hide scenarios</span><span className="scenario-chevron" aria-hidden="true">⌄</span></span>
      </summary><${SuiteStrip} suite=${me.suite} parts=${parts} selected=${id} onPick=${onPick} insights=${suiteInsights}/></details>`}

      <${StudioSummary} rep=${rep} g=${g} onExplore=${t => setTab(t)}/>
      <nav className="studio-nav" aria-label="Review sections">${STUDIO_VIEWS.filter(([key])=>key !== "scenarios" || parts.length > 1).map(([key,label])=>html`<button key=${key} aria-pressed=${studioMode===key} onClick=${()=>setStudioMode(key)}>${label}</button>`)}</nav>
      <div className="studio-overview-grid" hidden=${studioMode !== "overview"}>
        <${StudioTrend} rep=${rep} onExplore=${t=>setTab(t)}/>
        <${StudioBrief} rep=${rep} insights=${insights} onExplore=${t=>setTab(t)} onAll=${()=>setStudioMode("findings")}/>
      </div>
      <div className="studio-view-heading"><span>${({overview:"THE TEST AT A GLANCE",experience:"THE CALLER’S EXPERIENCE",tasks:"DID IT DO THE JOB?",scenarios:"HOW THE SCENARIOS COMPARE",compare:"PROGRESS BETWEEN TESTS",findings:"FINDINGS & EXPLANATIONS",evidence:"THE MEASURED EVIDENCE"})[studioMode]}</span><p>${({overview:"Every load level, in one place.",experience:"See how often callers waited, and where in the conversation it happened.",tasks:"Task completion and the requirements behind it.",scenarios:"One load plan, several conversations, read on the same axis.",compare:"Compare the result with the previous test under matching conditions.",findings:"Read the analysis, then follow each finding to its evidence.",evidence:"Inspect timings, conversations, task checks, connections, and cost."})[studioMode]}</p></div>


      <${PriorityViews} mode=${studioMode} rep=${rep} prev=${prev} onHistory=${onOpenRuns} onCall=${requestId => { openCall(requestId); requestAnimationFrame(() => document.getElementById("explore-results").scrollIntoView({block:"start"})); }} onExplore=${t => { setTab(t); requestAnimationFrame(() => document.getElementById("explore-results").scrollIntoView({block:"start"})); }}/>
      ${studioMode === "scenarios" && parts.length > 1 && html`<${ScenarioCompare} parts=${parts} reports=${{ ...partReports, [id]: rep }} onPick=${onPick}/>`}

      <details open hidden=${studioMode !== "findings"} className="supporting-details studio-findings">
        <summary>Written analysis & more questions answered <span>Explore the supporting findings</span></summary>
        <${Insights} data=${insights} kind="run" subject=${id}/>
        <${Questions} rep=${rep} runs=${runs} id=${id}/>
      </details>

      <div hidden=${studioMode !== "evidence"} className="studio-evidence">
      <div className="section-top" id="explore-results">
        <div>
          <span className="eyebrow">EXPLORE THE EVIDENCE</span>
          <h2>What would you like to understand?</h2>
        </div>
        <span className="quiet">One question at a time.</span>
      </div>
      <${Tabs} tab=${tab} setTab=${setTab}/>

      <section id="insightPanel" className="insight-panel" role="tabpanel" aria-labelledby=${"tab-" + tab}>
        <div className="chart-area">
          <div className="chart-head">
            <div>
              <h3>${v.question}</h3>
              <p>${v.subtitle}</p>
            </div>
            ${v.compareable && html`
              <label className="compare-control" title=${prevIndex ? `Previous run of this profile and scenario: ${prevIndex.id}` : "No earlier run of this profile and scenario"}>
                <input type="checkbox" checked=${compare && !!prev} disabled=${!prev} onChange=${e => setCompare(e.target.checked)}/>
                <span>Previous run${prevIndex ? "" : " · none"}</span>
              </label>`}
          </div>
          ${tab === "calls" && html`<div className="chart-controls call-controls-top">${v.controls || null}</div>`}
          <div className="chart">${v.chart}</div>
          ${v.legend && html`<div className="cost-legend">${v.legend.map(([c, t]) => html`<span key=${t}><i style=${{background: c}}></i>${t}</span>`)}</div>`}
          ${tab !== "calls" && html`<div className="chart-controls">${v.controls || null}</div>`}
          <div className="chart-footer">
            <span>${v.footnote || ""}</span>
            <button className="text-button" onClick=${() => setDrawer("method")}>How is this measured? <span>↗</span></button>
          </div>
        </div>
        <aside className="takeaway">
          <div>
            <span className="eyebrow">THE TAKEAWAY</span>
            <h3>${keyed(take.verdict)}</h3>
            ${take.why && html`<p>${keyed(take.why)}</p>`}
          </div>
          ${v.observation && html`<div className="selected-observation">${v.observation}</div>`}
          <div className="next-step">
            <span className="eyebrow">SUGGESTED NEXT STEP</span>
            ${take.act && html`<p>${keyed(take.act)}</p>`}
            <button className="dark-button" onClick=${() => setDrawer("evidence")}>Inspect the evidence <span>↗</span></button>
          </div>
        </aside>
      </section>

      <details className="supporting-details"><summary>Calculations for this run <span>Measured values, formulas, and test stages</span></summary><${ComputedAppendix} rep=${rep} refs=${lines} estimate=${estimate}/></details>
      </div>

      <div className="below-note">
        <span className=${"verified" + (g.degraded.length > 0 ? " warn" : "")}>${g.degraded.length > 0 ? "!" : "✓"}</span>
        <span>${g.degraded.length > 0
          ? `Harness suspect on ${g.degraded.map(s => s.name).join(", ")}: pacing drifted past 100ms`
          : `Harness checks passed${steps.length ? ": pacing within 100ms on every step" : ""}`}</span>
        <span className="note-divider">·</span>
        <span>Synthetic callers, a real agent</span>
        <button className="text-button" onClick=${() => setDrawer("findings")}>View findings <span>↗</span></button>
      </div>

      <${Dialog} open=${!!drawer} className="drawer" label=${drawerTitle} onClose=${closeDrawer}>
        <div className="drawer-top">
          <span className="eyebrow">${drawerTitle}</span>
          <button className="icon-button" onClick=${closeDrawer} aria-label="Close details">✕</button>
        </div>
        <div className="drawer-content">
          ${drawer === "evidence" && html`<${Evidence} tab=${tab} rep=${rep} refs=${lines} id=${id} calls=${calls} step=${steps[Math.min(point, Math.max(steps.length - 1, 0))]} onOpenCall=${openCall} estimate=${estimate}/>`}
          ${drawer === "method" && html`<${Method} tab=${tab} refs=${lines}/>`}
          ${drawer === "findings" && html`<${Findings} items=${all} onPick=${f => { setTab(f.tab); setDrawer("evidence"); }}/>`}
        </div>
      <//>
    <//>`;
}

// Loads the selected report and the previous run of the same profile and
// scenario, then hands both to the report.
function ReportLoader({ id, refs, runs, onOpenRuns, onPick }) {
  const [rep, setRep] = useState(null);
  const [prev, setPrev] = useState(null);
  const [err, setErr] = useState(null);
  const [attempt, setAttempt] = useState(0);

  const prevIndex = rep && runs.find(r => r.id !== id && r.profile === rep.profile && r.scenario === rep.scenario &&
    new Date(r.started_at) < new Date(rep.started_at));
  const prevId = prevIndex ? prevIndex.id : null;

  useEffect(() => {
    if (!id) return;
    setRep(null); setPrev(null); setErr(null);
    fetch(API + `runs/${id}.json`)
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
      .then(r => setRep({ ...r, id }))
      .catch(e => setErr(String(e.message || e)));
  }, [id, attempt]);

  useEffect(() => {
    if (!prevId) { setPrev(null); return; }
    let live = true;
    fetch(API + `runs/${prevId}.json`).then(r => (r.ok ? r.json() : null))
      .then(p => { if (live) setPrev(p); }).catch(() => { if (live) setPrev(null); });
    return () => { live = false; };
  }, [prevId]);

  if (!id) {
    return html`<div className="cs-card state">
      <span className="eyebrow">TEST RESULTS</span>
      <h2>Pick a run</h2>
      <p className="quiet">Open the run history to choose one.</p>
      <button className="dark-button inline" onClick=${onOpenRuns}>Run history <span>↗</span></button>
    </div>`;
  }
  if (err) {
    return html`<div className="cs-card state">
      <span className="eyebrow">TEST RESULTS</span>
      <h2>Could not load ${id}</h2>
      <p className="quiet">${err}. The run list is unchanged; nothing you picked was lost.</p>
      <button className="dark-button inline" onClick=${() => setAttempt(a => a + 1)}>Try again</button>
    </div>`;
  }
  if (!rep) {
    return html`<div className="cs-card state" aria-busy="true">
      <span className="eyebrow">TEST RESULTS</span>
      <h2>Loading ${id}…</h2>
    </div>`;
  }
  return html`<${Report} rep=${rep} id=${id} refs=${refs} runs=${runs} prev=${prev} onOpenRuns=${onOpenRuns} onPick=${onPick}/>`;
}

function App() {
  const [runs, setRuns] = useState([]);
  const [selected, setSelected] = useState(null);
  const [refs, setRefs] = useState([]);
  const [err, setErr] = useState(null);
  const [loading, setLoading] = useState(true);
  const [updated, setUpdated] = useState(null);
  const [runsOpen, setRunsOpen] = useState(false);
  const [definitionsOpen, setDefinitionsOpen] = useState(false);
  const closeDefinitions = React.useCallback(() => setDefinitionsOpen(false), []);
  const closeRuns = React.useCallback(() => setRunsOpen(false), []);

  const load = () => {
    setLoading(true); setErr(null);
    fetch(API + "runs.json")
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
      .then(rs => {
        setRuns(rs);
        setUpdated(new Date());
        // Keep the selection across a refresh unless the run has gone.
        setSelected(s => (s && rs.some(r => r.id === s)) ? s : (rs.length ? rs[0].id : null));
      })
      .catch(e => setErr(String(e.message || e)))
      .finally(() => setLoading(false));
  };

  useEffect(() => {
    fetch(API + "references.json").then(r => (r.ok ? r.json() : [])).then(setRefs).catch(() => setRefs([]));
    load();
  }, []);

  const current = runs.find(r => r.id === selected);
  const top = () => { window.dispatchEvent(new Event("studio-overview")); window.scrollTo({ top: 0, behavior: "auto" }); };
  const about = () => setDefinitionsOpen(true);

  return html`
    <${Frag}>
      <${Sidebar} count=${groupRuns(runs).length} target=${current && current.target} who="Yaksh Gandhi"
        onOverview=${top} onRuns=${() => setRunsOpen(true)} onAbout=${about}/>
      <div className="app">
        <header className="topbar">
          <div>Voice agents <span className="crumb">/</span> <strong>${current ? `${current.suite ? `${current.suite} · ` : ""}${current.profile} · ${current.scenario}` : "no run selected"}</strong></div>
          <span className="demo">
            <span></span> ${err ? "API unreachable" : updated ? `Live · ${runs.length} runs · ${updated.toLocaleTimeString()}` : "Loading runs"}
            <button className="text-button refresh" onClick=${load} disabled=${loading}>${loading ? "…" : "Refresh"}</button>
          </span>
        </header>
        <main>
          ${err && html`
            <div className="cs-observation state">
              Could not load the run history: ${err}
              <button className="dark-button inline" onClick=${load}>Try again</button>
            </div>`}
          ${!err && !loading && runs.length === 0 && html`
            <div className="cs-card state">
              <span className="eyebrow">TEST RESULTS</span>
              <h2>No runs yet</h2>
              <p className="quiet">Place one with <code>callstorm</code> and it appears here.</p>
            </div>`}
          <${ReportLoader} id=${selected} refs=${refs} runs=${runs} onOpenRuns=${() => setRunsOpen(true)} onPick=${id => { setSelected(id); top(); }}/>

          <footer>CALLSTORM <span>Every finding starts with a conversation.</span></footer>
        </main>
      </div>
      <${Dialog} open=${definitionsOpen} className="drawer" label="Definitions & how this test works" onClose=${closeDefinitions}>
        <div className="drawer-top"><h2>Definitions & how this test works</h2><button className="icon-button" onClick=${closeDefinitions} aria-label="Close definitions">×</button></div>
        <div className="drawer-content"><${Glossary}/><${About}/><${Appendix} refs=${refs}/><${Sources}/></div>
      <//>
      <${Dialog} open=${runsOpen} className="run-dialog" label="Evaluation runs" onClose=${closeRuns}>
        <div className="dialog-title">
          <div>
            <span className="eyebrow">EVALUATION RUNS</span>
            <h2>Choose a run</h2>
          </div>
          <button className="icon-button" onClick=${closeRuns} aria-label="Close run history">✕</button>
        </div>
        <p className="quiet">Every sweep, newest first. One run tells you how an agent behaved once; the shape across runs is what says whether it is getting worse.</p>
        <${Trend} runs=${runs}/>
        <${RunList} runs=${runs} sel=${selected} onPick=${id => { setSelected(id); setRunsOpen(false); top(); }}/>
      <//>
    <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Boundary}><${App}/><//>`);
</script>
</body>
</html>
