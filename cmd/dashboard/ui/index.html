<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callstorm runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
  :root {
    --ground:#EEF1F4; --surface:#FBFCFD; --sunk:#E4E9EE;
    --ink:#131A24; --ink-2:#3D4854; --mute:#626E7C;
    --rule:#CBD3DB; --rule-soft:#DDE3E9;
    --signal:#0E8FA8; --ref:#7A8592;
    --pass:#2F7D53; --warn:#C08A00; --fail:#C03A2B;
    --pass-bg:rgba(47,125,83,.11); --warn-bg:rgba(192,138,0,.14); --fail-bg:rgba(192,58,43,.11);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D1317; --surface:#151D23; --sunk:#1E272E;
      --ink:#E3EAEF; --ink-2:#BDC8D1; --mute:#8B98A4;
      --rule:#2C3841; --rule-soft:#222C34;
      --signal:#3FB8D1; --ref:#8C97A3;
      --pass:#4FB87C; --warn:#C89A3C; --fail:#E0685A;
      --pass-bg:rgba(79,184,124,.13); --warn-bg:rgba(200,154,60,.14); --fail-bg:rgba(224,104,90,.13);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace; font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin-inline:auto; padding-inline:20px; }
  header { padding-block:28px 18px; border-bottom:2px solid var(--ink); }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; font-weight:600; }
  .sub { margin:8px 0 0; color:var(--ink-2); font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; max-width:62ch; }
  .eyebrow { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }

  .cols { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:28px; padding-block:24px 60px; align-items:start; }
  @media (max-width: 860px) { .cols { grid-template-columns:1fr; } }

  .runs { border-top:1px solid var(--rule); }
  .run {
    width:100%; text-align:left; background:none; border:0; cursor:pointer; color:inherit;
    font:inherit; padding:11px 10px 12px; border-bottom:1px solid var(--rule-soft);
    display:grid; grid-template-columns:1fr auto; gap:4px 10px;
  }
  .run:hover { background:var(--surface); }
  .run[aria-current="true"] { background:var(--surface); box-shadow:inset 3px 0 0 var(--signal); }
  .run .id { font-size:12px; color:var(--ink); }
  .run .meta { grid-column:1/-1; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums; }

  .pill { font-size:10px; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:2px; align-self:start; }
  .pass { color:var(--pass); background:var(--pass-bg); }
  .warn { color:var(--warn); background:var(--warn-bg); }
  .fail { color:var(--fail); background:var(--fail-bg); }

  .card { background:var(--surface); border:1px solid var(--rule-soft); border-radius:3px; padding:20px; }
  .card + .card { margin-top:18px; }
  h2 { margin:0 0 4px; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .spec { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px 22px; margin-top:16px; }
  .spec div { border-top:1px solid var(--rule); padding-block:8px 10px; }
  .spec dt { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); }
  .spec dd { margin:3px 0 0; font-variant-numeric:tabular-nums; word-break:break-word; }

  table { border-collapse:collapse; width:100%; font-size:12px; margin-top:14px; }
  th,td { padding:7px 10px 7px 0; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); border-bottom:1px solid var(--ink); font-weight:500; }
  tbody tr { border-bottom:1px solid var(--rule-soft); }
  .tablewrap { overflow-x:auto; }

  .note { margin-top:14px; padding:10px 12px; border-left:3px solid var(--warn); background:var(--sunk); font-size:12px; color:var(--ink-2); }

  /* A reading: what this card's numbers actually say, and what to do about it.
     Distinct from .note, which is a caveat -- this is the finding. */
  .read { margin-top:16px; border-top:1px solid var(--rule); padding-top:14px; }
  .read-verdict { font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; line-height:1.45;
                  color:var(--ink); letter-spacing:-.005em; max-width:70ch; }
  .read-verdict b { color:var(--signal); font-weight:600; }
  .read-why { margin-top:9px; font-size:12px; line-height:1.6; color:var(--ink-2); max-width:76ch; }
  .read-do { margin-top:9px; font-size:12px; line-height:1.55; color:var(--ink-2); max-width:76ch;
             border-left:3px solid var(--signal); padding:7px 0 7px 11px; background:var(--sunk); }
  .read-do b, .read-why b { color:var(--ink); }
  .read-do code, .read-why code { font-size:11.5px; background:var(--ground); padding:1px 4px; border-radius:2px; }

  /* Anatomy of a turn: two proportional segments, sized by the run's own
     numbers, so the diagram is a measurement rather than an illustration. */
  .atrack { display:flex; margin-top:16px; height:42px; border-radius:2px; overflow:hidden; }
  .aseg { display:flex; flex-direction:column; justify-content:center; gap:2px; padding:0 10px;
          min-width:0; overflow:hidden; font-size:11px; color:#fff; white-space:nowrap; }
  .aseg b { font-size:13px; font-variant-numeric:tabular-nums; }
  .aseg.ep { background:color-mix(in srgb, var(--signal) 42%, var(--surface)); color:var(--ink); }
  .aseg.ts { background:var(--signal); color:#06232A; }
  @media (prefers-color-scheme: dark) { .aseg.ts { color:#04181D; } }
  .amarks { display:flex; margin-top:6px; font-size:10px; color:var(--mute); line-height:1.35; }
  .amarks > * { min-width:0; padding-right:8px; }
  .amarks .between { display:flex; justify-content:space-between; gap:10px; }
  .amarks .between span:last-child { text-align:right; }
  .ahalves { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1px 24px; margin-top:16px; }
  .ahalves div { border-top:1px solid var(--rule); padding-block:9px 11px; }
  .ahalves dt { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--signal); }
  .ahalves dd { margin:4px 0 0; font-size:12px; color:var(--ink-2); line-height:1.55; }
  .ahalves dd em { font-style:normal; color:var(--ink); }

  /* The glossary: every number on this page, in plain words, before anyone
     scrolls into a table of them. */
  .gloss { margin-top:16px; }
  .gloss table { margin-top:0; }
  .gloss td:first-child { font-weight:500; color:var(--ink); white-space:nowrap; vertical-align:top; }
  .gloss td:nth-child(2) { text-align:left; white-space:normal; color:var(--ink-2); line-height:1.55; min-width:22ch; }
  .gloss td:last-child { text-align:left; white-space:normal; color:var(--mute); line-height:1.5; }
  .gloss .good { color:var(--pass); }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
  .trend { margin-top:10px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin-top:8px; }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  a { color:var(--signal); }

  .hero { padding-block:26px 4px; }

  /* The two questions are the product. Everything else on this page exists to
     support them, so they are the largest thing on it -- larger than the name,
     which is only a label. */
  .asks { margin:22px 0 0; border-top:2px solid var(--ink); border-bottom:1px solid var(--rule); padding-block:20px 22px; }
  /* The framing is light; the thing being asked carries the weight, so the
     answer a reader is here for is the boldest text on the page. */
  .ask { margin:0; font-family:"IBM Plex Serif", Georgia, serif; font-weight:400;
         font-size:clamp(21px, 3.3vw, 31px); line-height:1.25; letter-spacing:-.015em;
         color:var(--ink-2); text-wrap:balance; max-width:26ch; }
  .ask + .ask { margin-top:14px; }
  .ask span { color:var(--ink); font-weight:600; }
  .asks-lead { margin:0 0 14px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--signal); }

  .thesis { margin:20px 0 0; font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; line-height:1.6; color:var(--ink-2); max-width:68ch; }
  .caps { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1px 26px; margin-top:22px; }
  .caps div { border-top:1px solid var(--rule); padding-block:9px 11px; }
  .caps dt { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--signal); }
  .caps dd { margin:4px 0 0; font-size:12px; color:var(--ink-2); line-height:1.5; }
  .foundation { margin-top:20px; border-left:3px solid var(--signal); padding:12px 14px; background:var(--surface); font-size:12.5px; color:var(--ink-2); line-height:1.6; max-width:76ch; }
  .foundation b { color:var(--ink); }
  .links { margin-top:16px; display:flex; gap:18px; flex-wrap:wrap; font-size:12px; }
  .subhead { padding-block:26px 0; border-bottom:none; }
  .subhead h1 { font-size:20px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script>
const { useState, useEffect } = React;

// Report a failure to the server rather than to a console nobody is watching.
function report(where, err) {
  try {
    fetch("api/clienterror", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        where: where,
        message: String((err && err.message) || err),
        stack: String((err && err.stack) || ""),
      }),
    });
  } catch (_) { /* reporting must never be the thing that breaks */ }
}
window.addEventListener("error", e => report("window", e.error || e.message));
window.addEventListener("unhandledrejection", e => report("promise", e.reason));

// A dashboard that renders and then vanishes tells its operator nothing. React
// unmounts the whole tree when a render throws, so without this the symptom of
// any bug is a blank page.
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err: err }; }
  componentDidCatch(err, info) { report("render", err); console.error(err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div className="card">
      <div className="eyebrow">The dashboard broke</div>
      <h2>${String(this.state.err.message || this.state.err)}</h2>
      <pre style=${{whiteSpace:"pre-wrap",fontSize:"11px",color:"var(--mute)",marginTop:"10px"}}>${String(this.state.err.stack || "")}</pre>
    </div>`;
  }
}
const html = htm.bind(React.createElement);

const ms = n => (n || n === 0) ? Math.round(n) + "ms" : "-";
const pct = n => (n * 100).toFixed(n < 0.01 ? 1 : 1) + "%";
const when = s => new Date(s).toLocaleString();

function Pill({ v }) {
  return html`<span className="pill ${v}">${v}</span>`;
}

// Run history as a sparkline of worst p95 per run, oldest to newest. The whole
// reason the dashboard exists is the question "is this getting worse", and that
// is a shape rather than a number.
function Trend({ runs }) {
  const series = runs.filter(r => r.worst_p95_ms > 0).slice(0, 20).reverse();
  if (series.length < 2) return null;

  const W = 640, H = 120, PAD = 34;
  const max = Math.max(...series.map(r => r.worst_p95_ms)) * 1.15;
  const x = i => PAD + (i * (W - PAD - 12)) / Math.max(series.length - 1, 1);
  const y = v => H - 26 - (v / max) * (H - 48);
  const color = v => v === "fail" ? "var(--fail)" : v === "warn" ? "var(--warn)" : "var(--pass)";

  return html`
    <div className="trend">
      <div className="eyebrow">Worst p95 TTFA, last ${series.length} runs (oldest left)</div>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto"}}>
        <line x1=${PAD} y1=${H - 26} x2=${W - 12} y2=${H - 26} stroke="var(--rule)" strokeWidth="1"/>
        <text x="4" y=${y(max / 1.15) + 4} fontSize="10" fill="var(--mute)">${Math.round(max / 1.15)}</text>
        <polyline fill="none" stroke="var(--signal)" strokeWidth="2" strokeLinejoin="round"
          points=${series.map((r, i) => `${x(i)},${y(r.worst_p95_ms)}`).join(" ")}/>
        ${series.map((r, i) => html`
          <circle key=${r.id} cx=${x(i)} cy=${y(r.worst_p95_ms)} r="4.5"
            fill=${color(r.verdict)} stroke="var(--surface)" strokeWidth="2">
            <title>${r.id + "\n" + Math.round(r.worst_p95_ms) + "ms · " + r.verdict}</title>
          </circle>`)}
      </svg>
      <div className="legend">
        <span><i style=${{background:"var(--pass)"}}></i>pass</span>
        <span><i style=${{background:"var(--warn)"}}></i>warn</span>
        <span><i style=${{background:"var(--fail)"}}></i>fail</span>
      </div>
    </div>`;
}

// A reading has three parts, always in this order: what the numbers say, why
// that is what they say, and what to do about it. A dashboard that shows a
// chart and stops has handed its reader a research project.
function Reading({ verdict, why, act }) {
  // A reading is prose with values spliced through it, so htm hands back an
  // array of children rather than one element. React wants keys on any array,
  // and warns on stderr without rendering anything differently -- which is the
  // shape of every bug this dashboard has shipped. Keyed here once, so no
  // reading has to remember to wrap itself.
  const keyed = v => Array.isArray(v)
    ? v.map((c, i) => React.createElement(React.Fragment, { key: i }, c))
    : v;
  return html`
    <div className="read">
      <div className="read-verdict">${keyed(verdict)}</div>
      ${why && html`<div className="read-why">${keyed(why)}</div>`}
      ${act && html`<div className="read-do">${keyed(act)}</div>`}
    </div>`;
}

// Every number on the page, in plain words, before anyone meets it in a table.
// Assume the reader has never load-tested a voice agent: the column that
// matters is not the definition but what the number catches that no other
// number does.
const GLOSSARY = [
  ["p50 / p95 TTFA",
   "Time to first audio: you stop talking, and this is how long the line stays dead before the agent says anything. p50 is the middle turn; p95 is the turn worse than 95% of the rest.",
   "p50 is the call you usually get. p95 is the call that makes someone hang up, and it is always worse than the average suggests."],
  ["Endpointing",
   "The first half of that wait: how long the agent took to notice you had stopped, before it began working on a reply.",
   "It is a silence threshold, not computation. If this is the big half, a faster model changes nothing."],
  ["Think / speak",
   "The second half: the language model composing a reply plus the voice generating audio for it.",
   "This is the half that queues under load. If it grows while endpointing holds, the agent ran out of compute, not patience."],
  ["Talk ratio",
   "The agent's share of the speaking, counted in seconds of audio rather than lines of text.",
   "Published work puts half of voice agents at 0.80 or above. That is an agent delivering a monologue at a customer."],
  ["Words per minute",
   "Pace, measured over each side's own speaking time rather than the clock, so pauses do not flatter a slow agent.",
   "Above roughly 190 is faster than a person can comfortably follow on a phone line."],
  ["Interruption score",
   "0 to 5, as 5 x (1 - interruptions / turns). 5 means the agent never talked over the caller.",
   "The same formula the commercial platforms publish, so a run here can be read beside one from them."],
  ["Dead air",
   "Turns where the line stayed silent more than two seconds after the caller finished.",
   "A percentile says how slow the slow turns were. This says how often the call sounded broken, which is the thing a caller actually notices."],
  ["Word error rate",
   "How much of what the caller said the agent misheard, against the exact script the caller was given.",
   "The one failure no timing can show: an agent can answer in 300ms, fluently, to a question nobody asked."],
  ["Barge-in yield",
   "When the caller cuts in, how long the agent keeps talking before it stops.",
   "An agent that never stops has taken the floor from the person paying for the call."],
  ["Cost per turn",
   "Billable agent-minutes for the step, divided by the turns in it.",
   "Voice agents bill by the minute, so latency is a price. Verbosity is the same bill in a different disguise."],
  ["Pacing drift",
   "How far the caller's audio drifted from real time. This measures the test rig, not the agent.",
   "Every other number is only worth reading while this stays near zero. A run that hides it is asking to be trusted."],
];

function Glossary() {
  const [open, setOpen] = useState(false);
  return html`
    <div className="card">
      <div className="eyebrow">Start here</div>
      <h2>What each number catches</h2>
      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        Latency percentiles say how long a caller waited. They say nothing about whether the agent
        lectured, raced, talked over the caller, misheard them, or left the line dead. Each row
        below is a failure the row above it cannot see.
      </div>
      <div className="tablewrap gloss">
        <table>
          <thead><tr><th>Term</th><th>What it means</th><th>What it catches</th></tr></thead>
          <tbody>
            ${(open ? GLOSSARY : GLOSSARY.slice(0, 4)).map(([t, m, c]) => html`
              <tr key=${t}><td>${t}</td><td>${m}</td><td>${c}</td></tr>`)}
          </tbody>
        </table>
      </div>
      <button className="run" style=${{border:"1px solid var(--rule)",marginTop:"10px",borderRadius:"2px",
              display:"block",width:"auto",padding:"7px 12px",fontSize:"11px",color:"var(--signal)"}}
              onClick=${() => setOpen(!open)}>
        ${open ? "Show fewer" : `Show all ${GLOSSARY.length} terms`}
      </button>
    </div>`;
}

// Anatomy of one turn, drawn to the run's own median so the picture is a
// measurement rather than an illustration. The split point is the thing being
// taught: TTFA is two different problems wearing one number.
function TurnAnatomy({ ep, ts }) {
  const total = ep + ts;
  if (total <= 0) return null;
  return html`
    <div>
      <div className="atrack">
        <div className="aseg ep" style=${{flex: Math.max(ep, total * 0.14)}}>
          <span>endpointing</span><b>${ms(ep)}</b>
        </div>
        <div className="aseg ts" style=${{flex: Math.max(ts, total * 0.14)}}>
          <span>think / speak</span><b>${ms(ts)}</b>
        </div>
      </div>
      <div className="amarks">
        <div style=${{flex: Math.max(ep, total * 0.14)}}>↑ you stop talking</div>
        <div className="between" style=${{flex: Math.max(ts, total * 0.14)}}>
          <span>↑ agent's transcript of you</span><span>↑ its first audio</span>
        </div>
      </div>
      <div className="ahalves">
        <div>
          <dt>Endpointing</dt>
          <dd>The agent is listening to silence and deciding whether you paused or finished.
              Nothing is being computed yet. <em>It is a configured threshold</em>, so it barely
              moves from turn to turn.</dd>
        </div>
        <div>
          <dt>Think / speak</dt>
          <dd>The language model composes a reply and the voice renders it.
              <em>This is real work</em>, so it varies with what you said and queues when the
              service is busy.</dd>
        </div>
      </div>
    </div>`;
}

// readSplit turns the two halves into the sentence a reader wants: which half
// is the problem, how it is known, and which knob it corresponds to.
//
// The tell is not size but behaviour. A configured silence threshold holds its
// value while load rises; compute does not. So the reading is driven by what
// moved between the first step and the worst one, not by which half is bigger
// at rest -- an agent can have a large, perfectly healthy endpointing setting.
function readSplit(rows) {
  const base = rows[0], peak = rows[rows.length - 1];
  const ep = peak.endpointing.p95_ms, ts = peak.think_speak.p95_ms;
  const share = ts / (ep + ts);

  if (rows.length < 2) {
    return {
      verdict: html`At ${base.concurrency} concurrent, <b>${Math.round(share * 100)}% of the wait
        is think/speak</b> and the rest is the agent noticing you stopped.`,
      why: html`One step cannot show which half gives way under load, because nothing was varied.
        The split itself is still worth knowing: it says where the time goes at rest.`,
      act: html`Run a profile with more than one concurrency step to find out which half grows.`,
    };
  }

  const epGrew = ep - base.endpointing.p95_ms;
  const tsGrew = ts - base.think_speak.p95_ms;
  const pct = (d, b) => (b > 0 ? Math.round((d / b) * 100) : 0);
  const epPct = pct(epGrew, base.endpointing.p95_ms), tsPct = pct(tsGrew, base.think_speak.p95_ms);
  const span = `${base.concurrency} to ${peak.concurrency} concurrent`;

  // Under 15% is noise on a sample this size, not a trend worth a fix.
  const moved = Math.max(Math.abs(epPct), Math.abs(tsPct)) >= 15;
  if (!moved) {
    return {
      verdict: html`Neither half gave way. From ${span} the wait held its shape:
        endpointing ${epPct >= 0 ? "+" : ""}${epPct}%, think/speak ${tsPct >= 0 ? "+" : ""}${tsPct}%.`,
      why: html`Both halves growing together, or neither growing, means this load never reached
        whatever this agent's limit is. The breakpoint is above the concurrency tested here.`,
      act: html`Push the profile higher. A sweep that never breaks has found a floor, not a ceiling.`,
    };
  }

  const thinkWon = tsGrew >= epGrew;
  return {
    verdict: thinkWon
      ? html`<b>Think/speak is the half that saturates.</b> From ${span} it
             grew ${ms(tsGrew)} (${tsPct >= 0 ? "+" : ""}${tsPct}%) while endpointing
             moved ${ms(epGrew)} (${epPct >= 0 ? "+" : ""}${epPct}%).`
      : html`<b>Endpointing is the half that saturates.</b> From ${span} it
             grew ${ms(epGrew)} (${epPct >= 0 ? "+" : ""}${epPct}%) while think/speak
             moved ${ms(tsGrew)} (${tsPct >= 0 ? "+" : ""}${tsPct}%).`,
    why: thinkWon
      ? html`That is the signature of compute queueing. Endpointing is a silence threshold: it is
             a timer, so it holds its value no matter how busy the service is. Think/speak is the
             language model and the voice doing real work, so it is what lengthens when there is
             more of that work than capacity for it.`
      : html`That is unusual, and worth checking before acting on. Endpointing is a configured
             timer, so it should not care how busy the service is. When it stretches under load
             the delay is usually transport — audio arriving late — rather than the threshold
             itself, which would make this a network finding rather than an agent one.`,
    act: thinkWon
      ? html`<b>Fix the reply, not the listening.</b> A smaller or faster model, a shorter system
             prompt, or streaming the voice so audio starts before the sentence is finished. Tuning
             the silence threshold buys nothing here: it was never the part that grew.`
      : html`<b>Check the transport before the settings.</b> Compare this against a local
             reference agent at the same concurrency. If endpointing stays flat there, the
             stretch is the network between you and the agent, not the agent.`,
  };
}

// Component share: how p95 TTFA divides between noticing the caller stopped
// and producing a reply, one bar per step.
//
// A single TTFA number cannot tell an endpointing problem from an inference
// problem, and the two have different fixes. The stack makes the growing half
// obvious: a bar whose left segment stays put while the right one stretches is
// an LLM or TTS queue, not a VAD.
function ComponentShare({ steps }) {
  const rows = steps.filter(s =>
    s.endpointing && s.endpointing.n > 0 && s.think_speak && s.think_speak.n > 0 &&
    s.endpointing.p95_ms + s.think_speak.p95_ms > 0);
  // One step still answers "what is this agent's split"; two or more answer
  // "which half moves under load". Both are worth drawing.
  if (rows.length < 1) {
    if (steps.length === 0) return null;
    return html`
      <div className="card">
        <div className="eyebrow">Which half saturates first</div>
        <h2>No split to draw</h2>
        <div className="note">
          Splitting TTFA needs the moment the agent's transcript of the caller arrived, and this
          run recorded none. A target that returns no user transcript can be timed but not
          decomposed.
        </div>
      </div>`;
  }

  const W = 640, ROW = 30, LEFT = 64, RIGHT = 78;
  const H = rows.length * ROW + 16;
  const max = Math.max(...rows.map(s => s.endpointing.p95_ms + s.think_speak.p95_ms)) * 1.02;
  const w = v => Math.max((v / max) * (W - LEFT - RIGHT), 0);
  const base = rows[0].think_speak.p95_ms / (rows[0].endpointing.p95_ms + rows[0].think_speak.p95_ms);

  return html`
    <div className="card">
      <div className="eyebrow">Which half saturates first</div>
      <h2>Anatomy of the wait</h2>
      <div className="read-why" style=${{marginTop:"8px"}}>
        The pause before an agent answers is two different problems wearing one number. Drawn to
        this run's own median turn:
      </div>
      <${TurnAnatomy} ep=${rows[0].endpointing.p50_ms} ts=${rows[0].think_speak.p50_ms}/>
      <h2 style=${{marginTop:"26px"}}>Which half moves under load</h2>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"12px"}}>
        ${rows.map((s, i) => {
          const ep = s.endpointing.p95_ms, ts = s.think_speak.p95_ms;
          const share = ts / (ep + ts);
          const y = i * ROW + 6;
          const shift = (share - base) * 100;
          return html`
            <g key=${s.name}>
              <text x="0" y=${y + 14} fontSize="11" fill="var(--ink-2)">${s.name}</text>
              <rect x=${LEFT} y=${y} width=${w(ep)} height="18" fill="var(--signal)" opacity="0.34"/>
              <rect x=${LEFT + w(ep)} y=${y} width=${w(ts)} height="18" fill="var(--signal)"/>
              <text x=${W - RIGHT + 8} y=${y + 13} fontSize="11" fill="var(--ink-2)">
                ${Math.round(share * 100)}% think${i > 0 && Math.abs(shift) >= 5
                  ? (shift > 0 ? " ▲" : " ▼") + Math.abs(Math.round(shift)) : ""}
              </text>
              <title>${s.name + "\n" + Math.round(ep) + "ms endpointing + " + Math.round(ts) + "ms think/speak"}</title>
            </g>`;
        })}
      </svg>
      <div className="legend">
        <span><i style=${{background:"var(--signal)",opacity:0.34}}></i>endpointing — noticing the caller stopped</span>
        <span><i style=${{background:"var(--signal)"}}></i>think/speak — LLM plus TTS</span>
      </div>
      <${Reading} ...${readSplit(rows)}/>
    </div>`;
}

// Cost per turn against concurrency.
//
// Voice agents bill by the minute, so latency is a price as well as an
// experience: every second the caller waits is a second of billed session. A
// step whose cost per turn climbs is an agent getting more expensive under
// exactly the load it was bought to handle, which no latency percentile states
// in the units a budget is written in.
function CostChart({ steps }) {
  const rows = steps.filter(s => s.cost && s.cost.usd_per_turn > 0);
  if (rows.length < 2) {
    // A card that silently disappears when its data is missing tells the
    // reader nothing, and looks identical to a card that is broken. Say which
    // of the two it is and what would populate it.
    const priced = steps.some(s => s.cost);
    return html`
      <div className="card">
        <div className="eyebrow">What the latency costs</div>
        <h2>Not priced</h2>
        <div className="note">
          ${priced
            ? html`<span>This run counted ${steps.reduce((a, s) => a + ((s.cost && s.cost.agent_minutes) || 0), 0).toFixed(1)}
                   agent-minutes but was not given a rate. Re-run with
                   <b> -rate-per-minute</b> to price it — voice agents bill by the minute, so
                   latency is a cost as well as an experience.</span>`
            : html`<span>This run predates cost accounting. Runs placed from this version onward carry
                   billable minutes, and <b>-rate-per-minute</b> turns them into dollars.</span>`}
        </div>
      </div>`;
  }

  const W = 640, H = 150, PAD = 44;
  const max = Math.max(...rows.map(s => s.cost.usd_per_turn)) * 1.2;
  const x = i => PAD + (i * (W - PAD - 40)) / Math.max(rows.length - 1, 1);
  const y = v => H - 28 - (v / max) * (H - 50);
  const first = rows[0].cost.usd_per_turn;
  const last = rows[rows.length - 1].cost.usd_per_turn;

  return html`
    <div className="card">
      <div className="eyebrow">What the latency costs</div>
      <h2>Dollars per turn as concurrency rises</h2>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"8px"}}>
        <line x1=${PAD} y1=${H - 28} x2=${W - 40} y2=${H - 28} stroke="var(--rule)" strokeWidth="1"/>
        <text x="2" y=${y(max / 1.2) + 4} fontSize="10" fill="var(--mute)">$${(max / 1.2).toFixed(4)}</text>
        <polyline fill="none" stroke="var(--signal)" strokeWidth="2" strokeLinejoin="round"
          points=${rows.map((s, i) => `${x(i)},${y(s.cost.usd_per_turn)}`).join(" ")}/>
        ${rows.map((s, i) => html`
          <g key=${s.name}>
            <circle cx=${x(i)} cy=${y(s.cost.usd_per_turn)} r="4"
              fill="var(--signal)" stroke="var(--surface)" strokeWidth="2">
              <title>${s.name + "\n$" + s.cost.usd_per_turn.toFixed(4) + " per turn at " + s.concurrency + " concurrent"}</title>
            </circle>
            <text x=${x(i)} y=${H - 12} fontSize="10" fill="var(--mute)" textAnchor="middle">${s.concurrency}</text>
          </g>`)}
      </svg>
      <${Reading} ...${readCost(rows, steps)}/>
    </div>`;
}

// readLatency explains the headline table: what a percentile is, what the
// verdict compared against, and whether the run found a limit at all.
function readLatency(steps, rep) {
  const base = steps.find(s => s.name === rep.baseline) || steps[0];
  const worst = steps.reduce((a, s) => (s.ttfa.p95_ms > a.ttfa.p95_ms ? s : a), steps[0]);
  const bp = steps.find(s => s.verdict === "fail");
  const ratio = base.ttfa.p95_ms > 0 ? worst.ttfa.p95_ms / base.ttfa.p95_ms : 0;

  return {
    verdict: bp
      ? html`<b>It broke at ${bp.concurrency} concurrent calls.</b> p95 reached ${ms(bp.ttfa.p95_ms)},
             ${bp.p95_ratio ? bp.p95_ratio.toFixed(2) : "?"}× the ${ms(base.ttfa.p95_ms)} it managed
             at ${base.concurrency}.`
      : html`<b>Nothing broke.</b> The worst step, ${worst.name} at ${worst.concurrency} concurrent,
             held p95 at ${ms(worst.ttfa.p95_ms)} — ${ratio.toFixed(2)}× the baseline's ${ms(base.ttfa.p95_ms)}, inside the 2× line.`,
    why: html`p95 means 95 of every 100 turns were faster than this and 5 were slower. It is used
      instead of an average because averages hide the calls that lose customers: one turn in twenty
      is a call every hour on a busy line. The verdict compares each step against the baseline
      rather than a fixed target, because a latency that is generous for one agent is unreachable
      for another — <b>warn</b> past 1.5× the baseline, <b>fail</b> past 2×, or whenever call setup
      drops below 97%.`,
    act: bp
      ? html`That concurrency is this agent's ceiling under this scenario. Size capacity below it,
             or take the split below to find which half gave way first.`
      : html`This sweep found a floor, not a ceiling. Raise the profile's concurrency until a step
             fails, otherwise the number you can quote is "at least this", not "this".`,
  };
}

function readConversation(conv, steps) {
  // conv holds steps, not summaries: the conversation figures hang off each
  // one. Reading talk_ratio straight off the step yields NaN and prints it.
  const c = conv[conv.length - 1].conversation;
  const first = conv[0].conversation;
  const problems = [];
  if (c.talk_ratio >= 0.8) problems.push("lecturing");
  if (c.agent_wpm > 190) problems.push("rushing");
  if (c.dead_air_turns > 0) problems.push("dead air");
  if (c.interruption_score < 4.5) problems.push("interrupting");

  const pace = c.caller_wpm > 0 ? c.agent_wpm / c.caller_wpm : 1;
  return {
    verdict: problems.length === 0
      ? html`<b>It sounded like a conversation.</b> The agent held ${pct(c.talk_ratio)} of the
             speaking at ${Math.round(c.agent_wpm)} words a minute, never talked over the caller,
             and left no silence longer than two seconds.`
      : html`<b>It sounded off: ${problems.join(", ")}.</b> The agent held ${pct(c.talk_ratio)} of
             the floor at ${Math.round(c.agent_wpm)} wpm${c.dead_air_turns > 0
               ? html`, and ${c.dead_air_turns} turns left the line silent past two seconds` : ""}.`,
    why: html`None of this is visible in a latency chart. An agent can answer every turn in 300ms
      and still be unbearable: ${pct(c.talk_ratio)} of the talking means the caller
      got ${pct(1 - c.talk_ratio)} of it, and at ${Math.round(c.agent_wpm)} wpm against the
      caller's ${Math.round(c.caller_wpm)}, the agent speaks ${pace >= 1.08
        ? `${((pace - 1) * 100).toFixed(0)}% faster than` : pace <= 0.92
        ? `${((1 - pace) * 100).toFixed(0)}% slower than` : "at about the same pace as"} the
      person it is talking to. Dead air is counted separately from latency on purpose: a p95
      says how slow the slow turns were, this says how many of them sounded like a dropped call.
      ${conv.length > 1 && Math.abs(c.talk_ratio - first.talk_ratio) >= 0.03
        ? html` The ratio also moved from ${pct(first.talk_ratio)} at the lightest step, which
                means load changed how the agent spoke, not just how fast.`
        : conv.length > 1 ? html` The ratio held steady across every concurrency step.` : ""}`,
    act: problems.length === 0
      ? html`Nothing to fix here. If you want a harder test, add a scenario where the caller
             interrupts — <code>scenarios/barge-in.json</code> — since an agent only reveals
             whether it will yield the floor when something takes it.`
      : html`<b>These are prompt and voice settings, not capacity.</b>
             ${c.talk_ratio >= 0.8 ? "Cap reply length in the system prompt. " : ""}
             ${c.agent_wpm > 190 ? "Slow the voice: most providers expose a speaking-rate setting. " : ""}
             ${c.dead_air_turns > 0 ? "Dead air with healthy latency usually means a turn failed silently rather than slowly — check the failing turns above. " : ""}
             ${c.interruption_score < 4.5 ? "Lengthen the silence threshold so the agent stops cutting people off." : ""}`,
  };
}

function readCost(rows, steps) {
  const first = rows[0], last = rows[rows.length - 1];
  const rise = first.cost.usd_per_turn > 0
    ? last.cost.usd_per_turn / first.cost.usd_per_turn - 1 : 0;
  const total = steps.reduce((a, s) => a + ((s.cost && s.cost.usd) || 0), 0);
  const turns = steps.reduce((a, s) => a + (s.turns_total || 0), 0);
  // A thousand calls a day is a small deployment, and it makes a fraction of a
  // cent per turn legible as money.
  const perCall = last.cost.usd_per_call;

  return {
    verdict: rise >= 0.05
      ? html`<b>The same conversation costs ${(rise * 100).toFixed(0)}% more under load.</b>
             $${first.cost.usd_per_turn.toFixed(4)} a turn at ${first.concurrency} concurrent,
             $${last.cost.usd_per_turn.toFixed(4)} at ${last.concurrency}.`
      : html`<b>Load did not change the price.</b> A turn cost
             $${first.cost.usd_per_turn.toFixed(4)} at ${first.concurrency} concurrent and
             $${last.cost.usd_per_turn.toFixed(4)} at ${last.concurrency}.`,
    why: html`Voice agents bill for the time the session is open, so every second the caller spends
      waiting is a second you pay for. That makes latency a line item and verbosity another one:
      an agent that answers in 300ms and then talks for fifteen seconds is expensive in a way no
      percentile shows. This run billed ${steps.reduce((a, s) => a + ((s.cost && s.cost.agent_minutes) || 0), 0).toFixed(1)} agent-minutes
      across ${turns} turns at $${last.cost.rate_per_minute.toFixed(4)} a minute, or
      $${total.toFixed(2)} in total.`,
    act: html`At $${perCall.toFixed(4)} a call, <b>1,000 calls a day is about
      $${(perCall * 1000 * 30).toFixed(0)} a month</b>${rise >= 0.05
        ? html`, and that is the busy-hour price — the ${(rise * 100).toFixed(0)}% you see here is
               what the extra latency costs, so shortening replies pays twice.` : "."}${" "}Substitute your own volume; the per-call figure is the one to multiply.`,
  };
}

function readWER(rows) {
  const worst = rows.reduce((a, s) => (s.wer.mean > a.wer.mean ? s : a), rows[0]);
  const clean = worst.wer.mean <= 0.05;
  const w = worst.wer;
  return {
    verdict: clean
      ? html`<b>It heard the caller.</b> The worst step misheard ${pct(w.mean)} of the words —
             ${w.substitutions + w.deletions + w.insertions} errors across ${w.ref_words} spoken.`
      : html`<b>It misheard ${pct(w.mean)} of what was said</b> at ${worst.name} — ${w.substitutions + w.deletions + w.insertions} errors
             across ${w.ref_words} words.`,
    why: html`The caller's lines were generated from a known script, so this compares against what
      was actually spoken rather than one transcript against another. ${w.substitutions} of
      the errors are substitutions, which are the dangerous kind: a deletion usually produces a
      confused agent, but a substitution produces a confident one answering a different question.
      On an earlier run here the caller read order "four four eight one two", the agent heard
      "four four eight two", thanked them for it, and carried on toward refunding an order that
      was never named. Every timing number on that call looked healthy.`,
    act: clean
      ? html`Under 5% is the usual bar for usable recognition, so the transcript is not what is
             costing you tasks. Run with <code>-judge</code> to see whether the failures are in the
             agent's reasoning instead.`
      : html`<b>Fix the listening before the reasoning.</b> Try a stronger speech model, or supply
             domain keywords if the provider supports them — order numbers, product names and
             spelled-out digits are where these errors concentrate.`,
  };
}

function readBarge(rows) {
  const turns = rows.reduce((a, s) => a + s.barge_in.turns, 0);
  const yielded = rows.reduce((a, s) => a + s.barge_in.yielded, 0);
  const never = turns - yielded;
  const worst = rows.reduce((a, s) => Math.max(a, s.barge_in.yield_p95_ms), 0);
  return {
    verdict: never > 0
      ? html`<b>The agent kept talking ${never} of the ${turns} times it was interrupted.</b>`
      : html`<b>It stopped every time it was interrupted</b>, within ${ms(worst)} at worst.`,
    why: html`A real caller interrupts — to correct a wrong order number, to say they already tried
      that. Callstorm measures this by starting the next caller line while the agent is still
      speaking and timing how long the agent's audio keeps coming. A zero here is not a good
      score: it means the agent was never observed to stop at all, which is why it is reported as
      a failure rather than as instant.`,
    act: never > 0
      ? html`<b>This is the worst failure on the page.</b> An agent that will not yield has taken
             the floor from the person paying for the call. Check that barge-in is enabled at all,
             and that the caller's audio is reaching the agent while it speaks.`
      : html`Under about 500ms reads as a person stopping mid-sentence. Above a second the caller
             will start talking over it again, and both sides end up repeating themselves.`,
  };
}

function ReportCard({ id }) {
  const [rep, setRep] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    if (!id) return;
    setRep(null); setErr(null);
    fetch(`api/runs/${id}.json`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(setRep).catch(e => setErr(String(e)));
  }, [id]);

  if (!id) return html`<div className="card empty">Pick a run.</div>`;
  if (err) return html`<div className="card empty">Could not load ${id}: ${err}</div>`;
  if (!rep) return html`<div className="card empty">Loading…</div>`;

  const steps = rep.steps || [];
  const degraded = steps.filter(s => s.harness_degraded);
  const anyWER = steps.some(s => s.wer && s.wer.turns > 0);
  const anyBarge = steps.some(s => s.barge_in && s.barge_in.turns > 0);
  const conv = steps.filter(s => s.conversation && s.conversation.turns > 0);

  return html`
    <${Glossary}/>

    <div className="card">
      <div className="eyebrow">Report card</div>
      <h2>${rep.profile} · ${rep.scenario}</h2>
      <dl className="spec">
        <div><dt>Run</dt><dd>${id}</dd></div>
        <div><dt>Started</dt><dd>${when(rep.started_at)}</dd></div>
        <div><dt>Duration</dt><dd>${Math.round(rep.duration_s)}s</dd></div>
        <div><dt>Target</dt><dd>${rep.target || "deepgram voice agent"}</dd></div>
      </dl>

      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Conc</th><th>Setup</th><th>p50</th><th>p95</th><th>p99</th>
            <th>Turns</th><th>Drift</th><th>vs base</th><th>Verdict</th>
          </tr></thead>
          <tbody>
            ${steps.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}${s.name === rep.baseline ? " ←" : ""}</td>
                <td>${s.concurrency}</td>
                <td>${pct(s.setup_success)}</td>
                <td>${ms(s.ttfa.p50_ms)}</td>
                <td>${ms(s.ttfa.p95_ms)}</td>
                <td>${ms(s.ttfa.p99_ms)}</td>
                <td>${s.turns_total}</td>
                <td>${ms(s.worst_harness_drift_ms)}</td>
                <td>${s.p95_ratio ? s.p95_ratio.toFixed(2) + "×" : "-"}</td>
                <td><${Pill} v=${s.verdict}/></td>
              </tr>`)}
          </tbody>
        </table>
      </div>

      ${degraded.length > 0 && html`
        <div className="note">
          <strong>Suspect.</strong> ${degraded.map(s => s.name).join(", ")} drifted past the 100ms
          pacing limit, so ${degraded.length > 1 ? "those steps measure" : "that step measures"} the
          load generator rather than the agent. The verdict grades the agent and should not be
          believed here.
        </div>`}

      ${steps.length > 0 && html`<${Reading} ...${readLatency(steps, rep)}/>`}
    </div>

    ${conv.length === 0 && steps.length > 0 && html`
      <div className="card">
        <div className="eyebrow">Conversation quality</div>
        <h2>Not measured on this run</h2>
        <div className="note">
          This run predates talk ratio, pace, interruption score and dead air. Those come from
          instants the harness already stamps, so any run placed from this version onward carries
          them — nothing needs enabling. Re-run the profile to populate this card.
        </div>
      </div>`}

    ${conv.length > 0 && html`
      <div className="card">
        <div className="eyebrow">Conversation quality</div>
        <h2>How the calls sounded</h2>
        <div className="tablewrap">
          <table>
            <thead><tr>
              <th>Step</th><th>Agent's share</th><th>Agent pace</th><th>Caller pace</th>
              <th>Interruptions</th><th>Score /5</th><th>Dead air</th>
            </tr></thead>
            <tbody>
              ${conv.map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${pct(s.conversation.talk_ratio)}${s.conversation.talk_ratio >= 0.8 ? " ⚠" : ""}</td>
                  <td>${Math.round(s.conversation.agent_wpm)} wpm${s.conversation.agent_wpm > 190 ? " ⚠" : ""}</td>
                  <td>${Math.round(s.conversation.caller_wpm)} wpm</td>
                  <td>${s.conversation.interruptions} of ${s.conversation.turns}</td>
                  <td>${s.conversation.interruption_score.toFixed(2)}</td>
                  <td>${s.conversation.dead_air_turns > 0
                        ? `${s.conversation.dead_air_turns} turns · ${Math.round(s.conversation.dead_air_seconds)}s`
                        : "none"}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        <div className="note">
          Pace is words over that speaker's own speaking time, not wall clock, so a slow agent is
          not flattered by the caller's pauses. ⚠ marks the published breakdown thresholds: an
          agent holding <b>80%</b> or more of the floor is lecturing rather than conversing, and
          above <b>190 wpm</b> is faster than comfortable listening. Dead air counts turns where
          the line stayed silent more than two seconds after the caller finished — the point at
          which a person says "hello?".
        </div>
        <${Reading} ...${readConversation(conv, steps)}/>
      </div>`}

    <${ComponentShare} steps=${steps}/>
    <${CostChart} steps=${steps}/>

    ${anyWER && html`
      <div className="card">
        <div className="eyebrow">Transcript accuracy</div>
        <h2>What the agent heard</h2>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Mean</th><th>Worst turn</th><th>Errors</th><th>Words</th><th>S / D / I</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.wer && s.wer.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${pct(s.wer.mean)}</td>
                  <td>${pct(s.wer.worst)}</td>
                  <td>${s.wer.substitutions + s.wer.deletions + s.wer.insertions}</td>
                  <td>${s.wer.ref_words}</td>
                  <td>${s.wer.substitutions} / ${s.wer.deletions} / ${s.wer.insertions}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        <${Reading} ...${readWER(steps.filter(s => s.wer && s.wer.turns > 0))}/>
      </div>`}

    ${anyBarge && html`
      <div className="card">
        <div className="eyebrow">Interruption</div>
        <h2>How fast it gave the floor back</h2>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Barge-ins</th><th>Yielded</th><th>p50</th><th>p95</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.barge_in && s.barge_in.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${s.barge_in.turns}</td>
                  <td>${s.barge_in.yielded}${s.barge_in.yielded < s.barge_in.turns
                        ? ` — ${s.barge_in.turns - s.barge_in.yielded} never yielded` : ""}</td>
                  <td>${ms(s.barge_in.yield_p50_ms)}</td>
                  <td>${ms(s.barge_in.yield_p95_ms)}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        <${Reading} ...${readBarge(steps.filter(s => s.barge_in && s.barge_in.turns > 0))}/>
      </div>`}`;
}

function App() {
  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetch("api/runs.json").then(r => r.json())
      .then(rs => { setRuns(rs); if (rs.length) setSel(rs[0].id); })
      .catch(e => setErr(String(e)));
  }, []);

  return html`
    <div className="wrap">
      <header className="hero">
        <span className="eyebrow">Load testing and observability for voice AI agents</span>
        <h1>Callstorm</h1>
        <div className="asks">
          <p className="asks-lead">Two questions, not one</p>
          <p className="ask">At what concurrency does this agent <span>stop meeting its own baseline?</span></p>
          <p className="ask">And did it <span>actually do its job?</span></p>
        </div>

        <p className="thesis">Callstorm places synthetic calls against a voice agent, speaks to it
          with real text-to-speech, listens to what comes back, and stamps every instant on both
          sides of the conversation. The first question is answered in milliseconds, the second by
          reading what was actually said.</p>

        <dl className="caps">
          <div><dt>Latency</dt><dd>Time to first audio, split into endpointing and think+speak. Percentiles per step, and the breakpoint scored against the run's own baseline rather than a number someone else picked.</dd></div>
          <div><dt>Accuracy</dt><dd>Word error rate against the caller's script. Callstorm generated that audio from known text, so the reference is ground truth rather than a second transcription.</dd></div>
          <div><dt>Task success</dt><dd>An LLM judge scores plain-language criteria, and every verdict must quote the turn it was decided on &mdash; so it can be checked rather than trusted.</dd></div>
          <div><dt>Interruption</dt><dd>The caller cuts in mid-reply and the run records how long the agent kept talking, calibrated against a known injected yield.</dd></div>
          <div><dt>Personas</dt><dd>Pacing rather than costume: a caller who pauses mid-thought is what turn detection actually reacts to, and it catches endpointing tuned too tight.</dd></div>
          <div><dt>Branching</dt><dd>The caller responds to what the agent said instead of reciting. Every branch is synthesized before the call, so no speech latency lands inside the measurement.</dd></div>
          <div><dt>Scale</dt><dd>A dispatcher hands calls to a Kubernetes worker fleet over Kafka, autoscaled on queue depth and chaos-tested by killing pods mid-run.</dd></div>
          <div><dt>Observability</dt><dd>Prometheus native histograms and Grafana while a run happens; these report cards afterwards.</dd></div>
        </dl>

        <p className="foundation">Two measurements are <b>calibrated against known answers</b>:
          latency, worst error <b>3.3&nbsp;ms</b> across five concurrency levels, and barge-in yield,
          <b>15&nbsp;ms</b> at three concurrent callers. That is the foundation. A harness whose
          numbers have never been checked against something it already knows cannot be trusted about
          anything else &mdash; which is also why a run reports its own pacing drift, and marks a step
          suspect when this machine rather than the agent was the limit.</p>

        <div className="links">
          <a href="https://github.com/ai-calypse/callstorm">Source on GitHub</a>
        </div>
      </header>

      <header className="subhead">
        <span className="eyebrow">Every sweep, newest first</span>
        <h1>Run history</h1>
        <p className="sub">One run tells you how an agent behaved once; the shape across runs is what
          says whether it is getting worse.</p>
      </header>

      ${err && html`<div className="card empty">Could not load runs: ${err}</div>`}

      <div className="cols">
        <div>
          <${Trend} runs=${runs}/>
          <div className="runs">
            ${runs.length === 0 && !err && html`<div className="empty">No runs yet.</div>`}
            ${runs.map(r => html`
              <button key=${r.id} className="run" aria-current=${String(r.id === sel)}
                      onClick=${() => setSel(r.id)}>
                <span className="id">${r.profile} · ${r.scenario}</span>
                <${Pill} v=${r.verdict}/>
                <span className="meta">
                  ${when(r.started_at)} · peak ${r.peak_concurrency} · worst p95 ${ms(r.worst_p95_ms)}
                  ${r.harness_degraded ? " · harness suspect" : ""}
                  ${r.breakpoint ? ` · breaks at ${r.breakpoint}` : ""}
                </span>
              </button>`)}
          </div>
        </div>
        <div><${ReportCard} id=${sel}/></div>
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Boundary}><${App}/><//>`);
</script>
</body>
</html>
