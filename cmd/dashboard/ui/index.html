// Callstorm Calm evaluation studio: one run, one question at a time, with the
// evidence behind every answer one click away.
//
// The Go server, or a static export, answers the API beside this page. Nothing
// here has its own data.
const { useState, useEffect, useRef } = React;
const API = "api/";

// Report a failure to the server rather than to a console nobody is watching.
function report(where, err) {
  try {
    fetch(API + "clienterror", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        where: where,
        message: String((err && err.message) || err),
        stack: String((err && err.stack) || ""),
      }),
    });
  } catch (_) { /* reporting must never be the thing that breaks */ }
}
window.addEventListener("error", e => report("window", e.error || e.message));
window.addEventListener("unhandledrejection", e => report("promise", e.reason));

// React unmounts the whole tree when a render throws, so without this the
// symptom of any bug is a blank page.
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err: err }; }
  componentDidCatch(err, info) { report("render", err); console.error(err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<main><div className="cs-card state">
      <span className="eyebrow">THE DASHBOARD BROKE</span>
      <h2>${String(this.state.err.message || this.state.err)}</h2>
      <pre className="stack">${String(this.state.err.stack || "")}</pre>
    </div></main>`;
  }
}
const html = htm.bind(React.createElement);
const Frag = React.Fragment;

const ms = n => (n || n === 0) ? Math.round(n) + "ms" : "-";
const pct = n => (n * 100).toFixed(n < 0.01 ? 1 : 1) + "%";
const when = s => new Date(s).toLocaleString();
const day = s => new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const fmtS = v => (v >= 1000 ? `${(v / 1000).toFixed(v % 1000 === 0 ? 0 : 1)}s` : `${Math.round(v)}ms`);
const lineText = r => (r.to_ms > 0 ? `${fmtS(r.ms)} to ${fmtS(r.to_ms)}` : fmtS(r.ms));

// A reading is prose with values spliced through it, so htm hands back an
// array of children rather than one element. React wants keys on any array.
const keyed = v => Array.isArray(v)
  ? v.map((c, i) => React.createElement(Frag, { key: i }, c))
  : v;

// Verdicts map onto the kit's semantic states; the words stay the run's own.
const TONE = { pass: "success", warn: "warning", fail: "danger" };
function Badge({ v }) {
  return html`<span className=${"cs-badge" + (TONE[v] ? " cs-badge-" + TONE[v] : "")}>${v}</span>`;
}

const CLOCKS = [
  ["end_of_speech", "From true end of speech", "ttfa"],
  ["detection", "From detection", "think_speak"],
];
const KIND_ORDER = ["observed", "target", "perceptual"];
const KIND_LABEL = { observed: "where agents are", target: "published target", perceptual: "human reference" };

const HEAT_METRICS = [
  ["p50", "p50 TTFA", s => s.ttfa && s.ttfa.p50_ms, v => ms(v)],
  ["p90", "p90 TTFA", s => s.ttfa && s.ttfa.p90_ms, v => ms(v)],
  ["p95", "p95 TTFA", s => s.ttfa && s.ttfa.p95_ms, v => ms(v)],
  ["agent_p95", "agent p95", s => s.agent_ttfa && s.agent_ttfa.p95_ms, v => ms(v)],
  ["vs_clean", "p95 × clean", s => s.vs_clean, v => v.toFixed(2) + "×"],
];

const describeNet = p => {
  const parts = [];
  if (p.delay_ms > 0 || p.jitter_ms > 0) parts.push(`+${p.delay_ms || 0}ms${p.jitter_ms > 0 ? ` ±${p.jitter_ms}ms` : ""}`);
  if (p.loss_pct > 0) parts.push(`${p.loss_pct}% loss`);
  return parts.length ? parts.join(", ") : "unimpaired";
};

// ---- The readings and the reference tables.
const GLOSSARY = [
  ["p50 / p95 TTFA",
   "Time to first audio: you stop talking, and this is how long the line stays dead before the agent says anything. p50 is the middle turn; p95 is the turn worse than 95% of the rest.",
   "p50 is the call you usually get. p95 is the call that makes someone hang up, and it is always worse than the average suggests."],
  ["Endpointing",
   "The first half of that wait: how long the agent took to notice you had stopped, before it began working on a reply.",
   "It is a silence threshold, not computation. If this is the big half, a faster model changes nothing."],
  ["Think / speak",
   "The second half: the language model composing a reply plus the voice generating audio for it.",
   "This is the half that queues under load. If it grows while endpointing holds, the agent ran out of compute, not patience."],
  ["Agent TTFA",
   "TTFA with the network round trip taken out: every call pings the agent over its own connection, and that round trip is subtracted turn by turn.",
   "Observed TTFA moves when the test moves. This is the share the agent owns, so it is the figure to compare between runs placed from different places."],
  ["Talk ratio",
   "The agent's share of the speaking, counted in seconds of audio rather than lines of text.",
   "Published work puts half of voice agents at 0.80 or above. That is an agent delivering a monologue at a customer."],
  ["Words per minute",
   "Pace, measured over each side's own speaking time rather than the clock, so pauses do not flatter a slow agent.",
   "Above roughly 190 is faster than a person can comfortably follow on a phone line."],
  ["Interruption score",
   "0 to 5, as 5 x (1 - interruptions / turns). 5 means the agent never talked over the caller.",
   "The same formula the commercial platforms publish, so a run here can be read beside one from them."],
  ["Dead air",
   "Turns where the line stayed silent more than two seconds after the caller finished.",
   "A percentile says how slow the slow turns were. This says how often the call sounded broken, which is the thing a caller actually notices."],
  ["Waits past 1.2s",
   "Turns where the caller waited more than 1.2 seconds after finishing before the agent made a sound.",
   "Coval puts the point where callers start repeating themselves, talking over the agent or hanging up at 1.2 seconds. A p95 says how long the slow waits were; this says how often a caller hit one."],
  ["Wait per turn",
   "The wait at one turn of the conversation, across every call at that load: the greeting, the order number, the goodbye.",
   "A step's figures mix every turn together. A turn slow in every call hides in that mix and stands out here."],
  ["Leading silence",
   "How long the agent's reply stays silent after its audio starts arriving, until the first sound loud enough to hear.",
   "TTFA stops at the first byte. A voice that opens its reply with a pause keeps the caller waiting past it, and only this shows it."],
  ["Quality verdict",
   "Whether a step still did the job as well as at normal load: scenario checks, the judge's task success, words misheard, talking over callers and failed turns.",

  ["Repeated replies",
   "Replies that said again what the agent had already said earlier in the same call.",
   "A conversation stuck in a loop sounds broken long before any timing moves."],
  ["Word error rate",
   "How much of what the caller said the agent misheard, against the exact script the caller was given.",
   "The one failure no timing can show: an agent can answer in 300ms, fluently, to a question nobody asked."],
  ["Barge-in yield",
   "When the caller cuts in, how long the agent keeps talking before it stops.",
   "An agent that never stops has taken the floor from the person paying for the call."],
  ["Cost per turn",
   "Billable agent-minutes for the step, divided by the turns in it.",
   "Voice agents bill by the minute, so latency is a price. Verbosity is the same bill in a different disguise."],
  ["Two clocks",
   "Every step is timed twice: from the instant the caller actually stopped talking, and from the instant the agent's transcript of the caller arrived.",
   "Published latency numbers start the timer at different instants. A number is only comparable with another taken on the same clock."],
  ["Reference lines",
   "Thresholds and observations other people have published, each drawn on the clock its source defined, with its source and date.",
   "Where this agent sits against real deployments and vendor targets. They disagree with each other, so none of them is the verdict."],
  ["Phase",
   "What a step is for: smoke, ramp, stress, spike, soak or recovery. A spike jumps straight to peak, a soak holds one load for a long time, a recovery drops back to baseline afterwards.",
   "A profile of ramps only asks how much at once. It never asks what a sudden jump does, what an hour does, or whether the agent comes back."],
  ["Drift",
   "A step getting slower across its own duration while the load never changed, found by splitting its calls in half by start time.",
   "A leak, a filling queue or a cache going cold. All three look perfectly healthy in any single percentile for the step."],
  ["Task success",
   "Whether the agent did the job, graded by a language model reading the transcript against the scenario's written criteria.",
   "Every other number says how the call sounded. This is the only one that says whether it was worth making."],
  ["Heard versus done",
   "Task success split by how badly the agent misheard the caller, and the two groups compared.",
   "Whether the transcript is what is costing you tasks. A word error rate alone gives nobody a reason to act; this one either does or clears it."],
  ["Pacing drift",
   "How far the caller's audio drifted from real time. This measures the test rig, not the agent.",

const APPENDIX = [
  ["TTFA", "t(agent's first audio byte arrives) − t(caller's last audio frame finishes playing)", "Per turn. Kept negative when the agent spoke before the caller finished. Turns the agent talked over are left out of percentiles."],
  ["Endpointing", "t(agent's transcript of the caller arrives) − t(caller's last frame finishes)", "The last transcript before the agent's first audio. Absent when the target sends none."],
  ["Think / speak", "t(agent's first audio) − t(agent's transcript of the caller)", "Endpointing + think/speak = TTFA whenever both exist."],
  ["Turn latency", "t(agent's audio finishes playing) − t(caller's last frame finishes)", "Playout end comes from audio duration, not arrival: voices stream faster than realtime."],
  ["Round trip", "t(pong received) − t(ping sent), a WebSocket ping on the call's own connection once a second", "Per turn: the median of pings sent between the caller starting to speak and the agent's first audio, or the latest before it. No pong means no sample; a pong faster than the clock resolves is a real sample of zero."],
  ["Agent TTFA", "TTFA − that turn's round trip; agent endpointing = endpointing − that turn's round trip", "Only turns with a measured round trip. An estimate: the network's share comes out, the agent's internals stay together. The verdict uses observed TTFA."],
  ["Percentile", "value at rank ⌈p ÷ 100 × n⌉ of the step's values sorted ascending", "Nearest rank over one step's turns, never pooled across steps. p50, p90, p95, p99."],
  ["Setup success", "calls that reached a conversation ÷ calls attempted", "Per step."],
  ["Verdict", "r = step p95 TTFA ÷ baseline step p95 TTFA. Pass r ≤ 1.5, warn r ≤ 2, fail r > 2 or setup < 97%", "In an impairment matrix every cohort's r uses the clean cohort's baseline step."],
  ["Breakpoint", "first step, in profile order, whose verdict is fail", "One per run, and one per cohort in a matrix."],
  ["Two clocks", "from end of speech = TTFA; from detection = think/speak = t(first audio) − t(agent's transcript of the caller)", "Every step is reported on both."],
  ["Reference line", "the step's value on the line's clock and percentile, compared with the line, or with the top of a range", "p50 and p95 both when the source states no percentile. Never a verdict."],
  ["Drift", "(p50 of the later half − p50 of the earlier half) ÷ p50 of the earlier half", "Halves split by call start. +15% or more drifting, −15% or less settling. Each half needs 10 turns."],
  ["Recovered", "recovery step r ≤ 1.2", "Recovery runs at the baseline's own concurrency."],
  ["Pacing drift", "(t(caller end) − t(caller start)) − length of the caller's audio", "Measures the harness. A step whose worst drift exceeds 100ms either way is marked suspect."],
  ["Word error rate", "(substitutions + deletions + insertions) ÷ words in the caller's script, summed over the step", "Turns the target transcribed and the caller finished."],
  ["Talk ratio", "agent speech seconds ÷ (agent + caller speech seconds)", "Speech lengths from audio duration."],
  ["Words per minute", "words spoken ÷ that speaker's own speech minutes", "Not wall clock, so pauses do not flatter anyone."],
  ["Interruption score", "clamp(5 × (1 − interruptions ÷ turns), 0, 5)", "An interruption is a turn where the agent began speaking before the caller finished."],
  ["Dead air", "turns with TTFA over 2s", "A turn the agent talked over has no silence to count."],
  ["Wait bands", "timed turns counted by TTFA: ≤ 800ms, ≤ 1200ms, ≤ 2s, over 2s", "Per step. 800ms is Hamming's target, 1.2s is where Coval says callers repeat themselves, over 2s is dead air. Turns the agent talked over are left out."],
  ["Wait per turn", "TTFA percentiles over one turn position across a step's calls, with that turn's endpointing and think/speak p50", "The caller's line shown is the one said most often on that turn."],
  ["Leading silence", "t(the first 10ms window with RMS above 0.01 of full scale, stepped 1ms, starts playing) − t(the reply's first audio byte)", "Coval's onset definition. Audible TTFA = TTFA + leading silence. Only turns where sound was found; a silence-free reply reads 0."],
  ["Repeated reply", "a reply whose words, ignoring case and punctuation, equal an earlier reply's in the same call, or share at least 80% of their distinct words when both have 4 or more", "Counted per step, with the calls they were in."],
  ["Quality verdict", "fail: a scenario check or the judge's pass rate drops more than 10 points, words misheard rise more than 2 points to above 15%, talked-over turns rise more than 5 points to above 10%, or more than 1% of turns fail. warn: a drop of 5 to 10 points, those rises below the poor mark, or more than 0.5% of turns failing", "Against the baseline step, or the clean cohort's in a matrix. Each rate needs 30 checks on both sides to be compared."],
  ["Quality breakpoint", "first step, in profile order, whose quality verdict is fail", "Reported beside the latency breakpoint."],
  ["Slow calls against done", "pass rate of judged calls with any turn's TTFA over 1200ms, against judged calls with none", "Read only with 8 or more judged calls and both groups non-empty."],
  ["Barge-in yield", "t(interrupted reply's audio stops) − t(interrupting caller line starts)", "Zero means the agent was never seen to stop."],
  ["Cost", "Σ(caller speech + turn latency) ÷ 60 × rate per minute", "Per step; per call and per turn by division. Unpriced without a rate."],
  ["Node pass rate", "visits whose reply met the node's expect ÷ visits to nodes with an expect", "Met: the reply contains a said_any phrase and no not_said phrase, ignoring case. A visit with no reply fails."],
  ["× clean", "cohort step p95 TTFA ÷ the clean cohort's same step p95 TTFA", "What the network cost at equal load."],
  ["Impairment", "tc qdisc replace dev <interface> root netem delay D J loss L", "Outbound on the calling pod, recorded verbatim with the kernel's own readback. Clean deletes the root qdisc and always runs first."],
  ["Dispatch integrity", "came back = distinct (step, seq) results; duplicates = results for a call already back; missing = dispatched − came back at the step deadline; late = results for a step already closed", "Callstorm's own pipeline, not the target's events."],
];

const BOUNDARIES = [
  ["Endpointing delay", "Last detected user speech", "End-of-turn decision", "Inside Callstorm's endpointing, which starts earlier: at the true end of speech, before anything was detected."],
  ["ASR finalization", "End-of-turn decision", "Final transcript available", "Inside Callstorm's endpointing, which ends when that transcript arrives. Not separable from outside the agent."],
  ["LLM TTFT", "Model request sent", "First output token", "Inside think/speak. Not separable from outside the agent."],
  ["Tool latency", "Tool request sent", "Tool result available", "Inside think/speak. Not separable today."],
  ["TTS first-byte", "Speakable text sent to TTS", "First audio bytes received", "Inside think/speak. Not separable from outside the agent."],
  ["TTFA", "A defined turn boundary", "First playable/audible audio", "Callstorm's TTFA, with the boundary set at the true end of speech. It ends when the first audio byte arrives, not when it plays. Audible TTFA adds the reply's leading silence, which ends it at the first audible sound. Agent TTFA subtracts the measured round trip to the agent's edge."],
  ["End-to-end response", "User finishes speaking", "Agent begins speaking", "Callstorm's TTFA is this row, ended at arrival rather than at audible start."],
  ["Interruption stop time", "Caller begins barge-in", "Agent audio stops", "Callstorm's barge-in yield, ended when the agent's audio stops arriving."],
];

function readSplit(rows) {
  const base = rows[0], peak = rows[rows.length - 1];
  const ep = peak.endpointing.p95_ms, ts = peak.think_speak.p95_ms;
  const share = ts / (ep + ts);

  if (rows.length < 2) {
    return {
      verdict: html`At ${base.concurrency} concurrent, <b>${Math.round(share * 100)}% of the wait
        is think/speak</b> and the rest is the agent noticing you stopped.`,
      why: html`One step cannot show which half gives way under load, because nothing was varied.
        The split itself is still worth knowing: it says where the time goes at rest.`,
      act: html`Run a profile with more than one concurrency step to find out which half grows.`,
    };
  }

  const epGrew = ep - base.endpointing.p95_ms;
  const tsGrew = ts - base.think_speak.p95_ms;
  const pct = (d, b) => (b > 0 ? Math.round((d / b) * 100) : 0);
  const epPct = pct(epGrew, base.endpointing.p95_ms), tsPct = pct(tsGrew, base.think_speak.p95_ms);
  const span = `${base.concurrency} to ${peak.concurrency} concurrent`;

  // Under 15% is noise on a sample this size, not a trend worth a fix.
  const moved = Math.max(Math.abs(epPct), Math.abs(tsPct)) >= 15;
  if (!moved) {
    return {
      verdict: html`Neither half gave way. From ${span} the wait held its shape:
        endpointing ${epPct >= 0 ? "+" : ""}${epPct}%, think/speak ${tsPct >= 0 ? "+" : ""}${tsPct}%.`,
      why: html`Both halves growing together, or neither growing, means this load never reached
        whatever this agent's limit is. The breakpoint is above the concurrency tested here.`,
      act: html`Push the profile higher. A sweep that never breaks has found a floor, not a ceiling.`,
    };
  }

  const thinkWon = tsGrew >= epGrew;
  return {
    verdict: thinkWon
      ? html`<b>Think/speak is the half that saturates.</b> From ${span} it
             grew ${ms(tsGrew)} (${tsPct >= 0 ? "+" : ""}${tsPct}%) while endpointing
             moved ${ms(epGrew)} (${epPct >= 0 ? "+" : ""}${epPct}%).`
      : html`<b>Endpointing is the half that saturates.</b> From ${span} it
             grew ${ms(epGrew)} (${epPct >= 0 ? "+" : ""}${epPct}%) while think/speak
             moved ${ms(tsGrew)} (${tsPct >= 0 ? "+" : ""}${tsPct}%).`,
    why: thinkWon
      ? html`That is the signature of compute queueing. Endpointing is a silence threshold: it is
             a timer, so it holds its value no matter how busy the service is. Think/speak is the
             language model and the voice doing real work, so it is what lengthens when there is
             more of that work than capacity for it.`
      : html`That is unusual, and worth checking before acting on. Endpointing is a configured
             timer, so it should not care how busy the service is. When it stretches under load
             the delay is usually transport — audio arriving late — rather than the threshold
             itself, which would make this a network finding rather than an agent one.`,
    act: thinkWon
      ? html`<b>Fix the reply, not the listening.</b> A smaller or faster model, a shorter system
             prompt, or streaming the voice so audio starts before the sentence is finished. Tuning
             the silence threshold buys nothing here: it was never the part that grew.`
      : html`<b>Check the transport before the settings.</b> Compare this against a local
             reference agent at the same concurrency. If endpointing stays flat there, the
             stretch is the network between you and the agent, not the agent.`,
  };
}

function readLatency(steps, rep) {
  const base = steps.find(s => s.name === rep.baseline) || steps[0];
  const worst = steps.reduce((a, s) => (s.ttfa.p95_ms > a.ttfa.p95_ms ? s : a), steps[0]);
  const bp = steps.find(s => s.verdict === "fail");
  const ratio = base.ttfa.p95_ms > 0 ? worst.ttfa.p95_ms / base.ttfa.p95_ms : 0;

  return {
    verdict: bp
      ? html`<b>It broke at ${bp.concurrency} concurrent calls.</b> p95
             reached ${ms(bp.ttfa.p95_ms)} — ${bp.p95_ratio ? bp.p95_ratio.toFixed(2) : "?"}× the
             baseline's own ${ms(base.ttfa.p95_ms)} at ${base.concurrency} concurrent.`
      : html`<b>Nothing broke.</b> The worst step, ${worst.name} at ${worst.concurrency} concurrent,
             held p95 at ${ms(worst.ttfa.p95_ms)} — ${ratio.toFixed(2)}× the baseline's ${ms(base.ttfa.p95_ms)}, inside the 2× line.`,
    why: html`p95 means 95 of every 100 turns were faster than this and 5 were slower. It is used
      instead of an average because averages hide the calls that lose customers: one turn in twenty
      is a call every hour on a busy line. The verdict compares each step against the baseline
      rather than a fixed target, because a latency that is generous for one agent is unreachable
      for another — <b>warn</b> past 1.5× the baseline, <b>fail</b> past 2×, or whenever call setup
      drops below 97%.`,
    act: bp
      ? html`That concurrency is this agent's ceiling under this scenario. Size capacity below it,
             or take the split below to find which half gave way first.`
      : html`This sweep found a floor, not a ceiling. Raise the profile's concurrency until a step
             fails, otherwise the number you can quote is "at least this", not "this".`,
  };
}

function readConversation(conv, steps) {
  // conv holds steps, not summaries: the conversation figures hang off each
  // one. Reading talk_ratio straight off the step yields NaN and prints it.
  const c = conv[conv.length - 1].conversation;
  const first = conv[0].conversation;
  const problems = [];
  if (c.talk_ratio >= 0.8) problems.push("lecturing");
  if (c.agent_wpm > 190) problems.push("rushing");
  if (c.dead_air_turns > 0) problems.push("dead air");
  if (c.interruption_score < 4.5) problems.push("interrupting");

  const pace = c.caller_wpm > 0 ? c.agent_wpm / c.caller_wpm : 1;
  return {
    verdict: problems.length === 0
      ? html`<b>It sounded like a conversation.</b> The agent held ${pct(c.talk_ratio)} of the
             speaking at ${Math.round(c.agent_wpm)} words a minute, never talked over the caller,
             and left no silence longer than two seconds.`
      : html`<b>It sounded off: ${problems.join(", ")}.</b> The agent held ${pct(c.talk_ratio)} of
             the floor at ${Math.round(c.agent_wpm)} wpm${c.dead_air_turns > 0
               ? html`, and ${c.dead_air_turns} turns left the line silent past two seconds` : ""}.`,
    why: html`None of this is visible in a latency chart. An agent can answer every turn in 300ms
      and still be unbearable: ${pct(c.talk_ratio)} of the talking means the caller
      got ${pct(1 - c.talk_ratio)} of it, and at ${Math.round(c.agent_wpm)} wpm against the
      caller's ${Math.round(c.caller_wpm)}, the agent speaks ${pace >= 1.08
        ? `${((pace - 1) * 100).toFixed(0)}% faster than` : pace <= 0.92
        ? `${((1 - pace) * 100).toFixed(0)}% slower than` : "at about the same pace as"} the
      person it is talking to. Dead air is counted separately from latency on purpose: a p95
      says how slow the slow turns were, this says how many of them sounded like a dropped call.
      ${conv.length > 1 && Math.abs(c.talk_ratio - first.talk_ratio) >= 0.03
        ? html` The ratio also moved from ${pct(first.talk_ratio)} at the lightest step, which
                means load changed how the agent spoke, not just how fast.`
        : conv.length > 1 ? html` The ratio held steady across every concurrency step.` : ""}`,
    act: problems.length === 0
      ? html`Nothing to fix here. If you want a harder test, add a scenario where the caller
             interrupts — <code>scenarios/barge-in.json</code> — since an agent only reveals
             whether it will yield the floor when something takes it.`
      : html`<b>These are prompt and voice settings, not capacity.</b>
             ${c.talk_ratio >= 0.8 ? "Cap reply length in the system prompt. " : ""}
             ${c.agent_wpm > 190 ? "Slow the voice: most providers expose a speaking-rate setting. " : ""}
             ${c.dead_air_turns > 0 ? "Dead air with healthy latency usually means a turn failed silently rather than slowly — check the failing turns above. " : ""}
             ${c.interruption_score < 4.5 ? "Lengthen the silence threshold so the agent stops cutting people off." : ""}`,
  };
}

function readCost(rows, steps) {
  const first = rows[0], last = rows[rows.length - 1];
  const rise = first.cost.usd_per_turn > 0
    ? last.cost.usd_per_turn / first.cost.usd_per_turn - 1 : 0;
  const total = steps.reduce((a, s) => a + ((s.cost && s.cost.usd) || 0), 0);
  const turns = steps.reduce((a, s) => a + (s.turns_total || 0), 0);
  // A thousand calls a day is a small deployment, and it makes a fraction of a
  // cent per turn legible as money.
  const perCall = last.cost.usd_per_call;

  return {
    verdict: rise >= 0.05
      ? html`<b>The same conversation costs ${(rise * 100).toFixed(0)}% more under load.</b>
             $${first.cost.usd_per_turn.toFixed(4)} a turn at ${first.concurrency} concurrent,
             $${last.cost.usd_per_turn.toFixed(4)} at ${last.concurrency}.`
      : html`<b>Load did not change the price.</b> A turn cost
             $${first.cost.usd_per_turn.toFixed(4)} at ${first.concurrency} concurrent and
             $${last.cost.usd_per_turn.toFixed(4)} at ${last.concurrency}.`,
    why: html`Voice agents bill for the time the session is open, so every second the caller spends
      waiting is a second you pay for. That makes latency a line item and verbosity another one:
      an agent that answers in 300ms and then talks for fifteen seconds is expensive in a way no
      percentile shows. This run billed ${steps.reduce((a, s) => a + ((s.cost && s.cost.agent_minutes) || 0), 0).toFixed(1)} agent-minutes
      across ${turns} turns at $${last.cost.rate_per_minute.toFixed(4)} a minute, or
      $${total.toFixed(2)} in total.`,
    act: html`At $${perCall.toFixed(4)} a call, <b>1,000 calls a day is about
      $${(perCall * 1000 * 30).toFixed(0)} a month</b>${rise >= 0.05
        ? html`, and that is the busy-hour price — the ${(rise * 100).toFixed(0)}% you see here is
               what the extra latency costs, so shortening replies pays twice.` : "."}${" "}Substitute your own volume; the per-call figure is the one to multiply.`,
  };
}

function readWER(rows) {
  const worst = rows.reduce((a, s) => (s.wer.mean > a.wer.mean ? s : a), rows[0]);
  const clean = worst.wer.mean <= 0.05;
  const w = worst.wer;
  // A local, because a sentence with three values in it has to fit on one line:
  // htm drops the whitespace wherever a line break lands next to a value or an
  // inline tag, and the space it drops is the one between two words.
  const errs = w.substitutions + w.deletions + w.insertions;
  return {
    verdict: clean
      ? html`<b>It heard the caller.</b> The worst step
             misheard ${pct(w.mean)} of the words: ${errs} errors across ${w.ref_words} spoken.`
      : html`<b>It misheard ${pct(w.mean)} of what was said</b> at ${worst.name}: ${errs} errors
             across ${w.ref_words} words.`,
    why: html`The caller's lines were generated from a known script, so this compares against what
      was actually spoken rather than one transcript against another. ${w.substitutions} of
      the errors are substitutions, which are the dangerous kind: a deletion usually produces a
      confused agent, but a substitution produces a confident one answering a different question.
      On an earlier run here the caller read order "four four eight one two", the agent heard
      "four four eight two", thanked them for it, and carried on toward refunding an order that
      was never named. Every timing number on that call looked healthy.`,
    act: clean
      ? html`Under 5% is the usual bar for usable recognition, so the transcript is not what is
             costing you tasks. Run with <code>-judge</code> to see whether the failures are in the
             agent's reasoning instead.`
      : html`<b>Fix the listening before the reasoning.</b> Try a stronger speech model, or supply
             domain keywords if the provider supports them — order numbers, product names and
             spelled-out digits are where these errors concentrate.`,
  };
}

function readBarge(rows) {
  const turns = rows.reduce((a, s) => a + s.barge_in.turns, 0);
  const yielded = rows.reduce((a, s) => a + s.barge_in.yielded, 0);
  const never = turns - yielded;
  const worst = rows.reduce((a, s) => Math.max(a, s.barge_in.yield_p95_ms), 0);
  return {
    verdict: never > 0
      ? html`<b>The agent kept talking ${never} of the ${turns} times it was interrupted.</b>`
      : html`<b>It stopped every time it was interrupted</b>, within ${ms(worst)} at worst.`,
    why: html`A real caller interrupts — to correct a wrong order number, to say they already tried
      that. Callstorm measures this by starting the next caller line while the agent is still
      speaking and timing how long the agent's audio keeps coming. A zero here is not a good
      score: it means the agent was never observed to stop at all, which is why it is reported as
      a failure rather than as instant.`,
    act: never > 0
      ? html`<b>This is the worst failure on the page.</b> An agent that will not yield has taken
             the floor from the person paying for the call. Check that barge-in is enabled at all,
             and that the caller's audio is reaching the agent while it speaks.`
      : html`Under about 500ms reads as a person stopping mid-sentence. Above a second the caller
             will start talking over it again, and both sides end up repeating themselves.`,
  };
}

function placeRef(r, s) {
  const sum = s[r.axis === "detection" ? "think_speak" : "ttfa"];
  if (!sum || !(sum.n > 0)) return [];
  const top = r.to_ms > 0 ? r.to_ms : r.ms;
  const key = { 50: "p50_ms", 90: "p90_ms", 95: "p95_ms", 99: "p99_ms" };
  return (r.percentile ? [r.percentile] : [50, 95]).map(p => {
    const v = sum[key[p]] || 0;
    return { percentile: p, value_ms: v, over: v > top };
  });
}

function readReferences(rows, lines) {
  const marksOf = r => rows.flatMap(s => placeRef(r, s).map(m => ({ ...m, step: s.name })));
  const worst = r => marksOf(r).reduce((a, m) => (!a || m.value_ms > a.value_ms ? m : a), null);
  const best = r => marksOf(r).reduce((a, m) => (!a || m.value_ms < a.value_ms ? m : a), null);
  const src = r => (r.cites && r.cites[0] ? r.cites[0].source : "its source");
  const observed = lines.find(r => r.kind === "observed");
  const human = lines.find(r => r.kind === "perceptual");
  const targets = lines.filter(r => r.kind === "target");
  const o = observed && worst(observed);
  const h = human && best(human);

  const verdict = !o
    ? html`<b>Read against ${lines.length} published lines</b>, each on its own clock.`
    : o.value_ms < observed.ms
    ? html`<b>Faster than agents in production.</b> Its slowest typical wait was ${fmtS(o.value_ms)} at ${o.step}, under the ${lineText(observed)} median ${src(observed)} observed in real deployments.`
    : o.over
    ? html`<b>Slower than agents in production.</b> Its slowest typical wait was ${fmtS(o.value_ms)} at ${o.step}, past the ${lineText(observed)} median ${src(observed)} observed in real deployments.`
    : html`<b>About where agents in production are.</b> Its slowest typical wait was ${fmtS(o.value_ms)} at ${o.step}, inside the ${lineText(observed)} median ${src(observed)} observed in real deployments.`;

  const targetText = targets.map(r => {
    const w = worst(r);
    if (!w) return `${r.label} has no samples on its clock`;
    return `${r.label} ${w.over ? "was crossed" : "held"}, worst ${fmtS(w.value_ms)} at ${w.step} p${w.percentile}`;
  }).join("; ");

  return {
    verdict: verdict,
    why: html`Start from where real agents are, not from where a person would be. Against the published targets: ${targetText || "none loaded"}.${h ? ` On the ${human.label.toLowerCase()} at ${lineText(human)}, where a person would answer, this agent's fastest typical wait was ${fmtS(h.value_ms)}.` : ""} These numbers come from different vendors measuring between different instants, so each is drawn only on the clock its source defined, and none of them decides pass or fail.`,
    act: html`<b>Quote a latency with its clock.</b> A p95 says nothing until it says where the timer started. This page gives every step on both clocks, and the appendix shows which published boundaries each Callstorm number spans. Pass and fail are still decided against this run's own baseline.`,
  };
}

function readPhases(rows) {
  const drifting = rows.filter(s => s.phase.drift === "drifting");
  const recovery = rows.find(s => s.phase.kind === "recovery");
  const spike = rows.find(s => s.phase.kind === "spike");
  const soak = rows.find(s => s.phase.kind === "soak");

  const d0 = drifting[0];
  const names = drifting.map(s => s.name).join(", ");
  const own = drifting.length > 1 ? "their own durations" : "its own duration";
  const from = d0 && ms(d0.phase.first_half.p50_ms), to = d0 && ms(d0.phase.second_half.p50_ms);
  const secs = d0 && Math.round(d0.phase.held_s);

  const verdict = drifting.length > 0
    ? html`<b>${names} got slower over ${own} while the load never
           changed.</b> Its median moved from ${from} to ${to} across ${secs} seconds.`
    : recovery && !recovery.phase.recovered
    ? html`<b>It did not come back.</b> ${recovery.name} returned to the baseline's concurrency but
           held p95 at ${recovery.p95_ratio ? recovery.p95_ratio.toFixed(2) : "?"}× the baseline's,
           so whatever the load did to this agent outlasted the load.`
    : html`<b>No phase drifted.</b> Every step that ran long enough to have a shape kept it: the
           calls at the end were as fast as the calls at the start.`;

  return {
    verdict: verdict,
    why: html`A profile made only of ramps asks one question — how much at once. Three others need
      a phase of their own.${spike ? html` A ${"spike"} jumps straight to peak with no warm-up,
      which is what a marketing email does to a support line and what a ramp never reproduces.` : ""}${soak
      ? html` A ${"soak"} holds one load long enough for a leak, a filling queue or a cache going
      cold to show; none of those appear in a step that lasts ninety seconds.` : ""}${recovery
      ? html` A ${"recovery"} drops back to the baseline's own concurrency afterwards, because an
      agent that survives the peak and never returns to normal has failed in a way the peak itself
      never showed.` : ""}`,
    act: drifting.length > 0
      ? html`<b>Look for something that accumulates.</b> Memory, an unbounded queue, a connection
             pool that never gives connections back, a context window that grows with the
             conversation. A run slower at its end than its start under identical load is not a
             capacity problem, and adding capacity will not fix it — it will only make the same
             failure take longer to appear.`
      : recovery && !recovery.phase.recovered
      ? html`<b>Check what the peak left behind.</b> Retries still draining, a queue still full, or
             connections that were never closed. Extend the recovery phase: if it comes back after
             five minutes, that is the real recovery time and it belongs in the runbook.`
      : soak
      ? html`Nothing accumulating that this soak was long enough to see.
             Lengthen <code>hold_s</code> before trusting that: leaks are measured in hours,
             and ${Math.round(soak.phase.held_s)} seconds is a smoke test for one.`
      : html`Add a soak and a recovery phase — <code>profiles/hamming-local.json</code> carries all
             six — since a profile of ramps only ever asks how much at once.`,
  };
}

function readTaskSuccess(j) {
  const x = j.correlation || {};
  const worst = (j.misses || []).filter(m => m.judged > 0)
    .reduce((a, m) => (!a || m.missed > a.missed ? m : a), null);
  const allPassed = j.passed === j.judged && j.judged > 0;

  // No correlation to draw: report the task result and say plainly why the
  // join is missing, rather than leaving a card that looks half-rendered.
  if (!(x.calls > 0)) {
    return {
      verdict: allPassed
        ? html`<b>It did the job every time.</b> All ${j.judged} graded conversations met every
               criterion.`
        : html`<b>It met every criterion on ${j.passed} of ${j.judged} conversations.</b>${worst &&
               worst.missed > 0
                 ? html` The one it missed most often: ${worst.criterion}.` : ""}`,
      why: html`The transcript accuracy of these calls could not be joined to their verdicts, so
        there is nothing here to say whether mishearing caused the failures. That happens when the
        target returned no transcript of the caller, which is the usual case against a reference
        agent that does no speech recognition at all.`,
      act: html`Run the same profile against the real agent to get the join. Against a reference
        target the task verdict is still meaningful; the correlation is not.`,
    };
  }

  const gap = x.gap || 0;
  return {
    verdict: !x.conclusive
      ? html`<b>No conclusion to draw yet:</b> ${x.note}. The two groups are reported below
             because they are what was measured; nothing is read into them.`
      : gap > 0
      ? html`<b>Mishearing is costing it the task.</b> The calls it heard cleanly finished the
             job ${pct(x.clean_pass_rate)} of the time; the ones it misheard,
             only ${pct(x.misheard_pass_rate)} — a gap of ${Math.round(gap * 100)} points.`
      : html`<b>Mishearing is not what is failing these calls.</b> Cleanly heard calls
             finished ${pct(x.clean_pass_rate)} of the time and misheard
             ones ${pct(x.misheard_pass_rate)}, which is no separation worth acting on.`,
    why: html`This is the join that makes word error rate worth measuring. On its own a WER figure
      is an accuracy statistic with no action attached — nobody knows whether 6% matters. Set
      against task outcomes it either points at the transcript as the thing to fix, or shows the
      failures are somewhere else and the WER number is a distraction. The same question from the
      other side needs no threshold at all: the calls that passed were
      misheard ${pct(x.median_wer_passed)} of the time at the median, the ones that
      failed ${pct(x.median_wer_failed)}. This is an association and nothing stronger — nothing assigned
      which calls got misheard, and load degrades recognition and everything else at once.`,
    act: !x.conclusive
      ? html`Raise <code>-judge-calls</code>, or judge every call with <code>-judge-calls 0</code>.
             Splitting a handful of conversations into two groups lets one call move a pass rate
             by twenty points, which is a conclusion the data cannot carry.`
      : gap > 0
      ? html`<b>Fix the listening before the reasoning.</b> A stronger speech model, or domain
             keywords if the provider supports them — order numbers, product names and spelled-out
             digits are where these errors concentrate. Changing the prompt or the model that
             thinks will not help an agent that was answering a different question.`
      : html`<b>Look past the transcript.</b> The agent heard these callers and still did not
             finish the job, so the failure is in the reasoning, the tools or the prompt. Read the
             quoted evidence above: the judge names the criterion and the line it failed on.`,
  };
}

function readAgentLatency(rows) {
  const peak = rows.reduce((a, s) => (s.ttfa.p50_ms > a.ttfa.p50_ms ? s : a), rows[0]);
  const rtt = peak.transport_rtt && peak.transport_rtt.n > 0 ? peak.transport_rtt.p50_ms : 0;
  const share = peak.ttfa.p50_ms > 0 ? rtt / peak.ttfa.p50_ms : 0;
  const big = share >= 0.2;
  return {
    verdict: big
      ? html`<b>The network is ${Math.round(share * 100)}% of the wait.</b> At ${peak.name} the caller usually waited ${ms(peak.ttfa.p50_ms)}, the round trip to the agent was ${ms(rtt)}, and the agent's own share was ${ms(peak.agent_ttfa.p50_ms)}.`
      : html`<b>The wait is the agent's.</b> At ${peak.name} the round trip was ${ms(rtt)} of a typical ${ms(peak.ttfa.p50_ms)} wait, leaving ${ms(peak.agent_ttfa.p50_ms)} as the agent's own share.`,
    why: html`A latency measured from one place includes the path from that place. The same agent tested from a laptop on hotel Wi-Fi and from a server beside its edge gets two observed TTFAs and one agent TTFA, which is what makes the agent figure comparable between runs placed from different machines. The observed figure is still the one a caller in that place experiences, so it is the one the verdict is scored on.`,
    act: big
      ? html`<b>Do not tune the agent for this share.</b> Run the test closer to the agent, or quote the agent figure beside the observed one. No endpointing threshold or model choice moves a round trip.`
      : html`Tune the agent, not the path: nearly all of this wait happens inside it. The split further down says whether it goes on noticing the caller stopped or on composing the reply.`,
  };
}

function readImpairment(m) {
  const clean = m.cohorts[0];
  const impaired = m.cohorts.slice(1);
  const peakOf = c => (c.steps || []).reduce((a, s) => ((s.vs_clean || 0) > (a.vs_clean || 0) ? s : a), (c.steps || [])[0] || {});
  const worst = impaired.reduce((a, c) => (!a || (peakOf(c).vs_clean || 0) > (peakOf(a).vs_clean || 0) ? c : a), null);
  const broke = impaired.filter(c => c.breakpoint);
  const firstBroke = broke[0];
  const stepOf = (c, name) => (c.steps || []).find(s => s.name === name);

  // Which half of the wait the network landed in, at the worst cohort's first
  // step. Delay on the caller's uplink should land in endpointing: the agent
  // hears the end of the utterance late, and replies no slower once it has.
  let split = null;
  if (worst && clean.steps && clean.steps.length) {
    const a = clean.steps[0], b = stepOf(worst, a.name);
    if (b && a.endpointing && b.endpointing && a.endpointing.n > 0 && b.endpointing.n > 0) {
      split = { step: a.name, ep: b.endpointing.p50_ms - a.endpointing.p50_ms,
                ts: b.think_speak.p50_ms - a.think_speak.p50_ms };
    }
  }

  if (!worst) {
    return {
      verdict: html`<b>Only the clean cohort ran</b>, so there is no network to compare it against.`,
      why: html`A matrix needs at least one impaired profile beside the control.`,
      act: html`Add profiles to the impairments file; the defaults are in <code>profiles/impairments.json</code>.`,
    };
  }

  const peak = peakOf(worst);
  return {
    verdict: firstBroke
      ? html`<b>The network breaks it before load does.</b> On ${firstBroke.impairment.name} (${describeNet(firstBroke.impairment)}) it fails at ${firstBroke.breakpoint}; on the clean network ${clean.breakpoint ? html`it failed at ${clean.breakpoint}` : "no step failed"}.`
      : html`<b>No network tested broke it.</b> The worst, ${worst.impairment.name} (${describeNet(worst.impairment)}), held p95 at ${(peak.vs_clean || 0).toFixed(2)}× the clean line at ${peak.name}.`,
    why: html`Every cohort placed the same calls at the same concurrency, one after the other, so a cell divided by the clean cell above it is what the network cost and nothing else. The impairment is netem on the calling pod's own interface, outbound only — a bad connection at the customer's end. This target speaks WebSocket, which is TCP: a lost packet is sent again rather than lost, so the network arrives as delay, not as damaged audio. netem also draws each packet's delay separately, so jitter reorders packets, and TCP backs off as if congested — a jittered cell can grow far past the jitter itself, and is an upper bound on what a real bad line does. Every cell is a latency, and none of them says how the call sounded.${split ? html` At ${split.step}, ${worst.impairment.name} moved endpointing by ${ms(split.ep)} and think/speak by ${ms(split.ts)}.` : ""}`,
    act: split && Math.abs(split.ep) > Math.abs(split.ts)
      ? html`<b>The network lands in endpointing</b>, as it should: the agent hears the caller stop late, then replies at its usual speed. A faster model buys nothing on a bad line; a shorter silence threshold buys back some of it, at the cost of cutting off callers who pause.`
      : html`Compare the split on the component card for the worst cohort. Delay that lands in think/speak rather than endpointing means the agent's own calls to its model or voice share the impaired path.`,
  };
}

function readNodes(worst, view) {
  const where = view.name ? ` on the ${view.name} network` : "";
  if (!worst || worst.n.pass_rate >= 1) {
    return {
      verdict: html`<b>Every scored node held</b>${where}: each assertion passed on every visit.`,
      why: html`A node passes when the agent's reply contains one of its expected phrases and none of its forbidden ones, matched as plain text so any verdict can be checked against the transcript.`,
      act: html`Tighten the assertions or push the load higher; a node that never fails has not been tested at its limit.`,
    };
  }
  return {
    verdict: html`<b>${worst.n.node} is the node that gives way</b>${where}: it passed ${pct(worst.n.pass_rate)} of ${worst.n.checked} visits at ${worst.s.name}.`,
    why: html`A call-level rate would average this node in with the ones that held and report a mild decline. Scored per node, the failure has an address.${worst.n.miss ? html` The first failing reply ${worst.n.miss}.` : ""}`,
    act: html`<b>Read that node's turns in the calls file</b>, filtered to ${worst.s.name}. A node that fails only at high concurrency is usually a timeout on whatever that step of the conversation depends on; one that fails everywhere is the prompt.`,
  };
}

function readIntegrity(d, te) {
  const dropped = te ? te.dropped : 0;
  const verdict = d && d.missing > 0
    ? html`<b>${d.missing} of ${d.dispatched} calls never came back.</b> They are scored as failed calls, so those steps describe the fleet as much as the agent.`
    : d && d.duplicates > 0
    ? html`<b>Every call came back, and ${d.duplicates} came back twice.</b> The second copy was dropped, so no call was counted twice.`
    : d
    ? html`<b>Every call dispatched came back exactly once.</b>`
    : dropped > 0
    ? html`<b>${dropped} turn events never reached the broker.</b>`
    : html`<b>Every turn event reached the broker.</b>`;
  return {
    verdict: verdict,
    why: html`Delivery is at-least-once by design: a worker commits an assignment only after publishing its result, so a worker killed between the two hands the call to another, which places it again. A duplicate is therefore expected under chaos and dropped by call identity; a missing call is not expected, and is counted as a failure rather than quietly retried. Turn events are fire-and-forget so they can never delay a caller's audio, which is why drops are counted instead of retried. None of this is the target's own events.`,
    act: d && d.missing > 0
      ? html`<b>Check the workers before the agent.</b> Look for pods restarted or rescheduled during the steps with missing calls, and re-run those steps before trusting their verdicts.`
      : html`Nothing to fix. The percentiles above rest on every call the run placed.`,
  };
}


// ---- The plain-language questions, their answer functions, the charts they draw
// ---- and the helpers they use.
const kindOf = s => (s.phase && s.phase.kind) || s.kind || "ramp";
const has = v => v !== null && v !== undefined && Number.isFinite(v);
const fixed = (v, d) => (has(v) ? v.toFixed(d) : "-");
const times = v => `${fixed(v, 2)}×`;
const pctOf = v => `${Math.round((v || 0) * 100)}%`;
const secs = v => (v >= 60 ? `${Math.floor(v / 60)} min ${Math.round(v % 60)} s` : `${Math.round(v || 0)} s`);
const atOnce = n => `${n} ${String(n) === "1" ? "call" : "calls"} at once`;
const SERIES = {
  main: "var(--signal)",
  soft: "color-mix(in srgb, var(--signal) 45%, var(--surface))",
  third: "var(--ink-2)",
  fourth: "color-mix(in srgb, var(--ink-2) 45%, var(--surface))",
};

// The load ladder: each level of calls at the same time the run tried, lightest
// first, one step per level. A built-up step is preferred over a sudden jump to
// the same level, so the ladder reads as a build-up.
// Steps where the test machine fell behind real time are left off it, because
// they measured the machine rather than the agent -- as long as two clean levels
// remain to compare. A run suspect throughout keeps every step, and the caution
// at the top of its answers says why they are rough.
function ladderOf(steps) {
  const rank = s => (kindOf(s) === "spike" ? 1 : 0);
  const byLevel = list => {
    const seen = new Set();
    return list.slice()
      .sort((a, b) => a.concurrency - b.concurrency || rank(a) - rank(b))
      .filter(s => {
        if (seen.has(s.concurrency)) return false;
        seen.add(s.concurrency);
        return true;
      });
  };
  const load = steps.filter(s => s.ttfa && s.ttfa.n > 0 && ["smoke", "ramp", "stress", "spike"].includes(kindOf(s)));
  const clean = byLevel(load.filter(s => !s.harness_degraded));
  return clean.length >= 2 ? clean : byLevel(load);
}
// Normal load is the run's baseline step when the ladder kept it, and the
// lightest level it kept otherwise: an answer that says a suspect step was left
// out cannot then measure everything against that step.
const baselineOf = (rep, L) => L.find(s => s.name === rep.baseline) || L[0];

// A line across load levels. Missing values leave a gap rather than a zero.
function LineChart({ labels, series, yFmt, refs, highlight, xTitle, endLabels = true }) {
  const W = 640, H = 210, L = 58, R = endLabels ? 110 : 18, T = 14, B = 40;
  const vals = series.flatMap(s => s.values.filter(has)).concat((refs || []).map(r => r.value));
  const top = Math.max(...vals, 1e-9) * 1.15;
  const x = i => L + (labels.length < 2 ? (W - L - R) / 2 : (i * (W - L - R)) / (labels.length - 1));
  const y = v => T + (H - T - B) * (1 - v / top);
  return html`
    <div>
      <svg viewBox="0 0 ${W} ${H}" className="qchart" role="img" aria-label=${series.map(s => s.name).join(", ")}>
        <line x1=${L} y1=${H - B} x2=${W - R} y2=${H - B} stroke="var(--rule)" strokeWidth="1"/>
        <text x=${L - 8} y=${y(top / 1.15) + 4} fontSize="10" textAnchor="end" fill="var(--mute)">${yFmt(top / 1.15)}</text>
        <text x=${L - 8} y=${H - B + 4} fontSize="10" textAnchor="end" fill="var(--mute)">0</text>
        ${highlight && html`<rect x=${x(highlight[0])} y=${T} width=${Math.max(x(highlight[1]) - x(highlight[0]), 2)} height=${H - T - B} fill="var(--fail)" opacity="0.09"/>`}
        ${(refs || []).map(r => html`
          <g key=${r.label}>
            <line x1=${L} y1=${y(r.value)} x2=${W - R} y2=${y(r.value)} stroke="var(--ink-2)" strokeWidth="1" strokeDasharray="4 3"/>
            <text x=${L + 4} y=${y(r.value) - 5} fontSize="10" fill="var(--ink-2)">${r.label}</text>
          </g>`)}
        ${series.map((s, si) => {
          const pts = s.values.map((v, i) => (has(v) ? `${x(i)},${y(v)}` : "")).filter(Boolean).join(" ");
          let last = -1;
          s.values.forEach((v, i) => { if (has(v)) last = i; });
          return html`
            <g key=${s.name}>
              <polyline fill="none" stroke=${s.color} strokeWidth="2" strokeLinejoin="round" points=${pts}/>
              ${s.values.map((v, i) => (has(v) ? html`
                <circle key=${i} cx=${x(i)} cy=${y(v)} r="4" fill=${s.color} stroke="var(--surface)" strokeWidth="2">
                  <title>${s.name + " at " + labels[i] + ": " + yFmt(v)}</title>
                </circle>` : null))}
              ${endLabels && series.length > 1 && last >= 0 && html`<text x=${W - R + 8} y=${y(s.values[last]) + 4 + si * 12} fontSize="10.5" fill="var(--ink-2)">${s.name}</text>`}
            </g>`;
        })}
        ${labels.map((l, i) => html`<text key=${i} x=${x(i)} y=${H - B + 16} fontSize="10" textAnchor="middle" fill="var(--mute)">${l}</text>`)}
        <text x=${(L + W - R) / 2} y=${H - 6} fontSize="10" textAnchor="middle" fill="var(--mute)">${xTitle}</text>
      </svg>
      ${series.length > 1 && html`
        <div className="legend">
          ${series.map(s => html`<span key=${s.name}><i style=${{background: s.color}}></i>${s.name}</span>`)}
        </div>`}
    </div>`;
}

// Horizontal bars, one per row, split into segments. With share set, each bar
// fills the width and the segments are proportions.
function StackBars({ rows, segments, valueFmt, totalFmt, share }) {
  const W = 640, L = 120, R = 92, ROW = 26;
  const H = rows.length * ROW + 6;
  const sums = rows.map(r => r.values.reduce((a, v) => a + Math.max(v || 0, 0), 0));
  const max = Math.max(...sums, 1e-9);
  const span = W - L - R;
  return html`
    <div>
      <svg viewBox="0 0 ${W} ${H}" className="qchart" role="img" aria-label=${segments.map(s => s.name).join(", ")}>
        ${rows.map((r, i) => {
          const y = i * ROW + 4;
          const sum = sums[i];
          let at = L;
          return html`
            <g key=${r.label}>
              <text x="0" y=${y + 13} fontSize="11" fill="var(--ink-2)">${r.label}</text>
              ${r.values.map((v, j) => {
                const part = Math.max(v || 0, 0);
                const width = sum > 0 ? (share ? part / sum : part / max) * span : 0;
                const x0 = at;
                at += width;
                return width > 0 ? html`
                  <rect key=${j} x=${x0} y=${y} width=${Math.max(width - 2, 1)} height="17" rx="2" fill=${segments[j].color}>
                    <title>${r.label + ": " + segments[j].name + " " + valueFmt(v)}</title>
                  </rect>` : null;
              })}
              <text x=${W - R + 8} y=${y + 13} fontSize="10.5" fill="var(--ink-2)">${totalFmt(sum)}</text>
            </g>`;
        })}
      </svg>
      <div className="legend">
        ${segments.map(s => html`<span key=${s.name}><i style=${{background: s.color}}></i>${s.name}</span>`)}
      </div>
    </div>`;
}

// Every call as a dot over time, for questions about what happened when.
function TimeDots({ points, bands, limit, lines, yFmt, xTitle }) {
  const W = 640, H = 206, L = 58, R = 16, T = 28, B = 38;
  const tmax = Math.max(1, ...points.map(p => p.t), ...(bands || []).map(b => b.to));
  const vmax = Math.max(1, ...points.map(p => p.v), limit ? limit.value : 0, ...(lines || []).map(l => l.value)) * 1.15;
  const x = t => L + (Math.max(t, 0) / tmax) * (W - L - R);
  const y = v => T + (H - T - B) * (1 - v / vmax);
  return html`
    <div>
      <svg viewBox="0 0 ${W} ${H}" className="qchart" role="img" aria-label="each call over time">
        ${(bands || []).map((b, i) => html`
          <g key=${b.label}>
            <rect x=${x(b.from)} y=${T} width=${Math.max(x(b.to) - x(b.from), 1)} height=${H - T - B} fill="var(--sunk)" opacity=${i % 2 ? 0.55 : 1}/>
            <text x=${x(b.from) + 4} y=${T - 9} fontSize="10" fill="var(--ink-2)">${b.label}</text>
          </g>`)}
        ${limit && html`
          <g>
            <line x1=${L} y1=${y(limit.value)} x2=${W - R} y2=${y(limit.value)} stroke="var(--pass)" strokeWidth="1.5" strokeDasharray="5 4"/>
            <text x=${W - R - 4} y=${y(limit.value) - 5} fontSize="10" textAnchor="end" fill="var(--ink-2)">${limit.label}</text>
          </g>`}
        ${(lines || []).map(l => html`
          <g key=${l.label}>
            <line x1=${x(l.from)} y1=${y(l.value)} x2=${x(l.to)} y2=${y(l.value)} stroke="var(--ink)" strokeWidth="2"/>
            <text x=${x(l.from) + 4} y=${y(l.value) - 6} fontSize="10" fill="var(--ink-2)">${l.label}</text>
          </g>`)}
        ${points.map((p, i) => html`
          <circle key=${i} cx=${x(p.t)} cy=${p.failed ? T + 4 : y(p.v)} r="3.5"
            fill=${p.failed ? "var(--surface)" : "var(--signal)"} stroke=${p.failed ? "var(--fail)" : "var(--surface)"} strokeWidth="1.5">
            <title>${p.failed ? "call failed at " + secs(p.t) : "call at " + secs(p.t) + ", typical wait " + yFmt(p.v)}</title>
          </circle>`)}
        <line x1=${L} y1=${H - B} x2=${W - R} y2=${H - B} stroke="var(--rule)" strokeWidth="1"/>
        <text x=${L - 8} y=${y(vmax / 1.15) + 4} fontSize="10" textAnchor="end" fill="var(--mute)">${yFmt(vmax / 1.15)}</text>
        <text x=${L} y=${H - B + 16} fontSize="10" fill="var(--mute)">0 s</text>
        <text x=${W - R} y=${H - B + 16} fontSize="10" textAnchor="end" fill="var(--mute)">${secs(tmax)}</text>
        <text x=${(L + W - R) / 2} y=${H - 6} fontSize="10" textAnchor="middle" fill="var(--mute)">${xTitle}</text>
      </svg>
      <div className="legend">
        <span><i style=${{background: "var(--signal)"}}></i>one call and its typical wait</span>
        <span><i style=${{background: "var(--surface)", border: "1.5px solid var(--fail)"}}></i>a call that failed</span>
      </div>
    </div>`;
}

// Saying which suspect steps the ladder left out keeps an answer from quietly
// changing its evidence. A run suspect throughout keeps them all, and says
// nothing here.
const leftOut = rep => {
  const kept = new Set(ladderOf(rep.steps || []).map(s => s.name));
  const names = (rep.steps || [])
    .filter(s => s.harness_degraded && !kept.has(s.name) && ["smoke", "ramp", "stress", "spike"].includes(kindOf(s)))
    .map(s => s.name);
  return names.length ? ` Left out: ${names.join(", ")}, where the test machine fell behind real time.` : "";
};

function qCapacity(rep, L) {
  const q = { id: "capacity", group: "How much it can take", ask: "How many calls at the same time can it take before callers notice it getting slower?" };
  if (L.length < 2) return { ...q, missing: "This run tried only one level of calls at the same time, so there is nothing to compare it with. Run a load plan with several steps." };
  const base = baselineOf(rep, L);
  const failed = L.find(s => s.verdict === "fail");
  const top = L[L.length - 1];
  const ok = failed ? L.filter(s => s.concurrency < failed.concurrency).pop() : top;
  const why = failed && failed.setup_success < 0.97
    ? `only ${pctOf(failed.setup_success)} of calls managed to connect`
    : failed ? `the slowest callers waited ${ms(failed.ttfa.p95_ms)}, more than twice the ${ms(base.ttfa.p95_ms)} they waited at ${base.concurrency}` : "";
  const chart = html`<${LineChart} labels=${L.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${ms}
      series=${[{ name: "slowest callers' wait", color: SERIES.main, values: L.map(s => s.ttfa.p95_ms) }]}
      refs=${[{ value: 2 * base.ttfa.p95_ms, label: "twice the normal wait" }]}/>`;
  const how = "The slowest callers means the wait that 95 turns in 100 beat. Noticeably slower means more than twice that wait at normal load, or fewer than 97 calls in 100 connecting. A level that fails while every busier level passes is not treated as the limit.";
  const note = leftOut(rep);
  // A limit is where it stays broken. A failed level with every busier level
  // passing again was slowed by something other than the number of calls.
  const busier = failed ? L.filter(s => s.concurrency > failed.concurrency) : [];
  if (failed && busier.length > 0 && busier.every(s => s.verdict !== "fail")) {
    return { ...q, how, chart, short: `Unclear: ${failed.concurrency} at once was too slow, but every busier level was not.`,
      answer: html`<b>Not clearly limited by load.</b> At ${failed.concurrency}, ${why}, but every busier level it tried stayed within twice normal, up to ${atOnce(top.concurrency)}. A slowdown that does not come back as load rises points at something else, such as the service varying over time, so run the test again before treating ${failed.concurrency} as the limit.${note}` };
  }
  return failed
    ? { ...q, how, chart,
        short: ok ? `Between ${ok.concurrency} and ${failed.concurrency} at once: fine at ${ok.concurrency}, too slow at ${failed.concurrency}.` : `Fewer than ${failed.concurrency} at once.`,
        answer: ok
          ? html`<b>Somewhere between ${ok.concurrency} and ${atOnce(failed.concurrency)}.</b> It was fine at ${ok.concurrency}, but at ${failed.concurrency}, ${why}. The test tried nothing in between, so more steps between those two would narrow it down.${note}`
          : html`<b>Fewer than ${atOnce(failed.concurrency)}.</b> At ${failed.concurrency}, ${why}.${note}` }
    : { ...q, how, chart, short: `At least ${top.concurrency} at once, and it never got noticeably slower.`,
        answer: html`<b>At least ${atOnce(top.concurrency)}, and it never got noticeably slower.</b> Even at ${top.concurrency}, the slowest callers waited ${ms(top.ttfa.p95_ms)}, within twice the ${ms(base.ttfa.p95_ms)} at normal load. Its real limit is higher than this test went.${note}` };
}

function qShape(rep, L) {
  const q = { id: "shape", group: "How it breaks", ask: "When it gets slower, does that happen gradually or all of a sudden?" };
  if (L.length < 3) return { ...q, missing: "Telling gradual from sudden needs at least three levels of calls at the same time, and this run had fewer." };
  const p = L.map(s => s.ttfa.p95_ms);
  const first = p[0], last = p[p.length - 1];
  const peak = p.indexOf(Math.max(...p));
  // The slowdown is the climb to the slowest level. Measured to the last level
  // instead, a wait that rose and fell back left a jump bigger than the whole,
  // and the answer printed a share of it above 100%.
  const climb = p[peak] - first;
  const labels = L.map(s => String(s.concurrency));
  const chart = j => html`<${LineChart} labels=${labels} xTitle="calls at the same time" yFmt=${ms}
      series=${[{ name: "slowest callers' wait", color: SERIES.main, values: p }]}
      highlight=${j >= 0 ? [j, j + 1] : null}/>`;
  const how = "We measure how much of the climb to the slowest level happens in the single biggest jump between neighbouring levels. If one jump holds more than 60% of it, the slowdown was sudden. A wait that peaks and then falls back as load keeps rising is not counted as a slowdown caused by load.";
  const note = leftOut(rep);
  if (climb <= 0.15 * first) {
    const faster = last < 0.85 * first;
    const verdict = faster ? "Neither: it got faster, not slower." : "Neither: it barely got slower.";
    return { ...q, how, chart: chart(-1), short: verdict,
      answer: html`<b>${verdict}</b> From ${L[0].concurrency} to ${atOnce(L[L.length - 1].concurrency)}, the slowest wait went from ${ms(first)} to ${ms(last)}.${note}` };
  }
  if (peak < p.length - 1 && last - first <= 0.5 * climb) {
    return { ...q, how, chart: chart(-1), short: `Neither: it slowed at ${atOnce(L[peak].concurrency)}, then recovered at busier levels.`,
      answer: html`<b>Neither: the slowdown did not follow the load.</b> The slowest wait peaked at ${ms(p[peak])} at ${atOnce(L[peak].concurrency)}, then came back to ${ms(last)} at ${L[L.length - 1].concurrency}, a busier level. Something other than the number of calls made that level slow, such as the service varying over time.${note}` };
  }
  const rises = p.slice(1, peak + 1).map((v, i) => v - p[i]);
  const j = rises.indexOf(Math.max(...rises));
  const share = Math.min(1, rises[j] / climb);
  // A jump across a wide gap in load may hide a steady climb between the two
  // levels the test tried, so a sudden answer says when that is possible.
  const gap = L[j + 1].concurrency >= 2 * L[j].concurrency
    ? " The test tried nothing between those two levels, so some of that jump may be a steady climb it didn't see."
    : "";
  return share >= 0.6
    ? { ...q, how, chart: chart(j), short: `All of a sudden, between ${L[j].concurrency} and ${atOnce(L[j + 1].concurrency)}.`,
        answer: html`<b>All of a sudden.</b> ${pctOf(share)} of the whole slowdown came in one jump, between ${L[j].concurrency} and ${atOnce(L[j + 1].concurrency)}, where the slowest wait went from ${ms(p[j])} to ${ms(p[j + 1])}. There is little warning before that point, so run well below it.${gap}` }
    : { ...q, how, chart: chart(j), short: "Gradually, with warning.",
        answer: html`<b>Gradually.</b> The slowest wait rose level by level, from ${ms(p[0])} at ${atOnce(L[0].concurrency)} to ${ms(p[p.length - 1])} at ${L[L.length - 1].concurrency}, and no single jump held most of it. Rising waits give an early warning.` };
}

function qWho(rep, L) {
  const q = { id: "who", group: "How it breaks", ask: "Do all callers get slower, or only some of them?" };
  if (L.length < 2) return { ...q, missing: "This needs at least two levels of calls at the same time to compare." };
  const base = baselineOf(rep, L), top = L[L.length - 1];
  if (!(base.ttfa.p50_ms > 0 && base.ttfa.p95_ms > 0)) return { ...q, missing: "The normal-load step has no timed turns to compare against." };
  const g50 = top.ttfa.p50_ms / base.ttfa.p50_ms, g95 = top.ttfa.p95_ms / base.ttfa.p95_ms;
  const chart = html`<${LineChart} labels=${L.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${times}
      series=${[
        { name: "typical caller", color: SERIES.soft, values: L.map(s => s.ttfa.p50_ms / base.ttfa.p50_ms) },
        { name: "slowest callers", color: SERIES.main, values: L.map(s => s.ttfa.p95_ms / base.ttfa.p95_ms) },
      ]}
      refs=${[{ value: 1, label: "normal" }]}/>`;
  const how = "Typical caller means the middle turn: half waited less and half waited more. Slowest callers means the wait 95 turns in 100 beat. Both are shown as multiples of their normal value.";
  if (g50 < 1.15 && g95 < 1.15) {
    return { ...q, how, chart, short: "Nobody got noticeably slower.",
      answer: html`<b>Nobody got noticeably slower.</b> At ${atOnce(top.concurrency)}, the typical wait was ${times(g50)} normal and the slowest ${times(g95)}.` };
  }
  if (g95 >= g50 + 0.3 && g50 < 1.2) {
    return { ...q, how, chart, short: "Only some: a few calls got stuck while most were fine.",
      answer: html`<b>Only some.</b> At ${atOnce(top.concurrency)}, the typical caller barely noticed (${times(g50)} normal) while the slowest callers waited ${times(g95)} as long. That usually means some calls are stuck in a queue or hitting a limit while the rest go straight through.` };
  }
  return { ...q, how, chart, short: "Everyone got slower together.",
    answer: html`<b>Everyone got slower together.</b> At ${atOnce(top.concurrency)}, the typical wait grew to ${times(g50)} normal and the slowest to ${times(g95)}. The whole service slowed down, rather than a few calls getting stuck.` };
}

function qProblems(rep) {
  const q = { id: "problems", group: "How it breaks", ask: "As it gets busier, do new kinds of problems show up?" };
  const steps = (rep.steps || []).filter(s => s.calls_attempted > 0);
  if (steps.length === 0) return { ...q, missing: "This run placed no calls." };
  const KINDS = [
    { name: "answered normally", color: "var(--pass)" },
    { name: "agent cut the caller off", color: "var(--warn)" },
    { name: "no answer in time", color: "color-mix(in srgb, var(--fail) 55%, var(--surface))" },
    { name: "other errors", color: "var(--fail)" },
    { name: "call never connected", color: "var(--ink-2)" },
  ];
  const split = s => {
    const timeouts = (s.errors && s.errors["turn timeout"]) || 0;
    const other = Math.max((s.turns_failed || 0) - timeouts, 0);
    const over = s.turns_yielded || 0;
    const clean = Math.max((s.turns_total || 0) - (s.turns_failed || 0) - over, 0);
    return [clean, over, timeouts, other, Math.max(s.calls_attempted - s.calls_connected, 0)];
  };
  const byLoad = steps.slice().sort((a, b) => a.concurrency - b.concurrency);
  const firsts = KINDS.slice(1)
    .map((k, i) => ({ k, s: byLoad.find(s => split(s)[i + 1] > 0) }))
    .filter(f => f.s)
    .sort((a, b) => a.s.concurrency - b.s.concurrency)
    .map(f => `${f.k.name}, from ${atOnce(f.s.concurrency)}`);
  const chart = html`<${StackBars} rows=${steps.map(s => ({ label: `${s.name} · ${s.concurrency}`, values: split(s) }))}
      segments=${KINDS} share=${true} valueFmt=${v => String(v)} totalFmt=${sum => `${sum} total`}/>`;
  const how = "Each bar splits one step's turns by what happened to them. A call that never connected had no turns, so it counts once.";
  return firsts.length === 0
    ? { ...q, how, chart, short: "No: every call connected and every turn was answered.",
        answer: html`<b>No.</b> At every step, every call connected, every turn got an answer in time, and the agent never cut a caller off.` }
    : { ...q, how, chart, short: `Yes: ${firsts[0]}.`,
        answer: html`<b>Yes.</b> In the order they appeared as calls rose: ${firsts.join("; ")}.` };
}

function qWhereWait(rep, L) {
  const q = { id: "wait", group: "What causes the wait", ask: "Where does the waiting time go?" };
  const rows = L.filter(s => s.think_speak && s.think_speak.n > 0);
  if (rows.length === 0) return { ...q, missing: "The agent under test never reported what it heard, so the wait can't be split into its parts." };
  // Silence at the start of the reply is part of the wait a caller hears, once
  // a run measures it; runs before that are split three ways as they were.
  const silent = rows.some(s => s.leading_silence && s.leading_silence.n > 0);
  const parts = s => {
    const net = s.transport_rtt && s.transport_rtt.n > 0 ? s.transport_rtt.p50_ms : 0;
    const notice = s.agent_endpointing && s.agent_endpointing.n > 0 ? s.agent_endpointing.p50_ms : (s.endpointing && s.endpointing.p50_ms) || 0;
    const p = [Math.max(net, 0), Math.max(notice, 0), Math.max(s.think_speak.p50_ms, 0)];
    return silent ? p.concat([Math.max((s.leading_silence && s.leading_silence.p50_ms) || 0, 0)]) : p;
  };
  const NAMES = ["the network", "the agent noticing you stopped", "the agent thinking up its reply", "silence at the start of its reply"];
  const SEG = [
    { name: "the network, out to the agent and back", color: "color-mix(in srgb, var(--signal) 25%, var(--surface))" },
    { name: "the agent noticing you stopped talking", color: "color-mix(in srgb, var(--signal) 55%, var(--surface))" },
    { name: "the agent thinking up and starting its reply", color: "var(--signal)" },
    { name: "silence at the start of the reply, before any sound", color: "var(--ink-2)" },
  ].slice(0, silent ? 4 : 3);
  const chart = html`<${StackBars} rows=${rows.map(s => ({ label: `${s.concurrency} at once`, values: parts(s) }))}
      segments=${SEG} valueFmt=${ms} totalFmt=${ms}/>`;
  const how = "Each bar is a typical turn at that load, split into its parts. The network part comes from pinging the agent during every call; a run with no pings counts it inside noticing you stopped." +
    (silent ? " Silence at the start of the reply is audio that arrived but held no sound a caller could hear." : "");
  const a = parts(rows[0]), b = parts(rows[rows.length - 1]);
  const grew = b.map((v, i) => v - a[i]);
  const k = grew.indexOf(Math.max(...grew));
  const biggest = a.indexOf(Math.max(...a));
  const total = a.reduce((x, v) => x + v, 0);
  const silence = silent ? `, then ${ms(a[3])} of silence at the start of its reply` : "";
  if (rows.length < 2 || grew[k] < 0.15 * total) {
    return { ...q, how, chart, short: `Mostly ${NAMES[biggest]}, and that held as it got busier.`,
      answer: html`<b>Mostly ${NAMES[biggest]}.</b> A typical turn spent ${ms(a[0])} on the network, ${ms(a[1])} on the agent noticing you stopped, and ${ms(a[2])} on it thinking up its reply${silence}, and that split held as it got busier.` };
  }
  return { ...q, how, chart, short: `The extra wait under load is ${NAMES[k]}.`,
    answer: html`<b>The extra wait under load is ${NAMES[k]}.</b> From ${rows[0].concurrency} to ${atOnce(rows[rows.length - 1].concurrency)}, that part grew by ${ms(grew[k])}, more than ${silent ? "any of the other three" : "either of the other two"}.` };
}

function qRush(rep) {
  const q = { id: "rush", group: "Sudden rushes", ask: "Can it cope with a sudden rush of calls as well as a slow build-up?" };
  const spike = (rep.steps || []).find(s => kindOf(s) === "spike" && s.ttfa && s.ttfa.n > 0);
  if (!spike) return { ...q, missing: "This run had no sudden-rush step. Add a step of kind spike that jumps straight to a high number of calls, at the same level as a built-up step." };
  const built = rep.steps.find(s => ["ramp", "stress"].includes(kindOf(s)) && s.concurrency === spike.concurrency && s.ttfa && s.ttfa.n > 0);
  if (!built) return { ...q, missing: `This run jumped straight to ${atOnce(spike.concurrency)} but never built up to that same level, so it can't tell the rush apart from the extra calls. Add a built-up step at ${spike.concurrency}.` };
  const r = spike.ttfa.p95_ms / built.ttfa.p95_ms;
  const chart = html`<${StackBars} rows=${[
      { label: "built up slowly", values: [built.ttfa.p95_ms] },
      { label: "sudden rush", values: [spike.ttfa.p95_ms] },
    ]} segments=${[{ name: `slowest callers' wait at ${atOnce(spike.concurrency)}`, color: SERIES.main }]} valueFmt=${ms} totalFmt=${ms}/>`;
  const how = "Both steps had the same number of calls at the same time. One climbed there level by level; the other jumped there from normal load. We compare the slowest callers' wait in each.";
  return r <= 1.2
    ? { ...q, how, chart, short: "Yes: a sudden rush was no worse than a slow build-up.",
        answer: html`<b>Yes.</b> Jumping straight to ${atOnce(spike.concurrency)} left the slowest callers waiting ${ms(spike.ttfa.p95_ms)}, against ${ms(built.ttfa.p95_ms)} when it built up to the same level.` }
    : { ...q, how, chart, short: `No: a sudden rush was ${times(r)} as slow as a build-up.`,
        answer: html`<b>No.</b> Jumping straight to ${atOnce(spike.concurrency)} left the slowest callers waiting ${ms(spike.ttfa.p95_ms)}, ${times(r)} the ${ms(built.ttfa.p95_ms)} they waited when it built up to the same level. Whatever makes room for more calls is too slow for a rush.` };
}

function qRecovery(rep) {
  const q = { id: "recovery", group: "Sudden rushes", ask: "After a rush ends, how long does it take to get back to normal?" };
  const steps = rep.steps || [];
  const i = steps.findIndex(s => kindOf(s) === "recovery");
  if (i < 0) return { ...q, missing: "This run had no recovery step. Add a step of kind recovery at normal load straight after a heavy one." };
  const rec = steps[i], rush = steps[i - 1];
  const base = steps.find(s => s.name === rep.baseline);
  if (!rec.timeline || rec.timeline.length === 0 || !base) return { ...q, missing: "This run predates call timestamps, so it can say whether the agent came back but not how long that took. Runs placed from this version onward record when every call happened." };
  const limit = 1.2 * base.ttfa.p50_ms;
  const useRush = rush && rush.timeline && rush.timeline.length > 0;
  const t0 = new Date(useRush ? rush.started_at : rec.started_at).getTime();
  const at = v => (new Date(v).getTime() - t0) / 1000;
  const pts = [].concat(useRush ? rush.timeline : [], rec.timeline)
    .map(p => ({ t: at(p.at), v: p.ttfa_ms || 0, failed: !!p.failed }));
  const bands = [];
  if (useRush) bands.push({ label: `heavy: ${rush.concurrency} at once`, from: 0, to: at(rec.started_at) });
  bands.push({ label: `back to ${rec.concurrency} at once`, from: at(rec.started_at), to: at(rec.ended_at) });
  const chart = html`<${TimeDots} points=${pts} bands=${bands} yFmt=${ms} xTitle="time since the heavy step began"
      limit=${{ value: limit, label: `normal: under ${ms(limit)}` }}/>`;
  const how = "Every dot is one call. Back to normal means every call from that moment to the end of the recovery step had a typical wait within 1.2 times the normal step's, with none failing.";
  const ph = rec.phase || {};
  const after = ph.back_to_normal_after_s || 0;
  const watched = (new Date(rec.ended_at) - new Date(rec.started_at)) / 1000;
  if (!ph.back_to_normal) {
    return { ...q, how, chart, short: "It had not got back to normal when the test ended.",
      answer: html`<b>It had not got back to normal after ${secs(watched)}.</b> Calls at normal load were still slower than normal when the recovery step ended, so whatever the rush left behind outlasted it.` };
  }
  return after < 1
    ? { ...q, how, chart, short: "Straight away.",
        answer: html`<b>Straight away.</b> As soon as calls dropped back to ${rec.concurrency} at once, every call was back within normal waiting time, and stayed there.` }
    : { ...q, how, chart, short: `About ${secs(after)} after the rush ended.`,
        answer: html`<b>About ${secs(after)}.</b> Once calls dropped back to ${rec.concurrency} at once, every call from ${secs(after)} onward was back within normal waiting time.` };
}

function qOverTime(rep) {
  const q = { id: "drift", group: "Staying power", ask: "Does it get slower the longer it keeps going?" };
  const soak = (rep.steps || []).find(s => kindOf(s) === "soak");
  if (!soak) return { ...q, missing: "This run had no long steady step. Add a step of kind soak that holds one load for several minutes." };
  const ph = soak.phase || {};
  if (!ph.drift || ph.drift === "unknown") return { ...q, missing: `The steady step lasted ${secs(ph.held_s || 0)}, too short to compare how it started with how it ended.` };
  const how = "The steady step is split in half by when its calls started, and the typical wait in each half is compared. A change of 15% or more counts.";
  let chart = null;
  if (soak.timeline && soak.timeline.length) {
    const t0 = new Date(soak.started_at).getTime();
    const pts = soak.timeline.map(p => ({ t: (new Date(p.at).getTime() - t0) / 1000, v: p.ttfa_ms || 0, failed: !!p.failed }));
    const mid = pts.length > 1 ? pts[Math.floor(pts.length / 2)].t : 0;
    const end = (new Date(soak.ended_at).getTime() - t0) / 1000;
    chart = html`<${TimeDots} points=${pts} yFmt=${ms} xTitle=${`time since the steady step began, ${atOnce(soak.concurrency)}`}
      lines=${[
        { from: 0, to: mid, value: ph.first_half.p50_ms, label: `first half: ${ms(ph.first_half.p50_ms)}` },
        { from: mid, to: end, value: ph.second_half.p50_ms, label: `second half: ${ms(ph.second_half.p50_ms)}` },
      ]}/>`;
  }
  const change = `${ph.drift_pct >= 0 ? "+" : ""}${Math.round((ph.drift_pct || 0) * 100)}%`;
  return ph.drift === "drifting"
