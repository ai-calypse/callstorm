// A native dialog kept in step with React state: open when told, and tell
// React when the user closes it by Escape or a click outside.
function Dialog({ open, className, label, onClose, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const d = ref.current;
    if (!d) return;
    if (open && !d.open) { d.showModal(); d.scrollTop = 0; }
    if (!open && d.open) d.close();
  }, [open]);
  useEffect(() => {
    const d = ref.current;
    if (!d) return;
    const closed = () => onClose();
    d.addEventListener("close", closed);
    return () => d.removeEventListener("close", closed);
  }, [onClose]);
  const outside = e => {
    const d = ref.current;
    if (!d || e.target !== d) return;
    const b = d.getBoundingClientRect();
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) d.close();
  };
  return html`<dialog ref=${ref} className=${className} aria-label=${label} onClick=${outside}>${open ? children : null}</dialog>`;
}

// Run history as a sparkline of worst p95 per run, oldest to newest.
function Trend({ runs }) {
  const series = runs.filter(r => r.worst_p95_ms > 0).slice(0, 20).reverse();
  if (series.length < 2) return null;
  const W = 540, H = 64, PAD = 8;
  const max = Math.max(...series.map(r => r.worst_p95_ms)) * 1.15;
  const x = i => PAD + (i * (W - PAD * 2)) / Math.max(series.length - 1, 1);
  const y = v => H - PAD - (v / max) * (H - PAD * 2);
  const color = v => `var(--cs-${TONE[v] || "info"}-text)`;
  return html`
    <div className="trend">
      <span className="eyebrow">WORST P95 · LAST ${series.length} RUNS · OLDEST LEFT</span>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label=${"Worst p95 TTFA across the last " + series.length + " runs: " + series.map(r => Math.round(r.worst_p95_ms) + "ms " + r.verdict).join(", ")}>
        <polyline fill="none" stroke="var(--cs-chart-primary)" strokeWidth="1.5" strokeLinejoin="round"
          points=${series.map((r, i) => `${x(i)},${y(r.worst_p95_ms)}`).join(" ")}/>
        ${series.map((r, i) => html`
          <circle key=${r.id} cx=${x(i)} cy=${y(r.worst_p95_ms)} r="3.5" fill=${color(r.verdict)} stroke="var(--cs-surface-detail)" strokeWidth="1.5">
            <title>${r.id + "\n" + Math.round(r.worst_p95_ms) + "ms · " + r.verdict}</title>
          </circle>`)}
      </svg>
      <div className="cost-legend">
        <span><i style=${{background:"var(--cs-success-text)"}}></i>pass</span>
        <span><i style=${{background:"var(--cs-warning-text)"}}></i>warn</span>
        <span><i style=${{background:"var(--cs-danger-text)"}}></i>fail</span>
        <span>peak ${ms(max / 1.15)}</span>
      </div>
    </div>`;
}

// A suite: several runs that count as one load test. The history shows a
// suite as one entry, placed where its newest part sits, with the worst
// part's verdict and its judged counts summed; the report page shows every
// part above whichever part is open.
const worstVerdict = rs => rs.reduce((a, r) => (r.verdict === "fail" || a === "fail" ? "fail" : r.verdict === "warn" || a === "warn" ? "warn" : "pass"), "pass");
function groupRuns(runs) {
  const out = [], seen = new Set();
  for (const r of runs) {
    if (!r.suite) { out.push({ kind: "run", run: r }); continue; }
    if (seen.has(r.suite)) continue;
    seen.add(r.suite);
    const parts = runs.filter(x => x.suite === r.suite).slice().sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
    out.push({ kind: "suite", suite: r.suite, newest: r, parts, verdict: worstVerdict(parts),
      judged: parts.reduce((a, p) => a + (p.judged || 0), 0), passed: parts.reduce((a, p) => a + (p.passed || 0), 0) });
  }
  return out;
}
const suiteParts = (runs, r) => (r && r.suite ? runs.filter(x => x.suite === r.suite).slice().sort((a, b) => new Date(a.started_at) - new Date(b.started_at)) : []);

function SuiteStrip({ suite, parts, selected, onPick, insights }) {
  const broke = parts.filter(p => p.breakpoint || (p.network_breaks && p.network_breaks.length));
  const suspect = parts.filter(p => p.harness_degraded);
  const judged = parts.reduce((a, p) => a + (p.judged || 0), 0), passed = parts.reduce((a, p) => a + (p.passed || 0), 0);
  const sweeps = parts.filter(p => !p.cohorts), matrices = parts.filter(p => p.cohorts > 0);
  return html`
    <section className="suite" aria-label="Suite">
      <div className="suite-head">
        <div>
          <span className="eyebrow">SUITE · ${suite}</span>
          <h2>${parts.length} ${parts.length === 1 ? "part" : "parts"}, one test</h2>
        </div>
        <div className="suite-verdict">
          <${Badge} v=${worstVerdict(parts)}/>
          <span className="quiet">${sweeps.length ? `${sweeps.length} load sweep${sweeps.length === 1 ? "" : "s"}` : ""}${sweeps.length && matrices.length ? " · " : ""}${matrices.length ? `${matrices.length} on impaired networks` : ""}${judged ? ` · judged ${passed}/${judged}` : ""}</span>
        </div>
      </div>
      <div className="tablewrap">
        <table className="parts">
          <thead><tr><th>Part</th><th>Scenario</th><th>Profile</th><th>Started</th><th>Peak</th><th>Worst p95</th><th>Breaks at</th><th>Judged</th><th>Verdict</th></tr></thead>
          <tbody>
            ${parts.map((p, i) => html`
              <tr key=${p.id} className=${p.id === selected ? "selected" : ""} aria-current=${p.id === selected ? "true" : "false"}>
                <td><button className="text-button part" onClick=${() => onPick(p.id)}>${i + 1}${p.id === selected ? " · open" : " ↗"}</button></td>
                <td>${p.scenario}</td>
                <td>${p.profile}${p.cohorts > 0 ? ` · ${p.cohorts} networks` : ""}</td>
                <td>${when(p.started_at)}</td>
                <td>${p.peak_concurrency}</td>
                <td>${ms(p.worst_p95_ms)}</td>
                <td>${[p.breakpoint, ...(p.network_breaks || [])].filter(Boolean).join("; ") || "held"}</td>
                <td>${p.judged > 0 ? `${p.passed || 0}/${p.judged}` : "—"}</td>
                <td><${Badge} v=${p.verdict}/>${p.harness_degraded ? html`<span className="quote">⚠ harness suspect</span>` : ""}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
      <p className="lede">${broke.length === 0
        ? `No part of this suite found a limit${judged ? `, and the graded conversations met every criterion ${passed} of ${judged} times` : ""}.`
        : `${broke.length} of ${parts.length} parts found a limit: ${broke.map(p => `${p.scenario} on ${p.profile} at ${[p.breakpoint, ...(p.network_breaks || [])].filter(Boolean).join("; ")}`).join("; ")}.`}
        ${suspect.length > 0 ? ` ${suspect.length === parts.length ? "Every part" : `${suspect.length} of ${parts.length} parts`} drifted past the 100ms pacing limit, so ${suspect.length === 1 ? "its" : "their"} latency describes the load generator as much as the agent: ${suspect.map(p => p.scenario).join(", ")}.` : ""}
        ${" "}Each part is a run of its own; the report below is the part marked open, and the parts arrive as the suite runs.</p>
      <${Insights} data=${insights} kind="suite" subject=${suite}/>
    </section>`;
}

// A written analysis of a run or a suite, generated by a language model from
// the run's own data and checked against it: every number in a kept insight
// was found in the data, and claims that cited numbers the data does not
// hold are listed as dropped rather than shown. The dashboard only reads it.
const SEVERITY = { high: "cs-badge-danger", medium: "cs-badge-warning", low: "cs-badge-success", info: "" };
const CATEGORY_TILE = { latency: "lavender", capacity: "lavender", quality: "blue", reliability: "lime", test: "peach", cost: "peach" };
function Insights({ data, kind, subject }) {
  const noun = kind === "suite" ? "suite" : "run";
  if (data === undefined) {
    return html`<section className="insights" aria-busy="true"><span className="eyebrow">WRITTEN ANALYSIS</span><p className="quiet">Looking for a written analysis of this ${noun}…</p></section>`;
  }
  if (data === null) {
    return html`
      <section className="insights none">
        <span className="eyebrow">WRITTEN ANALYSIS</span>
        <p className="quiet">No written analysis for this ${noun}. One is written at the end of every run when <code>GEMINI_API_KEY</code> is set, or by <code>callstorm -insights ${kind === "suite" ? "<dir>" : "<report>"}</code>.</p>
      </section>`;
  }
  const kept = data.insights || [], dropped = data.rejected || [];
  // A claim is dropped for a number the data does not hold, or for saying
  // again what an earlier finding said.
  const repeated = dropped.filter(r => /^repeats /.test(r.reason || "")).length;
  const unchecked = dropped.length - repeated;
  const droppedNote = [
    unchecked ? `${unchecked} ${unchecked === 1 ? "claim" : "claims"} that could not be checked` : "",
    repeated ? `${repeated} repeating an earlier finding` : "",
  ].filter(Boolean).join(", ");
  const order = ["high", "medium", "low", "info"];
  const sorted = kept.slice().sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity));
  return html`
    <section className="insights" aria-label=${`Written analysis of this ${noun}`}>
      <div className="insights-head">
        <div>
          <span className="eyebrow">WRITTEN ANALYSIS · ${String(data.model || "").toUpperCase() || "LANGUAGE MODEL"}</span>
          ${data.headline ? html`<h2>${data.headline}</h2>` : html`<h2 className="quiet-h">${kept.length} ${kept.length === 1 ? "insight" : "insights"} for this ${noun}</h2>`}
        </div>
        <span className="quiet">${data.generated_at ? `written ${when(data.generated_at)}` : ""}${data.runs && data.runs.length > 1 ? ` · from ${data.runs.length} runs` : ""}</span>
      </div>
      ${kept.length === 0 && html`<p className="quiet">Every claim the model made was dropped: ${droppedNote || "none could be checked against the data"}.</p>`}
      <div className="insight-list">
        ${sorted.map((x, i) => html`
          <article key=${i} className="insight-row">
            <div className="insight-tags">
              <span className=${"cs-badge " + (SEVERITY[x.severity] || "")}>${x.severity || "info"}</span>
              <span className=${"tab-symbol small " + (CATEGORY_TILE[x.category] || "blue")} aria-hidden="true">${{ latency: "⌁", capacity: "⌁", quality: "✓", reliability: "≋", test: "⚙", cost: "$" }[x.category] || "•"}</span>
              <span className="insight-cat">${x.category || ""}</span>
            </div>
            <h3>${x.title}</h3>
            ${x.finding && html`<p className="insight-finding">${x.finding}</p>`}
            ${x.why_it_matters && html`<p className="insight-why">${x.why_it_matters}</p>`}
            ${x.next_step && html`<div className="reading-act"><span className="eyebrow">NEXT STEP</span><p>${x.next_step}</p></div>`}
            ${x.evidence && x.evidence.length > 0 && html`
              <details className="insight-evidence">
                <summary>${x.evidence.length} ${x.evidence.length === 1 ? "piece" : "pieces"} of evidence, each checked against the data</summary>
                <ul>${x.evidence.map((e, k) => html`<li key=${k}>${e}</li>`)}</ul>
              </details>`}
          </article>`)}
      </div>
      <div className="insights-foot">
        <span className="quiet">Every number in a kept insight was found in the ${noun}'s own data.</span>
        ${dropped.length > 0 && html`
          <details className="dropped">
            <summary>Dropped: ${droppedNote}</summary>
            <ul>${dropped.map((d, k) => html`<li key=${k}><b>${d.title}</b>${d.reason ? " — " : ""}${d.reason ? html`<span>${d.reason}</span>` : ""}</li>`)}</ul>
          </details>`}
      </div>
    </section>`;
}

const runFlags = r => [
  r.harness_degraded && "harness suspect",
  r.breakpoint && `breaks at ${r.breakpoint}`,
  // passed is omitted from the index when it is zero, which is exactly the
  // run whose count matters most.
  r.judged > 0 && `judged ${r.passed || 0}/${r.judged}`,
  r.drifted > 0 && `${r.drifted} drifting`,
  r.cohorts > 0 && `${r.cohorts} network cohorts`,
  r.network_breaks && r.network_breaks.length > 0 && `network breaks it: ${r.network_breaks.join(", ")}`,
].filter(Boolean);

function RunRow({ r, selected, onPick, part }) {

function RunList({ runs, sel: selected, onPick }) {

}

function About() {
  return html`

function Tabs({ tab, setTab }) {

    "Recovered": phase && phase.kind === "recovery" && number(r) ? `${r <= 1.2 ? "Yes" : "No"} · ${r.toFixed(2)}× baseline (limit 1.20×)` : "Not a measured recovery stage",

    "Word error rate": w && w.ref_words > 0 ? `(${w.substitutions} + ${w.deletions} + ${w.insertions}) ÷ ${w.ref_words} = ${pct((w.substitutions+w.deletions+w.insertions)/w.ref_words)}` : "Not measured",
    "Talk ratio": c && number(c.agent_speech_seconds) && number(c.caller_speech_seconds) ? `${c.agent_speech_seconds}s ÷ ${c.agent_speech_seconds+c.caller_speech_seconds}s = ${pct(c.agent_speech_seconds/(c.agent_speech_seconds+c.caller_speech_seconds || 1))}` : "Not measured",
    "Words per minute": c && c.turns > 0 ? `Assistant ${c.agent_wpm ?? "not measured"} · caller ${c.caller_wpm ?? "not measured"} words/min` : "Not measured",
    "Interruption score": c && c.turns > 0 && number(c.interruptions) ? `5 × (1 − ${c.interruptions} ÷ ${c.turns}) = ${Math.max(0,Math.min(5,5*(1-c.interruptions/c.turns))).toFixed(2)} / 5` : "Not measured",

    "Node pass rate": nodes.map(n => `${n.node}: ${ratio(n.passed,n.checked)}`).join("; ") || "No scenario checks recorded",

function ComputedAppendix({ rep, refs, estimate }) {

  return html`<section className="computed-appendix ref-card">

    <div className="tablewrap"><table><thead><tr><th>Metric</th><th>Value in this run</th><th>Formula</th><th>Scope</th></tr></thead><tbody>

// Priority views: keep denominators visible and keep stages/cohorts separate.
const WAIT_BANDS = [
  ["up_to_800ms", "Within 0.8 sec", "#527052"],
  ["800_to_1200ms", "0.8–1.2 sec", "#8da9c4"],
  ["1200_to_2000ms", "1.2–2 sec", "#c19754"],
  ["over_2000ms", "Over 2 sec", "#9e5650"],
];
const measuredRatio = (a,b) => Number.isFinite(a) && b > 0 ? `${pct(a/b)} · ${a}/${b}` : "Not measured";
function stageJudged(rep, step, cohort) {
  return (rep.judge?.calls || []).filter(c => c.judged && c.step === step.name &&
    (cohort ? c.cohort === cohort : !c.cohort));
}
function validWaits(s) {
  const w = s.waits;
  return w && w.turns > 0 && WAIT_BANDS.every(([k]) => Number.isFinite(w[k]) && w[k] >= 0) &&
    WAIT_BANDS.reduce((n,[k]) => n + w[k],0) === w.turns ? w : null;
}
function matchingTest(a,b) {
  if (!b) return "No earlier report is available to compare.";
  if (!a.scenario_hash || !b.scenario_hash || !a.profile_hash || !b.profile_hash)
    return "The reports do not both record scenario and test-profile fingerprints, so matching conditions cannot be verified.";
  if (a.scenario_hash !== b.scenario_hash || a.profile_hash !== b.profile_hash || a.target !== b.target)
    return "The scenario, test profile, or assistant target differs. A direct improvement comparison would be misleading.";
  const shape = r => JSON.stringify((r.matrix?.cohorts || [{steps:sel.steps(r)}]).map(g => ({
    impairment:g.impairment || null, steps:(g.steps || []).map(s=>[s.name,s.concurrency,s.phase?.kind || "ramp"])
  })));
  return shape(a) === shape(b) ? null : "The tested stages or connection conditions differ. Compare matching test conditions first.";
}
function comparisonMetrics(rep) {
  const ss=sel.steps(rep), sum=k=>ss.reduce((n,s)=>n+(s[k] || 0),0);
  const attempts=ss.reduce((n,s)=>n+(s.calls_attempted ?? s.calls ?? 0),0);
  const allWaits=ss.length && ss.every(validWaits), waits=allWaits ? ss.reduce((n,s)=>n+s.waits.turns,0) : 0;
  const late=allWaits ? ss.reduce((n,s)=>n+s.waits['1200_to_2000ms']+s.waits.over_2000ms,0) : 0;
  const prices=ss.length && ss.every(s=>s.cost && Number.isFinite(s.cost.usd) && s.cost.agent_minutes > 0);
  return [
    {name:"Tasks completed", value:rep.judge?.judged > 0 ? rep.judge.passed/rep.judge.judged : null, count:rep.judge?.judged || 0, unit:"reviewed calls", higher:true},
    {name:"Replies taking over 1.2 sec", value:waits ? late/waits : null, count:waits, unit:"timed replies"},
    {name:"Calls that did not connect", value:attempts && ss.every(s=>Number.isFinite(s.calls_connected)) ? (attempts-sum("calls_connected"))/attempts : null, count:attempts, unit:"call attempts"},
    {name:"Cost per call attempt", value:prices && attempts ? ss.reduce((n,s)=>n+s.cost.usd,0)/attempts : null, count:attempts, unit:"call attempts", money:true,
      rates:prices ? [...new Set(ss.map(s=>(s.cost.usd/s.cost.agent_minutes).toFixed(6)))].sort().join(",") : null},
  ];
}
function PreviousTest({rep,prev,onHistory}) {
  const reason=matchingTest(rep,prev), now=comparisonMetrics(rep), before=prev ? comparisonMetrics(prev) : [];
  const fmt=(v,money)=>v === null ? "Not measured" : money ? "$"+v.toFixed(3) : pct(v);
  return html`<section className="priority-panel" aria-labelledby="previous-test-title">
    <h2 id="previous-test-title">Did the last change help?</h2>
    <p className="quiet">${reason || `Same scenario and test configuration. Previous test: ${when(prev.started_at)}. Differences describe the two tests; they do not prove a change caused them.`}</p>
    ${reason ? html`<button className="outline" onClick=${onHistory}>Choose another test</button>` : html`<${Frag}>
      ${(sel.steps(rep).some(s=>s.harness_degraded) || sel.steps(prev).some(s=>s.harness_degraded)) && html`<p className="comparison-caution">The test system fell behind in at least one report. Treat the comparison as provisional.</p>`}
      <div className="tablewrap"><table className="comparison-table"><thead><tr><th>Measure</th><th>Previous test</th><th>This test</th><th>Difference</th></tr></thead><tbody>
        ${now.map((m,i)=>{
          const p=before[i];
          const reason=m.name === "Tasks completed" && (rep.judge?.backend !== prev.judge?.backend || JSON.stringify(rep.judge?.criteria) !== JSON.stringify(prev.judge?.criteria))
            ? "Review criteria or reviewer changed" : m.money && m.rates !== p.rates ? "Pricing differs or is unavailable" : null;
          const comparable=!reason && m.value !== null && p.value !== null;
          const d=comparable ? m.value-p.value : null;
          const better=d !== null && (m.higher ? d>0 : d<0);
          return html`<tr key=${m.name}><th scope="row">${m.name}</th><td>${fmt(p.value,m.money)}<small>${p.count} ${p.unit}</small></td><td>${fmt(m.value,m.money)}<small>${m.count} ${m.unit}</small></td>
            <td className=${d === null || d === 0 ? "" : better ? "good" : "bad"}>${d === null ? reason || (m.money ? "Recorded pricing needed in both tests" : "Not measured in both tests") : d === 0 ? "Unchanged" : `${better ? "Improved" : "Worsened"}: ${m.money ? "$"+Math.abs(d).toFixed(3) : (Math.abs(d)*100).toFixed(1)+" percentage points"}`}</td></tr>`;
        })}
      </tbody></table></div><p className="quiet">Rates use the sample counts shown. Small samples can move substantially between tests. Cost comparisons use recorded prices on the same billing basis, not an estimate mixed with a recorded bill.</p><//>`}
  </section>`;
}
function PriorityViews({rep,prev,onExplore,onCall,onHistory,mode="all"}) {
  const groups=rep.matrix?.cohorts?.length ? rep.matrix.cohorts : [{steps:sel.steps(rep)}];
  const [groupIndex,setGroupIndex]=useState(0);
  const group=groups[groupIndex] || groups[0], steps=group.steps || [];
  const cohort=groupIndex > 0 ? group.impairment?.name : "";
  const [heatMetric,setHeatMetric]=useState("p95_ms");
  const [heatPick,setHeatPick]=useState(null);
  const turns=[...new Set(steps.flatMap(s=>(s.turns || []).map(t=>t.turn)))].sort((a,b)=>a-b);
  const maxWait=Math.max(1,...steps.flatMap(s=>(s.turns || []).filter(t=>t.ttfa?.n > 0).map(t=>t.ttfa[heatMetric] || 0)));
  const picked=heatPick && steps.find(s=>s.name === heatPick.step)?.turns?.find(t=>t.turn === heatPick.turn);
  const misses=(rep.judge?.misses || []).filter(m=>m.judged>0).slice().sort((a,b)=>b.missed-a.missed || a.criterion.localeCompare(b.criterion));
  const judgedTotal=rep.judge?.judged || 0;
  const heardX=rep.judge?.correlation || {}, heardRead=rep.judge ? readTaskSuccess(rep.judge) : null;
  return html`<div className="priority-views">
    <section hidden=${mode !== "all" && !["overview"].includes(mode)} className="priority-panel" aria-labelledby="load-results-title">
      <div className="priority-heading"><div><h2 id="load-results-title">What changed as more people called?</h2><p className="quiet">Read across a row to see task completion, reliability, speed, and conversation issues together.</p></div>
      ${groups.length>1 && html`<label className="stage-picker">Connection conditions<select className="cs-input" value=${groupIndex} onChange=${e=>{setGroupIndex(Number(e.target.value));setHeatPick(null);}}>${groups.map((g,i)=>html`<option key=${i} value=${i}>${g.impairment?.name || "Standard connection"}</option>`)}</select></label>`}</div>
      ${steps.length ? html`<div className="tablewrap"><table className="results-grid"><thead><tr><th>Calls at once</th><th>Tasks completed</th><th>Calls connected</th><th>Reply wait</th><th>Conversation issues</th></tr></thead><tbody>
        ${steps.map(s=>{
          const judged=stageJudged(rep,s,cohort), c=s.conversation;
          return html`<tr key=${s.name}><th scope="row">${s.concurrency}<small>${s.name}${s.harness_degraded ? " · test timing suspect" : ""}</small></th>
            <td>${judged.length ? measuredRatio(judged.filter(c=>c.met).length,judged.length) : "Not reviewed"}<small>reviewed calls meeting all requirements</small></td>
            <td>${measuredRatio(s.calls_connected,s.calls_attempted ?? s.calls)}<small>call attempts</small></td>
            <td>${s.ttfa?.n > 0 ? ms(s.ttfa.p95_ms) : "Not measured"}<small>${s.ttfa?.n || 0} replies · 95% were this fast or faster</small></td>
            <td>${c?.turns > 0 ? html`<${Frag}><span>${c.interruptions ?? "Not recorded"} talked-over replies / ${c.turns}</span><small>${c.dead_air_turns ?? "Not recorded"} waits over 2 sec</small><//>` : "Not measured"}${Number.isFinite(s.turns_failed) && html`<small>${s.turns_failed} failed replies / ${s.turns_total || 0}</small>`}</td></tr>`;
        })}
      </tbody></table></div>` : html`<p className="cs-notice">No test stages were recorded.</p>`}
      <p className="quiet">Task review and connection success are different checks. A fast, connected call can still miss the task. Reviewed samples can be much smaller than the total call count.</p>
    </section>

    <section hidden=${mode !== "all" && !["experience"].includes(mode)} className="priority-panel" aria-labelledby="wait-frequency-title"><h2 id="wait-frequency-title">How often did callers have to wait?</h2>
      <p className="quiet">Each bar contains all timed replies at that call load. Width shows the share in each wait band; counts are shown underneath.</p>
      <div className="wait-key">${WAIT_BANDS.map(([k,label,color])=>html`<span key=${k}><i style=${{background:color}}></i>${label}</span>`)}</div>
      ${steps.length ? steps.map(s=>{const w=validWaits(s);return html`<div key=${s.name} className="wait-frequency-row"><div><strong>${s.concurrency} at once</strong><small>${s.name}</small></div><div>
        ${w ? html`<${Frag}><div className="wait-stack" role="img" aria-label=${`${s.name}: `+WAIT_BANDS.map(([k,label])=>`${label}: ${w[k]} of ${w.turns} replies`).join(", ")}>
          ${WAIT_BANDS.filter(([k])=>w[k]>0).map(([k,label,color])=>html`<span key=${k} style=${{width:(w[k]/w.turns*100)+"%",background:color,color:k === "800_to_1200ms" || k === "1200_to_2000ms" ? "#182018" : "#ffffff"}} title=${`${label}: ${w[k]} replies (${pct(w[k]/w.turns)})`}>${w[k]/w.turns>=.12 ? pct(w[k]/w.turns) : ""}</span>`)}
        </div><div className="wait-counts">${WAIT_BANDS.map(([k,label])=>html`<span key=${k}>${label}: <b>${w[k]}</b></span>`)}<span>Total: ${w.turns}</span></div><//>` : html`<p className="quiet">Wait bands not recorded for this stage.</p>`}
      </div></div>`;}) : html`<p className="cs-notice">No timed replies recorded.</p>`}
    </section>

    <section hidden=${mode !== "all" && !["experience"].includes(mode)} className="priority-panel" aria-labelledby="conversation-heat-title"><div className="priority-heading"><div><h2 id="conversation-heat-title">Where in the conversation did things slow down?</h2><p className="quiet">Rows are reply positions, columns are call loads. Darker cells mean a longer wait. Select a cell to read the caller’s line.</p></div>
      <label className="stage-picker">Reply time<select className="cs-input" aria-label="Conversation heatmap measure" value=${heatMetric} onChange=${e=>setHeatMetric(e.target.value)}><option value="p95_ms">Slow replies (95th percentile)</option><option value="p50_ms">Typical reply (median)</option></select></label></div>
      ${turns.length ? html`<${Frag}><div className="tablewrap"><table className="conversation-heatmap"><thead><tr><th>Conversation moment</th>${steps.map(s=>html`<th key=${s.name}>${s.concurrency} at once<small>${s.name}</small></th>`)}</tr></thead><tbody>
        ${turns.map(n=>html`<tr key=${n}><th scope="row">Reply ${n}</th>${steps.map(s=>{const t=(s.turns || []).find(t=>t.turn===n), value=t?.ttfa?.n>0 ? t.ttfa[heatMetric] : null;return html`<td key=${s.name}>${Number.isFinite(value) ? html`<button aria-pressed=${!!(heatPick?.step === s.name && heatPick?.turn === n)} aria-label=${`Reply ${n}, ${s.concurrency} calls at once, ${ms(value)}, ${t.ttfa.n} samples`} style=${{background:`color-mix(in srgb, var(--cs-lavender) ${Math.round(15+85*Math.max(0,value)/maxWait)}%, white)`}} onClick=${()=>setHeatPick({step:s.name,turn:n})}>${ms(value)}<small>${t.ttfa.n} samples</small></button>` : html`<span className="quiet">Not measured</span>`}</td>`;})}</tr>`)}
      </tbody></table></div><p className="heat-selection" aria-live="polite">${picked ? `Reply ${picked.turn} at ${heatPick.step}: ${picked.caller_line || "Caller text was not recorded."}` : "Select a measured cell for its conversation context."}</p>
      <p className="quiet">For branching conversations, the same reply position can contain different tasks. The report stores the most common caller line, not timing by scenario node, so these rows are not treated as identical tasks. Color scales to the selected connection group.</p><//>` : html`<p className="cs-notice">Reply-position timings were not recorded in this report.</p>`}
    </section>

    <section hidden=${mode !== "all" && !["tasks"].includes(mode)} className="priority-panel" aria-labelledby="missed-requirements-title"><h2 id="missed-requirements-title">Which requirements were missed?</h2><p className="quiet">Most frequently missed first. Counts cover reviewed calls across the whole run, including all connection conditions.</p>
      ${misses.length ? html`<${Frag}><div className="requirements-ranking">${misses.map(m=>{
        const example=(rep.judge?.judgements || []).find(c=>(c.outcomes || []).some(o=>o.criterion === m.criterion && !o.met && o.evidence));
        const outcome=example?.outcomes.find(o=>o.criterion === m.criterion && !o.met && o.evidence);
        return html`<div className="requirement-row" key=${m.criterion}><div className="requirement-title"><strong>${m.criterion}</strong><span>${m.missed} of ${m.judged} missed (${pct(m.missed/m.judged)})</span></div>
          <div className="requirement-track" role="img" aria-label=${`${m.missed} of ${m.judged} reviews missed this requirement`}><span style=${{width:(m.missed/m.judged*100)+"%"}}></span></div>
          ${example ? html`<details><summary>Read an example of a missed requirement</summary><blockquote>${outcome.evidence}</blockquote><button className="text-button" onClick=${()=>onCall(example.request_id)}>Open this conversation →</button></details>` : html`<p className="quiet">${m.missed ? "No quoted example recorded." : "No misses in the reviewed sample."}</p>`}
        </div>`;
      })}</div><button className="outline" onClick=${()=>onExplore("quality")}>Explore task evidence</button><//>` : html`<p className="cs-notice">${judgedTotal ? "Individual requirement results were not recorded." : "Task completion was not reviewed in this run."}</p>`}
    </section>

    <section hidden=${mode !== "all" && !["tasks"].includes(mode)} className="priority-panel" aria-labelledby="heard-done-title"><h2 id="heard-done-title">Are the calls it misheard the calls it failed?</h2>
      ${heardX.calls > 0 ? html`<${Frag}><p className="quiet">Each dot is a reviewed call, placed by the share of its words the agent misheard. Under ${Math.round((heardX.threshold || 0.05) * 100)}% counts as heard cleanly. It shows an association, not a cause.</p>
        <p>${keyed(heardRead.verdict)}</p><${WERStrip} calls=${rep.judge.calls || []} threshold=${heardX.threshold || 0.05}/><${HeardDoneTable} x=${heardX}/>
        <p className="quiet">${keyed(heardRead.act)}</p><//>` : html`<p className="cs-notice">${heardRead ? keyed(heardRead.why) : "Task completion was not reviewed in this run, so there is no outcome to set hearing against."}</p>`}
    </section>
    <div hidden=${mode !== "all" && mode !== "compare"}><${PreviousTest} rep=${rep} prev=${prev} onHistory=${onHistory}/></div>
  </div>`;
}

// ---- Scenario comparison ----------------------------------------------------
// A suite runs one load plan through several conversations. Each part's page
// reads it against its own normal load; this reads the parts against each other
// on one axis, so a scenario that is slow everywhere is not hidden by a baseline
// that was slow too.

const SCENARIO_COLORS = ["var(--cs-chart-primary)", "var(--cs-chart-comparison)", "var(--cs-chart-target)", "var(--cs-chart-efficiency)", "var(--ink-2)"];

// wilson is the 95% Wilson score interval for k successes in n: the pass rates
// a sample this size cannot tell apart. 20 of 20 is not 100%, it is "above 84%".
function wilson(k, n) {
  if (!(n > 0)) return null;
  const z = 1.96, p = k / n, d = 1 + z * z / n;
  const c = (p + z * z / (2 * n)) / d, h = (z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n))) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}

const ratioOf = (n, d) => (has(n) && has(d) && d > 0 ? n / d : null);
const roundPct = v => `${Math.round(v * 100)}%`;

function scenarioRows(parts, reports) {
  const count = parts.reduce((m, p) => ({ ...m, [p.scenario]: (m[p.scenario] || 0) + 1 }), {});
  return parts.map((part, i) => {
    const rep = reports[part.id];
    return { part, rep, L: rep ? ladderOf(sel.steps(rep)) : [], color: SCENARIO_COLORS[i % SCENARIO_COLORS.length],
      name: count[part.scenario] > 1 ? `${part.scenario} (part ${i + 1})` : part.scenario };
  }).filter(r => r.rep);
}

const ScenarioName = ({ r, onPick }) => html`<button className="text-button scenario-link" onClick=${() => onPick(r.part.id)}><i className="scenario-swatch" aria-hidden="true" style=${{background: r.color}}></i>${r.name}</button>`;

function ScenarioWaits({ rows, onPick }) {
  const [pick, setPick] = useState("p95_ms");
  const ready = rows.filter(r => r.L.length > 0);
  const title = html`<h2 id="scenario-waits-title">Which scenario keeps callers waiting longest?</h2>`;
  if (ready.length === 0) return html`<section className="priority-panel" aria-labelledby="scenario-waits-title">${title}<p className="cs-notice">No scenario recorded reply timings.</p></section>`;
  const levels = [...new Set(ready.flatMap(r => r.L.map(s => s.concurrency)))].sort((a, b) => a - b);
  const at = (r, c) => { const s = r.L.find(s => s.concurrency === c); return s ? s.ttfa[pick] : null; };
  const table = ready.map(r => {
    const p50s = r.L.map(s => s.ttfa.p50_ms), top = r.L[r.L.length - 1];
    // The verdict is measured against the report's own baseline step, even when
    // the ladder left that step out, so the explanation quotes the same one.
    const base = sel.steps(r.rep).find(s => s.name === r.rep.baseline && s.ttfa && s.ttfa.n > 0) || baselineOf(r.rep, r.L);
    return { r, base: base.ttfa.p95_ms, top: top.ttfa.p95_ms, topLevel: top.concurrency, lo50: Math.min(...p50s), hi50: Math.max(...p50s) };
  });
  const byTop = table.slice().sort((a, b) => b.top - a.top);
  const lines = [];
  if (byTop.length > 1) {
    const hi = byTop[0], lo = byTop[byTop.length - 1];
    lines.push(`At its heaviest load, ${hi.r.name} kept its slowest callers waiting longest, ${ms(hi.top)} at the 95th percentile at ${atOnce(hi.topLevel)}, and ${lo.r.name} the least, ${ms(lo.top)} at ${atOnce(lo.topLevel)}.`);
  }
  // A verdict compares a scenario with its own normal load, so a scenario that
  // was slow from the start can pass while a faster one fails.
  const failing = table.filter(t => t.r.part.verdict === "fail"), passing = table.filter(t => t.r.part.verdict !== "fail");
  const inverted = passing.filter(q => failing.some(f => q.top > f.top)).sort((a, b) => b.top - a.top)[0];
  if (inverted) {
    const f = failing.filter(f => inverted.top > f.top).sort((a, b) => a.top - b.top)[0];
    lines.push(`Yet ${inverted.r.name} ${inverted.r.part.verdict === "warn" ? "only warned" : "passed"} while ${f.r.name} failed, at ${ms(inverted.top)} against ${ms(f.top)}. Each verdict compares a scenario with its own normal load, and those differed: ${inverted.r.name} started at ${ms(inverted.base)}, ${f.r.name} at ${ms(f.base)}. Read the verdicts for what load changed, and this chart for how slow each scenario is.`);
  }
  // A line that starts late is a scenario whose early levels measured the test
  // machine rather than the agent; saying so keeps a short line from reading as
  // a scenario that was only tested at heavy load.
  for (const r of ready) {
    const left = sel.steps(r.rep).filter(s => s.harness_degraded && !r.L.includes(s));
    if (!left.length) continue;
    const first = r.L[0].concurrency, last = r.L[r.L.length - 1].concurrency;
    const where = left.every(s => s.concurrency < first) ? `its line starts at ${atOnce(first)}`
      : left.every(s => s.concurrency > last) ? `its line stops at ${atOnce(last)}` : "its line skips those levels";
    lines.push(`${r.name} leaves out ${left.map(s => s.name).join(", ")}, where the test machine fell behind real time, so ${where}${left.some(s => s.name === r.rep.baseline) ? " and its verdict rests on a suspect baseline" : ""}.`);
  }
  const medians = table.flatMap(t => [t.lo50, t.hi50]);
  if (table.length > 1 && Math.max(...medians) <= 1.25 * Math.min(...medians)) {
    lines.push(`The typical wait hardly moved: every scenario's median stayed between ${ms(Math.min(...medians))} and ${ms(Math.max(...medians))} at every load, so what changed was the slowest calls.`);
  }
  return html`<section className="priority-panel" aria-labelledby="scenario-waits-title">
    <div className="priority-heading"><div>${title}<p className="quiet">Reply wait from the moment the caller stopped speaking, every scenario on the same axis.</p></div>
      <label className="stage-picker">Reply time<select className="cs-input" aria-label="Scenario wait measure" value=${pick} onChange=${e => setPick(e.target.value)}><option value="p95_ms">Slow replies (95th percentile)</option><option value="p50_ms">Typical reply (median)</option></select></label></div>
    <div className="scenario-line-chart"><${LineChart} labels=${levels.map(String)} xTitle="calls at the same time" yFmt=${v => ms(v)} endLabels=${false}
      series=${ready.map(r => ({ name: r.name, color: r.color, values: levels.map(c => at(r, c)) }))}/></div>
    ${lines.map((l, i) => html`<p key=${i} className="scenario-reading">${l}</p>`)}
    <div className="tablewrap"><table className="results-grid"><thead><tr><th>Scenario</th><th>Normal load</th><th>Heaviest load</th><th>Typical wait</th><th>Verdict</th></tr></thead><tbody>
      ${table.map(t => html`<tr key=${t.r.part.id}><th scope="row"><${ScenarioName} r=${t.r} onPick=${onPick}/></th>
        <td>${ms(t.base)}<small>95th percentile</small></td>
        <td>${ms(t.top)}<small>95th percentile at ${atOnce(t.topLevel)}</small></td>
        <td>${ms(t.lo50)} to ${ms(t.hi50)}<small>median across load levels</small></td>
        <td><${Badge} v=${t.r.part.verdict}/><small>${t.r.part.breakpoint ? `breaks at ${t.r.part.breakpoint}` : "held against its own normal load"}</small></td></tr>`)}
    </tbody></table></div>
  </section>`;
}

function ScenarioTasks({ rows, onPick }) {
  const title = html`<h2 id="scenario-tasks-title">Did every scenario do the job?</h2>`;
  const judged = rows.filter(r => r.rep.judge && r.rep.judge.judged > 0);
  if (judged.length === 0) return html`<section className="priority-panel" aria-labelledby="scenario-tasks-title">${title}<p className="cs-notice">No scenario in this test was judged, so nothing compares how often each did the job. Run the suite with -judge and written success criteria, or re-judge its runs with -rejudge.</p></section>`;
  const stats = judged.map(r => {
    const j = r.rep.judge;
    const calls = sel.steps(r.rep).reduce((a, s) => a + (s.calls_attempted ?? s.calls ?? 0), 0);
    return { r, j, calls, rate: j.passed / j.judged, ci: wilson(j.passed, j.judged) };
  });
  const lines = [];
  const lo = Math.max(...stats.map(s => s.ci[0])), hi = Math.min(...stats.map(s => s.ci[1]));
  const sizes = stats.map(s => s.j.judged);
  if (stats.every(s => s.rate === 1)) {
    lines.push(`Every judged call in every scenario did the job. With ${Math.min(...sizes)}${Math.min(...sizes) === Math.max(...sizes) ? "" : ` to ${Math.max(...sizes)}`} judged calls each, that fits a true pass rate of ${roundPct(Math.min(...stats.map(s => s.ci[0])))} or better in all of them.`);
  } else if (lo <= hi) {
    const worst = stats.slice().sort((a, b) => a.rate - b.rate)[0];
    lines.push(`No scenario is shown to do the job less often than another: every scenario's range overlaps the rest. The lowest measured was ${worst.r.name}, at ${pct(worst.rate)}.`);
  } else {
    const worst = stats.slice().sort((a, b) => a.ci[1] - b.ci[1])[0];
    const better = stats.filter(s => s.ci[0] > worst.ci[1]);
    lines.push(`${worst.r.name} did the job less often: ${pct(worst.rate)} (${roundPct(worst.ci[0])} to ${roundPct(worst.ci[1])}), against ${better.map(s => `${s.r.name} at ${pct(s.rate)}`).join(", ")}. Their ranges do not overlap, so a sample this size shows a real difference.`);
  }
  const judgedAll = stats.reduce((a, s) => a + s.j.judged + (s.j.errored || 0), 0), callsAll = stats.reduce((a, s) => a + s.calls, 0);
  if (judgedAll < callsAll) lines.push(`Only ${judgedAll} of ${callsAll} calls were judged. Judge every call with -judge-calls 0 to narrow the ranges.`);
  const graders = [...new Set(stats.map(s => s.j.backend).filter(Boolean))];
  if (graders.length > 1) lines.push(`The scenarios were judged by different graders (${graders.join(", ")}), so part of any difference may be the grader.`);

  // The same criterion asked in several scripts says whether a behaviour holds
  // regardless of the conversation around it.
  const crit = new Map();
  for (const s of stats) for (const m of s.j.misses || []) {
    if (!(m.judged > 0)) continue;
    if (!crit.has(m.criterion)) crit.set(m.criterion, {});
    crit.get(m.criterion)[s.r.part.id] = m;
  }
  const critRows = [...crit.entries()].sort((a, b) => Object.keys(b[1]).length - Object.keys(a[1]).length);
  return html`<section className="priority-panel" aria-labelledby="scenario-tasks-title">${title}
    <p className="quiet">Judged calls that met every requirement. The bar is the measured rate; the darker band is the range of true rates a sample this size cannot rule out (95% Wilson interval).</p>
    <div className="requirements-ranking">${stats.map(s => html`<div className="requirement-row" key=${s.r.part.id}>
      <div className="requirement-title"><strong><${ScenarioName} r=${s.r} onPick=${onPick}/></strong><span>${s.j.passed} of ${s.j.judged} did the job (${pct(s.rate)}) · range ${roundPct(s.ci[0])} to ${roundPct(s.ci[1])}</span></div>
      <div className="requirement-track rate-track" role="img" aria-label=${`${s.r.name}: ${pct(s.rate)} of ${s.j.judged} judged calls, 95% range ${roundPct(s.ci[0])} to ${roundPct(s.ci[1])}`}>
        <span className="rate-fill" style=${{width: s.rate * 100 + "%"}}></span><span className="rate-range" style=${{left: s.ci[0] * 100 + "%", width: (s.ci[1] - s.ci[0]) * 100 + "%"}}></span></div>
      <small>${s.j.judged + (s.j.errored || 0)} of ${s.calls} calls judged${s.j.errored ? `, ${s.j.errored} could not be graded` : ""}${s.j.backend ? ` · ${s.j.backend}` : ""}</small>
    </div>`)}</div>
    ${lines.map((l, i) => html`<p key=${i} className="scenario-reading">${l}</p>`)}
    ${critRows.length > 0 && html`<div className="tablewrap"><table className="results-grid"><thead><tr><th>Requirement</th>${stats.map(s => html`<th key=${s.r.part.id}>${s.r.name}</th>`)}</tr></thead><tbody>
      ${critRows.map(([c, by]) => html`<tr key=${c}><th scope="row">${c}</th>${stats.map(s => {
        const m = by[s.r.part.id];
        return html`<td key=${s.r.part.id}>${m ? `${m.judged - m.missed} of ${m.judged}` : html`<span className="quiet">not asked</span>`}${m && m.missed > 0 ? html`<small>${m.missed} missed</small>` : ""}</td>`;
      })}</tr>`)}
    </tbody></table></div>`}
  </section>`;
}

function ScenarioTurns({ rows, onPick }) {
  const title = html`<h2 id="scenario-turns-title">Is the slow moment the same in every scenario?</h2>`;
  const data = rows.filter(r => r.L.length).map(r => {
    const top = r.L[r.L.length - 1];
    return { r, top, ts: (top.turns || []).filter(t => t.ttfa && t.ttfa.n > 0) };
  }).filter(d => d.ts.length);
  if (data.length === 0) return html`<section className="priority-panel" aria-labelledby="scenario-turns-title">${title}<p className="cs-notice">Reply-position timings were not recorded for these scenarios.</p></section>`;
  const positions = Array.from({ length: Math.max(...data.flatMap(d => d.ts.map(t => t.turn))) }, (_, i) => i + 1);
  const maxWait = Math.max(1, ...data.flatMap(d => d.ts.map(t => t.ttfa.p95_ms)));
  const slow = data.map(d => ({ d, t: d.ts.reduce((a, t) => (t.ttfa.p95_ms > a.ttfa.p95_ms ? t : a)), last: Math.max(...d.ts.map(t => t.turn)) }));
  const span = xs => `${ms(Math.min(...xs))}${Math.min(...xs) === Math.max(...xs) ? "" : ` to ${ms(Math.max(...xs))}`}`;
  const reading = data.length < 2 ? ""
    : slow.every(x => x.t.turn === x.last)
    ? `The last reply is the slowest in every scenario, ${span(slow.map(x => x.t.ttfa.p95_ms))} at the 95th percentile. A delay every script shares comes from how the calls end rather than from any one conversation: look at what the agent does when it answers the caller's closing line.`
    : slow.every(x => x.t.turn === slow[0].t.turn)
    ? `Reply ${slow[0].t.turn} is the slowest in every scenario, ${span(slow.map(x => x.t.ttfa.p95_ms))} at the 95th percentile, so the delay does not depend on the script.`
    : `The slowest reply differs by scenario: ${slow.map(x => `${x.d.r.name} at reply ${x.t.turn} (${ms(x.t.ttfa.p95_ms)})`).join(", ")}.`;
  return html`<section className="priority-panel" aria-labelledby="scenario-turns-title">${title}
    <p className="quiet">Slow replies (95th percentile) at each reply position, for each scenario at its heaviest load. Darker cells mean a longer wait; hover a cell for the caller's line.</p>
    <div className="tablewrap"><table className="conversation-heatmap"><thead><tr><th>Scenario</th>${positions.map(n => html`<th key=${n}>Reply ${n}</th>`)}</tr></thead><tbody>
      ${slow.map(({ d, t: worst }) => html`<tr key=${d.r.part.id}><th scope="row"><${ScenarioName} r=${d.r} onPick=${onPick}/><small>${atOnce(d.top.concurrency)}</small></th>${positions.map(n => {
        const t = d.ts.find(t => t.turn === n);
        return html`<td key=${n}>${t ? html`<div className="scenario-heat" title=${t.caller_line || ""} style=${{background: `color-mix(in srgb, var(--cs-lavender) ${Math.round(15 + 85 * t.ttfa.p95_ms / maxWait)}%, white)`}}>${t === worst ? html`<b>${ms(t.ttfa.p95_ms)}</b>` : ms(t.ttfa.p95_ms)}<small>${t.ttfa.n} samples</small></div>` : html`<span className="quiet">none</span>`}</td>`;
      })}</tr>`)}
    </tbody></table></div>
    ${reading && html`<p className="scenario-reading">${reading}</p>`}
  </section>`;
}

function ScenarioWaitBands({ rows, onPick }) {
  const title = html`<h2 id="scenario-bands-title">How often did callers wait long enough to notice?</h2>`;
  const data = rows.map(r => {
    const ws = r.L.map(validWaits).filter(Boolean);
    if (ws.length === 0) return null;
    const w = { turns: ws.reduce((a, x) => a + x.turns, 0) };
    for (const [k] of WAIT_BANDS) w[k] = ws.reduce((a, x) => a + x[k], 0);
    return { r, w, past: (w["1200_to_2000ms"] + w.over_2000ms) / w.turns };
  }).filter(Boolean);
  if (data.length === 0) return html`<section className="priority-panel" aria-labelledby="scenario-bands-title">${title}<p className="cs-notice">Wait bands were not recorded for these scenarios.</p></section>`;
  const byPast = data.slice().sort((a, b) => b.past - a.past);
  return html`<section className="priority-panel" aria-labelledby="scenario-bands-title">${title}
    <p className="quiet">Every timed reply across each scenario's load levels, sorted by the caller's wait.</p>
    <div className="wait-key">${WAIT_BANDS.map(([k, label, color]) => html`<span key=${k}><i style=${{background: color}}></i>${label}</span>`)}</div>
    ${data.map(({ r, w }) => html`<div key=${r.part.id} className="wait-frequency-row"><div><${ScenarioName} r=${r} onPick=${onPick}/><small>${w.turns} replies</small></div><div>
      <div className="wait-stack" role="img" aria-label=${`${r.name}: ` + WAIT_BANDS.map(([k, label]) => `${label}: ${w[k]} of ${w.turns} replies`).join(", ")}>
        ${WAIT_BANDS.filter(([k]) => w[k] > 0).map(([k, label, color]) => html`<span key=${k} style=${{width: (w[k] / w.turns * 100) + "%", background: color, color: k === "800_to_1200ms" || k === "1200_to_2000ms" ? "#182018" : "#ffffff"}} title=${`${label}: ${w[k]} replies (${pct(w[k] / w.turns)})`}>${w[k] / w.turns >= .12 ? pct(w[k] / w.turns) : ""}</span>`)}
      </div><div className="wait-counts">${WAIT_BANDS.map(([k, label]) => html`<span key=${k}>${label}: <b>${w[k]}</b></span>`)}</div>
    </div></div>`)}
    ${data.length > 1 && html`<p className="scenario-reading">${byPast[0].r.name} kept callers waiting past 1.2 seconds most often, on ${pct(byPast[0].past)} of replies, against ${pct(byPast[byPast.length - 1].past)} for ${byPast[byPast.length - 1].r.name}. Past 1.2 seconds is where Coval says callers start repeating themselves.</p>`}
  </section>`;
}

// The heard-versus-done split pooled across the suite: the parts' judged calls
// together often clear the eight-call floor no single part does.
function ScenarioHearing({ rows }) {
  const title = html`<h2 id="scenario-hearing-title">Across the suite, are the calls it misheard the calls it failed?</h2>`;
  const withCalls = rows.map(r => ({ r, cs: ((r.rep.judge && r.rep.judge.calls) || []).filter(c => c.judged && c.ref_words > 0) })).filter(x => x.cs.length);
  const pooled = withCalls.flatMap(x => x.cs);
  if (pooled.length === 0) return html`<section className="priority-panel" aria-labelledby="scenario-hearing-title">${title}<p className="cs-notice">No judged call has a record of what the agent heard, so hearing can't be set against the outcome.</p></section>`;
  const T = 0.05, clean = pooled.filter(c => c.wer <= T), mis = pooled.filter(c => c.wer > T);
  const x = { threshold: T, clean_calls: clean.length, clean_passed: clean.filter(c => c.met).length, misheard_calls: mis.length, misheard_passed: mis.filter(c => c.met).length };
  x.clean_pass_rate = ratioOf(x.clean_passed, x.clean_calls) || 0;
  x.misheard_pass_rate = ratioOf(x.misheard_passed, x.misheard_calls) || 0;
  const perScenario = withCalls.map(w => `${w.r.name} ${w.cs.filter(c => c.wer > T).length} of ${w.cs.length}`).join(", ");
  const small = Math.min(x.clean_calls, x.misheard_calls);
  const loose = small > 0 && small < 5 ? ` The smaller group has only ${small} ${small === 1 ? "call" : "calls"}, so read this loosely.` : "";
  // Pooling can make one scenario's problem read as the suite's: say where the
  // misheard calls that failed came from.
  const failedMisheard = withCalls.map(w => ({ w, n: w.cs.filter(c => c.wer > T && !c.met).length })).filter(f => f.n > 0);
  const where = failedMisheard.length === 1 && withCalls.length > 1
    ? ` All ${failedMisheard[0].n} misheard calls that failed came from ${failedMisheard[0].w.r.name}, so this is that scenario's problem rather than the suite's.`
    : failedMisheard.length > 1 ? ` The misheard calls that failed came from ${failedMisheard.map(f => `${f.w.r.name} (${f.n})`).join(", ")}.` : "";
  const reading = pooled.length < 8 ? `Not enough to tell: only ${pooled.length} judged calls across the suite, and the split needs 8.`
    : x.misheard_calls === 0 ? `Not enough to tell: every one of the ${pooled.length} judged calls was heard cleanly, so there is no second group to compare.`
    : x.clean_calls === 0 ? `Not enough to tell: every one of the ${pooled.length} judged calls was misheard, so there is no clean group to compare.`
    : x.clean_pass_rate > x.misheard_pass_rate
    ? `Mishearing is costing it the task across the suite: ${pct(x.misheard_pass_rate)} of the ${x.misheard_calls} misheard calls did the job, against ${pct(x.clean_pass_rate)} of the ${x.clean_calls} heard cleanly.${where} Fix the listening before the reasoning.${loose}`
    : `Mishearing is not what fails calls across the suite: ${pct(x.misheard_pass_rate)} of the ${x.misheard_calls} misheard calls did the job, against ${pct(x.clean_pass_rate)} of the ${x.clean_calls} heard cleanly.${loose}`;
  return html`<section className="priority-panel" aria-labelledby="scenario-hearing-title">${title}
    <p className="quiet">Every judged call from every scenario, placed by the share of its words the agent misheard. Misheard calls by scenario: ${perScenario}. It shows an association, not a cause.</p>
    <p className="scenario-reading">${reading}</p>
    <${WERStrip} calls=${pooled} threshold=${T}/><${HeardDoneTable} x=${x}/>
  </section>`;
}

function ScenarioSideBySide({ rows, onPick }) {
  // Pooled over the steps that recorded each figure; a scenario with none reads
  // as not measured, never as zero.
  const pooled = (r, pick, num, den) => {
    const L = r.L.filter(s => pick(s));
    return L.length ? ratioOf(L.reduce((a, s) => a + num(s), 0), L.reduce((a, s) => a + den(s), 0)) : null;
  };
  const metrics = [
    ["Calls connected", r => pooled(r, s => has(s.calls_connected), s => s.calls_connected, s => s.calls_attempted ?? s.calls), pct],
    ["Replies that failed", r => pooled(r, s => has(s.turns_failed) && s.turns_total > 0, s => s.turns_failed, s => s.turns_total), pct],
    ["Words misheard", r => pooled(r, s => s.wer && s.wer.turns > 0, s => s.wer.mean * s.wer.turns, s => s.wer.turns), pct],
    ["Replies that talked over the caller", r => pooled(r, s => s.conversation && s.conversation.turns > 0, s => s.conversation.interruptions || 0, s => s.conversation.turns), pct],
    ["Waits over 2 seconds", r => pooled(r, s => s.conversation && s.conversation.turns > 0, s => s.conversation.dead_air_turns || 0, s => s.conversation.turns), pct],
    ["Replies repeating an earlier one", r => pooled(r, s => s.conversation && s.conversation.turns > 0 && has(s.conversation.repeated_replies), s => s.conversation.repeated_replies, s => s.conversation.turns), pct],
    ["Agent minutes per call", r => pooled(r, s => s.cost && has(s.cost.agent_minutes) && (s.calls_attempted ?? s.calls) > 0, s => s.cost.agent_minutes, s => s.calls_attempted ?? s.calls), v => `${v.toFixed(2)} min`],
  ];
  return html`<section className="priority-panel" aria-labelledby="scenario-side-title"><h2 id="scenario-side-title">Everything else, side by side</h2>
    <p className="quiet">Pooled over every load level each scenario kept. Not measured means the scenario recorded no such figure.</p>
    <div className="tablewrap"><table className="results-grid"><thead><tr><th>Measure</th>${rows.map(r => html`<th key=${r.part.id}><${ScenarioName} r=${r} onPick=${onPick}/></th>`)}</tr></thead><tbody>
      ${metrics.map(([label, get, fmt]) => html`<tr key=${label}><th scope="row">${label}</th>${rows.map(r => { const v = get(r); return html`<td key=${r.part.id}>${has(v) ? fmt(v) : html`<span className="quiet">Not measured</span>`}</td>`; })}</tr>`)}
    </tbody></table></div>
  </section>`;
}

function ScenarioCompare({ parts, reports, onPick }) {
  const loading = parts.filter(p => reports[p.id] === undefined).length;
  const failed = parts.filter(p => reports[p.id] === null);
  const rows = scenarioRows(parts, reports);
  const plans = new Set(parts.map(p => p.profile_hash || p.profile)).size;
  return html`<div className="priority-views scenario-compare">
    ${loading > 0 && html`<p className="cs-notice">Loading ${loading} of ${parts.length} scenarios…</p>`}
    ${failed.length > 0 && html`<p className="cs-notice">${failed.map(p => p.scenario).join(", ")} could not be loaded, so ${failed.length === 1 ? "it is" : "they are"} left out.</p>`}
    ${plans > 1 && html`<p className="cs-notice">These scenarios ran different load plans, so a load level means the same number of calls at once but not the same test.</p>`}
    ${rows.length > 0 && html`<${Frag}>
      <${ScenarioWaits} rows=${rows} onPick=${onPick}/>
      <${ScenarioTasks} rows=${rows} onPick=${onPick}/>
      <${ScenarioTurns} rows=${rows} onPick=${onPick}/>
      <${ScenarioWaitBands} rows=${rows} onPick=${onPick}/>
      <${ScenarioHearing} rows=${rows}/>
      <${ScenarioSideBySide} rows=${rows} onPick=${onPick}/>
    <//>`}
  </div>`;
}

const STUDIO_VIEWS = [["overview","Overview"],["experience","Caller experience"],["tasks","Task results"],["scenarios","Compare scenarios"],["compare","Compare tests"],["findings","Findings"],["evidence","Explore evidence"]];
function StudioSummary({rep,g,onExplore}) {
  const steps=sel.steps(rep), j=rep.judge, judged=j?.judged>0;
  const attempts=steps.reduce((n,s)=>n+(s.calls_attempted ?? s.calls ?? 0),0);
  const connected=steps.length && steps.every(s=>Number.isFinite(s.calls_connected)) ? steps.reduce((n,s)=>n+s.calls_connected,0) : null;
  const timed=steps.filter(s=>s.ttfa?.n>0), worst=timed.length ? Math.max(...timed.map(s=>s.ttfa.p95_ms)) : null;
  const title=!steps.length ? "No measurements to review yet." : judged ? `${j.passed} of ${j.judged} reviewed calls completed the task.` : "The calls are measured. The outcome is still unknown.";
  const metrics=[
    {label:"Tasks completed",value:judged ? pct(j.passed/j.judged) : "Not reviewed",note:judged ? `${j.passed} of ${j.judged} reviewed calls` : "Task review was not recorded",tab:"quality"},
    {label:"Calls handled at once",value:g.stats[0].value,note:"Highest tested level that passed",tab:"load"},
    {label:"Slow reply time",value:worst === null ? "Not measured" : (worst/1000).toFixed(2)+"s",note:"95% faster than this in the worst stage",tab:"load"},
    {label:"Cost per call",value:g.stats[2].value === "—" ? "Not priced" : g.stats[2].value,note:keyed(g.stats[2].note),tab:"cost"},
  ];
  return html`<section className="studio-summary" aria-label="Evaluation summary">
    <div className="studio-result"><div><span className="eyebrow">AT A GLANCE</span><h2>${title}</h2><p>Simulated callers. Your real assistant. Results from this test, with the evidence to explain them.</p></div>
      <div className="studio-sample"><strong>${attempts}</strong><span>call attempts</span><small>${connected === null ? "Connections not recorded" : `${connected} connected`} · ${steps.length} test stages</small></div></div>
    ${g.degraded.length>0 && html`<div className="studio-caution"><span>!</span><p><strong>Read the timing results with care.</strong> The test system fell behind in ${g.degraded.length} stages. Some delay may come from the test itself.</p><button onClick=${()=>onExplore("load")}>Check timing →</button></div>`}
    <div className="studio-metrics">${metrics.map(m=>html`<button key=${m.label} onClick=${()=>onExplore(m.tab)}><span>${m.label}</span><strong>${m.value}</strong><small>${m.note}</small><span className="metric-arrow" aria-hidden="true">↗</span></button>`)}</div>
  </section>`;
}
function StudioTrend({rep,onExplore}) {
  const steps=sel.ttfa(rep), [selected,setSelected]=useState(0);
  if(!steps.length) return html`<section className="studio-chart"><h2>Reply speed as calls increase</h2><p>No reply timings were recorded.</p></section>`;
  const s=steps[Math.min(selected,steps.length-1)];
  const width=660, height=240, left=48,right=625,top=22,bottom=195;
  const maximum=Math.max(100,...steps.map(s=>s.ttfa.p95_ms))*1.15;
  const peak=Math.max(1,...steps.map(s=>s.concurrency)), min=Math.min(...steps.map(s=>s.concurrency));
  const x=s=>peak===min ? (left+right)/2 : left+(s.concurrency-min)/(peak-min)*(right-left);
  const y=v=>bottom-v/maximum*(bottom-top);
  const path=key=>steps.map((s,i)=>`${i ? "L" : "M"}${x(s)},${y(s.ttfa[key])}`).join(" ");
  return html`<section className="studio-chart"><div className="studio-chart-head"><div><h2>Does a busier line mean a longer wait?</h2><p>Reply time, from the moment a caller stops speaking.</p></div><span className="chart-unit">SECONDS</span></div>
    <div className="studio-chart-legend"><span><i className="slow-line"></i>Slow replies · 95th percentile</span><span><i className="typical-line"></i>Typical reply · median</span></div>
    <svg className="studio-speed-chart" viewBox=${`0 0 ${width} ${height}`} role="group" aria-label="Reply speed by calls at once. Select a stage to inspect its timings.">
      ${[0,.25,.5,.75,1].map(f=>html`<g key=${f}><line x1=${left} x2=${right} y1=${y(maximum*f)} y2=${y(maximum*f)} stroke="var(--cs-border)" strokeDasharray=${f ? "3 5" : "none"}/><text x=${left-12} y=${y(maximum*f)+4} textAnchor="end">${(maximum*f/1000).toFixed(1)}</text></g>`)}
      <path d=${path("p95_ms")+` L${x(steps[steps.length-1])},${bottom} L${x(steps[0])},${bottom} Z`} fill="var(--studio-chart-wash)"/>
      <path d=${path("p95_ms")} fill="none" stroke="var(--studio-teal)" strokeWidth="2.5" strokeLinejoin="round"/>
      <path d=${path("p50_ms")} fill="none" stroke="var(--studio-blue)" strokeWidth="2" strokeDasharray="5 5"/>
      ${steps.map((stage,i)=>html`<g key=${stage.name} role="button" tabIndex="0" aria-label=${`${stage.name}, ${stage.concurrency} at once: slow ${ms(stage.ttfa.p95_ms)}, typical ${ms(stage.ttfa.p50_ms)}`} aria-pressed=${selected===i} onClick=${()=>setSelected(i)} onKeyDown=${e=>{if(e.key === "Enter" || e.key === " "){e.preventDefault();setSelected(i);}}}>
        <rect x=${x(stage)-14} y=${top} width="28" height=${bottom-top+35} fill="transparent"/>
        <circle cx=${x(stage)} cy=${y(stage.ttfa.p95_ms)} r=${selected===i ? 6 : 4} fill="var(--cs-surface)" stroke="var(--studio-teal)" strokeWidth="2.5"/>
        <text x=${x(stage)} y=${bottom+23} textAnchor="middle">${stage.concurrency}</text>
      </g>`)}
      <text x=${(left+right)/2} y="237" textAnchor="middle">Calls at the same time</text>
    </svg>
    <div className="studio-chart-detail"><div><span>${s.concurrency} calls at once</span><strong>${ms(s.ttfa.p95_ms)} <small>slow replies</small></strong></div><div><span>${s.ttfa.n} measured replies</span><strong>${ms(s.ttfa.p50_ms)} <small>typical reply</small></strong></div><button className="text-button" onClick=${()=>onExplore("load")}>Inspect timings →</button></div>
    <p className="quiet">Each point is a measured test stage, not a capacity guarantee. The line connects observations.</p>
  </section>`;
}
function StudioBrief({rep,insights,onExplore,onAll}) {
  const items=(insights?.insights || []).slice().sort((a,b)=>["high","medium","low","info"].indexOf(a.severity)-["high","medium","low","info"].indexOf(b.severity)).slice(0,3);
  const routes={latency:"load",capacity:"load",test:"load",reliability:"network",quality:"quality",cost:"cost"};
  const failed=sel.steps(rep).find(s=>s.verdict === "fail");
  return html`<aside className="studio-brief"><div className="brief-heading"><span className="eyebrow">REVIEW NOTES</span><span className="brief-mark">↗</span></div><h2>What deserves a closer look</h2>
