      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        Each row is the same profile run again with only the caller's network changed, clean first.
        Read across a row for what load did on that network, and down a column for what the network
        did at that load.
      </div>
      <div className="seg" role="group" aria-label="Cell value">
        ${HEAT_METRICS.map(x => html`
          <button key=${x[0]} aria-pressed=${String(x[0] === metric[0])}
                  onClick=${() => setPicked(x[0])}>${x[1]}</button>`)}
      </div>
      <div className="tablewrap">
        <table className="heat">
          <thead><tr>
            <th>Network</th>
            ${steps.map(s => html`<th key=${s.name}>${s.name} · ${s.concurrency}</th>`)}
            <th>Breaks at</th>
          </tr></thead>
          <tbody>
            ${m.cohorts.map(c => html`
              <tr key=${c.impairment.name}>
                <td><b>${c.impairment.name}</b><span className="quote">${describeNet(c.impairment)}</span></td>
                ${(c.steps || []).map(s => {
                  const v = get(s);
                  const t = v > 0 ? intensity(v) : 0;
                  return html`<td key=${s.name} className=${"hm" + (t > 0.6 ? " hot" : "")}
                      style=${{background: v > 0 ? fill(t) : "transparent"}}
                      title=${`${c.impairment.name} · ${s.name} at ${s.concurrency} concurrent: p95 ${ms(s.ttfa && s.ttfa.p95_ms)}${s.vs_clean ? `, ${s.vs_clean.toFixed(2)}× clean` : ""}, ${s.verdict}`}>
                    ${v > 0 ? fmt(v) : "-"}${s.verdict === "fail" ? " ✕" : ""}
                  </td>`;
                })}
                <td>${c.breakpoint || "held"}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
      <div className="bandkey">
        <span>${label}: lighter is lower</span>
        <span className="ramp" aria-hidden="true"></span>
        <span>✕ failed against the clean baseline</span>
      </div>
      <div className="tablewrap gloss">
        <table>
          <thead><tr><th>Cohort</th><th>Command, exactly as run on ${m.device}</th><th>What the kernel then reported</th></tr></thead>
          <tbody>
            ${m.cohorts.map(c => html`
              <tr key=${c.impairment.name}>
                <td>${c.impairment.name}</td>
                <td><code>${c.tc_command}</code></td>
                <td>${c.qdisc || "-"}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
      <${Reading} ...${readImpairment(m)}/>
    </div>`;
}

function readImpairment(m) {
  const clean = m.cohorts[0];
  const impaired = m.cohorts.slice(1);
  const peakOf = c => (c.steps || []).reduce((a, s) => ((s.vs_clean || 0) > (a.vs_clean || 0) ? s : a), (c.steps || [])[0] || {});
  const worst = impaired.reduce((a, c) => (!a || (peakOf(c).vs_clean || 0) > (peakOf(a).vs_clean || 0) ? c : a), null);
  const broke = impaired.filter(c => c.breakpoint);
  const firstBroke = broke[0];
  const stepOf = (c, name) => (c.steps || []).find(s => s.name === name);

  // Which half of the wait the network landed in, at the worst cohort's first
  // step. Delay on the caller's uplink should land in endpointing: the agent
  // hears the end of the utterance late, and replies no slower once it has.
  let split = null;
  if (worst && clean.steps && clean.steps.length) {
    const a = clean.steps[0], b = stepOf(worst, a.name);
    if (b && a.endpointing && b.endpointing && a.endpointing.n > 0 && b.endpointing.n > 0) {
      split = { step: a.name, ep: b.endpointing.p50_ms - a.endpointing.p50_ms,
                ts: b.think_speak.p50_ms - a.think_speak.p50_ms };
    }
  }

  if (!worst) {
    return {
      verdict: html`<b>Only the clean cohort ran</b>, so there is no network to compare it against.`,
      why: html`A matrix needs at least one impaired profile beside the control.`,
      act: html`Add profiles to the impairments file; the defaults are in <code>profiles/impairments.json</code>.`,
    };
  }

  const peak = peakOf(worst);
  return {
    verdict: firstBroke
      ? html`<b>The network breaks it before load does.</b> On ${firstBroke.impairment.name} (${describeNet(firstBroke.impairment)}) it fails at ${firstBroke.breakpoint}; on the clean network ${clean.breakpoint ? html`it failed at ${clean.breakpoint}` : "no step failed"}.`
      : html`<b>No network tested broke it.</b> The worst, ${worst.impairment.name} (${describeNet(worst.impairment)}), held p95 at ${(peak.vs_clean || 0).toFixed(2)}× the clean line at ${peak.name}.`,
    why: html`Every cohort placed the same calls at the same concurrency, one after the other, so a cell divided by the clean cell above it is what the network cost and nothing else. The impairment is netem on the calling pod's own interface, outbound only — a bad connection at the customer's end. This target speaks WebSocket, which is TCP: a lost packet is sent again rather than lost, so the network arrives as delay, not as damaged audio. netem also draws each packet's delay separately, so jitter reorders packets, and TCP backs off as if congested — a jittered cell can grow far past the jitter itself, and is an upper bound on what a real bad line does. Every cell is a latency, and none of them says how the call sounded.${split ? html` At ${split.step}, ${worst.impairment.name} moved endpointing by ${ms(split.ep)} and think/speak by ${ms(split.ts)}.` : ""}`,
    act: split && Math.abs(split.ep) > Math.abs(split.ts)
      ? html`<b>The network lands in endpointing</b>, as it should: the agent hears the caller stop late, then replies at its usual speed. A faster model buys nothing on a bad line; a shorter silence threshold buys back some of it, at the cost of cutting off callers who pause.`
      : html`Compare the split on the component card for the worst cohort. Delay that lands in think/speak rather than endpointing means the agent's own calls to its model or voice share the impaired path.`,
  };
}

// Per-node pass rates: which part of the conversation gave way.
//
// A call-level success rate says the agent got worse and nothing about where.
// Completion can hold while the one node that verifies an order collapses, and
// that is a different fix from a slow greeting, so each node is scored apart.
function NodeScores({ rep }) {
  const [picked, setPicked] = useState(null);
  const views = rep.matrix && rep.matrix.cohorts && rep.matrix.cohorts.length
    ? rep.matrix.cohorts.map(c => ({ name: c.impairment.name, steps: c.steps || [] }))
    : [{ name: "", steps: rep.steps || [] }];
  const scored = v => v.steps.reduce((a, s) => {
    for (const n of s.nodes || []) { a.checked += n.checked; a.passed += n.passed; }
    return a;
  }, { checked: 0, passed: 0 });

  const anyNodes = views.some(v => v.steps.some(s => (s.nodes || []).length > 0));
  const anyChecked = views.some(v => scored(v).checked > 0);
  if (!anyNodes || !anyChecked) {
    return html`
      <div className="card">
        <div className="eyebrow">Scenario nodes</div>
        <h2>No node was scored</h2>
        <div className="note">
          ${anyNodes
            ? html`<span>The scenario names its nodes but none of them carries an <code>expect</code>, so there is nothing to pass or fail. Add <code>"expect": { "said_any": [...] }</code> to the turns that matter.</span>`
            : html`<span>This run predates per-node scoring. Runs placed from this version onward record which node every turn spoke.</span>`}
        </div>
      </div>`;
  }

  // Default to the cohort whose nodes passed least often: that is where the
  // diagnosis is.
  const rate = v => { const x = scored(v); return x.checked > 0 ? x.passed / x.checked : 1; };
  const worstView = views.reduce((a, v) => (rate(v) < rate(a) ? v : a), views[0]);
  const view = views.find(v => v.name === picked) || worstView;
  const steps = view.steps.filter(s => (s.nodes || []).length > 0);
  const order = (steps[0] && steps[0].nodes || []).map(n => n.node);

  let worst = null;
  for (const s of steps) for (const n of s.nodes) {
    if (n.checked > 0 && (!worst || n.pass_rate < worst.n.pass_rate)) worst = { s, n };
  }

  return html`
    <div className="card">
      <div className="eyebrow">Scenario nodes</div>
      <h2>Which part of the conversation gave way</h2>
      ${views.length > 1 && html`
        <div className="seg" role="group" aria-label="Cohort">
          ${views.map(v => html`
            <button key=${v.name} aria-pressed=${String(v === view)} onClick=${() => setPicked(v.name)}>
              ${v.name}${v === worstView ? " · worst" : ""}
            </button>`)}
        </div>`}
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Node</th>
            ${steps.map(s => html`<th key=${s.name}>${s.name} · ${s.concurrency}</th>`)}
          </tr></thead>
          <tbody>
            ${order.map(id => html`
              <tr key=${id}>
                <td>${id}</td>
                ${steps.map(s => {
                  const n = s.nodes.find(x => x.node === id);
                  if (!n || n.visits === 0) return html`<td key=${s.name} className="dim">not reached</td>`;
                  if (n.checked === 0) return html`<td key=${s.name} className="dim">${n.visits} visits</td>`;
                  return html`<td key=${s.name} title=${n.miss || ""}
                      className=${n.pass_rate < 1 ? "fail-text" : ""}>${pct(n.pass_rate)} · ${n.passed}/${n.checked}</td>`;
                })}
              </tr>`)}
          </tbody>
        </table>
      </div>
      <${Reading} ...${readNodes(worst, view)}/>
    </div>`;
}

function readNodes(worst, view) {
  const where = view.name ? ` on the ${view.name} network` : "";
  if (!worst || worst.n.pass_rate >= 1) {
    return {
      verdict: html`<b>Every scored node held</b>${where}: each assertion passed on every visit.`,
      why: html`A node passes when the agent's reply contains one of its expected phrases and none of its forbidden ones, matched as plain text so any verdict can be checked against the transcript.`,
      act: html`Tighten the assertions or push the load higher; a node that never fails has not been tested at its limit.`,
    };
  }
  return {
    verdict: html`<b>${worst.n.node} is the node that gives way</b>${where}: it passed ${pct(worst.n.pass_rate)} of ${worst.n.checked} visits at ${worst.s.name}.`,
    why: html`A call-level rate would average this node in with the ones that held and report a mild decline. Scored per node, the failure has an address.${worst.n.miss ? html` The first failing reply ${worst.n.miss}.` : ""}`,
    act: html`<b>Read that node's turns in the calls file</b>, filtered to ${worst.s.name}. A node that fails only at high concurrency is usually a timeout on whatever that step of the conversation depends on; one that fails everywhere is the prompt.`,
  };
}

// Harness event integrity: did the pipeline carrying the calls deliver them?
//
// This checks Callstorm, not the target. Callstorm does not receive the
// target's webhooks, so nothing here says a CRM got its record. What it does
// say is whether the numbers above rest on every call the run placed.
function IntegrityCard({ integrity }) {
  const d = integrity && integrity.dispatch;
  const te = integrity && integrity.turn_events;
  if (!d && !te) {
    return html`
      <div className="card">
        <div className="eyebrow">Harness event integrity</div>
        <h2>No pipeline to check on this run</h2>
        <div className="note">
          This run placed its calls in this process and published no turn events, so there was no
          dispatch that could lose or duplicate a call. Run with <b>-distributed</b> to check the
          fleet's delivery, or add <b>-kafka</b> to count turn events. This card checks
          Callstorm's own pipeline, not the target's webhooks, which Callstorm does not receive.
        </div>
      </div>`;
  }
  return html`
    <div className="card">
      <div className="eyebrow">Harness event integrity</div>
      <h2>Did every call come back exactly once?</h2>
      ${d && html`<div>
        <dl className="spec">
          <div><dt>Dispatched</dt><dd>${d.dispatched}</dd></div>
          <div><dt>Came back</dt><dd>${d.received}</dd></div>
          <div><dt>Duplicates dropped</dt><dd>${d.duplicates}</dd></div>
          <div><dt>Never came back</dt><dd>${d.missing}</dd></div>
          <div><dt>Arrived late</dt><dd>${d.late}</dd></div>
        </dl>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Dispatched</th><th>Came back</th><th>Duplicates</th><th>Missing</th><th>Late from earlier</th></tr></thead>
            <tbody>
              ${(d.steps || []).map(s => html`
                <tr key=${s.step}>
                  <td>${s.step}</td><td>${s.dispatched}</td><td>${s.received}</td>
                  <td>${s.duplicates}</td><td>${s.missing}</td><td>${s.late}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>`}
      ${te && html`
        <dl className="spec">
          <div><dt>Turn events published</dt><dd>${te.published}</dd></div>
          <div><dt>Turn events dropped</dt><dd>${te.dropped}</dd></div>
          ${te.last_error && html`<div><dt>Last error</dt><dd>${te.last_error}</dd></div>`}
        </dl>`}
      <${Reading} ...${readIntegrity(d, te)}/>
    </div>`;
}

function readIntegrity(d, te) {
  const dropped = te ? te.dropped : 0;
  const verdict = d && d.missing > 0
    ? html`<b>${d.missing} of ${d.dispatched} calls never came back.</b> They are scored as failed calls, so those steps describe the fleet as much as the agent.`
    : d && d.duplicates > 0
    ? html`<b>Every call came back, and ${d.duplicates} came back twice.</b> The second copy was dropped, so no call was counted twice.`
    : d
    ? html`<b>Every call dispatched came back exactly once.</b>`
    : dropped > 0
    ? html`<b>${dropped} turn events never reached the broker.</b>`
    : html`<b>Every turn event reached the broker.</b>`;
  return {
    verdict: verdict,
    why: html`Delivery is at-least-once by design: a worker commits an assignment only after publishing its result, so a worker killed between the two hands the call to another, which places it again. A duplicate is therefore expected under chaos and dropped by call identity; a missing call is not expected, and is counted as a failure rather than quietly retried. Turn events are fire-and-forget so they can never delay a caller's audio, which is why drops are counted instead of retried. None of this is the target's own events.`,
    act: d && d.missing > 0
      ? html`<b>Check the workers before the agent.</b> Look for pods restarted or rescheduled during the steps with missing calls, and re-run those steps before trusting their verdicts.`
      : html`Nothing to fix. The percentiles above rest on every call the run placed.`,
  };
}

// The appendix: every number on the page as a formula, so a reader can check
// it means what it claims. The glossary above says what each number catches;
// this says exactly how it is computed, matching the code that computes it.
const APPENDIX = [
  ["TTFA", "t(agent's first audio byte arrives) − t(caller's last audio frame finishes playing)", "Per turn. Kept negative when the agent spoke before the caller finished. Turns the agent talked over are left out of percentiles."],
  ["Endpointing", "t(agent's transcript of the caller arrives) − t(caller's last frame finishes)", "The last transcript before the agent's first audio. Absent when the target sends none."],
  ["Think / speak", "t(agent's first audio) − t(agent's transcript of the caller)", "Endpointing + think/speak = TTFA whenever both exist."],
  ["Turn latency", "t(agent's audio finishes playing) − t(caller's last frame finishes)", "Playout end comes from audio duration, not arrival: voices stream faster than realtime."],
  ["Round trip", "t(pong received) − t(ping sent), a WebSocket ping on the call's own connection once a second", "Per turn: the median of pings sent between the caller starting to speak and the agent's first audio, or the latest before it. No pong means no sample; a pong faster than the clock resolves is a real sample of zero."],
  ["Agent TTFA", "TTFA − that turn's round trip; agent endpointing = endpointing − that turn's round trip", "Only turns with a measured round trip. An estimate: the network's share comes out, the agent's internals stay together. The verdict uses observed TTFA."],
  ["Percentile", "value at rank ⌈p ÷ 100 × n⌉ of the step's values sorted ascending", "Nearest rank over one step's turns, never pooled across steps. p50, p90, p95, p99."],
  ["Setup success", "calls that reached a conversation ÷ calls attempted", "Per step."],
  ["Verdict", "r = step p95 TTFA ÷ baseline step p95 TTFA. Pass r ≤ 1.5, warn r ≤ 2, fail r > 2 or setup < 97%", "In an impairment matrix every cohort's r uses the clean cohort's baseline step."],
  ["Breakpoint", "first step, in profile order, whose verdict is fail", "One per run, and one per cohort in a matrix."],
  ["Two clocks", "from end of speech = TTFA; from detection = think/speak = t(first audio) − t(agent's transcript of the caller)", "Every step is reported on both."],
  ["Reference line", "the step's value on the line's clock and percentile, compared with the line, or with the top of a range", "p50 and p95 both when the source states no percentile. Never a verdict."],
  ["Drift", "(p50 of the later half − p50 of the earlier half) ÷ p50 of the earlier half", "Halves split by call start. +15% or more drifting, −15% or less settling. Each half needs 10 turns."],
  ["Recovered", "recovery step r ≤ 1.2", "Recovery runs at the baseline's own concurrency."],
  ["Pacing drift", "(t(caller end) − t(caller start)) − length of the caller's audio", "Measures the harness. A step whose worst drift exceeds 100ms either way is marked suspect."],
  ["Word error rate", "(substitutions + deletions + insertions) ÷ words in the caller's script, summed over the step", "Turns the target transcribed and the caller finished."],
  ["Talk ratio", "agent speech seconds ÷ (agent + caller speech seconds)", "Speech lengths from audio duration."],
  ["Words per minute", "words spoken ÷ that speaker's own speech minutes", "Not wall clock, so pauses do not flatter anyone."],
  ["Interruption score", "clamp(5 × (1 − interruptions ÷ turns), 0, 5)", "An interruption is a turn where the agent began speaking before the caller finished."],
  ["Dead air", "turns with TTFA over 2s", "A turn the agent talked over has no silence to count."],
  ["Barge-in yield", "t(interrupted reply's audio stops) − t(interrupting caller line starts)", "Zero means the agent was never seen to stop."],
  ["Cost", "Σ(caller speech + turn latency) ÷ 60 × rate per minute", "Per step; per call and per turn by division. Unpriced without a rate."],
  ["Node pass rate", "visits whose reply met the node's expect ÷ visits to nodes with an expect", "Met: the reply contains a said_any phrase and no not_said phrase, ignoring case. A visit with no reply fails."],
  ["× clean", "cohort step p95 TTFA ÷ the clean cohort's same step p95 TTFA", "What the network cost at equal load."],
  ["Impairment", "tc qdisc replace dev <interface> root netem delay D J loss L", "Outbound on the calling pod, recorded verbatim with the kernel's own readback. Clean deletes the root qdisc and always runs first."],
  ["Dispatch integrity", "came back = distinct (step, seq) results; duplicates = results for a call already back; missing = dispatched − came back at the step deadline; late = results for a step already closed", "Callstorm's own pipeline, not the target's events."],
];

// Cekura's published boundary table, with what Callstorm measures against each
// row. Callstorm sees an agent from outside, so it splits the wait in two and no
// further; this says which published rows each half contains.
const BOUNDARIES = [
  ["Endpointing delay", "Last detected user speech", "End-of-turn decision", "Inside Callstorm's endpointing, which starts earlier: at the true end of speech, before anything was detected."],
  ["ASR finalization", "End-of-turn decision", "Final transcript available", "Inside Callstorm's endpointing, which ends when that transcript arrives. Not separable from outside the agent."],
  ["LLM TTFT", "Model request sent", "First output token", "Inside think/speak. Not separable from outside the agent."],
  ["Tool latency", "Tool request sent", "Tool result available", "Inside think/speak. Not separable today."],
  ["TTS first-byte", "Speakable text sent to TTS", "First audio bytes received", "Inside think/speak. Not separable from outside the agent."],
  ["TTFA", "A defined turn boundary", "First playable/audible audio", "Callstorm's TTFA, with the boundary set at the true end of speech. It ends when the first audio byte arrives, not when it plays. Agent TTFA subtracts the measured round trip to the agent's edge."],
  ["End-to-end response", "User finishes speaking", "Agent begins speaking", "Callstorm's TTFA is this row, ended at arrival rather than at audible start."],
  ["Interruption stop time", "Caller begins barge-in", "Agent audio stops", "Callstorm's barge-in yield, ended when the agent's audio stops arriving."],
];

function Appendix({ refs }) {
  const cekura = (refs || []).flatMap(r => r.cites || []).find(c => c.source === "Cekura");
  return html`
    <div className="card">
      <div className="eyebrow">Appendix</div>
      <h2>How every number is computed</h2>
      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        The glossary says what each number catches. This says exactly how it is calculated, so a
        figure on this page can be recomputed from the run's own files: the report JSON and the
        calls file beside it, which keep every turn's raw instants.
      </div>
      <div className="tablewrap gloss">
        <table>
          <thead><tr><th>Metric</th><th>Formula</th><th>Scope</th></tr></thead>
          <tbody>
            ${APPENDIX.map(([t, f, n]) => html`
              <tr key=${t}><td>${t}</td><td><code>${f}</code></td><td>${n}</td></tr>`)}
          </tbody>
        </table>
      </div>
      <h2 style=${{marginTop:"26px"}}>Whose boundary each number spans</h2>
      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        The first three columns are ${cekura && cekura.url ? html`<a href=${cekura.url}>Cekura's published boundary table</a>` : "Cekura's published boundary table"}${cekura ? ` (${cekura.title}, ${cekura.published})` : ""}, the only published attempt found to pin these metrics to start and end instants. The last column is what Callstorm measures against each row. Both Callstorm halves also carry the network in each direction, which none of the rows separates.
      </div>
      <div className="tablewrap gloss">
        <table>
          <thead><tr><th>Published metric</th><th>Starts</th><th>Ends</th><th>In Callstorm</th></tr></thead>
          <tbody>
            ${BOUNDARIES.map(([m, a, b, c]) => html`
              <tr key=${m}><td>${m}</td><td>${a}</td><td>${b}</td><td>${c}</td></tr>`)}
          </tbody>
        </table>
      </div>
    </div>`;
}

function ReportCard({ id, refs }) {
  const [rep, setRep] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    if (!id) return;
    setRep(null); setErr(null);
    fetch(`api/runs/${id}.json`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(setRep).catch(e => setErr(String(e)));
  }, [id]);

  if (!id) return html`<div className="card empty">Pick a run.</div>`;
  if (err) return html`<div className="card empty">Could not load ${id}: ${err}</div>`;
  if (!rep) return html`<div className="card empty">Loading…</div>`;

  const steps = rep.steps || [];
  const degraded = steps.filter(s => s.harness_degraded);
  const anyWER = steps.some(s => s.wer && s.wer.turns > 0);
  const anyBarge = steps.some(s => s.barge_in && s.barge_in.turns > 0);
  const conv = steps.filter(s => s.conversation && s.conversation.turns > 0);

  return html`
    <${Glossary}/>

    <div className="card">
      <div className="eyebrow">Report card</div>
      <h2>${rep.profile} · ${rep.scenario}</h2>
      <dl className="spec">
        <div><dt>Run</dt><dd>${id}</dd></div>
        <div><dt>Started</dt><dd>${when(rep.started_at)}</dd></div>
        <div><dt>Duration</dt><dd>${Math.round(rep.duration_s)}s</dd></div>
        <div><dt>Target</dt><dd>${rep.target || "deepgram voice agent"}</dd></div>
      </dl>

      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Conc</th><th>Setup</th><th>p50</th><th>p95</th><th>p99</th>
            <th>Turns</th><th>Drift</th><th>vs base</th><th>Verdict</th>
          </tr></thead>
          <tbody>
            ${steps.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}${s.name === rep.baseline ? " ←" : ""}</td>
                <td>${s.concurrency}</td>
                <td>${pct(s.setup_success)}</td>
                <td>${ms(s.ttfa.p50_ms)}</td>
                <td>${ms(s.ttfa.p95_ms)}</td>
                <td>${ms(s.ttfa.p99_ms)}</td>
                <td>${s.turns_total}</td>
                <td>${ms(s.worst_harness_drift_ms)}</td>
                <td>${s.p95_ratio ? s.p95_ratio.toFixed(2) + "×" : "-"}</td>
                <td><${Pill} v=${s.verdict}/></td>
              </tr>`)}
          </tbody>
        </table>
      </div>

      ${degraded.length > 0 && html`
        <div className="note">
          <strong>Suspect.</strong> ${degraded.map(s => s.name).join(", ")} drifted past the 100ms
          pacing limit, so ${degraded.length > 1 ? "those steps measure" : "that step measures"} the
          load generator rather than the agent. The verdict grades the agent and should not be
          believed here.
        </div>`}

      ${steps.length > 0 && html`<${Reading} ...${readLatency(steps, rep)}/>`}
    </div>

    <${AgentLatency} steps=${steps}/>
    <${ImpairmentHeatmap} rep=${rep}/>
    <${ReferenceLines} steps=${steps} refs=${rep.references || refs}/>
    <${PhaseTable} steps=${steps}/>

    ${conv.length === 0 && steps.length > 0 && html`
      <div className="card">
        <div className="eyebrow">Conversation quality</div>
        <h2>Not measured on this run</h2>
        <div className="note">
          This run predates talk ratio, pace, interruption score and dead air. Those come from
          instants the harness already stamps, so any run placed from this version onward carries
          them — nothing needs enabling. Re-run the profile to populate this card.
        </div>
      </div>`}

    ${conv.length > 0 && html`
      <div className="card">
        <div className="eyebrow">Conversation quality</div>
        <h2>How the calls sounded</h2>
        <div className="tablewrap">
          <table>
            <thead><tr>
              <th>Step</th><th>Agent's share</th><th>Agent pace</th><th>Caller pace</th>
              <th>Interruptions</th><th>Score /5</th><th>Dead air</th>
            </tr></thead>
            <tbody>
              ${conv.map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${pct(s.conversation.talk_ratio)}${s.conversation.talk_ratio >= 0.8 ? " ⚠" : ""}</td>
                  <td>${Math.round(s.conversation.agent_wpm)} wpm${s.conversation.agent_wpm > 190 ? " ⚠" : ""}</td>
                  <td>${Math.round(s.conversation.caller_wpm)} wpm</td>
                  <td>${s.conversation.interruptions} of ${s.conversation.turns}</td>
                  <td>${s.conversation.interruption_score.toFixed(2)}</td>
                  <td>${s.conversation.dead_air_turns > 0
                        ? `${s.conversation.dead_air_turns} turns · ${Math.round(s.conversation.dead_air_seconds)}s`
                        : "none"}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        <div className="note">
          Pace is words over that speaker's own speaking time, not wall clock, so a slow agent is
          not flattered by the caller's pauses. ⚠ marks the published breakdown thresholds: an
          agent holding <b>80%</b> or more of the floor is lecturing rather than conversing, and
          above <b>190 wpm</b> is faster than comfortable listening. Dead air counts turns where
          the line stayed silent more than two seconds after the caller finished — the point at
          which a person says "hello?".
        </div>
        <${Reading} ...${readConversation(conv, steps)}/>
      </div>`}

    <${ComponentShare} steps=${steps}/>
    <${CostChart} steps=${steps}/>

    ${anyWER && html`
      <div className="card">
        <div className="eyebrow">Transcript accuracy</div>
        <h2>What the agent heard</h2>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Mean</th><th>Worst turn</th><th>Errors</th><th>Words</th><th>S / D / I</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.wer && s.wer.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${pct(s.wer.mean)}</td>
                  <td>${pct(s.wer.worst)}</td>
                  <td>${s.wer.substitutions + s.wer.deletions + s.wer.insertions}</td>
                  <td>${s.wer.ref_words}</td>
                  <td>${s.wer.substitutions} / ${s.wer.deletions} / ${s.wer.insertions}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        <${Reading} ...${readWER(steps.filter(s => s.wer && s.wer.turns > 0))}/>
      </div>`}

    <${TaskSuccessCard} judge=${rep.judge}/>

    ${anyBarge && html`
      <div className="card">
        <div className="eyebrow">Interruption</div>
        <h2>How fast it gave the floor back</h2>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Barge-ins</th><th>Yielded</th><th>p50</th><th>p95</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.barge_in && s.barge_in.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${s.barge_in.turns}</td>
                  <td>${s.barge_in.yielded}${s.barge_in.yielded < s.barge_in.turns
                        ? ` — ${s.barge_in.turns - s.barge_in.yielded} never yielded` : ""}</td>
                  <td>${ms(s.barge_in.yield_p50_ms)}</td>
                  <td>${ms(s.barge_in.yield_p95_ms)}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        <${Reading} ...${readBarge(steps.filter(s => s.barge_in && s.barge_in.turns > 0))}/>
      </div>`}

    <${IntegrityCard} integrity=${rep.integrity}/>
    <${NodeScores} rep=${rep}/>
    <${Appendix} refs=${rep.references || refs}/>`;
}

function App() {
  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  const [refs, setRefs] = useState([]);
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetch("api/references.json").then(r => (r.ok ? r.json() : [])).then(setRefs).catch(() => setRefs([]));
    fetch("api/runs.json").then(r => r.json())
      .then(rs => { setRuns(rs); if (rs.length) setSel(rs[0].id); })
      .catch(e => setErr(String(e)));
  }, []);

  return html`
    <div className="wrap">
      <header className="hero">
        <span className="eyebrow">Load testing and observability for voice AI agents</span>
        <h1>Callstorm</h1>
        <div className="asks">
          <p className="asks-lead">Two questions, not one</p>
          <p className="ask">At what concurrency does this agent <span>stop meeting its own baseline?</span></p>
          <p className="ask">And did it <span>actually do its job?</span></p>
        </div>

        <p className="thesis">Callstorm places synthetic calls against a voice agent, speaks to it
          with real text-to-speech, listens to what comes back, and stamps every instant on both
          sides of the conversation. The first question is answered in milliseconds, the second by
          reading what was actually said.</p>

        <dl className="caps">
          <div><dt>Latency</dt><dd>Time to first audio, split into endpointing and think+speak. Percentiles per step, and the breakpoint scored against the run's own baseline rather than a number someone else picked.</dd></div>
          <div><dt>Accuracy</dt><dd>Word error rate against the caller's script. Callstorm generated that audio from known text, so the reference is ground truth rather than a second transcription.</dd></div>
          <div><dt>Task success</dt><dd>An LLM judge scores plain-language criteria, and every verdict must quote the turn it was decided on &mdash; so it can be checked rather than trusted.</dd></div>
          <div><dt>Interruption</dt><dd>The caller cuts in mid-reply and the run records how long the agent kept talking, calibrated against a known injected yield.</dd></div>
          <div><dt>Personas</dt><dd>Pacing rather than costume: a caller who pauses mid-thought is what turn detection actually reacts to, and it catches endpointing tuned too tight.</dd></div>
          <div><dt>Branching</dt><dd>The caller responds to what the agent said instead of reciting. Every branch is synthesized before the call, so no speech latency lands inside the measurement.</dd></div>
          <div><dt>Scale</dt><dd>A dispatcher hands calls to a Kubernetes worker fleet over Kafka, autoscaled on queue depth and chaos-tested by killing pods mid-run.</dd></div>
          <div><dt>Observability</dt><dd>Prometheus native histograms and Grafana while a run happens; these report cards afterwards.</dd></div>
        </dl>

        <p className="foundation">Two measurements are <b>calibrated against known answers</b>:
          latency, worst error <b>3.3&nbsp;ms</b> across five concurrency levels, and barge-in
          yield, <b>15&nbsp;ms</b> at three concurrent callers. That is the foundation. A harness whose
          numbers have never been checked against something it already knows cannot be trusted about
          anything else &mdash; which is also why a run reports its own pacing drift, and marks a step
          suspect when this machine rather than the agent was the limit.</p>

        <div className="links">
          <a href="https://github.com/ai-calypse/callstorm">Source on GitHub</a>
        </div>
      </header>

      <header className="subhead">
        <span className="eyebrow">Every sweep, newest first</span>
        <h1>Run history</h1>
        <p className="sub">One run tells you how an agent behaved once; the shape across runs is what
          says whether it is getting worse.</p>
      </header>

      ${err && html`<div className="card empty">Could not load runs: ${err}</div>`}

      <div className="cols">
        <div>
          <${Trend} runs=${runs}/>
          <div className="runs">
            ${runs.length === 0 && !err && html`<div className="empty">No runs yet.</div>`}
            ${runs.map(r => html`
              <button key=${r.id} className="run" aria-current=${String(r.id === sel)}
                      onClick=${() => setSel(r.id)}>
                <span className="id">${r.profile} · ${r.scenario}</span>
                <${Pill} v=${r.verdict}/>
                <span className="meta">
                  ${when(r.started_at)} · peak ${r.peak_concurrency} · worst p95 ${ms(r.worst_p95_ms)}
                  ${r.harness_degraded ? " · harness suspect" : ""}
                  ${r.breakpoint ? ` · breaks at ${r.breakpoint}` : ""}
                  ${r.judged > 0 ? ` · judged ${r.passed}/${r.judged}` : ""}
                  ${r.drifted > 0 ? ` · ${r.drifted} drifting` : ""}
                  ${r.cohorts > 0 ? ` · ${r.cohorts} network cohorts` : ""}
                  ${r.network_breaks && r.network_breaks.length ? ` · network breaks it: ${r.network_breaks.join(", ")}` : ""}
                </span>
              </button>`)}
          </div>
        </div>
        <div><${ReportCard} id=${sel} refs=${refs}/></div>
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Boundary}><${App}/><//>`);
</script>
</body>
</html>
