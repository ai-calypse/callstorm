<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callstorm runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
  :root {
    --ground:#EEF1F4; --surface:#FBFCFD; --sunk:#E4E9EE;
    --ink:#131A24; --ink-2:#3D4854; --mute:#626E7C;
    --rule:#CBD3DB; --rule-soft:#DDE3E9;
    --signal:#0E8FA8; --ref:#7A8592;
    --pass:#2F7D53; --warn:#C08A00; --fail:#C03A2B;
    --pass-bg:rgba(47,125,83,.11); --warn-bg:rgba(192,138,0,.14); --fail-bg:rgba(192,58,43,.11);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D1317; --surface:#151D23; --sunk:#1E272E;
      --ink:#E3EAEF; --ink-2:#BDC8D1; --mute:#8B98A4;
      --rule:#2C3841; --rule-soft:#222C34;
      --signal:#3FB8D1; --ref:#8C97A3;
      --pass:#4FB87C; --warn:#C89A3C; --fail:#E0685A;
      --pass-bg:rgba(79,184,124,.13); --warn-bg:rgba(200,154,60,.14); --fail-bg:rgba(224,104,90,.13);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace; font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin-inline:auto; padding-inline:20px; }
  header { padding-block:28px 18px; border-bottom:2px solid var(--ink); }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; font-weight:600; }
  .sub { margin:8px 0 0; color:var(--ink-2); font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; max-width:62ch; }
  .eyebrow { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }

  .cols { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:28px; padding-block:24px 60px; align-items:start; }
  @media (max-width: 860px) { .cols { grid-template-columns:1fr; } }

  .runs { border-top:1px solid var(--rule); }
  .run {
    width:100%; text-align:left; background:none; border:0; cursor:pointer; color:inherit;
    font:inherit; padding:11px 10px 12px; border-bottom:1px solid var(--rule-soft);
    display:grid; grid-template-columns:1fr auto; gap:4px 10px;
  }
  .run:hover { background:var(--surface); }
  .run[aria-current="true"] { background:var(--surface); box-shadow:inset 3px 0 0 var(--signal); }
  .run .id { font-size:12px; color:var(--ink); }
  .run .meta { grid-column:1/-1; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums; }

  .pill { font-size:10px; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:2px; align-self:start; }
  .pass { color:var(--pass); background:var(--pass-bg); }
  .warn { color:var(--warn); background:var(--warn-bg); }
  .fail { color:var(--fail); background:var(--fail-bg); }

  .card { background:var(--surface); border:1px solid var(--rule-soft); border-radius:3px; padding:20px; }
  .card + .card { margin-top:18px; }
  h2 { margin:0 0 4px; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .spec { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px 22px; margin-top:16px; }
  .spec div { border-top:1px solid var(--rule); padding-block:8px 10px; }
  .spec dt { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); }
  .spec dd { margin:3px 0 0; font-variant-numeric:tabular-nums; word-break:break-word; }

  table { border-collapse:collapse; width:100%; font-size:12px; margin-top:14px; }
  th,td { padding:7px 10px 7px 0; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); border-bottom:1px solid var(--ink); font-weight:500; }
  tbody tr { border-bottom:1px solid var(--rule-soft); }
  .tablewrap { overflow-x:auto; }

  .note { margin-top:14px; padding:10px 12px; border-left:3px solid var(--warn); background:var(--sunk); font-size:12px; color:var(--ink-2); }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
  .trend { margin-top:10px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin-top:8px; }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  a { color:var(--signal); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script>
const { useState, useEffect } = React;
const html = htm.bind(React.createElement);

const ms = n => (n || n === 0) ? Math.round(n) + "ms" : "-";
const pct = n => (n * 100).toFixed(n < 0.01 ? 1 : 1) + "%";
const when = s => new Date(s).toLocaleString();

function Pill({ v }) {
  return html`<span class="pill ${v}">${v}</span>`;
}

// Run history as a sparkline of worst p95 per run, oldest to newest. The whole
// reason the dashboard exists is the question "is this getting worse", and that
// is a shape rather than a number.
function Trend({ runs }) {
  const series = runs.filter(r => r.worst_p95_ms > 0).slice(0, 20).reverse();
  if (series.length < 2) return null;

  const W = 640, H = 120, PAD = 34;
  const max = Math.max(...series.map(r => r.worst_p95_ms)) * 1.15;
  const x = i => PAD + (i * (W - PAD - 12)) / Math.max(series.length - 1, 1);
  const y = v => H - 26 - (v / max) * (H - 48);
  const color = v => v === "fail" ? "var(--fail)" : v === "warn" ? "var(--warn)" : "var(--pass)";

  return html`
    <div class="trend">
      <div class="eyebrow">Worst p95 TTFA, last ${series.length} runs (oldest left)</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
        <line x1=${PAD} y1=${H - 26} x2=${W - 12} y2=${H - 26} stroke="var(--rule)" stroke-width="1"/>
        <text x="4" y=${y(max / 1.15) + 4} font-size="10" fill="var(--mute)">${Math.round(max / 1.15)}</text>
        <polyline fill="none" stroke="var(--signal)" stroke-width="2" stroke-linejoin="round"
          points=${series.map((r, i) => `${x(i)},${y(r.worst_p95_ms)}`).join(" ")}/>
        ${series.map((r, i) => html`
          <circle key=${r.id} cx=${x(i)} cy=${y(r.worst_p95_ms)} r="4.5"
            fill=${color(r.verdict)} stroke="var(--surface)" stroke-width="2">
            <title>${r.id}\n${Math.round(r.worst_p95_ms)}ms · ${r.verdict}</title>
          </circle>`)}
      </svg>
      <div class="legend">
        <span><i style="background:var(--pass)"></i>pass</span>
        <span><i style="background:var(--warn)"></i>warn</span>
        <span><i style="background:var(--fail)"></i>fail</span>
      </div>
    </div>`;
}

function ReportCard({ id }) {
  const [rep, setRep] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    if (!id) return;
    setRep(null); setErr(null);
    fetch(`/api/runs/${id}`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(setRep).catch(e => setErr(String(e)));
  }, [id]);

  if (!id) return html`<div class="card empty">Pick a run.</div>`;
  if (err) return html`<div class="card empty">Could not load ${id}: ${err}</div>`;
  if (!rep) return html`<div class="card empty">Loading…</div>`;

  const steps = rep.steps || [];
  const degraded = steps.filter(s => s.harness_degraded);
  const anyWER = steps.some(s => s.wer && s.wer.turns > 0);
  const anyBarge = steps.some(s => s.barge_in && s.barge_in.turns > 0);

  return html`
    <div class="card">
      <div class="eyebrow">Report card</div>
      <h2>${rep.profile} · ${rep.scenario}</h2>
      <dl class="spec">
        <div><dt>Run</dt><dd>${id}</dd></div>
        <div><dt>Started</dt><dd>${when(rep.started_at)}</dd></div>
        <div><dt>Duration</dt><dd>${Math.round(rep.duration_s)}s</dd></div>
        <div><dt>Target</dt><dd>${rep.target || "deepgram voice agent"}</dd></div>
      </dl>

      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Conc</th><th>Setup</th><th>p50</th><th>p95</th><th>p99</th>
            <th>Turns</th><th>Drift</th><th>vs base</th><th>Verdict</th>
          </tr></thead>
          <tbody>
            ${steps.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}${s.name === rep.baseline ? " ←" : ""}</td>
                <td>${s.concurrency}</td>
                <td>${pct(s.setup_success)}</td>
                <td>${ms(s.ttfa.p50_ms)}</td>
                <td>${ms(s.ttfa.p95_ms)}</td>
                <td>${ms(s.ttfa.p99_ms)}</td>
                <td>${s.turns_total}</td>
                <td>${ms(s.worst_harness_drift_ms)}</td>
                <td>${s.p95_ratio ? s.p95_ratio.toFixed(2) + "×" : "-"}</td>
                <td><${Pill} v=${s.verdict}/></td>
              </tr>`)}
          </tbody>
        </table>
      </div>

      ${degraded.length > 0 && html`
        <div class="note">
          <strong>Suspect.</strong> ${degraded.map(s => s.name).join(", ")} drifted past the 100ms
          pacing limit, so ${degraded.length > 1 ? "those steps measure" : "that step measures"} the
          load generator rather than the agent. The verdict grades the agent and should not be
          believed here.
        </div>`}
    </div>

    ${anyWER && html`
      <div class="card">
        <div class="eyebrow">Transcript accuracy</div>
        <h2>What the agent heard</h2>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Mean</th><th>Worst turn</th><th>Errors</th><th>Words</th><th>S / D / I</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.wer && s.wer.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${pct(s.wer.mean)}</td>
                  <td>${pct(s.wer.worst)}</td>
                  <td>${s.wer.substitutions + s.wer.deletions + s.wer.insertions}</td>
                  <td>${s.wer.ref_words}</td>
                  <td>${s.wer.substitutions} / ${s.wer.deletions} / ${s.wer.insertions}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>`}

    ${anyBarge && html`
      <div class="card">
        <div class="eyebrow">Interruption</div>
        <h2>How fast it gave the floor back</h2>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Barge-ins</th><th>Yielded</th><th>p50</th><th>p95</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.barge_in && s.barge_in.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${s.barge_in.turns}</td>
                  <td>${s.barge_in.yielded}${s.barge_in.yielded < s.barge_in.turns
                        ? ` — ${s.barge_in.turns - s.barge_in.yielded} never yielded` : ""}</td>
                  <td>${ms(s.barge_in.yield_p50_ms)}</td>
                  <td>${ms(s.barge_in.yield_p95_ms)}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>`}`;
}

function App() {
  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetch("/api/runs").then(r => r.json())
      .then(rs => { setRuns(rs); if (rs.length) setSel(rs[0].id); })
      .catch(e => setErr(String(e)));
  }, []);

  return html`
    <div class="wrap">
      <header>
        <span class="eyebrow">Callstorm</span>
        <h1>Run history</h1>
        <p class="sub">Every sweep this harness has produced, newest first. One run tells you how an
          agent behaved once; the shape across runs is what says whether it is getting worse.</p>
      </header>

      ${err && html`<div class="card empty">Could not load runs: ${err}</div>`}

      <div class="cols">
        <div>
          <${Trend} runs=${runs}/>
          <div class="runs">
            ${runs.length === 0 && !err && html`<div class="empty">No runs yet.</div>`}
            ${runs.map(r => html`
              <button key=${r.id} class="run" aria-current=${String(r.id === sel)}
                      onClick=${() => setSel(r.id)}>
                <span class="id">${r.profile} · ${r.scenario}</span>
                <${Pill} v=${r.verdict}/>
                <span class="meta">
                  ${when(r.started_at)} · peak ${r.peak_concurrency} · worst p95 ${ms(r.worst_p95_ms)}
                  ${r.harness_degraded ? " · harness suspect" : ""}
                  ${r.breakpoint ? ` · breaks at ${r.breakpoint}` : ""}
                </span>
              </button>`)}
          </div>
        </div>
        <div><${ReportCard} id=${sel}/></div>
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
