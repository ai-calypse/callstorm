    ? { ...q, how, chart, short: `Yes: ${change} over ${secs(ph.held_s)} at steady load.`,
        answer: html`<b>Yes.</b> Holding ${atOnce(soak.concurrency)} for ${secs(ph.held_s)}, the typical wait went from ${ms(ph.first_half.p50_ms)} in the first half to ${ms(ph.second_half.p50_ms)} in the second (${change}) while the load never changed. Something is building up: memory, a queue, or connections not being let go.` }
    : { ...q, how, chart, short: `No: it held steady for ${secs(ph.held_s)}.`,
        answer: html`<b>No, not over ${secs(ph.held_s)}.</b> Holding ${atOnce(soak.concurrency)}, the typical wait was ${ms(ph.first_half.p50_ms)} in the first half and ${ms(ph.second_half.p50_ms)} in the second (${change}). Leaks show up over hours, so a longer steady step is a stronger test.` };
}

function qHearing(rep, L) {
  const q = { id: "hearing", group: "Quality when busy", ask: "Does it still hear people correctly when it's busy?" };
  const rows = L.filter(s => s.wer && s.wer.turns > 0);
  if (rows.length === 0) return { ...q, missing: "The agent under test never reported what it heard, so its hearing can't be checked. Against a real agent this compares what the test caller said with what the agent wrote down." };
  const pct1 = v => `${fixed((v || 0) * 100, 1)}%`;
  const a = rows[0].wer.mean, b = rows[rows.length - 1].wer.mean;
  const chart = html`<${LineChart} labels=${rows.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${pct1}
      series=${[{ name: "words misheard", color: SERIES.main, values: rows.map(s => s.wer.mean) }]}
      refs=${[{ value: 0.05, label: "5%: the usual limit for usable" }]}/>`;
  const how = "Callstorm knows exactly what the test caller said, so it compares that with what the agent heard, word by word. Under 5% misheard is the usual bar.";
  if (rows.length < 2) {
    return { ...q, how, chart, short: `It misheard ${pct1(a)} of words.`,
      answer: html`<b>It misheard ${pct1(a)} of words</b> at ${atOnce(rows[0].concurrency)}, the only level with transcripts to check.` };
  }
  return b - a >= 0.02
    ? { ...q, how, chart, short: `No: it misheard more when busy, ${pct1(a)} to ${pct1(b)}.`,
        answer: html`<b>No, it hears worse when busy.</b> It misheard ${pct1(a)} of words at ${atOnce(rows[0].concurrency)} and ${pct1(b)} at ${rows[rows.length - 1].concurrency}. Hearing shouldn't change with load, so its speech recognition is probably queueing or dropping audio.` }
    : { ...q, how, chart, short: `Yes: ${pct1(a)} misheard at light load, ${pct1(b)} at heavy.`,
        answer: html`<b>Yes.</b> It misheard ${pct1(a)} of words at ${atOnce(rows[0].concurrency)} and ${pct1(b)} at ${rows[rows.length - 1].concurrency}.` };
}

function qJob(rep, L) {
  const q = { id: "job", group: "Quality when busy", ask: "Does it still do its job when it's busy?" };
  const rows = L.filter(s => (s.nodes || []).some(n => n.checked > 0));
  const judged = rep.judge && rep.judge.calls && rep.judge.calls.length ? rep.judge : null;
  if (rows.length === 0 && !judged) return { ...q, missing: "This run had no way to tell whether a call went right. Give the scenario an expect on the steps that matter, or run it with -judge and written success criteria." };
  if (rows.length === 0) {
    const byStep = L.map(s => {
      const cs = judged.calls.filter(c => c.step === s.name && c.judged);
      return cs.length ? cs.filter(c => c.met).length / cs.length : null;
    });
    const vals = byStep.filter(has);
    if (vals.length === 0) return { ...q, missing: "The graded calls couldn't be matched to this run's load levels." };
    const lo = vals[0], hi = vals[vals.length - 1];
    const chart = html`<${LineChart} labels=${L.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${pctOf}
        series=${[{ name: "graded calls that did the job", color: SERIES.main, values: byStep }]}/>`;
    const how = "A language model read each graded call's transcript against the scenario's written success criteria. Only a few calls per level are graded by default, so small differences are noise.";
    return hi <= lo - 0.1
      ? { ...q, how, chart, short: `Less often: ${pctOf(lo)} of graded calls at light load, ${pctOf(hi)} at heavy.`,
          answer: html`<b>Less often when busy.</b> ${pctOf(lo)} of graded calls did the job at the lightest load and ${pctOf(hi)} at the heaviest.` }
      : { ...q, how, chart, short: `About as often: ${pctOf(lo)} at light load, ${pctOf(hi)} at heavy.`,
          answer: html`<b>About as often when busy.</b> ${pctOf(lo)} of graded calls did the job at the lightest load and ${pctOf(hi)} at the heaviest.` };
  }
  const ids = [...new Set(rows.flatMap(s => s.nodes.filter(n => n.checked > 0).map(n => n.node)))];
  const rate = (s, id) => {
    const n = (s.nodes || []).find(x => x.node === id);
    return n && n.checked > 0 ? n.pass_rate : null;
  };
  const colors = [SERIES.main, SERIES.soft, SERIES.third, SERIES.fourth];
  const chart = html`<${LineChart} labels=${rows.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${pctOf}
      series=${ids.slice(0, 4).map((id, i) => ({ name: id, color: colors[i], values: rows.map(s => rate(s, id)) }))}/>`;
  const how = "Each step of the conversation can carry a check on what the agent says back. The chart shows how often each check passed, at each load.";
  const low = rows[0], high = rows[rows.length - 1];
  const drops = ids.map(id => ({ id, from: rate(low, id) || 0, to: rate(high, id) || 0 })).sort((a, b) => (b.from - b.to) - (a.from - a.to));
  const weakest = ids.map(id => ({ id, to: rate(high, id) || 0 })).sort((a, b) => a.to - b.to)[0];
  if (rows.length > 1 && drops[0].from - drops[0].to >= 0.1) {
    return { ...q, how, chart, short: `Not fully: ${drops[0].id} fell from ${pctOf(drops[0].from)} to ${pctOf(drops[0].to)}.`,
      answer: html`<b>Not fully.</b> The ${drops[0].id} step of the conversation passed ${pctOf(drops[0].from)} of the time at ${atOnce(low.concurrency)}, but only ${pctOf(drops[0].to)} at ${high.concurrency}.` };
  }
  const neverAt = rate(low, weakest.id) || 0;
  // A check that fails every call at every load is as likely to be wrong as
  // the agent is: one written against another agent's words fails each time. A
  // judge that read the same calls says which.
  const graded = judged ? judged.calls.filter(c => c.judged) : [];
  const checkNote = graded.length
    ? ` The judge, reading the whole transcripts, found ${pctOf(graded.filter(c => c.met).length / graded.length)} of graded calls did the job, so check whether that step expects words this agent was ever asked to say.`
    : " If that step expects words this agent was never asked to say, the check is wrong rather than the agent.";
  return weakest.to === 0 && neverAt === 0
    ? { ...q, how, chart, short: `Load made no difference, but ${weakest.id} failed its check at every load.`,
        answer: html`<b>Load made no difference.</b> Every checked step passed about as often at ${atOnce(high.concurrency)} as at ${low.concurrency}. One step, ${weakest.id}, failed its check at every load.${checkNote}` }
    : { ...q, how, chart, short: "Yes: every checked step held up under load.",
        answer: html`<b>Yes.</b> Every checked step passed about as often at ${atOnce(high.concurrency)} as at ${low.concurrency}. The weakest, ${weakest.id}, passed ${pctOf(weakest.to)} of the time at the heaviest load.` };
}

// Whether mishearing cost the task: the split the evidence card draws, read the
// same way, so the two cannot disagree.
function qHeardDone(rep) {
  const q = { id: "heard-done", group: "Quality when busy", ask: "Are the calls it misheard the calls it failed?" };
  if (!rep.judge) return { ...q, missing: "This run was not judged, so nothing says which calls did the job. Run it with -judge and written success criteria." };
  const x = rep.judge.correlation;
  if (!x || !(x.calls > 0)) return { ...q, missing: "None of the judged calls has a record of what the agent heard, so hearing can't be set against the outcome. The reference agent does no speech recognition; run the same test against the real agent." };
  const line = `${Math.round((x.threshold || 0.05) * 100)}%`;
  if (!x.conclusive) {
    const next = x.clean_calls > 0 && x.misheard_calls > 0 ? " Judge more calls per step with -judge-calls to answer this."
      : x.misheard_calls === 0 ? " With none misheard there is no second group to compare against." : " With none heard cleanly there is no group to compare against.";
    return { ...q, missing: `Not enough to tell: ${x.note}. Of ${x.calls} judged calls, ${x.misheard_calls} had more than ${line} of their words misheard.${next}` };
  }
  const chart = html`<${StackBars} rows=${[
      { label: `misheard over ${line}`, values: [x.misheard_passed, x.misheard_calls - x.misheard_passed] },
      { label: "heard cleanly", values: [x.clean_passed, x.clean_calls - x.clean_passed] },
    ]} segments=${[{ name: "did the job", color: "var(--pass)" }, { name: "did not", color: "var(--fail)" }]}
      share=${true} valueFmt=${v => `${v} calls`} totalFmt=${sum => `${sum} calls`}/>`;
  const how = `Callstorm knows exactly what the test caller said, so each judged call gets the share of its words the agent misheard. Calls with more than ${line} misheard are compared with the rest on how often they did the job. A misheard-words figure alone says nothing about what to fix; set against outcomes it either points at the listening or clears it. Nothing chose which calls would be misheard, so it shows an association, not a cause.`;
  const counts = html`${pctOf(x.misheard_pass_rate)} of the ${x.misheard_calls} misheard calls did the job, against ${pctOf(x.clean_pass_rate)} of the ${x.clean_calls} heard cleanly.`;
  const small = Math.min(x.clean_calls, x.misheard_calls);
  const loose = small < 5 ? ` The smaller group has only ${small} ${small === 1 ? "call" : "calls"}, so read this loosely.` : "";
  return x.gap > 0
    ? { ...q, how, chart, short: `Yes: ${pctOf(x.misheard_pass_rate)} of misheard calls did the job, ${pctOf(x.clean_pass_rate)} of the rest.`,
        answer: html`<b>Yes, mishearing is costing it the task.</b> ${counts} Fix the listening before the reasoning.${loose}` }
    : { ...q, how, chart, short: "No: misheard calls did the job at least as often.",
        answer: html`<b>No, mishearing is not what fails these calls.</b> ${counts} Look past the transcript, at the reasoning, tools or prompt.${loose}` };
}

function qInterrupt(rep, L) {
  const q = { id: "interrupt", group: "Quality when busy", ask: "Does it talk over people more when it's busy?" };
  const rows = L.filter(s => s.conversation && s.conversation.turns > 0);
  if (rows.length === 0) return { ...q, missing: "This run predates conversation measurements." };
  const rates = rows.map(s => s.conversation.interruption_rate || 0);
  const chart = html`<${LineChart} labels=${rows.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${pctOf}
      series=${[{ name: "turns where the agent talked over the caller", color: SERIES.main, values: rates }]}/>`;
  const how = "Counts turns where the agent started speaking while the caller was still talking. The test caller is patient and never talks over a slow agent, so this measures the agent cutting in, not callers losing patience.";
  const a = rates[0], b = rates[rates.length - 1];
  if (Math.max(...rates) === 0) {
    return { ...q, how, chart, short: "No: it never talked over anyone.",
      answer: html`<b>No.</b> At every load, the agent waited for callers to finish before it spoke.` };
  }
  return b - a >= 0.05
    ? { ...q, how, chart, short: `Yes: from ${pctOf(a)} of turns to ${pctOf(b)}.`,
        answer: html`<b>Yes.</b> It talked over the caller in ${pctOf(a)} of turns at ${atOnce(rows[0].concurrency)} and ${pctOf(b)} at ${rows[rows.length - 1].concurrency}.` }
    : { ...q, how, chart, short: `No more than usual: about ${pctOf(b)} of turns.`,
        answer: html`<b>No more than usual.</b> It talked over the caller in ${pctOf(a)} of turns at ${atOnce(rows[0].concurrency)} and ${pctOf(b)} at ${rows[rows.length - 1].concurrency}.` };
}

function qWordier(rep, L) {
  const q = { id: "wordy", group: "Quality when busy", ask: "Does it talk longer, or faster, when it's busy?" };
  const rows = L.filter(s => s.conversation && s.conversation.turns > 0 && s.conversation.agent_speech_seconds > 0);
  if (rows.length === 0) return { ...q, missing: "This run predates conversation measurements." };
  const perTurn = s => s.conversation.agent_speech_seconds / s.conversation.turns;
  const a = rows[0], b = rows[rows.length - 1];
  const longer = perTurn(b) / perTurn(a) - 1, faster = (b.conversation.agent_wpm || 0) / (a.conversation.agent_wpm || 1) - 1;
  const chart = html`<${LineChart} labels=${rows.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${v => `${fixed(v, 1)} s`}
      series=${[{ name: "seconds of agent speech per turn", color: SERIES.main, values: rows.map(perTurn) }]}/>`;
  const how = "Measured from what the agent actually said: how many seconds it spoke per turn, and how many words a minute.";
  return Math.abs(longer) < 0.15 && Math.abs(faster) < 0.15
    ? { ...q, how, chart, short: "No: it spoke the same amount at the same pace.",
        answer: html`<b>No.</b> It spoke for ${fixed(perTurn(a), 1)} seconds a turn at ${atOnce(a.concurrency)} and ${fixed(perTurn(b), 1)} at ${b.concurrency}, at about ${Math.round(b.conversation.agent_wpm || 0)} words a minute.` }
    : { ...q, how, chart, short: `Yes: ${longer >= 0 ? "longer" : "shorter"} and ${faster >= 0 ? "faster" : "slower"} under load.`,
        answer: html`<b>Yes.</b> It spoke for ${fixed(perTurn(a), 1)} seconds a turn at ${atOnce(a.concurrency)} and ${fixed(perTurn(b), 1)} at ${b.concurrency}, and its pace went from ${Math.round(a.conversation.agent_wpm || 0)} to ${Math.round(b.conversation.agent_wpm || 0)} words a minute.` };
}

// The middle of a list of numbers, by nearest rank as every percentile here is.
const middle = vs => vs.slice().sort((a, b) => a - b)[Math.ceil(vs.length / 2) - 1];

function qTurnWait(rep, L) {
  const q = { id: "turns", group: "What causes the wait", ask: "Which moment in a call keeps callers waiting longest?" };
  const rows = L.filter(s => (s.turns || []).length > 0);
  if (rows.length === 0) return { ...q, missing: "This run predates waits per turn of the conversation. Run callstorm -refresh on its report to add them from its calls log." };
  const base = rows.find(s => s.name === rep.baseline) || rows[0], top = rows[rows.length - 1];
  if (top.turns.length < 2) return { ...q, missing: "Every call had a single turn, so there is no moment in it to compare." };
  const numbers = [...new Set(rows.flatMap(s => s.turns.map(t => t.turn)))].sort((a, b) => a - b);
  const p95At = (s, n) => { const t = s.turns.find(x => x.turn === n); return t ? t.ttfa.p95_ms : null; };
  const shown = base === top ? [top] : [base, top];
  const chart = html`<${LineChart} labels=${numbers.map(String)} xTitle="turn of the conversation" yFmt=${ms}
      series=${shown.map((s, i) => ({ name: `slowest callers at ${atOnce(s.concurrency)}`, color: i === shown.length - 1 ? SERIES.main : SERIES.soft, values: numbers.map(n => p95At(s, n)) }))}/>`;
  const how = "Each point is the wait 95 turns in 100 beat at that turn of the conversation, across every call at that load. A step's own figures mix every turn together, which hides a turn that is slow in every call. A turn stands out when it is at least one and a half times the middle of the others.";
  const slowest = s => s.turns.reduce((a, t) => (t.ttfa.p95_ms > a.ttfa.p95_ms ? t : a), s.turns[0]);
  const rest = (s, t, key) => middle(s.turns.filter(x => x !== t).map(x => (key === "p50" ? x.ttfa.p50_ms : x.ttfa.p95_ms)));
  const t = slowest(top), others = rest(top, t, "p95");
  if (t.ttfa.p95_ms < 1.5 * others) {
    const lo = Math.min(...top.turns.map(x => x.ttfa.p95_ms));
    return { ...q, how, chart, short: "No single moment: every turn waits about as long.",
      answer: html`<b>No single moment stands out.</b> At ${atOnce(top.concurrency)}, the slowest callers waited between ${ms(lo)} and ${ms(t.ttfa.p95_ms)} on every turn of the conversation.` };
  }
  const typicalSlow = t.ttfa.p50_ms >= 1.5 * rest(top, t, "p50");
  const typical = typicalSlow
    ? ` Even a typical caller waits ${ms(t.ttfa.p50_ms)} on that turn.`
    : ` A typical caller barely notices (${ms(t.ttfa.p50_ms)}); it is the slowest 1 turn in 20 that waits.`;
  const where = !typicalSlow ? ""
    : t.think_speak_p50_ms >= 0.6 * t.ttfa.p50_ms ? ` Most of it is the agent thinking up its reply: ${ms(t.think_speak_p50_ms)} of a typical ${ms(t.ttfa.p50_ms)}.`
    : t.endpointing_p50_ms >= 0.6 * t.ttfa.p50_ms ? ` Most of it is the agent noticing the caller stopped: ${ms(t.endpointing_p50_ms)} of a typical ${ms(t.ttfa.p50_ms)}.`
    : "";
  const baseSlow = base !== top ? slowest(base) : null;
  const load = !baseSlow ? ""
    : baseSlow.turn === t.turn && baseSlow.ttfa.p95_ms >= 1.5 * rest(base, baseSlow, "p95")
      ? ` It was the slowest turn at ${atOnce(base.concurrency)} too (${ms(baseSlow.ttfa.p95_ms)}), so it comes from what is said on that turn, not from being busy.`
      : ` At ${atOnce(base.concurrency)} it did not stand out, so being busy is what made it slow.`;
  // The caller's own full stop is dropped, so the sentence can end on its own.
  const said = (t.caller_line || "").replace(/[.!?]+$/, "");
  return { ...q, how, chart, short: `Turn ${t.turn}: ${ms(t.ttfa.p95_ms)} for the slowest callers, against ${ms(others)} on the others.`,
    answer: html`<b>Turn ${t.turn}${said ? `, after the caller says “${said}”` : ""}.</b> At ${atOnce(top.concurrency)}, the slowest callers waited ${ms(t.ttfa.p95_ms)} on that turn, against ${ms(others)} on the others.${typical}${where}${load}` };
}

function qLongWaits(rep, L) {
  const q = { id: "longwaits", group: "What causes the wait", ask: "How often does a caller wait long enough to notice?" };
  const rows = L.filter(s => s.waits && s.waits.turns > 0);
  if (rows.length === 0) return { ...q, missing: "This run predates counts of long waits. Run callstorm -refresh on its report to add them from its calls log." };
  const band = (s, k) => s.waits[k] || 0;
  const SEG = [
    { name: "up to 800ms, Hamming's target", color: "var(--pass)" },
    { name: "800ms to 1.2s", color: "color-mix(in srgb, var(--warn) 45%, var(--surface))" },
    { name: "1.2s to 2s, where callers start repeating themselves", color: "var(--warn)" },
    { name: "over 2s of dead air", color: "var(--fail)" },
  ];
  const chart = html`<${StackBars} rows=${rows.map(s => ({ label: atOnce(s.concurrency), values: [band(s, "up_to_800ms"), band(s, "800_to_1200ms"), band(s, "1200_to_2000ms"), band(s, "over_2000ms")] }))}
      segments=${SEG} share=${true} valueFmt=${v => `${v} turns`} totalFmt=${sum => `${sum} turns`}/>`;
  const how = "Every answered turn is sorted by how long the caller waited after they finished: up to 800ms, Hamming's published target; up to 1.2 seconds, past which Coval says callers start repeating themselves, talking over the agent or hanging up; up to 2 seconds; and dead air beyond that.";
  const past = s => (band(s, "1200_to_2000ms") + band(s, "over_2000ms")) / s.waits.turns;
  const dead = s => band(s, "over_2000ms") / s.waits.turns;
  const one = v => `${fixed(v * 100, 1)}%`;
  const a = rows[0], b = rows[rows.length - 1];
  if (rows.every(s => past(s) < 0.01)) {
    return { ...q, how, chart, short: "Rarely: under 1 turn in 100 past 1.2s at any load.",
      answer: html`<b>Rarely.</b> At every load, fewer than 1 turn in 100 kept a caller waiting past 1.2 seconds.` };
  }
  const trend = rows.length < 2 ? ""
    : past(b) - past(a) >= 0.02 ? ` That is up from ${one(past(a))} at ${atOnce(a.concurrency)}, so being busy makes the long waits more common.`
    : ` It was ${one(past(a))} at ${atOnce(a.concurrency)}, so the long waits are not coming from load.`;
  const deadNote = dead(b) > 0 ? ` ${one(dead(b))} went past 2 seconds, long enough for a caller to ask whether anyone is there.` : "";
  return { ...q, how, chart, short: `${one(past(b))} of turns past 1.2s at ${atOnce(b.concurrency)}.`,
    answer: html`<b>${one(past(b))} of turns at ${atOnce(b.concurrency)}.</b> That many kept the caller waiting past 1.2 seconds, where callers start repeating themselves.${trend}${deadNote}` };
}

function qQualityLimit(rep, L) {
  const q = { id: "quality", group: "How much it can take", ask: "Does it get worse at the job before it gets too slow?" };
  const rows = L.filter(s => s.quality && s.quality.verdict && s.quality.verdict !== "n/a");
  if (rows.length < 2) return { ...q, missing: rows.length === 0
    ? "This run predates the quality verdict. Run callstorm -refresh on its report to add it from its calls log."
    : "This needs at least two levels of calls at the same time to compare." };
  const compared = [...new Set(rows.flatMap(s => s.quality.compared || []))];
  // A speed failure with every busier level passing was not the load, as the
  // capacity answer reads it too.
  const firstSlow = rows.find(s => s.verdict === "fail");
  const busier = firstSlow ? rows.filter(s => s.concurrency > firstSlow.concurrency) : [];
  const speed = firstSlow && !(busier.length > 0 && busier.every(s => s.verdict !== "fail")) ? firstSlow : null;
  const job = rows.find(s => s.quality.verdict === "fail");
  const close = rows.find(s => s.quality.verdict === "warn");
  const chart = html`
    <div className="tablewrap">
      <table>
        <thead><tr><th>Calls at once</th><th>Speed</th><th>Doing the job</th><th>Why</th></tr></thead>
        <tbody>
          ${rows.map(s => html`
            <tr key=${s.name}>
              <td>${s.concurrency}</td>
              <td><${Badge} v=${s.verdict}/></td>
              <td><${Badge} v=${s.quality.verdict}/></td>
              <td className="wrap">${(s.quality.reasons || []).join("; ") || "-"}</td>
            </tr>`)}
        </tbody>
      </table>
    </div>`;
  const how = `Speed is judged on the slowest callers' wait against normal load. Doing the job is judged apart from speed, also against normal load: a scenario check or the judge's pass rate dropping more than 10 points fails, as Hamming's load-testing guide sets it, and so do words misheard rising past 15%, talking over callers in more than 1 turn in 10, or more than 1 turn in 100 failing. A rate needs 30 checks on each side to count. This run compared: ${compared.join(", ")}.`;
  const thin = compared.length === 1 ? " Only failed turns could be compared, so this says little about whether it did the job: judge more calls, or give the scenario checks." : "";
  const warned = !job && close ? ` It came close at ${atOnce(close.concurrency)}: ${close.quality.reasons[0]}.` : "";
  const notLoad = firstSlow && !speed ? ` Speed failed only at ${atOnce(firstSlow.concurrency)}, and every busier level passed, so that was not the load.` : "";
  if (job && speed && job.concurrency === speed.concurrency) {
    return { ...q, how, chart, short: `Both at once, at ${atOnce(job.concurrency)}.`,
      answer: html`<b>Both gave way at once.</b> At ${atOnce(job.concurrency)} it got too slow and stopped doing the job as well: ${job.quality.reasons[0]}.` };
  }
  if (job && (!speed || job.concurrency < speed.concurrency)) {
    return { ...q, how, chart, short: `Yes: it stopped doing the job as well at ${atOnce(job.concurrency)}.`,
      answer: html`<b>Yes.</b> It stopped doing the job as well at ${atOnce(job.concurrency)}${speed ? `, before it got too slow at ${speed.concurrency}` : ", and never got too slow"}: ${job.quality.reasons[0]}. A test that watched only speed would have passed that level.${notLoad}` };
  }
  if (speed) {
    const later = job ? ` Doing the job slipped later, at ${job.concurrency}: ${job.quality.reasons[0]}.` : " It did the job as well as at normal load at every level, on what was compared.";
    return { ...q, how, chart, short: `No: speed gave way first, at ${atOnce(speed.concurrency)}.`,
      answer: html`<b>No, speed gave way first.</b> It got too slow at ${atOnce(speed.concurrency)}.${later}${warned}${thin}` };
  }
  return { ...q, how, chart, short: "Neither gave way.",
    answer: html`<b>Neither gave way.</b> Up to ${atOnce(rows[rows.length - 1].concurrency)}, it did the job as well as at normal load, on what was compared, without a lasting slowdown.${notLoad}${warned}${thin}` };
}

function qRepeats(rep, L) {
  const q = { id: "repeats", group: "Quality when busy", ask: "Does it repeat itself more when it's busy?" };
  const rows = L.filter(s => s.conversation && s.conversation.turns > 0 && has(s.conversation.repeated_replies));
  if (rows.length === 0) return { ...q, missing: "This run predates counts of repeated replies. Run callstorm -refresh on its report to add them from its calls log." };
  const one = v => `${fixed(v * 100, 1)}%`;
  const rate = s => s.conversation.repeated_replies / s.conversation.turns;
  const chart = html`<${LineChart} labels=${rows.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${one}
      series=${[{ name: "replies that repeated an earlier one in the call", color: SERIES.main, values: rows.map(rate) }]}
      refs=${[{ value: 0.03, label: "3%: under it, Hamming rates repeated questions excellent" }]}/>`;
  const how = "A reply counts as repeated when its words match a reply the agent already gave in the same call, ignoring case and punctuation, or when it shares at least 80% of its distinct words with one. A conversation stuck in a loop shows here before any timing moves.";
  if (rows.every(s => s.conversation.repeated_replies === 0)) {
    return { ...q, how, chart, short: "No: it never repeated itself.",
      answer: html`<b>No.</b> At every load, no reply repeated one the agent had already given in the same call.` };
  }
  const a = rows[0], b = rows[rows.length - 1];
  const over = rate(b) > 0.03 ? " That is past 3%, the line under which Hamming rates repeated questions excellent." : "";
  return rate(b) - rate(a) >= 0.02
    ? { ...q, how, chart, short: `Yes: from ${one(rate(a))} of replies to ${one(rate(b))}.`,
        answer: html`<b>Yes.</b> ${one(rate(a))} of replies repeated an earlier one at ${atOnce(a.concurrency)}, and ${one(rate(b))} at ${b.concurrency}, in ${b.conversation.calls_with_repeats} calls.${over}` }
    : { ...q, how, chart, short: `No more than usual: ${one(rate(b))} of replies.`,
        answer: html`<b>No more than usual.</b> ${one(rate(a))} of replies repeated an earlier one at ${atOnce(a.concurrency)}, and ${one(rate(b))} at ${b.concurrency}.${over}` };
}

function qSlowFail(rep) {
  const q = { id: "slowfail", group: "Quality when busy", ask: "Do the calls that kept people waiting go worse?" };
  if (!rep.judge) return { ...q, missing: "This run was not judged, so nothing says which calls went well. Run it with -judge and written success criteria." };
  const w = rep.judge.waits;
  if (!w || !w.line_ms) return { ...q, missing: "This run predates the split of judged calls by how long they waited. Run callstorm -refresh on its report to add it." };
  const line = `${fixed(w.line_ms / 1000, 1)} seconds`;
  if (!w.conclusive) {
    return { ...q, missing: `Not enough to tell yet: of ${w.calls} judged calls, ${w.slow_calls} kept someone waiting past ${line}, and ${w.note}. Judge more calls per step with -judge-calls to answer this.` };
  }
  const chart = html`<${StackBars} rows=${[
      { label: "waited past the line", values: [w.slow_passed, w.slow_calls - w.slow_passed] },
      { label: "never that long", values: [w.quick_passed, w.quick_calls - w.quick_passed] },
    ]} segments=${[{ name: "did the job", color: "var(--pass)" }, { name: "did not", color: "var(--fail)" }]}
      share=${true} valueFmt=${v => `${v} calls`} totalFmt=${sum => `${sum} calls`}/>`;
  const how = `Judged calls are split by whether any turn kept the caller waiting past ${line}, where Coval says callers start repeating themselves, and the two groups' pass rates are compared. Hamming reports that each 100ms past 800ms costs 4 to 6% of task completion on the agents it watches; this checks that on this one. Nothing chose which calls would be slow, so it shows an association, not a cause.`;
  const counts = html`${pctOf(w.slow_pass_rate)} of the ${w.slow_calls} judged calls that kept someone waiting past ${line} did the job, against ${pctOf(w.quick_pass_rate)} of the other ${w.quick_calls}.`;
  // Eight judged calls make the split readable, but a group of two is one call
  // away from a different answer.
  const small = Math.min(w.slow_calls, w.quick_calls);
  const loose = small < 5 ? ` The smaller group has only ${small} ${small === 1 ? "call" : "calls"}, so read this loosely.` : "";
  return w.quick_pass_rate - w.slow_pass_rate >= 0.1
    ? { ...q, how, chart, short: `Yes: ${pctOf(w.slow_pass_rate)} of slow calls did the job, ${pctOf(w.quick_pass_rate)} of the rest.`,
        answer: html`<b>Yes.</b> ${counts} Waiting is costing it the task, or both come from the same cause.${loose}` }
    : { ...q, how, chart, short: "No: slow calls did the job about as often.",
        answer: html`<b>No.</b> ${counts}${loose}` };
}

function qBadLine(rep) {
  const q = { id: "network", group: "Bad connections", ask: "How much worse is it for callers on a bad network connection?" };
  const m = rep.matrix;
  if (!m || !m.cohorts || m.cohorts.length < 2) return { ...q, missing: "This run used a single network. Run it with -impairments to repeat the same calls on deliberately bad network conditions and compare." };
  const worstOf = c => (c.steps || []).reduce((a, s) => ((s.vs_clean || 0) > (a.vs_clean || 0) ? s : a), (c.steps || [])[0] || {});
  const bad = m.cohorts.slice(1);
  const broke = bad.filter(c => c.breakpoint);
  const worst = bad.reduce((a, c) => ((worstOf(c).vs_clean || 0) > (worstOf(a).vs_clean || 0) ? c : a), bad[0]);
  const chart = html`<${StackBars} rows=${bad.map(c => ({ label: c.impairment.name, values: [worstOf(c).vs_clean || 0] }))}
      segments=${[{ name: "slowest callers' wait, as a multiple of the same calls on a clean network", color: SERIES.main }]}
      valueFmt=${times} totalFmt=${times}/>`;
  const how = "The same calls were repeated with the network made worse on purpose: added delay, uneven delay, or lost data. Each bar is that condition's worst step, compared with the same step on a clean network.";
  const worstX = times(worstOf(worst).vs_clean || 0);
  return broke.length
    ? { ...q, how, chart, short: `Bad enough to break it: ${broke.map(c => c.impairment.name).join(", ")}.`,
        answer: html`<b>A bad connection breaks it before load does.</b> ${broke.map(c => `${c.impairment.name} (${describeNet(c.impairment)}) broke it at ${c.breakpoint}`).join("; ")}. The worst, ${worst.impairment.name}, made the slowest callers wait ${worstX} as long as on a clean network.` }
    : { ...q, how, chart, short: "It held up on every network tested.",
        answer: html`<b>It held up on every network tested.</b> The worst, ${worst.impairment.name} (${describeNet(worst.impairment)}), made the slowest callers wait ${worstX} as long as on a clean network, without breaking.` };
}

function qCost(rep, L) {
  const q = { id: "cost", group: "Cost", ask: "Does each turn of conversation cost more when it's busy?" };
  const rows = L.filter(s => s.cost && s.cost.agent_minutes > 0 && s.turns_total > 0);
  if (rows.length === 0) return { ...q, missing: "This run predates cost accounting." };
  const priced = rows.every(s => s.cost.usd_per_turn > 0);
  const value = s => (priced ? s.cost.usd_per_turn : (s.cost.agent_minutes * 60) / s.turns_total);
  const fmt = v => (priced ? `$${fixed(v, 4)}` : `${fixed(v, 1)} s`);
  const chart = html`<${LineChart} labels=${rows.map(s => String(s.concurrency))} xTitle="calls at the same time" yFmt=${fmt}
      series=${[{ name: priced ? "price per turn" : "billed call time per turn", color: SERIES.main, values: rows.map(value) }]}/>`;
  const how = priced
    ? "Voice agents charge for the time a call is open. This is the price per turn, from the minutes each call was open and the rate given."
    : "Voice agents charge for the time a call is open, so longer waits and longer replies cost more. This is billed call time per turn; give a price with -rate-per-minute to see dollars.";
  const a = value(rows[0]), b = value(rows[rows.length - 1]);
  const change = a > 0 ? b / a - 1 : 0;
  const verb = priced ? "A turn cost" : "A turn kept the call open for";
  return change >= 0.05
    ? { ...q, how, chart, short: `Yes: ${pctOf(change)} more per turn when busy.`,
        answer: html`<b>Yes, ${pctOf(change)} more.</b> ${verb} ${fmt(a)} at ${atOnce(rows[0].concurrency)} and ${fmt(b)} at ${rows[rows.length - 1].concurrency}, because every extra second of waiting is billed.` }
    : { ...q, how, chart, short: "No: about the same per turn at every load.",
        answer: html`<b>No.</b> ${verb} ${fmt(a)} at ${atOnce(rows[0].concurrency)} and ${fmt(b)} at ${rows[rows.length - 1].concurrency}.` };
}

function qTrust(rep) {
  const q = { id: "trust", group: "Can you trust this test", ask: "Did the test itself keep up, and count every call?" };
  const steps = rep.steps || [];
  if (steps.length === 0) return { ...q, missing: "This run has no steps." };
  const drift = s => Math.abs(s.worst_harness_drift_ms || 0);
  const worst = steps.reduce((a, s) => (drift(s) > drift(a) ? s : a), steps[0]);
  const doubtful = steps.filter(s => s.harness_degraded);
  const d = rep.integrity && rep.integrity.dispatch;
  const counted = !d ? ""
    : d.missing > 0 ? ` ${d.missing} of the ${d.dispatched} calls sent to the test machines never came back.`
    : ` Every one of the ${d.dispatched} calls sent to the test machines came back${d.duplicates ? `, and ${d.duplicates} duplicates were dropped` : ""}.`;
  // A percentile from too few turns is just the slowest turn: p95 needs 20
  // turns to be anything else, and p99 needs 100.
  const timed = steps.filter(s => s.ttfa && s.ttfa.n > 0);
  const fewest = timed.reduce((a, s) => (!a || s.ttfa.n < a.ttfa.n ? s : a), null);
  const sample = !fewest ? ""
    : fewest.ttfa.n < 20 ? ` ${fewest.name} timed only ${fewest.ttfa.n} turns, too few for its slowest callers' wait to be anything but its single slowest turn.`
    : fewest.ttfa.n < 100 ? ` Every step timed at least ${fewest.ttfa.n} turns: enough for the slowest callers' wait, though a p99 needs 100.`
    : ` Every step timed at least ${fewest.ttfa.n} turns, enough for every percentile shown.`;
  const chart = html`<${StackBars} rows=${steps.map(s => ({ label: s.name, values: [drift(s)] }))}
      segments=${[{ name: "how far the test caller fell behind real time (past 100ms a step is doubtful)", color: SERIES.soft }]}
      valueFmt=${ms} totalFmt=${ms}/>`;
  const how = "The test caller has to speak in real time, or the agent is being tested on something no real caller does. Each bar shows the furthest it fell behind in that step.";
  return doubtful.length
    ? { ...q, how, chart, short: `Not everywhere: ${doubtful.map(s => s.name).join(", ")} doubtful.`,
        answer: html`<b>Not everywhere.</b> In ${doubtful.map(s => s.name).join(", ")}, the test machine fell more than 100ms behind real time, so those steps show its limits as much as the agent's.${counted}${sample}` }
    : { ...q, how, chart, short: "Yes: it kept up throughout.",
        answer: html`<b>Yes.</b> The test caller never fell more than ${ms(drift(worst))} behind real time, well inside the 100ms that would make a step doubtful.${counted}${sample}` };
}

function qRepeat(rep, runs, id) {
  const q = { id: "repeat", group: "Can you trust this test", ask: "If we ran the same test again, would we get the same answer?" };
  const exact = !!rep.scenario_hash;
  const same = runs.filter(r => r.id !== id && r.target === rep.target && (exact && r.scenario_hash
    ? r.scenario_hash === rep.scenario_hash && r.profile_hash === rep.profile_hash
    : r.scenario === rep.scenario && r.profile === rep.profile));
  if (same.length === 0) {
    return { ...q, missing: exact
      ? "No other run has asked exactly this question of this agent yet. This run's scenario and load plan are fingerprinted, so the next run of the same test will be compared with it automatically."
      : "No other run in the history asked the same question of the same agent." };
  }
  const steps = rep.steps || [];
  const baseStep = steps.find(s => s.name === rep.baseline);
  const me = runs.find(r => r.id === id) || {
    id, started_at: rep.started_at,
    baseline_p95_ms: baseStep ? baseStep.ttfa.p95_ms : 0,
    worst_p95_ms: Math.max(0, ...steps.map(s => (s.ttfa ? s.ttfa.p95_ms : 0))),
  };
  const all = same.concat([me]).sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
  const spread = key => {
    const xs = all.map(r => r[key]).filter(v => v > 0);
    return xs.length > 1 ? Math.max(...xs) / Math.min(...xs) - 1 : 0;
  };
  const worstSpread = Math.max(spread("baseline_p95_ms"), spread("worst_p95_ms"));
  const label = r => (r.id === id ? "this run" : new Date(r.started_at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }));
  const chart = html`<${LineChart} labels=${all.map(label)} xTitle="runs of this test, oldest first" yFmt=${ms}
      series=${[
        { name: "slowest wait at normal load", color: SERIES.soft, values: all.map(r => r.baseline_p95_ms || null) },
        { name: "slowest wait at the heaviest load", color: SERIES.main, values: all.map(r => r.worst_p95_ms || null) },
      ]}/>`;
  const how = exact
    ? "Runs are matched by a fingerprint of the exact scenario and load plan, and by the agent tested. The closer the lines are to flat, the more repeatable the test."
    : "Older runs have no fingerprint, so they are matched by the names of their scenario and load plan, which may have changed in between.";
  return worstSpread <= 0.1
    ? { ...q, how, chart, short: `Yes: ${all.length} runs agree within ${pctOf(worstSpread)}.`,
        answer: html`<b>Yes, within ${pctOf(worstSpread)}.</b> ${all.length} runs of this test against this agent gave slowest waits within ${pctOf(worstSpread)} of each other, at normal load and at the heaviest.` }
    : { ...q, how, chart, short: `Not closely: runs differ by up to ${pctOf(worstSpread)}.`,
        answer: html`<b>Not closely.</b> Across ${all.length} runs of this test, the slowest waits differed by up to ${pctOf(worstSpread)}, so a single run's numbers need a margin of at least that much.` };
}

const OUT_OF_REACH = [
  ["What exactly inside the agent runs out first: memory, workers, or connections?", "Callstorm calls the agent from outside, the way a customer does. What runs out inside it only shows up in the agent's own monitoring."],
  ["Is the limit the agent's own, or its AI providers'?", "That needs the agent's own record of each provider's errors and rate limits. From outside, both look like waiting."],
  ["Is time lost between the agent's own internal steps?", "That needs tracing inside the agent. From outside, the wait splits only into the network, noticing you stopped, and composing the reply."],
  ["Does it leak memory or connections over many hours?", "Getting slower over time is checked above, but the leak itself is only visible in the agent's own metrics."],
  ["Are its lookups and bookings slower when it's busy?", "The agent's requests to other systems aren't observed yet. A stand-in for those systems would make this measurable."],
  ["Did the records a call should create actually arrive?", "That needs something to receive the events the agent sends after a call, and Deepgram's agent sends none."],
  ["Does it hand more calls to a human when it's busy?", "Handing a call over to a person isn't measured yet."],
  ["Does the sound get worse on a bad connection?", "That needs an audio quality score and a phone-style connection. Over this kind of connection a bad network causes delay, not broken audio."],
  ["Did our alerts go off at the right time?", "Alerts live in the agent's own monitoring, outside the test."],
  ["Do real callers lose patience and talk over a slow agent?", "The test caller is patient by design and waits for every answer, so it can't show that."],
];

function buildQuestions(rep, runs, id) {
  const L = ladderOf(rep.steps || []);
  const builders = [
    () => qCapacity(rep, L), () => qQualityLimit(rep, L), () => qShape(rep, L), () => qWho(rep, L), () => qProblems(rep),
    () => qWhereWait(rep, L), () => qTurnWait(rep, L), () => qLongWaits(rep, L),
    () => qRush(rep), () => qRecovery(rep), () => qOverTime(rep),
    () => qHearing(rep, L), () => qJob(rep, L), () => qHeardDone(rep), () => qSlowFail(rep), () => qInterrupt(rep, L), () => qWordier(rep, L), () => qRepeats(rep, L),
    () => qBadLine(rep), () => qCost(rep, L), () => qTrust(rep), () => qRepeat(rep, runs, id),
  ];
  // One broken answer must not take the whole report with it; it says it
  // failed, and the render check fails on that phrase.
  return builders.map((b, i) => {
    try {
      return b();
    } catch (e) {
      report("question", e);
      return { id: `failed-${i}`, group: "", ask: "An answer that could not be worked out", missing: "This answer could not be computed for this run." };
    }
  });
}


// ---- Selections the readings are built from ---------------------------------
// The same filters, in one place, so the chart, the takeaway, the findings list
// and the evidence drawer can never disagree about which steps count.
const sel = {
  steps: rep => rep.steps || [],
  ttfa: rep => sel.steps(rep).filter(s => s.ttfa && s.ttfa.n > 0),
  split: rep => sel.steps(rep).filter(s =>
    s.endpointing && s.endpointing.n > 0 && s.think_speak && s.think_speak.n > 0 &&
    s.endpointing.p95_ms + s.think_speak.p95_ms > 0),
  corrected: rep => sel.ttfa(rep).filter(s => s.agent_ttfa && s.agent_ttfa.n > 0),
  lines: refs => (refs || []).slice().sort((a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind)),
  phases: rep => {
    const rows = sel.steps(rep).filter(s => s.phase && s.phase.kind);
    return rows.some(s => s.phase.kind !== "ramp" || (s.phase.drift && s.phase.drift !== "unknown")) ? rows : [];
  },
  conv: rep => sel.steps(rep).filter(s => s.conversation && s.conversation.turns > 0),
  wer: rep => sel.steps(rep).filter(s => s.wer && s.wer.turns > 0),
  barge: rep => sel.steps(rep).filter(s => s.barge_in && s.barge_in.turns > 0),
  cost: rep => sel.steps(rep).filter(s => s.cost && s.cost.usd_per_turn > 0),
  matrix: rep => (rep.matrix && rep.matrix.cohorts && rep.matrix.cohorts.length ? rep.matrix : null),
};

// Which node gave way, for the reading and the table both.
function nodeSummary(rep) {
  const m = sel.matrix(rep);
  const views = m
    ? m.cohorts.map(c => ({ name: c.impairment.name, steps: c.steps || [] }))
    : [{ name: "", steps: sel.steps(rep) }];
  const scored = v => v.steps.reduce((a, s) => {
    for (const n of s.nodes || []) { a.checked += n.checked; a.passed += n.passed; }
    return a;
  }, { checked: 0, passed: 0 });
  const anyNodes = views.some(v => v.steps.some(s => (s.nodes || []).length > 0));
  const anyChecked = views.some(v => scored(v).checked > 0);
  if (!anyNodes || !anyChecked) return { views, anyNodes, worstView: null };
  const rate = v => { const x = scored(v); return x.checked > 0 ? x.passed / x.checked : 1; };
  const worstView = views.reduce((a, v) => (rate(v) < rate(a) ? v : a), views[0]);
  const worstOf = view => {
    let worst = null;
    for (const s of view.steps.filter(s => (s.nodes || []).length > 0)) for (const n of s.nodes) {
      if (n.checked > 0 && (!worst || n.pass_rate < worst.n.pass_rate)) worst = { s, n };
    }
    return worst;
  };
  return { views, anyNodes, worstView, worstOf };
}

// ---- Card primitives (the evidence drawer is made of these) -----------------

// One card's worth of evidence: what it is, what it shows, and what it says.
function Section({ eyebrow, title, lede, note, noteKind, reading, children }) {
  return html`
    <article className="evidence-block">
      <span className="eyebrow">${eyebrow}</span>
      <h3>${title}</h3>
      ${lede && html`<p className="lede">${keyed(lede)}</p>`}
      ${keyed(children)}
      ${note && html`<div className=${"caveat " + (noteKind === "warning" ? "cs-observation" : "cs-notice")}>${keyed(note)}</div>`}
      ${reading && html`<${ReadingBlock} reading=${reading}/>`}
    </article>`;
}

// The reading under a card: what the numbers say, why, and what to do.
function ReadingBlock({ reading }) {
  return html`
    <div className="reading">
      <p className="reading-verdict">${keyed(reading.verdict)}</p>
      ${reading.why && html`<p className="reading-why">${keyed(reading.why)}</p>`}
      ${reading.act && html`
        <div className="reading-act">
          <span className="eyebrow">WHAT TO INVESTIGATE</span>
          <p>${keyed(reading.act)}</p>
        </div>`}
    </div>`;
}

// ---- Load and latency evidence ----------------------------------------------

function ReportTable({ rep }) {
  const steps = sel.steps(rep);
  if (steps.length === 0) {
    return html`<${Section} eyebrow="LOAD AND LATENCY" title="No steps recorded"
      note="This report carries no steps, so there is no latency to read. The run may have stopped before its first step completed."/>`;
  }
  const degraded = steps.filter(s => s.harness_degraded);
  // A percentile from fewer turns than it needs is only the step's slowest turn.
  const thinFor = (s, need) => (s.ttfa && s.ttfa.n > 0 && s.ttfa.n < need ? "†" : "");
  const thin = steps.some(s => thinFor(s, 20) || thinFor(s, 100));
  const qualityIssues = steps.filter(s => s.quality && ["warn", "fail"].includes(s.quality.verdict) && (s.quality.reasons || []).length);
  const notes = [
    degraded.length > 0 && html`<p key="suspect"><b>Suspect.</b> ${degraded.map(s => s.name).join(", ")} drifted past the 100ms
      pacing limit, so ${degraded.length > 1 ? "those steps measure" : "that step measures"} the
      load generator rather than the agent. The verdict grades the agent and should not be
      believed here.</p>`,
    qualityIssues.length > 0 && html`<p key="quality"><b>Quality.</b> ${qualityIssues.map(s => `${s.name} ${s.quality.verdict}s: ${s.quality.reasons.join("; ")}`).join(". ")}. The Verdict column grades speed; Quality grades doing the job.</p>`,
    thin && html`<p key="thin">† fewer turns than that percentile needs to be more than the step's slowest turn: p95 needs 20 turns, p99 needs 100.</p>`,
  ].filter(Boolean);
  const note = notes.length > 0 ? html`<div className="notes">${notes}</div>` : null;
  return html`
    <${Section} eyebrow="REPORT CARD" title="Every step, as measured"
      lede="One row per step. p95 is the turn worse than 95 of every 100, and each step's verdict compares it with this run's own baseline step, marked ←. Quality is the step's verdict on doing the job, beside the verdict on speed."
      note=${note} noteKind=${degraded.length > 0 || qualityIssues.length > 0 ? "warning" : "info"} reading=${readLatency(steps, rep)}>
      <dl className="spec">
        <div><dt>Run</dt><dd>${rep.id}</dd></div>
        <div><dt>Started</dt><dd>${when(rep.started_at)}</dd></div>
        <div><dt>Duration</dt><dd>${Math.round(rep.duration_s)}s</dd></div>
        <div><dt>Target</dt><dd>${rep.target || "deepgram voice agent"}</dd></div>
      </dl>
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Conc</th><th>Setup</th><th>p50</th><th>p95</th><th>p99</th>
            <th>Turns</th><th>Drift</th><th>vs base</th><th>Verdict</th><th>Quality</th>
          </tr></thead>
          <tbody>
            ${steps.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}${s.name === rep.baseline ? " ←" : ""}</td>
                <td>${s.concurrency}</td>
                <td>${pct(s.setup_success)}</td>
                <td>${ms(s.ttfa.p50_ms)}</td>
                <td>${ms(s.ttfa.p95_ms)}${thinFor(s, 20)}</td>
                <td>${ms(s.ttfa.p99_ms)}${thinFor(s, 100)}</td>
                <td>${s.turns_total}</td>
                <td>${ms(s.worst_harness_drift_ms)}</td>
                <td>${s.p95_ratio ? s.p95_ratio.toFixed(2) + "×" : "-"}</td>
                <td><${Badge} v=${s.verdict}/></td>
                <td>${s.quality && s.quality.verdict ? html`<${Badge} v=${s.quality.verdict}/>` : "-"}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    <//>`;
}

// What the agent contributed: observed TTFA with the network round trip taken out.
function AgentLatency({ rep }) {
  const rows = sel.ttfa(rep);
  if (rows.length === 0) return null;
  const corrected = sel.corrected(rep);
  if (corrected.length === 0) {
    const pinged = rows.some(s => "transport_rtt" in s);
    return html`<${Section} eyebrow="WHAT THE AGENT CONTRIBUTED"
      title=${pinged ? "The network could not be taken out" : "Not separated from the network"}
      note=${pinged
        ? "Every call pinged the agent over its own connection and no pong came back, so this run's TTFA cannot be corrected for the network. The observed figures include the round trip between the test and the agent's edge."
        : "This run predates round-trip measurement, so its TTFA includes the network between the test and the agent's edge with no way to take it out. Runs placed from this version onward ping the agent on every call."}/>`;
  }
  return html`
    <${Section} eyebrow="WHAT THE AGENT CONTRIBUTED" title="The wait, with the network taken out"
      lede="Observed TTFA is what the caller waited through, and it includes the network between wherever this test ran and the agent. Every call pings the agent over its own connection, and the round trip it measures is subtracted turn by turn to estimate the agent's own share."
      note="The correction is an estimate. A ping travels the same connection as the audio, so it waits in the same queues, and its pong is read by the same code that times the agent's reply, so the harness's own delay cancels too. It cannot see inside the agent: speech recognition, the model and the voice stay together in the agent's share. Think/speak needs no correction, because both of its instants arrive over the same connection."
      reading=${readAgentLatency(corrected)}>
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Observed p50</th><th>Observed p95</th><th>Round trip p50</th>
            <th>Agent p50</th><th>Agent p95</th><th>Corrected</th>
          </tr></thead>
          <tbody>
            ${rows.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}</td>
                <td>${ms(s.ttfa.p50_ms)}</td>
                <td>${ms(s.ttfa.p95_ms)}</td>
                <td>${s.transport_rtt && s.transport_rtt.n > 0 ? ms(s.transport_rtt.p50_ms) : "-"}</td>
                <td>${s.agent_ttfa && s.agent_ttfa.n > 0 ? ms(s.agent_ttfa.p50_ms) : "-"}</td>
                <td>${s.agent_ttfa && s.agent_ttfa.n > 0 ? ms(s.agent_ttfa.p95_ms) : "-"}</td>
                <td>${s.agent_ttfa ? s.agent_ttfa.n : 0} of ${s.ttfa.n} turns</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    <//>`;
}

// Anatomy of one turn, drawn to the run's own median so the picture is a
// measurement rather than an illustration.
function TurnAnatomy({ ep, ts }) {
  const total = ep + ts;
  if (total <= 0) return null;
  const fe = Math.max(ep, total * 0.14), ft = Math.max(ts, total * 0.14);
  return html`
    <div className="anatomy">
      <div className="atrack">
        <div className="aseg ep" style=${{flex: fe}}><span>endpointing</span><b>${ms(ep)}</b></div>
        <div className="aseg ts" style=${{flex: ft}}><span>think / speak</span><b>${ms(ts)}</b></div>
      </div>
      <div className="amarks">
        <div style=${{flex: fe}}>↑ you stop talking</div>
        <div className="between" style=${{flex: ft}}>
          <span>↑ agent's transcript of you</span><span>↑ its first audio</span>
        </div>
      </div>
      <dl className="ahalves">
        <div>
          <dt>ENDPOINTING</dt>
          <dd>The agent is listening to silence and deciding whether you paused or finished.
              Nothing is being computed yet. <em>It is a configured threshold</em>, so it barely
              moves from turn to turn.</dd>
        </div>
        <div>
          <dt>THINK / SPEAK</dt>
          <dd>The language model composes a reply and the voice renders it.
              <em>This is real work</em>, so it varies with what you said and queues when the
              service is busy.</dd>
        </div>
      </dl>
    </div>`;
}

// Component share: how p95 TTFA divides between noticing the caller stopped
// and producing a reply, one bar per step.
function ComponentShare({ rep }) {
  const steps = sel.steps(rep);
  const rows = sel.split(rep);
  if (rows.length < 1) {
    if (steps.length === 0) return null;
    return html`<${Section} eyebrow="WHICH HALF SATURATES FIRST" title="No split to draw"
      note="Splitting TTFA needs the moment the agent's transcript of the caller arrived, and this run recorded none. A target that returns no user transcript can be timed but not decomposed."/>`;
  }

  const W = 640, ROW = 30, LEFT = 64, RIGHT = 78;
  const H = rows.length * ROW + 16;
  const max = Math.max(...rows.map(s => s.endpointing.p95_ms + s.think_speak.p95_ms)) * 1.02;
  const w = v => Math.max((v / max) * (W - LEFT - RIGHT), 0);
  const base = rows[0].think_speak.p95_ms / (rows[0].endpointing.p95_ms + rows[0].think_speak.p95_ms);

  return html`
    <${Section} eyebrow="WHICH HALF SATURATES FIRST" title="Anatomy of the wait"
      lede="The pause before an agent answers is two different problems wearing one number. Drawn to this run's own median turn:"
      reading=${readSplit(rows)}>
      <${TurnAnatomy} ep=${rows[0].endpointing.p50_ms} ts=${rows[0].think_speak.p50_ms}/>
      <h4 className="sub">Which half moves under load</h4>
      <div className="chart">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="p95 TTFA per step, split into endpointing and think/speak">
          ${rows.map((s, i) => {
            const ep = s.endpointing.p95_ms, ts = s.think_speak.p95_ms;
            const share = ts / (ep + ts);
            const y = i * ROW + 6;
            const shift = (share - base) * 100;
            return html`
              <g key=${s.name}>
                <text x="0" y=${y + 14} fontSize="11" fill="var(--cs-text-secondary)">${s.name}</text>
                <rect x=${LEFT} y=${y} width=${w(ep)} height="18" fill="var(--cs-blue)" stroke="var(--cs-chart-primary)" strokeWidth="1"/>
                <rect x=${LEFT + w(ep)} y=${y} width=${w(ts)} height="18" fill="var(--cs-lavender)" stroke="var(--cs-chart-comparison)" strokeWidth="1"/>
                <text x=${LEFT + w(ep) / 2} y=${y + 13} textAnchor="middle" fontSize=${Math.min(10, w(ep) / Math.max(ms(ep).length * .62, 1))} fill="var(--cs-ink)">${ms(ep)}</text>
                <text x=${LEFT + w(ep) + w(ts) / 2} y=${y + 13} textAnchor="middle" fontSize=${Math.min(10, w(ts) / Math.max(ms(ts).length * .62, 1))} fill="var(--cs-ink)">${ms(ts)}</text>
                <text x=${W - RIGHT + 8} y=${y + 13} fontSize="11" fill="var(--cs-text-secondary)">
                  ${Math.round(share * 100)}% think${i > 0 && Math.abs(shift) >= 5
                    ? (shift > 0 ? " ▲" : " ▼") + Math.abs(Math.round(shift)) : ""}
                </text>
                <title>${s.name + "\n" + Math.round(ep) + "ms endpointing + " + Math.round(ts) + "ms think/speak"}</title>
              </g>`;
          })}
        </svg>
      </div>
      <div className="legend">
        <span><i style=${{background:"var(--cs-blue)",borderColor:"var(--cs-chart-primary)"}}></i>endpointing — noticing the caller stopped</span>
        <span><i style=${{background:"var(--cs-lavender)",borderColor:"var(--cs-chart-comparison)"}}></i>think/speak — LLM plus TTS</span>
      </div>
    <//>`;
}

// Reference lines: what other people have published, each read on the clock
// its source defined. No line here is a verdict.
function ReferenceLines({ rep, refs }) {
  const rows = sel.ttfa(rep);
  if (rows.length === 0) return null;
  const lines = sel.lines(refs);
  if (lines.length === 0) {
    return html`<${Section} eyebrow="REFERENCE LINES" title="No reference lines loaded"
      note=${html`The published lines are read from <code>api/references.json</code>, and it did not load. The verdict does not depend on them.`}/>`;
  }

  const W = 640, LEFT = 104, RIGHT = 20, ROW = 20, GAP = 26, LABEL = 12;
  const vals = [];
  for (const [, , key] of CLOCKS) for (const s of rows) if (s[key] && s[key].n > 0) vals.push(s[key].p95_ms);
  for (const r of lines) vals.push(r.to_ms > 0 ? r.to_ms : r.ms);
  const axis = Math.max(...vals) * 1.08;
  const x = v => LEFT + (Math.min(Math.max(v, 0), axis) / axis) * (W - LEFT - RIGHT);
  let cursor = 0;
  const panels = CLOCKS.map(([id, title, key]) => {
    const onAxis = lines.filter(r => r.axis === id);
    const top = cursor;
    const rowsTop = top + 20 + onAxis.length * LABEL + 8;
    const bottom = rowsTop + rows.length * ROW;
    cursor = bottom + GAP;
    return { id, title, key, onAxis, top, rowsTop, bottom };
  });
  const H = cursor - GAP + 22;

  return html`
    <${Section} eyebrow="REFERENCE LINES" title="Where this run sits against what others have published"
      lede="Every step is drawn twice: timed from the instant the caller actually stopped talking, and from the instant the agent's transcript of the caller arrived. Published thresholds disagree, often because they start the clock at different instants, so each line is drawn only on the clock its source defined, with the source beside it."
      reading=${readReferences(rows, lines)}>
      <div className="chart">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Each step's p50 and p95 on both clocks, against the published lines">
          ${panels.map(p => html`<g key=${p.id}>
            <text x="0" y=${p.top + 12} fontSize="11" fill="var(--cs-ink)">${p.title}</text>
            ${p.onAxis.map((r, i) => html`<g key=${r.id}>
              ${r.to_ms > 0
                ? html`<rect x=${x(r.ms)} y=${p.top + 18} width=${Math.max(x(r.to_ms) - x(r.ms), 2)} height=${p.bottom - p.top - 18} fill="var(--cs-chart-target)" opacity="0.18"/>`
                : html`<line x1=${x(r.ms)} y1=${p.top + 18} x2=${x(r.ms)} y2=${p.bottom} stroke=${r.kind === "perceptual" ? "var(--cs-text-secondary)" : "var(--cs-chart-target)"} strokeWidth="1" strokeDasharray=${r.kind === "perceptual" ? "1 3" : "4 3"}/>`}
              <text x=${Math.min(x(r.ms) + 4, W - RIGHT - 170)} y=${p.top + 20 + (i + 1) * LABEL} fontSize="9.5" fill="var(--cs-text-secondary)">${r.label} · ${lineText(r)}</text>
            </g>`)}
            ${rows.map((s, i) => {
              const sum = s[p.key];
              const y = p.rowsTop + i * ROW + ROW / 2;
              if (!sum || !(sum.n > 0)) {
                return html`<text key=${s.name} x="0" y=${y + 4} fontSize="10" fill="var(--cs-text-caption)">${s.name} · no samples</text>`;
              }
              return html`<g key=${s.name}>
                <text x="0" y=${y + 4} fontSize="11" fill="var(--cs-text-secondary)">${s.name}</text>
                <line x1=${x(sum.p50_ms)} y1=${y} x2=${x(sum.p95_ms)} y2=${y} stroke="var(--cs-chart-primary)" strokeWidth="1.5"/>
                <circle cx=${x(sum.p95_ms)} cy=${y} r="4.5" fill="var(--cs-surface)" stroke="var(--cs-chart-primary)" strokeWidth="2">
                  <title>${s.name + " p95 " + Math.round(sum.p95_ms) + "ms, " + p.title.toLowerCase()}</title>
                </circle>
                <circle cx=${x(sum.p50_ms)} cy=${y} r="5" fill="var(--cs-chart-primary)">
                  <title>${s.name + " p50 " + Math.round(sum.p50_ms) + "ms, " + p.title.toLowerCase()}</title>
                </circle>
              </g>`;
            })}
          </g>`)}
          <text x=${LEFT} y=${H - 6} fontSize="10" fill="var(--cs-text-caption)">0</text>
          <text x=${W - RIGHT} y=${H - 6} fontSize="10" textAnchor="end" fill="var(--cs-text-caption)">${fmtS(axis / 1.08)}</text>
        </svg>
      </div>
      <div className="bandkey">
        <span><i style=${{background:"var(--cs-chart-primary)",borderRadius:"50%"}}></i>filled dot = p50</span>
        <span><i style=${{background:"var(--cs-surface)",border:"2px solid var(--cs-chart-primary)",borderRadius:"50%"}}></i>hollow dot = p95</span>
        <span><i style=${{background:"var(--cs-chart-target)",opacity:0.35}}></i>shaded = an observed range</span>
      </div>
      <div className="tablewrap gloss">
        <table>
          <thead><tr><th>Line</th><th>Its source's boundary</th><th>Why it sits on this clock</th><th>This run</th></tr></thead>
          <tbody>
            ${lines.map(r => {
              const marks = rows.flatMap(s => placeRef(r, s).map(m => ({ ...m, step: s.name })));
              const over = marks.filter(m => m.over);
              return html`<tr key=${r.id}>
                <td><b>${r.label}</b><span className="quote">${lineText(r)}${r.percentile ? ` at p${r.percentile}` : ", no percentile stated"} · ${r.axis === "detection" ? "from detection" : "from end of speech"} · ${KIND_LABEL[r.kind] || r.kind}</span>${(r.cites || []).map(c => html`<span key=${c.source + c.title} className="quote">${c.url ? html`<a className="cs-link" href=${c.url}>${c.source}, ${c.title}</a>` : `${c.source}, ${c.title}`}, ${c.published}</span>`)}</td>
                <td>${r.boundary}</td>
                <td>${r.placement}</td>
                <td>${marks.length === 0 ? "no samples on this clock" : over.length === 0 ? "every step under" : `over at ${over.map(m => `${m.step} p${m.percentile} ${fmtS(m.value_ms)}`).join(", ")}`}</td>
              </tr>`;
            })}
          </tbody>

    <//>`;
}

// PhaseTable: the shape of each step over its own duration.
function PhaseTable({ rep }) {
  const rows = sel.phases(rep);
  if (rows.length === 0) return null;
  const label = { steady: "held steady", drifting: "got slower", settling: "got faster",
                  unknown: "too short to tell" };
  return html`
    <${Section} eyebrow="PHASE SHAPE" title="What each phase did over its own duration"
      lede="Each step is split in half by when its calls started, and the two halves are compared. A step whose load never changed but whose median did is drifting, and drift is the one failure a single percentile for the whole step cannot show."
      note=${"The comparison is made on the median rather than p95. A half-step carries half the samples, and a p95 over a dozen turns is one unlucky call rather than a trend. \"Too short to tell\" is not a synonym for steady: it means the step never ran long enough to have a shape."}
      reading=${readPhases(rows)}>
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Phase</th><th>Held</th><th>First half</th><th>Second half</th>
            <th>Change</th><th>Reading</th>
          </tr></thead>
          <tbody>
            ${rows.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}</td>
                <td>${s.phase.kind}</td>
                <td>${s.phase.held_s > 0 ? Math.round(s.phase.held_s) + "s" : "-"}</td>
                <td>${s.phase.first_half && s.phase.first_half.n > 0 ? ms(s.phase.first_half.p50_ms) : "-"}</td>
                <td>${s.phase.second_half && s.phase.second_half.n > 0 ? ms(s.phase.second_half.p50_ms) : "-"}</td>
                <td>${s.phase.drift === "unknown" ? "-"
                      : `${s.phase.drift_pct >= 0 ? "+" : ""}${Math.round(s.phase.drift_pct * 100)}%`}</td>
                <td>${label[s.phase.drift] || s.phase.drift}${s.phase.kind === "recovery"
                      ? (s.phase.recovered ? " · back to baseline" : " · did not come back") : ""}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    <//>`;
}

// Timeline: every call's median TTFA on the run's own clock, so a step's shape
// over its duration is seen rather than inferred from two halves. Steps that
// predate timelines are simply absent; a run with none draws nothing.
const wall = s => (s && !String(s).startsWith("0001") ? Date.parse(s) : NaN);
const fmtClock = secs => secs >= 90 ? `${Math.floor(secs / 60)}m${Math.round(secs % 60) ? Math.round(secs % 60) + "s" : ""}` : `${Math.round(secs)}s`;
const timelineSteps = rep => sel.steps(rep).filter(s => s.timeline && s.timeline.length > 0 && !isNaN(wall(s.started_at)));

function readTimeline(steps, rep) {
  const rec = steps.find(s => s.phase && s.phase.kind === "recovery");
  // A step's drift, read off its own points: the median of the last third
  // against the first third of its timed calls.
  const med = a => { const v = a.slice().sort((x, y) => x - y); return v.length ? v[Math.floor(v.length / 2)] : 0; };
  const drift = s => {
    const v = s.timeline.filter(p => p.ttfa_ms > 0).map(p => p.ttfa_ms);
    if (v.length < 6) return null;
    const k = Math.floor(v.length / 3);
    const a = med(v.slice(0, k)), b = med(v.slice(v.length - k));
    return a > 0 ? { s, from: a, to: b, ratio: b / a } : null;
  };
  const drifts = steps.map(drift).filter(Boolean);
  const worst = drifts.reduce((a, d) => (!a || d.ratio > a.ratio ? d : a), null);
  const secs = s => (wall(s.ended_at) - wall(s.started_at)) / 1000;
  if (rec && rec.phase.back_to_normal) {
    const after = rec.phase.back_to_normal_after_s || 0;
    return {
      verdict: after > 0
        ? html`<b>It came back ${fmtClock(after)} after the load dropped.</b> ${rec.name} returned to the baseline's concurrency and its calls were back at the baseline's pace from that point on.`
        : html`<b>It was back to normal from the first call after the load dropped.</b> ${rec.name} returned to the baseline's concurrency and never showed the peak had happened.`,
      why: html`Each dot is one call's median wait, placed when the call started. A recovery step that comes back is one whose late dots sit where the baseline's do; the time it took to get there is the real recovery time, and it belongs in the runbook.`,
      act: after > 30
        ? html`<b>${fmtClock(after)} is long enough to matter.</b> Look for what was still draining: retries, a queue, connections never closed.`
        : after > 0 ? html`Nothing to fix here; ${fmtClock(after)} is within a queue draining.`
        : html`Nothing to fix here. Lengthen the peak before trusting it: a peak that leaves nothing behind may simply have been short.`,
    };
  }
  if (rec) {
    return {
      verdict: html`<b>It did not come back.</b> ${rec.name} ran ${fmtClock(secs(rec))} at the baseline's concurrency and its calls never returned to the baseline's pace.`,
      why: html`Each dot is one call's median wait, placed when the call started. After the peak, the dots should fall back to where the baseline's sit; here they did not, so whatever the load did to this agent outlasted the load.`,
      act: html`<b>Check what the peak left behind.</b> Retries still draining, a queue still full, or connections never closed. Extend the recovery phase: if it comes back after five minutes, that is the recovery time.`,
    };
  }
  if (worst && worst.ratio >= 1.15) {
    return {
      verdict: html`<b>${worst.s.name} got slower across its own ${fmtClock(secs(worst.s))}.</b> Its calls' median wait moved from ${ms(worst.from)} early in the step to ${ms(worst.to)} late in it, at a load that never changed.`,
      why: html`Each dot is one call's median wait, placed when the call started, so a step whose dots climb while its band stays the same width is drifting. That is a leak, a filling queue or a cache going cold, and none of them show in one percentile for the whole step.`,
      act: html`<b>Look for something that accumulates.</b> A run slower at its end than its start under identical load is not a capacity problem; adding capacity only makes the same failure take longer to appear.`,
    };
  }
  return {
    verdict: html`<b>Every step kept its shape.</b> Across ${fmtClock((Math.max(...steps.map(s => wall(s.ended_at))) - Math.min(...steps.map(s => wall(s.started_at)))) / 1000)} of calls, no step's late calls were slower than its early ones.`,
    why: html`Each dot is one call's median wait, placed when the call started. A step whose dots stay level from its first call to its last was the same thing from start to finish, which is what every other figure on this page quietly assumes.`,
    act: html`Lengthen the longest step before trusting that: leaks are measured in hours.`,
  };
}

function Timeline({ rep }) {
  const steps = timelineSteps(rep);
  if (steps.length === 0) return null;
  const pts = steps.flatMap(s => s.timeline.map(p => ({ ...p, step: s, t: wall(p.at) })).filter(p => !isNaN(p.t)));
  const t0 = Math.min(...steps.map(s => wall(s.started_at)));
  const t1 = Math.max(...steps.map(s => wall(s.ended_at) || wall(s.started_at)), ...pts.map(p => p.t));
  const W = 640, H = 246, L = 50, R = 14, TOP = 40, BASE = 206;
  const x = t => L + ((t - t0) / Math.max(t1 - t0, 1)) * (W - L - R);
  const base = steps.find(s => s.name === rep.baseline) || sel.steps(rep).find(s => s.name === rep.baseline) || steps[0];
  const fail = base && base.ttfa ? base.ttfa.p95_ms * 2 : 0;
  const max = Math.max(100, fail, ...pts.map(p => p.ttfa_ms || 0)) * 1.15;
  const y = v => BASE - (v / max) * (BASE - TOP);
  const total = (t1 - t0) / 1000;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * total);
  // Dots from a step the harness could not pace measure the load generator as
  // much as the agent, and the card must say so before anyone reads them.
  const degraded = steps.filter(s => s.harness_degraded);
  const note = degraded.length > 0 ? html`<b>Suspect.</b> ${degraded.length === steps.length ? "Every step" : degraded.map(s => s.name).join(", ")} drifted
    past the 100ms pacing limit (worst ${ms(Math.max(...degraded.map(s => s.worst_harness_drift_ms || 0)))}), so these dots measure the
    load generator as much as the agent. The shapes are real; the heights are not to be trusted.` : null;
  return html`
    <${Section} eyebrow="TIMELINE" title="Every call on the run's own clock"
      lede="One dot per call: its median time to first audio, placed when the call started. Each band is a step. Read a band left to right for what happened while the load held; read a recovery band for how long the agent took to come back."
      note=${note} noteKind="warning" reading=${readTimeline(steps, rep)}>
      <div className="chart">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label=${"Median TTFA per call over " + fmtClock(total) + ", " + steps.map(s => `${s.name} ${s.timeline.length} calls`).join(", ")}>
          ${steps.map((s, i) => {
            const a = x(wall(s.started_at)), b = x(wall(s.ended_at) || wall(s.started_at));
            // Labels clip to their own band and alternate between two rows, so
            // a short step beside a long one still reads.
            const clip = `tl-${i}`;
            return html`<g key=${s.name}>
              <clipPath id=${clip}><rect x=${a} y="0" width=${Math.max(b - a, 2)} height=${H}/></clipPath>
              <rect x=${a} y=${TOP - 24} width=${Math.max(b - a, 2)} height=${BASE - TOP + 24} fill=${i % 2 ? "var(--cs-surface-detail)" : "var(--cs-canvas)"}/>
              <text clipPath=${`url(#${clip})`} x=${a + 3} y=${i % 2 ? TOP - 3 : TOP - 14} fontSize="9.5" fill="var(--cs-text-secondary)">${s.name}${s.phase && s.phase.kind && s.phase.kind !== "ramp" ? ` · ${s.phase.kind}` : ""}</text>
            </g>`;
          })}
          ${steps.map(s => {
            // Drawn after every band so the label is never painted under the
            // band that follows a short recovery step.
            if (!(s.phase && s.phase.kind === "recovery" && s.phase.back_to_normal)) return null;
            const back = x(wall(s.started_at) + (s.phase.back_to_normal_after_s || 0) * 1000);
            return html`<g key=${"back-" + s.name}>
              <line x1=${back} y1=${TOP} x2=${back} y2=${BASE} stroke="var(--cs-olive)" strokeWidth="1.5" strokeDasharray="4 3"/>
              <text x=${back + 4} y=${BASE - 6} fontSize="10" fill="var(--cs-success-text)">back to normal · ${s.phase.back_to_normal_after_s > 0 ? fmtClock(s.phase.back_to_normal_after_s) : "from the first call"}</text>
            </g>`;
          })}
          ${fail > 0 && html`<g>
            <line x1=${L} y1=${y(fail)} x2=${W - R} y2=${y(fail)} stroke="var(--cs-chart-target)" strokeDasharray="4 5"/>
            <text x=${L + 4} y=${y(fail) - 4} fontSize="10" fill="var(--cs-chart-target)">2× baseline p95</text>
            <line x1=${L} y1=${y(base.ttfa.p95_ms)} x2=${W - R} y2=${y(base.ttfa.p95_ms)} stroke="var(--cs-chart-target)" strokeDasharray="2 5" opacity=".7"/>
            <text x=${L + 4} y=${y(base.ttfa.p95_ms) - 4} fontSize="10" fill="var(--cs-chart-target)" opacity=".9">baseline p95</text>
          </g>`}
          ${pts.map((p, i) => p.ttfa_ms > 0
            ? html`<circle key=${i} cx=${x(p.t)} cy=${y(p.ttfa_ms)} r="2.6" fill=${p.failed ? "var(--cs-danger-text)" : "var(--cs-chart-primary)"} opacity=".75">
                <title>${`${p.step.name} · ${new Date(p.t).toLocaleTimeString()} · median ${ms(p.ttfa_ms)}${p.failed ? " · a turn failed" : ""}`}</title>
              </circle>`
            : html`<text key=${i} x=${x(p.t)} y=${BASE - 2} fontSize="10" textAnchor="middle" fill="var(--cs-danger-text)"><title>${`${p.step.name} · ${new Date(p.t).toLocaleTimeString()} · no timed turn`}</title>✕</text>`)}
          <line x1=${L} y1=${BASE} x2=${W - R} y2=${BASE} stroke="var(--cs-border-strong)"/>
          ${ticks.map(s => html`<text key=${s} x=${x(t0 + s * 1000)} y=${BASE + 14} fontSize="10" textAnchor=${s === 0 ? "start" : s === total ? "end" : "middle"} fill="var(--cs-text-caption)">${fmtClock(s)}</text>`)}
          <text x=${L - 6} y=${y(max / 1.15) + 4} fontSize="10" textAnchor="end" fill="var(--cs-text-caption)">${fmtS(max / 1.15)}</text>
          <text x=${L - 6} y=${BASE + 4} fontSize="10" textAnchor="end" fill="var(--cs-text-caption)">0</text>
          <text x=${W / 2} y=${H - 4} fontSize="10" textAnchor="middle" fill="var(--cs-text-caption)">time since the first call</text>
        </svg>
      </div>
      <div className="legend">
        <span><i style=${{background:"var(--cs-chart-primary)",borderRadius:"50%"}}></i>one call, median wait</span>
        <span><i style=${{background:"var(--cs-danger-text)",borderRadius:"50%"}}></i>a turn in it failed</span>
        <span>✕ no timed turn</span>
        <span><i style=${{background:"var(--cs-olive)"}}></i>back to normal</span>
      </div>
    <//>`;
}

// Harness event integrity: did the pipeline carrying the calls deliver them?
function IntegrityCard({ rep }) {
  const integrity = rep.integrity;
  const d = integrity && integrity.dispatch;
  const te = integrity && integrity.turn_events;
  if (!d && !te) {
    return html`<${Section} eyebrow="HARNESS EVENT INTEGRITY" title="No pipeline to check on this run"
      note=${html`This run placed its calls in this process and published no turn events, so there was no
        dispatch that could lose or duplicate a call. Run with <b>-distributed</b> to check the
        fleet's delivery, or add <b>-kafka</b> to count turn events. This card checks
        Callstorm's own pipeline, not the target's webhooks, which Callstorm does not receive.`}/>`;
  }
  return html`
    <${Section} eyebrow="HARNESS EVENT INTEGRITY" title="Did every call come back exactly once?"
      reading=${readIntegrity(d, te)}>
      ${d && html`<div>
        <dl className="spec">
          <div><dt>Dispatched</dt><dd>${d.dispatched}</dd></div>
          <div><dt>Came back</dt><dd>${d.received}</dd></div>
          <div><dt>Duplicates dropped</dt><dd>${d.duplicates}</dd></div>
          <div><dt>Never came back</dt><dd>${d.missing}</dd></div>
          <div><dt>Arrived late</dt><dd>${d.late}</dd></div>
        </dl>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Dispatched</th><th>Came back</th><th>Duplicates</th><th>Missing</th><th>Late from earlier</th></tr></thead>
            <tbody>
              ${(d.steps || []).map(s => html`
                <tr key=${s.step}>
                  <td>${s.step}</td><td>${s.dispatched}</td><td>${s.received}</td>
                  <td>${s.duplicates}</td><td>${s.missing}</td><td>${s.late}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>`}
      ${te && html`
        <dl className="spec">
          <div><dt>Turn events published</dt><dd>${te.published}</dd></div>
          <div><dt>Turn events dropped</dt><dd>${te.dropped}</dd></div>
          ${te.last_error && html`<div><dt>Last error</dt><dd>${te.last_error}</dd></div>`}
        </dl>`}
    <//>`;
}

// The grid itself: every cohort crossed with every step. Drawn in the tab and
// again in the drawer, so it lives apart from either card.
function HeatGrid({ m, metric }) {
  const [, label, get, fmt] = metric;
  const steps = m.cohorts[0].steps || [];
  const values = m.cohorts.flatMap(c => (c.steps || []).map(get)).filter(v => v > 0);
  const top = Math.max(...values, 0);
  // Anchored so small differences do not saturate the scale: latency runs from
  // zero to at least a second, the ratio from parity to at least 2.5x.
  const intensity = v => metric[0] === "vs_clean"
    ? Math.min(Math.max((v - 1) / Math.max(top - 1, 1.5), 0), 1)
    : Math.min(v / Math.max(top, 1000), 1);
  const fill = t => `color-mix(in srgb, var(--cs-chart-primary) ${Math.round(6 + t * 82)}%, var(--cs-surface))`;
  return html`
    <${Frag}>
      <div className="tablewrap">
        <table className="heat">
          <thead><tr>
            <th>Network</th>
            ${steps.map(s => html`<th key=${s.name}>${s.name} · ${s.concurrency}</th>`)}
            <th>Breaks at</th>
          </tr></thead>
          <tbody>
            ${m.cohorts.map(c => html`
              <tr key=${c.impairment.name}>
                <td><b>${c.impairment.name}</b><span className="quote">${describeNet(c.impairment)}</span></td>
                ${(c.steps || []).map(s => {
                  const v = get(s);
                  const t = v > 0 ? intensity(v) : 0;
                  return html`<td key=${s.name} className="hm"
                      style=${{background: v > 0 ? fill(t) : "transparent"}}
                      title=${`${c.impairment.name} · ${s.name} at ${s.concurrency} concurrent: p95 ${ms(s.ttfa && s.ttfa.p95_ms)}${s.vs_clean ? `, ${s.vs_clean.toFixed(2)}× clean` : ""}, ${s.verdict}`}>
                    ${v > 0 ? fmt(v) : "-"}${s.verdict === "fail" ? " ✕" : ""}
                  </td>`;
                })}
                <td>${c.breakpoint || "held"}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
      <div className="bandkey">
        <span>${label}: lighter is lower</span>
        <span className="ramp" aria-hidden="true"></span>
        <span>✕ failed against the clean baseline</span>
      </div>
    <//>`;
}

function MetricPicker({ picked, onPick }) {
