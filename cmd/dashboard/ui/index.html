// Per-node pass rates: which part of the conversation gave way.
function NodeScores({ rep }) {
  const [picked, setPicked] = useState(null);
  const ns = nodeSummary(rep);
  if (!ns.worstView) {
    return html`<${Section} eyebrow="SCENARIO NODES" title="No node was scored"
      note=${ns.anyNodes
        ? html`The scenario names its nodes but none of them carries an <code>expect</code>, so there is nothing to pass or fail. Add <code>"expect": { "said_any": [...] }</code> to the turns that matter.`
        : "This run predates per-node scoring. Runs placed from this version onward record which node every turn spoke."}/>`;
  }
  const view = ns.views.find(v => v.name === picked) || ns.worstView;
  const steps = view.steps.filter(s => (s.nodes || []).length > 0);
  const order = (steps[0] && steps[0].nodes || []).map(n => n.node);
  const worst = ns.worstOf(view);

  return html`
    <${Section} eyebrow="SCENARIO NODES" title="Which part of the conversation gave way"
      reading=${readNodes(worst, view)}>
      ${ns.views.length > 1 && html`
        <div className="seg" role="group" aria-label="Cohort">
          ${ns.views.map(v => html`
            <button key=${v.name} aria-pressed=${String(v === view)} onClick=${() => setPicked(v.name)}>
              ${v.name}${v === ns.worstView ? " · worst" : ""}
            </button>`)}
        </div>`}
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Node</th>
            ${steps.map(s => html`<th key=${s.name}>${s.name} · ${s.concurrency}</th>`)}
          </tr></thead>
          <tbody>
            ${order.map(id => html`
              <tr key=${id}>
                <td>${id}</td>
                ${steps.map(s => {
                  const n = s.nodes.find(x => x.node === id);
                  if (!n || n.visits === 0) return html`<td key=${s.name} className="dim">not reached</td>`;
                  if (n.checked === 0) return html`<td key=${s.name} className="dim">${n.visits} visits</td>`;
                  return html`<td key=${s.name} title=${n.miss || ""}
                      className=${n.pass_rate < 1 ? "fail-text" : ""}>${pct(n.pass_rate)} · ${n.passed}/${n.checked}</td>`;
                })}
              </tr>`)}
          </tbody>
        </table>
      </div>
    <//>`;
}

// WERStrip: every judged call as a dot, placed by how badly the agent misheard
// it, in two lanes for whether it finished the job.
function WERStrip({ calls, threshold }) {
  const pts = calls.filter(c => c.judged && c.ref_words > 0);
  if (pts.length === 0) return null;

  const W = 640, H = 132, LEFT = 128, RIGHT = 18, TOP = 26;
  const max = Math.max(0.1, threshold * 2, ...pts.map(c => c.wer)) * 1.12;
  const x = w => LEFT + (w / max) * (W - LEFT - RIGHT);
  const lane = met => TOP + (met ? 16 : 62);

  return html`
    <div className="chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Every judged call by word error rate, in a lane for whether it did the job">
        <text x="0" y=${lane(true) + 4} fontSize="11" fill="var(--cs-success-text)">did the job</text>
        <text x="0" y=${lane(false) + 4} fontSize="11" fill="var(--cs-danger-text)">did not</text>
        <line x1=${LEFT} y1=${lane(true)} x2=${W - RIGHT} y2=${lane(true)} stroke="var(--cs-border)" strokeWidth="1"/>
        <line x1=${LEFT} y1=${lane(false)} x2=${W - RIGHT} y2=${lane(false)} stroke="var(--cs-border)" strokeWidth="1"/>
        <line x1=${x(threshold)} y1=${TOP - 8} x2=${x(threshold)} y2=${H - 22}
          stroke="var(--cs-text-secondary)" strokeWidth="1" strokeDasharray="3 3"/>
        <text x=${x(threshold)} y=${TOP - 13} fontSize="10" textAnchor="middle"
          fill="var(--cs-text-secondary)">${Math.round(threshold * 100)}% — usable</text>
        ${pts.map((c, i) => html`
          <circle key=${c.step + "/" + c.request_id + "/" + i} cx=${x(c.wer)}
            cy=${lane(c.met) + ((i % 3) - 1) * 5} r="5"
            fill=${c.met ? "var(--cs-success-text)" : "var(--cs-danger-text)"} fillOpacity="0.75"
            stroke="var(--cs-surface)" strokeWidth="1.5">
            <title>${c.step + " misheard " + (c.wer * 100).toFixed(1) + "% of " + c.ref_words +
                     " words, and " + (c.met ? "completed the task" : "did not")}</title>
          </circle>`)}
        <line x1=${LEFT} y1=${H - 18} x2=${W - RIGHT} y2=${H - 18} stroke="var(--cs-border-strong)" strokeWidth="1"/>
        <text x=${LEFT} y=${H - 5} fontSize="10" fill="var(--cs-text-caption)">0%</text>
        <text x=${W - RIGHT} y=${H - 5} fontSize="10" textAnchor="end"
          fill="var(--cs-text-caption)">${(max * 100).toFixed(0)}% of words misheard</text>
      </svg>
    </div>`;
}

// The two groups the heard-versus-done split compares, for the evidence card
// and the task view both.
function HeardDoneTable({ x }) {
  return html`
    <div className="tablewrap">
      <table>
        <thead><tr><th>Group</th><th>Calls</th><th>Did the job</th><th>Rate</th></tr></thead>
        <tbody>
          <tr>
            <td>Heard cleanly (under ${Math.round((x.threshold || 0.05) * 100)}% misheard)</td>
            <td>${x.clean_calls}</td><td>${x.clean_passed}</td>
            <td>${x.clean_calls > 0 ? pct(x.clean_pass_rate) : "-"}</td>
          </tr>
          <tr>
            <td>Misheard</td>
            <td>${x.misheard_calls}</td><td>${x.misheard_passed}</td>
            <td>${x.misheard_calls > 0 ? pct(x.misheard_pass_rate) : "-"}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

const UNJUDGED = html`Every number elsewhere on this page says how the agent sounded. None of them says whether it did the job.
  Re-run with <code>-judge</code> and a scenario that defines <code>success_criteria</code>,
  and this card grades each conversation against them and then asks whether the calls it
  misheard are the calls it failed.`;

// TaskSuccessCard answers the question the latency half cannot: the agent was
// fast, but did it do what it was called to do?
function TaskSuccessCard({ rep }) {
  const judge = rep.judge;
  if (!judge) {
    return html`<${Section} eyebrow="TASK SUCCESS" title="This run was not judged" note=${UNJUDGED}/>`;
  }
  const x = judge.correlation || {};
  const calls = judge.calls || [];
  const misses = (judge.misses || []).filter(m => m.judged > 0);

  return html`
    <${Section} eyebrow="TASK SUCCESS" title="Did it actually do the job?"
      note="The grader reads the transcript and nothing else, so it can only decide what words show. Anything about timing, pauses or whether the agent stopped when interrupted is measured directly elsewhere on this page — a judge asked to guess at those from text gives a confident wrong answer. Every verdict here carries the line it was drawn from, because a score nobody can check is the one number here that could be wrong unnoticed."
      reading=${readTaskSuccess(judge)}>
      <dl className="spec">
        <div><dt>Conversations graded</dt><dd>${judge.judged}</dd></div>
        <div><dt>Met every criterion</dt><dd>${judge.passed} of ${judge.judged}</dd></div>
        <div><dt>Could not be graded</dt><dd>${judge.errored}</dd></div>
        <div><dt>Graded by</dt><dd>${judge.backend || "unknown"}</dd></div>
      </dl>

      ${misses.length > 0 && html`
        <div className="tablewrap">
          <table>
            <thead><tr><th>Criterion</th><th>Met</th><th>Missed</th></tr></thead>
            <tbody>
              ${misses.map(m => html`
                <tr key=${m.criterion} className="crit">
                  <td>${m.criterion}${m.missed > 0 && m.evidence
                        ? html`<span className="quote">${m.evidence}</span>` : ""}</td>
                  <td>${m.judged - m.missed}</td>
                  <td>${m.missed}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>`}

      ${x.calls > 0 && html`
        <div className="subblock">
          <span className="eyebrow">HEARD VERSUS DONE</span>
          <h4 className="sub tight">Are the calls it misheard the calls it failed?</h4>
          <${WERStrip} calls=${calls} threshold=${x.threshold || 0.05}/>
          <${HeardDoneTable} x=${x}/>
        </div>`}
    <//>`;
}

// The call log: every graded conversation, criterion by criterion, with the
// line the judge decided on. A verdict nobody can check is an oracle.
function CallLog({ rep, id }) {
  const judge = rep.judge;
  if (!judge) return null;
  const log = judge.judgements || [];
  const wer = new Map((judge.calls || []).map(c => [c.step + "/" + c.request_id, c]));
  if (log.length === 0) {
    return html`<${Section} eyebrow="CALL LOG" title="Per-call judgements were not kept in this report"
      note=${html`This run's report carries the judge's totals but not each call's verdicts. Runs judged from this
        version onward keep them, and the full transcript of every call is in
        <code>${id}-calls.jsonl</code> beside the report.`}/>`;
  }
  return html`
    <${Section} eyebrow="CALL LOG" title=${`${log.length} graded conversations`}
      lede=${html`One entry per judged call, with the turn each verdict was drawn from. The full transcript of
        every call, turn by turn with its timings, is in <code>${id}-calls.jsonl</code> beside the report.`}>
      <div className="calllog">
        ${log.map((c, i) => {
          const met = c.outcomes.filter(o => o.met).length;
          const all = met === c.outcomes.length;
          const w = wer.get(c.step + "/" + c.request_id);
          return html`
            <details key=${c.step + "/" + c.request_id + "/" + i} className="call" open=${!all}>
              <summary>
                <span className="call-id">${c.step} · ${String(c.request_id).slice(0, 8)}</span>
                <span className=${"cs-badge " + (all ? "cs-badge-success" : "cs-badge-danger")}>${all ? "did the job" : `missed ${c.outcomes.length - met} of ${c.outcomes.length}`}</span>
                ${w && w.ref_words > 0 && html`<span className="call-wer">misheard ${(w.wer * 100).toFixed(1)}% of ${w.ref_words} words</span>`}
              </summary>
              <ol className="outcomes">
                ${c.outcomes.map((o, k) => html`
                  <li key=${k} className=${o.met ? "met" : "missed"}>
                    <span className="mark" aria-hidden="true">${o.met ? "✓" : "✕"}</span>
                    <div>
                      <div>${o.criterion}</div>
                      ${o.evidence && html`<div className="utterance">${o.evidence}</div>`}
                      ${o.reasoning && html`<div className="reasoning">${o.reasoning}</div>`}
                    </div>
                  </li>`)}
              </ol>
            </details>`;
        })}
      </div>
    <//>`;
}

// ---- Call logs --------------------------------------------------------------
// The calls file beside the report: every turn's words and instants, one call
// per line. Every number on the page is computed from these turns; this is
// where a reader checks what the agent did with what it heard.
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
// A target that returns no transcript of the caller leaves heard_text empty;
// that is "not heard", not "heard as nothing".
const hasHeard = t => t.heard_text !== undefined && t.heard_text !== null && t.heard_text !== "";
const misheard = t => hasHeard(t) && norm(t.heard_text) !== norm(t.caller_text);
const shortId = id => String(id || "").slice(0, 8);
const turnsOf = c => c.turns || [];
// A measured round trip can be a real zero, so the flag decides. Files written
// before the writer stopped omitting zeros carry the flag with no number: on
// Windows the clock reads many loopback round trips as exactly 0, and that is
// what the missing number means.
const rttOf = t => t.transport_rtt_measured ? (typeof t.transport_rtt_ms === "number" ? t.transport_rtt_ms : 0)
  : (t.transport_rtt_ms > 0 ? t.transport_rtt_ms : null);

// Wall-clock time for each side of a turn. The caller's line starts at the
// turn's own started_at (or the call's start plus caller_start_ms); the agent's
// reply starts at first_audio_ms on the call's clock, or, on files without the
// raw instants, at the caller's start plus their speech plus the wait.
const clockText = t => new Date(t).toLocaleTimeString();
const callerAt = (callStart, t) => {
  const s = wall(t.started_at);
  if (!isNaN(s)) return clockText(s);
  const c = wall(callStart);
  return !isNaN(c) && typeof t.caller_start_ms === "number" ? clockText(c + t.caller_start_ms) : null;
};
const agentAt = (callStart, t) => {
  if (t.failed) return null;
  const c = wall(callStart);
  if (!isNaN(c) && t.first_audio_ms > 0) return clockText(c + t.first_audio_ms);
  const s = wall(t.started_at);
  return !isNaN(s) && t.ttfa_ms >= 0 ? clockText(s + (t.caller_speech_ms || 0) + t.ttfa_ms) : null;
};

function filterCalls(calls, step, cohort, query) {
  const q = norm(query);
  return calls.filter(c => (!step || c.step === step) && (!cohort || c.cohort === cohort) &&
    (!q || String(c.request_id).includes(query.trim()) || norm(c.error).includes(q) ||
      turnsOf(c).some(t => norm(t.caller_text).includes(q) || norm(t.agent_text).includes(q) || norm(t.heard_text).includes(q))));
}

// Which criterion verdicts quote which turn of which call.
function judgeIndex(judge) {
  const byCall = new Map();
  for (const j of (judge && judge.judgements) || []) {
    const turns = new Map();
    for (const o of j.outcomes || []) {
      const m = /^turn (\d+)/.exec(o.evidence || "");
      const n = m ? Number(m[1]) : 0;
      if (!turns.has(n)) turns.set(n, []);
      turns.get(n).push(o);
    }
    byCall.set(j.step + "/" + j.request_id, { outcomes: j.outcomes || [], turns });
  }
  return byCall;
}

function readCalls(calls) {
  const turns = calls.flatMap(c => turnsOf(c).map(t => ({ ...t, step: c.step, request_id: c.request_id })));
  const never = calls.filter(c => c.error);
  const failed = turns.filter(t => t.failed);
  const heard = turns.filter(hasHeard);
  const wrong = heard.filter(misheard);
  const dead = turns.filter(t => !t.failed && t.ttfa_ms > 2000);
  const barged = turns.filter(t => t.barged_in);
  const missed = turns.filter(t => t.expect_checked && !t.expect_met);
  const slowest = turns.filter(t => !t.failed && t.ttfa_ms > 0).reduce((a, t) => (!a || t.ttfa_ms > a.ttfa_ms ? t : a), null);
  return {
    verdict: html`<b>${calls.length} calls and ${turns.length} turns, in full.</b> ${never.length ? `${never.length} call${never.length === 1 ? "" : "s"} never connected, ` : ""}${failed.length} turn${failed.length === 1 ? "" : "s"} failed${heard.length ? `, ${wrong.length} ${wrong.length === 1 ? "was" : "were"} heard differently from what the caller said` : ""}${dead.length ? `, ${dead.length} left the line silent past two seconds` : ""}${missed.length ? `, ${missed.length} ${missed.length === 1 ? "reply" : "replies"} missed what the scenario expected` : ""}.`,
    why: html`Every number on this page is computed from these turns. A percentile says how slow a turn was; the transcript says what the agent did with what it heard. ${heard.length
      ? html`<${Frag}>Where the agent's transcript of the caller differs from the script, the caller's line shows it as <em>heard as</em>: those are the words the agent actually acted on.<//>`
      : "This target returned no transcript of the caller, so only the caller's own script is shown."}${barged.length ? ` ${barged.length} turn${barged.length === 1 ? "" : "s"} cut in while the agent was speaking; each shows how long it kept talking.` : ""}`,
    act: slowest
      ? html`<b>Start with the slowest turn</b>: ${slowest.step}, call ${shortId(slowest.request_id)}, turn ${slowest.turn}, ${ms(slowest.ttfa_ms)} to first audio. Search a phrase to find every call that said it.`
      : html`Search a phrase to find every call that said it.`,
  };
}

function Transcripts({ calls, judge, step, cohort, query, selected, onSelect, limit, onMore }) {
  const jx = judgeIndex(judge);
  const shown = filterCalls(calls, step, cohort, query);
  if (shown.length === 0) {
    return html`<div className="cs-notice">No call matches${step ? ` in ${step}` : ""}${cohort ? ` on ${cohort}` : ""}${query ? ` for "${query}"` : ""}. Clear the filters to see all ${calls.length}.</div>`;
  }
  return html`
    <div className="transcripts">
      <p className="quiet">${shown.length} of ${calls.length} calls${step ? ` · ${step}` : ""}${cohort ? ` · ${cohort}` : ""}${query ? ` · matching "${query}"` : ""}</p>
      ${shown.slice(0, limit).map((c, i) => {
        const key = c.step + "/" + (c.cohort || "") + "/" + c.request_id;
        const j = jx.get(c.step + "/" + c.request_id);
        const met = j ? j.outcomes.filter(o => o.met).length : 0;
        const turns = turnsOf(c);
        const failed = turns.filter(t => t.failed).length;
        const worst = turns.filter(t => !t.failed).reduce((a, t) => Math.max(a, t.ttfa_ms || 0), 0);
        const began = wall(c.started_at), ended = wall(c.ended_at);
        const when_ = !isNaN(began) ? `${new Date(began).toLocaleTimeString()}${!isNaN(ended) ? ` · ${fmtClock((ended - began) / 1000)}` : ""}` : "";
        return html`
          <details key=${key} className="call" open=${i === selected}
                   onToggle=${e => { if (e.target.open) onSelect(i); else if (i === selected) onSelect(-1); }}>
            <summary>
              <span className="call-id">${c.step}${c.cohort ? ` · ${c.cohort}` : ""} · ${shortId(c.request_id)}${when_ ? ` · ${when_}` : ""}</span>
              ${c.error
                ? html`<span className="cs-badge cs-badge-danger">never connected</span>`
                : html`<span className="call-meta">${turns.length} turns · slowest ${ms(worst)}${failed ? ` · ${failed} failed` : ""}</span>`}
              ${j
                ? html`<span className=${"cs-badge " + (met === j.outcomes.length ? "cs-badge-success" : "cs-badge-danger")}>${met === j.outcomes.length ? "did the job" : `missed ${j.outcomes.length - met} of ${j.outcomes.length}`}</span>`
                : (judge && judge.judged > 0 && !c.error) ? html`<span className="cs-badge ungraded" title="The judge grades a sample of each step's calls; this call was not in it.">not graded</span>` : ""}
            </summary>
            ${c.error && html`<div className="turns"><div className="utterance failed"><small>CALL FAILED TO SET UP</small>${c.error}</div></div>`}
            <div className="turns">
              ${turns.map(t => html`
                <div key=${t.turn} className="turn">
                  <div className="utterance">
                    <small>CALLER${callerAt(c.started_at, t) ? ` · ${callerAt(c.started_at, t)}` : ""} · TURN ${t.turn}${t.node ? ` · ${t.node}` : ""}${t.branch ? ` · branch ${t.branch}` : ""}${t.caller_speech_ms > 0 ? ` · ${(t.caller_speech_ms / 1000).toFixed(1)}s of speech` : ""}${t.barged_in ? " · cut in while the agent was speaking" : ""}</small>
                    ${t.caller_text}
                    ${misheard(t) && html`<div className="heard">heard as: “${t.heard_text}”</div>`}
                  </div>
                  <div className=${"utterance agent" + (t.failed ? " failed" : "")}>
                    <small>AGENT${agentAt(c.started_at, t) ? ` · ${agentAt(c.started_at, t)}` : ""}${t.failed ? "" : ` · ${ms(t.ttfa_ms)} to first audio`}${t.endpointing_ms > 0 ? ` · endpointing ${ms(t.endpointing_ms)} · think/speak ${ms(t.think_speak_ms)}` : ""}${rttOf(t) !== null ? ` · round trip ${ms(rttOf(t))}` : ""}${t.agent_speech_ms > 0 ? ` · spoke ${(t.agent_speech_ms / 1000).toFixed(1)}s` : ""}${t.barged_in ? (t.barge_in_yield_ms > 0 ? ` · yielded in ${ms(t.barge_in_yield_ms)}` : " · never yielded") : ""}${!t.failed && t.ttfa_ms > 2000 ? " · dead air" : ""}</small>
                    ${t.failed
                      ? html`<span className="turn-fail">✕ No reply${t.fail_reason ? `: ${t.fail_reason}` : ""}</span>`
                      : (t.agent_text || html`<em>(no words)</em>`)}
                    ${t.expect_checked && !t.expect_met && html`<div className="turn-fail expect">✕ Expected reply not met${t.expect_miss ? `: ${t.expect_miss}` : ""}</div>`}
                    ${t.started_at && !isNaN(wall(t.started_at)) && (t.first_audio_ms > 0 || t.caller_end_ms > 0) && html`<div className="instants">${[
                      t.caller_start_ms >= 0 && `caller spoke ${(t.caller_start_ms / 1000).toFixed(2)}–${(t.caller_end_ms / 1000).toFixed(2)}s`,
                      t.heard_ms > 0 && `transcript at ${(t.heard_ms / 1000).toFixed(2)}s`,
                      t.first_audio_ms > 0 && `first audio at ${(t.first_audio_ms / 1000).toFixed(2)}s`,
                      t.playout_end_ms > 0 && `playout ended ${(t.playout_end_ms / 1000).toFixed(2)}s`,
                    ].filter(Boolean).join(" · ")} · on the call's clock</div>`}
                    ${j && j.turns.has(t.turn) && html`
                      <ul className="judged-lines">
                        ${j.turns.get(t.turn).map((o, k) => html`<li key=${k} className=${o.met ? "met" : "missed"}><span className="mark" aria-hidden="true">${o.met ? "✓" : "✕"}</span><span>${o.criterion}${o.reasoning && html`<span className="reasoning">${o.reasoning}</span>`}</span></li>`)}
                      </ul>`}
                  </div>
                </div>`)}
            </div>
            <${EventLog} events=${c.events}/>
          </details>`;
      })}
      ${shown.length > limit && html`<button className="outline more-calls" onClick=${onMore}>Show ${Math.min(30, shown.length - limit)} more · ${shown.length - limit} remaining</button>`}
    </div>`;
}

// The call's own event log, on its clock: every instant the harness stamped,
// in order, for a reader who wants the raw record behind a turn's timings.
function EventLog({ events }) {
  if (!events || events.length === 0) return null;
  return html`
    <details className="events">
      <summary>${events.length} events on the call's clock</summary>
      <div className="tablewrap">
        <table className="eventlog">
          <thead><tr><th>At</th><th>Event</th><th>Turn</th><th>Detail</th></tr></thead>
          <tbody>
            ${events.map((e, k) => html`
              <tr key=${k}>
                <td>${(e.t_ms / 1000).toFixed(3)}s</td>
                <td>${e.kind}</td>
                <td>${e.turn ? e.turn : ""}</td>
                <td>${e.text || ""}${e.bytes ? `${e.text ? " · " : ""}${e.bytes} bytes` : ""}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    </details>`;
}

// One representative slow turn: the slowest completed turn of the selected
// step, drawn from the calls file with its real stage durations. Stage
// durations describe this turn, not summed percentiles.
function SlowTurn({ rep, calls, step, onOpenCall }) {
  const steps = sel.steps(rep);
  const [selected, setSelected] = useState(step && step.name);
  const s = steps.find(x => x.name === selected) || step || steps[0];
  return html`<div className="slow-turn-selection">
    <label className="stage-picker">Calls at the same time
      <select className="cs-input" aria-label="Slow turn concurrency" value=${s ? s.name : ""} onChange=${e => setSelected(e.target.value)}>
        ${steps.map(x => html`<option key=${x.name} value=${x.name}>${x.concurrency} at once · ${x.name}</option>`)}
      </select>
    </label>
    <${SlowTurnDetail} rep=${rep} calls=${calls} step=${s} onOpenCall=${onOpenCall}/>
  </div>`;
}
function SlowTurnDetail({ rep, calls, step: s, onOpenCall }) {
  if (!s) return null;
  const eyebrow = "ONE REPRESENTATIVE SLOW TURN";
  if (calls === undefined) {
    return html`<${Section} eyebrow=${eyebrow} title="Reading the calls file…" note=${EMPTY.loading.why}/>`;
  }
  if (calls === null) {
    return html`<${Section} eyebrow=${eyebrow} title="No calls file for this run" note=${EMPTY.calls.why}/>`;
  }
  const turns = calls.filter(c => c.step === s.name && !c.cohort)
    .flatMap(c => turnsOf(c).filter(t => !t.failed && t.ttfa_ms > 0).map(t => ({ ...t, request_id: c.request_id, call_started_at: c.started_at })));
  if (turns.length === 0) {
    return html`<${Section} eyebrow=${eyebrow} title=${`No completed turn at ${s.name}`}
      note="Every turn recorded for this step failed or was talked over, so there is no reply to time."/>`;
  }
  const t = turns.reduce((a, x) => (x.ttfa_ms > a.ttfa_ms ? x : a));
  const split = t.endpointing_ms > 0;
  const ep = split ? t.endpointing_ms : 0;
  const ts = split ? t.think_speak_ms : t.ttfa_ms;
  const sp = t.agent_speech_ms > 0 ? t.agent_speech_ms : 0;
  const total = t.turn_latency_ms > 0 ? t.turn_latency_ms : t.ttfa_ms + sp;
  const w = v => Math.max((v / total) * 100, 0).toFixed(1) + "%";
  const epShare = split ? ep / t.ttfa_ms : 0;
  const med = s.endpointing && s.endpointing.n > 0 && s.think_speak && s.think_speak.n > 0
    ? `${ms(s.endpointing.p50_ms)} endpointing and ${ms(s.think_speak.p50_ms)} think/speak at the median` : null;

  return html`
    <${Section} eyebrow=${eyebrow} title=${`What happens at ${s.concurrency} concurrent call${s.concurrency === 1 ? "" : "s"}?`}
      lede=${`The slowest completed turn at ${s.name}: ${ms(t.ttfa_ms)} to first audio, against the step's p95 of ${ms(s.ttfa.p95_ms)}. Stage durations describe this turn, not summed percentiles.`}>
      <span className="evidence-label">${s.turns_total} turns · ${s.concurrency} concurrent · call ${shortId(t.request_id)} · turn ${t.turn}</span>
      <div className="trace-bar" role="img" aria-label=${`${split ? `endpointing ${ms(ep)}, think/speak ${ms(ts)}` : `time to first audio ${ms(ts)}`}${sp ? `, agent speaking ${ms(sp)}` : ""}, total ${ms(total)}`}>
        ${split && html`<span style=${{width: w(ep), background: "var(--cs-blue)"}} title="Endpointing"></span>`}
        <span style=${{width: w(ts), background: "var(--cs-lavender)"}} title=${split ? "Think / speak" : "Time to first audio"}></span>
        ${sp > 0 && html`<span style=${{width: w(sp), background: "var(--cs-peach)"}} title="Agent speaking"></span>`}
      </div>
      <div className="legend">
        ${split && html`<span><i style=${{background:"var(--cs-blue)"}}></i>endpointing</span>`}
        <span><i style=${{background:"var(--cs-lavender)"}}></i>${split ? "think / speak" : "time to first audio"}</span>
        ${sp > 0 && html`<span><i style=${{background:"var(--cs-peach)"}}></i>agent speaking</span>`}
      </div>
      <div className="timing">
        ${split && html`<div className="timing-row"><span>Endpointing</span><strong>${ms(ep)}</strong></div>`}
        ${split && html`<div className="timing-row"><span>Think / speak</span><strong>${ms(ts)}</strong></div>`}
        <div className="timing-row"><span>Time to first audio</span><strong>${ms(t.ttfa_ms)}</strong></div>
        ${sp > 0 && html`<div className="timing-row"><span>Agent speaking</span><strong>${ms(sp)}</strong></div>`}
        <div className="timing-row"><span>Total turn</span><strong>${ms(total)}</strong></div>
      </div>
      <div className="transcript">
        <span className="eyebrow">THE TURN</span>
        <div className="turn">
          <div className="utterance">
            <small>CALLER${callerAt(t.call_started_at, t) ? ` · ${callerAt(t.call_started_at, t)}` : ""} · TURN ${t.turn}</small>
            ${t.caller_text}
            ${misheard(t) && html`<div className="heard">heard as: “${t.heard_text}”</div>`}
          </div>
          <div className="utterance agent">
            <small>AGENT${agentAt(t.call_started_at, t) ? ` · ${agentAt(t.call_started_at, t)}` : ""} · ${ms(t.ttfa_ms)} to first audio</small>
            ${t.agent_text || html`<em>(no words)</em>`}
          </div>
        </div>
      </div>
      <details>
        <summary>What to investigate</summary>
        <p>${split
          ? (epShare >= 0.5
            ? `More than half of this wait was the agent noticing the caller had stopped. Endpointing is a configured silence threshold, so a faster model changes nothing here; a shorter threshold does, at the cost of cutting off callers who pause.`
            : `Most of this wait was the reply: the model composing and the voice rendering. That is the half that queues under load, so compare it with the same turn at a lighter step before tuning anything.`)
          : `This target returned no transcript of the caller, so the wait cannot be split into endpointing and think/speak for this turn.`}
          ${med ? ` The step's own shape is ${med}; a single slow turn does not establish the cause, and the component-share card says which half grows with load.` : ""}
          ${t.pacing_drift_ms > 100 ? ` This turn's pacing drifted ${ms(t.pacing_drift_ms)}, so the harness rather than the agent may own part of it.` : ""}</p>
      </details>
      ${onOpenCall && html`<button className="text-button" onClick=${() => onOpenCall(t.request_id)}>Read the whole call in the log <span>↗</span></button>`}
    <//>`;
}

// ---- Cost evidence ----------------------------------------------------------

// Deepgram's published Voice Agent prices, Pay As You Go, as read from
// deepgram.com/pricing on the date below. Deepgram bills the agent by
// WebSocket connection time, so a run that was not given a rate can still be
// priced from each call's own start and end instants.
const DEEPGRAM_PRICING = {
  source: "https://deepgram.com/pricing", fetched: "2026-09-13", plan: "Pay As You Go", basis: "WebSocket connection time",
  tiers: [
    { id: "standard", label: "Standard — Deepgram STT, LLM and TTS", list: 0.075, promo: 0.056, promoUntil: "2026-09-14" },
    { id: "standard-byo-tts", label: "Standard — bring your own TTS", list: 0.065 },
    { id: "custom-byo-llm", label: "Custom — bring your own LLM", list: 0.065, promo: 0.050, promoUntil: "2026-09-14" },
    { id: "custom-byo-llm-tts", label: "Custom — bring your own LLM and TTS", list: 0.050 },
    { id: "advanced", label: "Advanced", list: 0.163, promo: 0.122, promoUntil: "2026-09-14" },
    { id: "advanced-byo-tts", label: "Advanced — bring your own TTS", list: 0.122 },
  ],
};
const tierOf = id => DEEPGRAM_PRICING.tiers.find(t => t.id === id) || DEEPGRAM_PRICING.tiers[0];
// The rate in force on a given day: the promotional one while it lasted.
const rateOn = (tier, date) => (tier.promo && !isNaN(wall(date)) && wall(date) <= Date.parse(tier.promoUntil + "T23:59:59Z")) ? tier.promo : tier.list;

// Price a run from its calls' connection time, in the shape the harness's own
// cost rows take, so the chart and the reading need no second path.
function connectedRows(rep, calls, rate) {
  return sel.steps(rep).map(s => {
    const cs = calls.filter(c => c.step === s.name && !c.cohort && !isNaN(wall(c.started_at)) && !isNaN(wall(c.ended_at)));
    if (cs.length === 0) return null;
    const minutes = cs.reduce((a, c) => a + Math.max(wall(c.ended_at) - wall(c.started_at), 0) / 60000, 0);
    const usd = minutes * rate;
    return { name: s.name, concurrency: s.concurrency, turns_total: s.turns_total, calls: cs.length,
      harness_minutes: (s.cost && s.cost.agent_minutes) || 0,
      cost: { rate_per_minute: rate, agent_minutes: minutes, usd, usd_per_call: usd / cs.length, usd_per_turn: s.turns_total > 0 ? usd / s.turns_total : 0 } };
  }).filter(Boolean);
}
const minutesOf = calls => calls.filter(c => !isNaN(wall(c.started_at)) && !isNaN(wall(c.ended_at)))
  .reduce((a, c) => a + Math.max(wall(c.ended_at) - wall(c.started_at), 0) / 60000, 0);

function costMissing(steps) {
  const priced = steps.some(s => s.cost && s.cost.agent_minutes > 0);
  return priced
    ? html`This run counted ${steps.reduce((a, s) => a + ((s.cost && s.cost.agent_minutes) || 0), 0).toFixed(1)} agent-minutes
           but was not given a rate. Re-run with <b>-rate-per-minute</b> to price it —
           voice agents bill by the minute, so latency is a cost as well as an experience.`
    : html`This run predates cost accounting. Runs placed from this version onward carry
           billable minutes, and <b>-rate-per-minute</b> turns them into dollars.`;
}

function CostCard({ rep, estimate }) {
  const steps = sel.steps(rep);
  const rows = sel.cost(rep);
  if (rows.length < 2 && estimate && estimate.rows.length > 0) {
    const e = estimate, tier = tierOf(e.tier);
    const total = e.rows.reduce((a, r) => a + r.cost.usd, 0), minutes = e.rows.reduce((a, r) => a + r.cost.agent_minutes, 0);
    const harness = e.rows.reduce((a, r) => a + r.harness_minutes, 0), calls = e.rows.reduce((a, r) => a + r.calls, 0);
    return html`
      <${Section} eyebrow="WHAT THE LATENCY COSTS" title="Priced from connection time"
        lede=${html`This run was not given a rate, so it is priced here from each call's own start and end instants at Deepgram's published rate: <b>$${e.rate.toFixed(3)} per minute</b>, ${tier.label}, ${DEEPGRAM_PRICING.plan}${e.rate === tier.promo ? ` (the promotional rate in force on ${day(rep.started_at)}; $${tier.list.toFixed(3)} from ${day(tier.promoUntil + "T12:00:00Z")} on)` : ""}. Deepgram bills the Voice Agent by ${DEEPGRAM_PRICING.basis}; read from <a className="cs-link" href=${DEEPGRAM_PRICING.source}>${DEEPGRAM_PRICING.source.replace("https://", "")}</a> on ${DEEPGRAM_PRICING.fetched}.`}
        note=${html`Connection time runs from the call's WebSocket opening to its close, so it includes call setup, the agent's own speaking and the caller's pauses — which is why it is ${harness > 0 ? `${((minutes / harness - 1) * 100).toFixed(0)}% more than` : "more than"} the harness's agent-minutes (caller speech plus reply wait). Telephony, the judge and the synthetic caller's speech are not on this bill. Change the tier or the rate on the Cost tab if this agent was built differently.`}
        reading=${readCost(e.rows, e.rows)}>
        <div className="timing">
          <div className="timing-row"><span>Rate</span><strong>$${e.rate.toFixed(3)} per minute · ${tier.label}</strong></div>
          <div className="timing-row"><span>Connected minutes, from the timestamps</span><strong>${minutes.toFixed(1)}</strong></div>
          ${harness > 0 && html`<div className="timing-row"><span>Harness agent-minutes, for comparison</span><strong>${harness.toFixed(1)}</strong></div>`}
          <div className="timing-row"><span>Calls · turns</span><strong>${calls} · ${e.rows.reduce((a, r) => a + (r.turns_total || 0), 0)}</strong></div>
          <div className="timing-row"><span>Total for this run</span><strong>$${total.toFixed(2)}</strong></div>
        </div>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Conc</th><th>Calls</th><th>Connected min</th><th>Harness min</th><th>Per turn</th><th>Per call</th><th>Step total</th></tr></thead>
            <tbody>
              ${e.rows.map(r => html`
                <tr key=${r.name}>
                  <td>${r.name}</td><td>${r.concurrency}</td><td>${r.calls}</td>
                  <td>${r.cost.agent_minutes.toFixed(1)}</td><td>${r.harness_minutes > 0 ? r.harness_minutes.toFixed(1) : "-"}</td>
                  <td>$${r.cost.usd_per_turn.toFixed(4)}</td><td>$${r.cost.usd_per_call.toFixed(4)}</td><td>$${r.cost.usd.toFixed(2)}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        ${e.suite && e.suite.length > 1 && html`
          <h4 className="sub">The whole suite, at the same rate</h4>
          <div className="tablewrap">
            <table>
              <thead><tr><th>Part</th><th>Scenario</th><th>Calls</th><th>Connected min</th><th>Per call</th><th>Total</th></tr></thead>
              <tbody>
                ${e.suite.map((p, i) => html`
                  <tr key=${p.id} className=${p.id === rep.id ? "selected" : ""}>
                    <td>${i + 1}${p.id === rep.id ? " · open" : ""}</td><td>${p.scenario}</td>
                    <td>${p.calls === null ? "…" : p.calls}</td><td>${p.minutes === null ? "…" : p.minutes.toFixed(1)}</td>
                    <td>${p.minutes === null || !p.calls ? "…" : "$" + (p.minutes * e.rate / p.calls).toFixed(4)}</td>
                    <td>${p.minutes === null ? "loading" : "$" + (p.minutes * e.rate).toFixed(2)}</td>
                  </tr>`)}
                <tr className="total">
                  <td colSpan="2">${e.suite.every(p => p.minutes !== null) ? "Whole suite" : "Loading the other parts…"}</td>
                  <td>${e.suite.reduce((a, p) => a + (p.calls || 0), 0)}</td>
                  <td>${e.suite.reduce((a, p) => a + (p.minutes || 0), 0).toFixed(1)}</td>
                  <td></td>
                  <td>$${(e.suite.reduce((a, p) => a + (p.minutes || 0), 0) * e.rate).toFixed(2)}</td>
                </tr>
              </tbody>
            </table>
          </div>`}
      <//>`;
  }
  if (rows.length < 2) {
    return html`<${Section} eyebrow="WHAT THE LATENCY COSTS" title="Not priced" note=${costMissing(steps)}/>`;
  }
  const total = steps.reduce((a, s) => a + ((s.cost && s.cost.usd) || 0), 0);
  const minutes = steps.reduce((a, s) => a + ((s.cost && s.cost.agent_minutes) || 0), 0);
  return html`
    <${Section} eyebrow="WHAT THE LATENCY COSTS" title="Where the billed minutes go"
      lede="Billable agent-minutes per step, divided by the turns in it, at the rate this run was given."
      reading=${readCost(rows, steps)}>
      <div className="timing">
        <div className="timing-row"><span>Rate</span><strong>$${rows[rows.length - 1].cost.rate_per_minute.toFixed(4)} per minute</strong></div>
        <div className="timing-row"><span>Agent-minutes billed</span><strong>${minutes.toFixed(1)}</strong></div>
        <div className="timing-row"><span>Turns</span><strong>${steps.reduce((a, s) => a + (s.turns_total || 0), 0)}</strong></div>
        <div className="timing-row"><span>Total for this run</span><strong>$${total.toFixed(2)}</strong></div>
      </div>
      <div className="tablewrap">
        <table>
          <thead><tr><th>Step</th><th>Conc</th><th>Agent-minutes</th><th>Per turn</th><th>Per call</th><th>Step total</th></tr></thead>
          <tbody>
            ${rows.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}</td>
                <td>${s.concurrency}</td>
                <td>${(s.cost.agent_minutes || 0).toFixed(1)}</td>
                <td>$${s.cost.usd_per_turn.toFixed(4)}</td>
                <td>$${(s.cost.usd_per_call || 0).toFixed(4)}</td>
                <td>$${(s.cost.usd || 0).toFixed(2)}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
      <p className="lede">Agent-minutes are caller speech plus turn latency, so the price includes the waiting. Excludes
        telephony, hosting, the synthetic caller's own speech generation and the judge; this is what the
        agent's session time costs, not the total cost of operating the system.</p>
    <//>`;
}

// ---- The primary charts, one per question -----------------------------------

// The chart's frame: gridlines with labels, in the demo's 640×254 box.
const CH = { W: 640, H: 254, L: 55, R: 600, TOP: 40, BASE: 207 };
function gridLines(max, fmt) {
  const y = v => CH.BASE - (v / max) * (CH.BASE - CH.TOP - 3);
  const out = [];
  for (let i = 0; i <= 5; i++) {
    const v = max * i / 5;
    out.push(html`<g key=${i}>
      <line x1=${CH.L} y1=${y(v)} x2=${CH.R} y2=${y(v)} stroke="var(--cs-x-grid)"/>
      <text x=${CH.L - 15} y=${y(v) + 4} textAnchor="end" fill="var(--cs-text-caption)" fontSize="12">${fmt(v)}</text>
    </g>`);
  }
  return out;
}

// p95 time to first audio per step, against the run's own warn and fail lines.
function LoadChart({ steps, prev, point, onPick, base }) {
  const n = steps.length;
  const x = i => CH.L + (n > 1 ? i * ((CH.R - CH.L) / (n - 1)) : (CH.R - CH.L) / 2);
  const prevOf = s => prev && (prev.find(p => p.name === s.name) || null);
  const vals = steps.map(s => s.ttfa.p95_ms);
  const pvals = steps.map(s => prevOf(s)).filter(Boolean).map(p => p.ttfa.p95_ms);
  const fail = base ? base.ttfa.p95_ms * 2 : 0, warn = base ? base.ttfa.p95_ms * 1.5 : 0;
  const max = Math.max(100, ...vals, ...pvals, fail) * 1.15;
  const y = v => CH.BASE - (v / max) * (CH.BASE - CH.TOP - 3);
  const cur = steps[point] || steps[0];
  const lx = Math.min(CH.R - 56, Math.max(CH.L + 36, x(point)));
  const label = `p95 time to first audio per step: ` + steps.map(s => `${s.name} at ${s.concurrency} concurrent ${ms(s.ttfa.p95_ms)}, ${s.verdict}`).join("; ");
  return html`
    <svg viewBox="0 0 ${CH.W} ${CH.H}" role="img" aria-label=${label}>
      ${gridLines(max, v => fmtS(v))}
      ${fail > 0 && fail < max && html`<rect x=${CH.L} y=${CH.TOP - 8} width=${CH.R - CH.L + 14} height=${Math.max(y(fail) - (CH.TOP - 8), 0)} fill="var(--cs-warm)" opacity=".7"/>`}
      ${fail > 0 && html`<${Frag}>
        <line x1=${CH.L} y1=${y(fail)} x2=${CH.R} y2=${y(fail)} stroke="var(--cs-chart-target)" strokeDasharray="4 5"/>
        <text x=${CH.L + 6} y=${y(fail) - 6} fill="var(--cs-chart-target)" fontSize="11">2× baseline · fail</text>
        <line x1=${CH.L} y1=${y(warn)} x2=${CH.R} y2=${y(warn)} stroke="var(--cs-chart-target)" strokeDasharray="2 5" opacity=".7"/>
        <text x=${CH.L + 6} y=${y(warn) - 6} fill="var(--cs-chart-target)" fontSize="11" opacity=".9">1.5× · warn</text>
      <//>`}
      ${prev && pvals.length > 1 && html`<polyline points=${steps.map((s, i) => prevOf(s) ? `${x(i)},${y(prevOf(s).ttfa.p95_ms)}` : null).filter(Boolean).join(" ")}
        fill="none" stroke="var(--cs-chart-comparison)" strokeWidth="2" strokeDasharray="5 5" opacity=".7"/>`}
      ${n > 1 && html`<path d=${"M" + x(0) + " " + CH.BASE + " L" + steps.map((s, i) => `${x(i)} ${y(s.ttfa.p95_ms)}`).join(" L") + " L" + x(n - 1) + " " + CH.BASE + " Z"} fill="var(--cs-blue)" opacity=".35"/>`}
      <polyline points=${steps.map((s, i) => `${x(i)},${y(s.ttfa.p95_ms)}`).join(" ")} fill="none" stroke="var(--cs-chart-primary)" strokeWidth="3" strokeLinejoin="round"/>
      <line x1=${x(point)} y1=${CH.TOP - 8} x2=${x(point)} y2=${CH.BASE} stroke="var(--cs-border-strong)" strokeDasharray="3 5"/>
      ${steps.map((s, i) => html`<g key=${s.name}>
        <circle className="point" cx=${x(i)} cy=${y(s.ttfa.p95_ms)} r=${i === point ? 6 : 4.5}
          fill=${i === point ? "var(--cs-surface)" : "var(--cs-chart-primary)"} stroke=${i === point ? "var(--cs-olive)" : "var(--cs-chart-primary)"} strokeWidth="2"
          onClick=${() => onPick(i)} tabIndex="0" onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(i); } }}>
          <title>${`${s.name} · ${s.concurrency} concurrent: p95 ${ms(s.ttfa.p95_ms)} · ${s.verdict}`}</title>
        </circle>
        <text x=${x(i)} y="229" textAnchor="middle" fill="var(--cs-text-caption)" fontSize="12">${s.concurrency}</text>
      </g>`)}
      <rect x=${lx - 38} y="7" width="76" height="26" rx="5" fill="var(--cs-summary)"/>
      <text x=${lx} y="24" textAnchor="middle" fill="var(--cs-success-text)" fontSize="12">${ms(cur.ttfa.p95_ms)}</text>
      <text x="328" y="252" textAnchor="middle" fill="var(--cs-text-caption)" fontSize="11">Concurrent calls</text>
    </svg>`;
}

// The agent's share of the speaking per step, against the published 80% line.
function TalkChart({ conv, point, onPick }) {
  const n = conv.length;
  const slot = (CH.R - CH.L) / n, bw = Math.min(70, slot * 0.6);
  const x = i => CH.L + slot * i + slot / 2;
  const y = v => CH.BASE - v * (CH.BASE - CH.TOP - 3);
  const label = `Agent's share of the speaking per step: ` + conv.map(s => `${s.name} ${pct(s.conversation.talk_ratio)}`).join("; ");
  return html`
    <svg viewBox="0 0 ${CH.W} ${CH.H}" role="img" aria-label=${label}>
      ${gridLines(1, v => Math.round(v * 100) + "%")}
      <line x1=${CH.L} y1=${y(0.8)} x2=${CH.R} y2=${y(0.8)} stroke="var(--cs-chart-target)" strokeDasharray="4 5"/>
      <text x=${CH.L + 6} y=${y(0.8) - 6} fill="var(--cs-chart-target)" fontSize="11">80% · lecturing</text>
      ${conv.map((s, i) => {
        const v = s.conversation.talk_ratio, on = i === point;
        return html`<g key=${s.name} className="point" onClick=${() => onPick(i)} tabIndex="0"
            onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(i); } }}>
          <rect x=${x(i) - bw / 2} y=${y(v)} width=${bw} height=${CH.BASE - y(v)} rx="3"
            fill=${v >= 0.8 ? "var(--cs-peach)" : "var(--cs-blue)"} stroke=${on ? "var(--cs-olive)" : (v >= 0.8 ? "var(--cs-chart-target)" : "var(--cs-chart-primary)")} strokeWidth=${on ? 2 : 1}/>
          <text x=${x(i)} y=${y(v) - 8} textAnchor="middle" fill="var(--cs-ink)" fontSize="12">${pct(v)}</text>
          <text x=${x(i)} y="229" textAnchor="middle" fill="var(--cs-text-caption)" fontSize="12">${s.name} · ${s.concurrency}</text>
          <title>${`${s.name}: agent held ${pct(v)} of the speaking at ${Math.round(s.conversation.agent_wpm)} wpm`}</title>
        </g>`;
      })}
      <text x="328" y="252" textAnchor="middle" fill="var(--cs-text-caption)" fontSize="11">Step · concurrent calls</text>
    </svg>`;
}

// Criteria met across graded conversations, one row per criterion.
function CriteriaBars({ judge, picked, onPick }) {
  const rows = (judge.misses || []).filter(m => m.judged > 0);
  if (rows.length === 0) {
    return html`<div className="cs-notice">The judge reported totals but no per-criterion counts for this run.</div>`;
  }
  return html`
    <div className="scenarios" role="group" aria-label="Criteria">
      ${rows.map((m, i) => {
        const rate = (m.judged - m.missed) / m.judged;
        return html`<button key=${m.criterion} className="scenario" aria-pressed=${String(i === picked)} onClick=${() => onPick(i)}>
          <span className="scenario-name">${m.criterion}</span>
          <span className="scenario-track"><span className=${"scenario-fill" + (m.missed > 0 ? " missed" : "")} style=${{width: Math.round(rate * 100) + "%"}}></span></span>
          <strong>${Math.round(rate * 100)}%</strong>
        </button>`;
      })}
      <div className="axis-caption"><span>0% met</span><span>${judge.judged} conversations graded · 100%</span></div>
    </div>`;
}

// Cost per turn as concurrency rises.
function CostLine({ rows, prev, point, onPick }) {
  const n = rows.length;
  const x = i => CH.L + (n > 1 ? i * ((CH.R - CH.L) / (n - 1)) : (CH.R - CH.L) / 2);
  const prevOf = s => prev && (prev.find(p => p.name === s.name && p.cost && p.cost.usd_per_turn > 0) || null);
  const vals = rows.map(s => s.cost.usd_per_turn);
  const pvals = rows.map(prevOf).filter(Boolean).map(p => p.cost.usd_per_turn);
  const max = Math.max(...vals, ...pvals) * 1.25;
  const y = v => CH.BASE - (v / max) * (CH.BASE - CH.TOP - 3);
  const cur = rows[point] || rows[0];
  const lx = Math.min(CH.R - 56, Math.max(CH.L + 36, x(point)));
  return html`
    <svg viewBox="0 0 ${CH.W} ${CH.H}" role="img" aria-label=${"Cost per turn per step: " + rows.map(s => `${s.name} $${s.cost.usd_per_turn.toFixed(4)}`).join("; ")}>
      ${gridLines(max, v => "$" + v.toFixed(4))}
      ${prev && pvals.length > 1 && html`<polyline points=${rows.map((s, i) => prevOf(s) ? `${x(i)},${y(prevOf(s).cost.usd_per_turn)}` : null).filter(Boolean).join(" ")}
        fill="none" stroke="var(--cs-chart-comparison)" strokeWidth="2" strokeDasharray="5 5" opacity=".7"/>`}
      <polyline points=${rows.map((s, i) => `${x(i)},${y(s.cost.usd_per_turn)}`).join(" ")} fill="none" stroke="var(--cs-chart-efficiency)" strokeWidth="3" strokeLinejoin="round"/>
      <line x1=${x(point)} y1=${CH.TOP - 8} x2=${x(point)} y2=${CH.BASE} stroke="var(--cs-border-strong)" strokeDasharray="3 5"/>
      ${rows.map((s, i) => html`<g key=${s.name}>
        <circle className="point" cx=${x(i)} cy=${y(s.cost.usd_per_turn)} r=${i === point ? 6 : 4.5}
          fill=${i === point ? "var(--cs-surface)" : "var(--cs-chart-efficiency)"} stroke="var(--cs-chart-efficiency)" strokeWidth="2"
          onClick=${() => onPick(i)} tabIndex="0" onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(i); } }}>
          <title>${`${s.name}: $${s.cost.usd_per_turn.toFixed(4)} per turn at ${s.concurrency} concurrent`}</title>
        </circle>
        <text x=${x(i)} y="229" textAnchor="middle" fill="var(--cs-text-caption)" fontSize="12">${s.concurrency}</text>
      </g>`)}
      <rect x=${lx - 42} y="7" width="84" height="26" rx="5" fill="var(--cs-summary)"/>
      <text x=${lx} y="24" textAnchor="middle" fill="var(--cs-success-text)" fontSize="12">$${cur.cost.usd_per_turn.toFixed(4)}</text>
      <text x="328" y="252" textAnchor="middle" fill="var(--cs-text-caption)" fontSize="11">Concurrent calls</text>
    </svg>`;
}

// ---- The questions ----------------------------------------------------------
// Each tab answers one question: a chart, a selection to inspect, the takeaway
// beside it, and a drawer of the evidence and the method behind it.

const EMPTY = {
  steps: { verdict: html`<b>Nothing was measured.</b> This report carries no steps.`,
           why: "The run may have stopped before its first step completed, so there is no latency to read.",
           act: "Check the run's log, then place it again." },
  conversation: { verdict: html`<b>Not measured on this run.</b>`, why: CONV_MISSING,
                  act: "Re-run the profile; nothing needs enabling." },
  judge: { verdict: html`<b>This run was not judged.</b>`, why: UNJUDGED,
           act: html`Re-run with <code>-judge</code> and a scenario that defines <code>success_criteria</code>.` },
  network: { verdict: html`<b>Placed on an unimpaired network.</b>`, why: UNIMPAIRED,
             act: html`Re-run with <code>-impairments profiles/impairments.json</code> from a pod with NET_ADMIN.` },
  calls: { verdict: html`<b>No calls file for this run.</b>`,
           why: html`Runs placed from this version onward write every call's words and instants to <code>&lt;run&gt;-calls.jsonl</code> beside the report. This run has none, so there is nothing to read; the percentiles elsewhere still stand.`,
           act: "Re-run the profile; nothing needs enabling." },
  loading: { verdict: html`<b>Reading the calls file.</b>`,
             why: "It is read only when this tab is opened, and can run to a few hundred kilobytes.", act: null },
};

const TABS = [
  { id: "load", label: "Speed & capacity", tile: "lavender", glyph: "⌁" },
  { id: "conversation", label: "Speaking & listening", tile: "peach", glyph: "♪" },
  { id: "quality", label: "Tasks completed", tile: "blue", glyph: "✓" },
  { id: "calls", label: "Read the calls", tile: "lime", glyph: "☰" },
  { id: "network", label: "Connection quality", tile: "lime", glyph: "≋" },
  { id: "cost", label: "Call costs", tile: "peach", glyph: "$" },
];
const tabOf = id => TABS.find(t => t.id === id) || TABS[0];

// Which glossary terms and appendix rows explain each question.
const METHOD = {
  load: { terms: ["p50 / p95 TTFA", "Endpointing", "Think / speak", "Agent TTFA", "Two clocks", "Reference lines", "Phase", "Drift", "Pacing drift"],
          formulas: ["TTFA", "Endpointing", "Think / speak", "Turn latency", "Round trip", "Agent TTFA", "Percentile", "Setup success", "Verdict", "Breakpoint", "Two clocks", "Reference line", "Drift", "Recovered", "Pacing drift", "Dispatch integrity"], boundaries: true },
  conversation: { terms: ["Talk ratio", "Words per minute", "Interruption score", "Dead air", "Word error rate", "Barge-in yield"],
                  formulas: ["Talk ratio", "Words per minute", "Interruption score", "Dead air", "Word error rate", "Barge-in yield"] },
  quality: { terms: ["Task success", "Heard versus done", "Word error rate"], formulas: ["Word error rate", "Node pass rate"] },
  calls: { terms: ["p50 / p95 TTFA", "Endpointing", "Think / speak", "Word error rate", "Barge-in yield", "Dead air", "Pacing drift"],
           formulas: ["TTFA", "Endpointing", "Think / speak", "Turn latency", "Word error rate", "Barge-in yield", "Dead air", "Pacing drift"] },
  network: { terms: ["p50 / p95 TTFA", "Endpointing", "Agent TTFA"], formulas: ["× clean", "Impairment", "Verdict", "Breakpoint", "Node pass rate"] },
  cost: { terms: ["Cost per turn", "Talk ratio"], formulas: ["Cost", "Turn latency"] },
};

// Every reading the run supports, tagged with the tab that shows its evidence.
// The takeaway is the first of a tab's findings; the findings drawer is all of them.
function findings(rep, refs) {
  const steps = sel.steps(rep);
  const out = [];
  const add = (tab, r) => r && out.push({ tab, ...r });
  if (steps.length === 0) add("load", EMPTY.steps);
  else add("load", readLatency(steps, rep));
  const split = sel.split(rep); if (split.length) add("load", readSplit(split));
  const corrected = sel.corrected(rep); if (corrected.length) add("load", readAgentLatency(corrected));
  const ttfa = sel.ttfa(rep), lines = sel.lines(refs); if (ttfa.length && lines.length) add("load", readReferences(ttfa, lines));
  const tl = timelineSteps(rep); if (tl.length) add("load", readTimeline(tl, rep));
  const ph = sel.phases(rep); if (ph.length) add("load", readPhases(ph));
  const d = rep.integrity && rep.integrity.dispatch, te = rep.integrity && rep.integrity.turn_events;
  if (d || te) add("load", readIntegrity(d, te));

  const conv = sel.conv(rep);
  add("conversation", conv.length ? readConversation(conv, steps) : EMPTY.conversation);
  const wer = sel.wer(rep); if (wer.length) add("conversation", readWER(wer));
  const barge = sel.barge(rep); if (barge.length) add("conversation", readBarge(barge));

  add("quality", rep.judge ? readTaskSuccess(rep.judge) : EMPTY.judge);

  const m = sel.matrix(rep);
  add("network", m ? readImpairment(m) : EMPTY.network);
  const ns = nodeSummary(rep); if (ns.worstView) add("network", readNodes(ns.worstOf(ns.worstView), ns.worstView));

  const cost = sel.cost(rep);
  add("cost", cost.length >= 2 ? readCost(cost, steps)
    : { verdict: html`<b>Not priced.</b>`, why: costMissing(steps), act: html`Re-run with <b>-rate-per-minute</b>.` });
  return out;
}

// The summary: both questions answered in a line each, and three values, all
// derived from the same steps the tabs draw so the glance and the evidence
// cannot disagree. Deltas are against the previous run of the same profile
// and scenario, when there is one.
function glance(rep, prevIndex, prevRep, estimate) {
  const steps = sel.steps(rep);
  const bp = steps.find(s => s.verdict === "fail");
  const within = steps.filter(s => s.verdict === "pass").reduce((a, s) => Math.max(a, s.concurrency || 0), 0);
  const peak = steps.reduce((a, s) => Math.max(a, s.concurrency || 0), 0);
  let verdict = "pass";
  for (const s of steps) {
    if (s.verdict === "fail") verdict = "fail";
    else if (s.verdict === "warn" && verdict !== "fail") verdict = "warn";
  }
  const degraded = steps.filter(s => s.harness_degraded);
  const j = rep.judge, judged = j && j.judged > 0;
  const m = sel.matrix(rep);
  const netBreaks = m ? m.cohorts.slice(1).filter(c => c.breakpoint).map(c => `${c.impairment.name} at ${c.breakpoint}`) : [];
  const conv = sel.conv(rep);
  const c = conv.length ? conv[conv.length - 1].conversation : null;
  const convProblems = c ? [c.talk_ratio >= 0.8, c.agent_wpm > 190, c.dead_air_turns > 0, c.interruption_score < 4.5].filter(Boolean).length : 0;
  const costRows = sel.cost(rep);
  const priced = costRows.length > 0;
  const calls = steps.reduce((a, s) => a + (s.calls_attempted || s.calls || 0), 0);
  const usd = steps.reduce((a, s) => a + ((s.cost && s.cost.usd) || 0), 0);
  const perCall = priced && calls > 0 ? usd / calls : 0;

  const attention = [
    bp && `breaks at ${bp.name}`,
    verdict === "warn" && "a step warned",
    degraded.length > 0 && "harness suspect",
    netBreaks.length > 0 && "network breaks it",
    judged && j.passed < j.judged && "task criteria missed",
    convProblems > 0 && "conversation quality",
  ].filter(Boolean);

  const headline = steps.length === 0
    ? ["Nothing was measured.", "The report carries no steps."]
    : [bp ? `Breaks at ${bp.concurrency} concurrent.` : `Holds its baseline to ${peak} concurrent.`,
       judged ? (j.passed === j.judged ? "Did the job every time." : `Did the job ${j.passed} of ${j.judged} times.`) : "Task success not graded."];

  const delta = (cur, prev, better) => {
    if (prev === null || prev === undefined || !isFinite(prev)) return null;
    const d = cur - prev;
    return { d, good: better === "up" ? d >= 0 : d <= 0 };
  };
  const rate = judged ? j.passed / j.judged : null;
  const prevRate = prevIndex && prevIndex.judged > 0 ? (prevIndex.passed || 0) / prevIndex.judged : null;
  const rateDelta = rate !== null ? delta(rate * 100, prevRate === null ? null : prevRate * 100, "up") : null;
  const prevCalls = prevRep ? sel.steps(prevRep).reduce((a, s) => a + (s.calls_attempted || s.calls || 0), 0) : 0;
  const prevUsd = prevRep ? sel.steps(prevRep).reduce((a, s) => a + ((s.cost && s.cost.usd) || 0), 0) : 0;
  const prevPerCall = prevRep && prevUsd > 0 && prevCalls > 0 ? prevUsd / prevCalls : null;
  const costDelta = perCall > 0 ? delta(perCall, prevPerCall, "down") : null;

  return {
    verdict, headline, degraded, netBreaks,
    pill: attention.length === 0 ? "No checks need attention"
      : attention.length === 1 ? `1 check needs attention: ${attention[0]}`
      : `${attention.length} checks need attention: ${attention.join(", ")}`,
    stats: [
      { label: "Within its baseline", value: steps.length ? String(within) : "—", unit: steps.length ? "calls" : "",
        note: bp ? html`Concurrent · fails at <b>${bp.concurrency}</b> (${bp.name})` : `Concurrent · highest step that passed of ${peak} tested` },
      { label: "Tasks completed", value: judged ? (rate * 100).toFixed(1) : "—", unit: judged ? "%" : "",
        note: judged
          ? (rateDelta ? html`<span className=${rateDelta.good ? "good" : "bad"}>${rateDelta.d >= 0 ? "↗" : "↘"} ${Math.abs(rateDelta.d).toFixed(1)} pp</span> vs previous run` : `${j.passed} of ${j.judged} graded · no comparison`)
          : "Not judged · re-run with -judge" },
      { label: "Cost / call", value: priced ? "$" + perCall.toFixed(3) : estimate && estimate.rows.length ? "$" + (estimate.rows.reduce((a, r) => a + r.cost.usd, 0) / Math.max(estimate.rows.reduce((a, r) => a + r.calls, 0), 1)).toFixed(3) : "—", unit: "",
        note: priced
          ? (costDelta ? html`<span className=${costDelta.good ? "good" : "bad"}>${costDelta.d <= 0 ? "↘" : "↗"} ${Math.abs(costDelta.d / (prevPerCall || 1) * 100).toFixed(1)}%</span> vs previous run` : `$${usd.toFixed(2)} across ${calls} calls · no comparison`)
          : estimate && estimate.rows.length
          ? `$${estimate.rows.reduce((a, r) => a + r.cost.usd, 0).toFixed(2)} for the run · from connection time at $${estimate.rate.toFixed(3)}/min`
          : "Not priced · open Cost to price it from connection time" },
    ],
  };
}

// What each tab shows: the question, the chart, the controls, the selected
// observation, the footnote and which evidence answers it.
function view(tab, ctx) {
  const { rep, refs, prev, point, setPoint, criterion, setCriterion, metric, setMetric, compare } = ctx;
  const steps = sel.steps(rep);
  const prevSteps = prev ? sel.steps(prev) : null;
  const range = (items, name) => items.length > 1 && html`
    <div className="range-control">
      <label>Inspect ${name}
        <strong>${items[point] ? (items[point].name + " · " + items[point].concurrency + " concurrent") : ""}</strong>
        <input type="range" min="0" max=${items.length - 1} value=${Math.min(point, items.length - 1)} onChange=${e => setPoint(Number(e.target.value))} aria-label=${"Inspect " + name}/>
      </label>
      <small>Drag, or pick a point on the chart. The observation beside the chart follows it.</small>
    </div>`;

  if (tab === "load") {
    if (steps.length === 0) return { question: "How much load can this agent take?", subtitle: "p95 time to first audio · milliseconds · lower is better",
      chart: html`<div className="cs-notice">${keyed(EMPTY.steps.why)}</div>`, compareable: false };
    const s = steps[Math.min(point, steps.length - 1)];
    const base = steps.find(x => x.name === rep.baseline) || steps[0];
    return {
      question: "Does the assistant get slower as more people call?",
      subtitle: "Wait before a reply, in milliseconds. 95 out of 100 replies are faster than this. Compared with the starting test stage.",
      chart: html`<${LoadChart} steps=${steps} prev=${compare ? prevSteps : null} point=${Math.min(point, steps.length - 1)} onPick=${setPoint} base=${base}/>`,
      legend: [["var(--cs-chart-primary)", "This run, p95"], compare && prevSteps && ["var(--cs-chart-comparison)", "Previous run, p95"], ["var(--cs-warm)", "Above 2× baseline"]].filter(Boolean),
      controls: range(steps, "load"),
      observation: html`<${Frag}>
        <small>SELECTED STEP</small>
        <strong>${s.name} · ${s.concurrency} concurrent · ${s.verdict}</strong>
        p50 ${ms(s.ttfa.p50_ms)} · p95 ${ms(s.ttfa.p95_ms)} · p99 ${ms(s.ttfa.p99_ms)} · setup ${pct(s.setup_success)} ·
        ${s.p95_ratio ? s.p95_ratio.toFixed(2) + "× baseline" : "the baseline"} · ${s.turns_total} turns
        ${s.harness_degraded ? html`<small>⚠ Harness suspect: pacing drifted ${ms(s.worst_harness_drift_ms)}, past the 100ms limit.</small>` : html`<small>Pacing drift ${ms(s.worst_harness_drift_ms)} · within the 100ms limit</small>`}
      <//>`,
      footnote: "p95 = the turn slower than 95 of every 100. warn past 1.5× the baseline step, fail past 2×, or whenever call setup drops below 97%.",
      compareable: true,
    };
  }
  if (tab === "conversation") {
    const conv = sel.conv(rep);
    if (conv.length === 0) return { question: "Did it sound like a conversation?", subtitle: "Agent's share of the speaking · percent · published breakdown at 80%",
      chart: html`<div className="cs-notice">${steps.length ? CONV_MISSING : "This run recorded no steps."}</div>` };
    const i = Math.min(point, conv.length - 1), c = conv[i].conversation;
    return {
      question: "Did it sound like a conversation, or a monologue?",
      subtitle: "Agent's share of the speaking, per step · percent · published breakdown at 80% · lower is more conversational",
      chart: html`<${TalkChart} conv=${conv} point=${i} onPick=${setPoint}/>`,
      legend: [["var(--cs-blue)", "Agent's share"], ["var(--cs-peach)", "At or past 80% — lecturing"]],
      controls: range(conv, "step"),
      observation: html`<${Frag}>
        <small>SELECTED STEP</small>
        <strong>${conv[i].name} · agent ${Math.round(c.agent_wpm)} wpm, caller ${Math.round(c.caller_wpm)} wpm</strong>
        Interrupted the caller ${c.interruptions} of ${c.turns} turns (score ${c.interruption_score.toFixed(2)} / 5) ·
        dead air ${c.dead_air_turns > 0 ? `${c.dead_air_turns} turns, ${Math.round(c.dead_air_seconds)}s` : "none"}
        ${c.agent_wpm > 190 ? html`<small>⚠ Above 190 wpm is faster than comfortable listening.</small>` : ""}
      <//>`,
      footnote: "Pace is words over that speaker's own speaking time, not wall clock. Transcript accuracy and barge-in yield are in the evidence.",
    };
  }
  if (tab === "quality") {
    const j = rep.judge;
    if (!j) return { question: "Did it actually do the job?", subtitle: "Criteria met across graded conversations · percent · higher is better",
      chart: html`<div className="cs-notice">${keyed(UNJUDGED)}</div>` };
    const rows = (j.misses || []).filter(m => m.judged > 0);
    // Until the reader picks one, the criterion missed most often is selected:
    // that is where the diagnosis is.
    const worstIdx = rows.reduce((a, m, i) => (m.missed > (rows[a] ? rows[a].missed : -1) ? i : a), 0);
    const k = Math.min(criterion === null ? worstIdx : criterion, Math.max(rows.length - 1, 0)), m = rows[k];
    const example = m && (j.judgements || []).flatMap(c => c.outcomes.filter(o => o.criterion === m.criterion && !o.met && o.evidence)).concat(
      (j.judgements || []).flatMap(c => c.outcomes.filter(o => o.criterion === m.criterion && o.met && o.evidence)))[0];
    return {
      question: "Where does the agent lose the task?",
      subtitle: `Criteria met across ${j.judged} graded conversations · percent · higher is better · graded by ${j.backend || "unknown"}`,
      chart: html`<${CriteriaBars} judge=${j} picked=${k} onPick=${setCriterion}/>`,
      observation: m ? html`<${Frag}>
        <small>SELECTED CRITERION</small>
        <strong>${m.criterion}</strong>
        Met on ${m.judged - m.missed} of ${m.judged} conversations${m.missed > 0 ? `, missed on ${m.missed}` : ""}.
        ${example ? html`<small>${example.met ? "Met, for example, at" : "Missed at"} ${example.evidence}</small>` : (m.evidence ? html`<small>${m.evidence}</small>` : "")}
      <//>` : html`<${Frag}><small>GRADED</small><strong>${j.passed} of ${j.judged} met every criterion</strong>${j.errored} could not be graded.<//>`,
      footnote: "The grader reads the transcript and nothing else; every verdict quotes the turn it was decided on. The call log is in the evidence.",
    };
  }
  if (tab === "calls") {
    const { calls, callStep, setCallStep, callCohort, setCallCohort, query, setQuery, selectedCall, setSelectedCall, callLimit, setCallLimit } = ctx;
    const base = { question: "What was actually said?",
      subtitle: "Every call, turn by turn: what the caller said, what the agent heard, what it replied, and how long each took",
      footnote: "Timings are per turn as recorded; the percentiles elsewhere are computed from exactly these turns. A failed turn has no reply and is left out of them." };
    if (calls === undefined) return { ...base, chart: html`<div className="cs-notice" aria-busy="true">Loading the calls file…</div>` };
    if (calls === null) return { ...base, chart: html`<div className="cs-notice">${keyed(EMPTY.calls.why)}</div>` };
    const names = steps.map(s => s.name).filter(n => calls.some(c => c.step === n));
    const cohorts = [...new Set(calls.map(c => c.cohort).filter(Boolean))];
    const shown = filterCalls(calls, callStep, callCohort, query);
    const c = shown[selectedCall];
    const j = c && judgeIndex(rep.judge).get(c.step + "/" + c.request_id);
    const worst = c && turnsOf(c).filter(t => !t.failed).reduce((a, t) => Math.max(a, t.ttfa_ms || 0), 0);
    const failed = c && turnsOf(c).filter(t => t.failed).length;
    const wrong = c && turnsOf(c).filter(misheard).length;
    return { ...base,
      chart: html`<${Transcripts} calls=${calls} judge=${rep.judge} step=${callStep} cohort=${callCohort} query=${query} selected=${selectedCall}
        onSelect=${setSelectedCall} limit=${callLimit} onMore=${() => setCallLimit(callLimit + 30)}/>`,
      controls: html`<${Frag}>
        <div className="seg" role="group" aria-label="Step">
          <button aria-pressed=${String(!callStep)} onClick=${() => { setCallStep(""); setSelectedCall(0); }}>All steps</button>
          ${names.map(n => html`<button key=${n} aria-pressed=${String(callStep === n)} onClick=${() => { setCallStep(n); setSelectedCall(0); }}>${n}</button>`)}
        </div>
        ${cohorts.length > 0 && html`
          <div className="seg" role="group" aria-label="Network cohort">
            <button aria-pressed=${String(!callCohort)} onClick=${() => { setCallCohort(""); setSelectedCall(0); }}>All networks</button>
            ${cohorts.map(n => html`<button key=${n} aria-pressed=${String(callCohort === n)} onClick=${() => { setCallCohort(n); setSelectedCall(0); }}>${n}</button>`)}
          </div>`}
        <label className="search">
          <span className="cs-label">Search what was said</span>
          <input className="cs-input" type="search" value=${query} placeholder="a phrase, or a call id"
                 onChange=${e => { setQuery(e.target.value); setSelectedCall(0); }}/>
        </label>
      <//>`,
      observation: c ? html`<${Frag}>
        <small>SELECTED CALL</small>
        <strong>${c.step}${c.cohort ? ` · ${c.cohort}` : ""} · ${shortId(c.request_id)}</strong>
        ${c.error
          ? `Never connected: ${c.error}`
          : `${turnsOf(c).length} turns · slowest ${ms(worst)} to first audio${failed ? ` · ${failed} failed` : ""}${wrong ? ` · ${wrong} heard differently` : ""}${j ? ` · ${j.outcomes.filter(o => o.met).length} of ${j.outcomes.length} criteria met` : ""}`}
      <//>` : null,
    };
  }
  if (tab === "network") {
    const m = sel.matrix(rep);
    if (!m) return { question: "Does a bad line break it before load does?", subtitle: "p95 time to first audio per network cohort and step · lighter is lower",
      chart: html`<div className="cs-notice">${keyed(UNIMPAIRED)}</div>` };
    const met = HEAT_METRICS.find(x => x[0] === metric) || HEAT_METRICS[2];
    const impaired = m.cohorts.slice(1);
    const peakOf = c => (c.steps || []).reduce((a, s) => ((s.vs_clean || 0) > (a.vs_clean || 0) ? s : a), (c.steps || [])[0] || {});
    const worst = impaired.reduce((a, c) => (!a || (peakOf(c).vs_clean || 0) > (peakOf(a).vs_clean || 0) ? c : a), null);
    const p = worst && peakOf(worst);
    return {
      question: "Does a bad line break it before load does?",
      subtitle: `${met[1]} per network cohort and step · ${met[0] === "vs_clean" ? "ratio to the clean cohort" : "milliseconds"} · lighter is lower`,
      chart: html`<div className="heat-in-chart"><${HeatGrid} m=${m} metric=${met}/></div>`,
      controls: html`<${MetricPicker} picked=${met[0]} onPick=${setMetric}/>`,
      observation: worst ? html`<${Frag}>
        <small>WORST COHORT</small>
        <strong>${worst.impairment.name} · ${describeNet(worst.impairment)}</strong>
        p95 ${(p.vs_clean || 0).toFixed(2)}× the clean line at ${p.name} · ${worst.breakpoint ? `breaks at ${worst.breakpoint}` : "held every step"}
        <small>Clean cohort: ${m.cohorts[0].breakpoint ? `breaks at ${m.cohorts[0].breakpoint}` : "held every step"} · ${m.cohorts.length} cohorts on ${m.device}</small>
      <//>` : html`<${Frag}><small>COHORTS</small><strong>Only the clean cohort ran</strong>Nothing to compare it against.<//>`,
      footnote: "Each row is the same profile with only the caller's network changed, clean first. The tc commands and per-node scores are in the evidence.",
    };
  }
  // cost
  const harnessRows = sel.cost(rep);
  const est = ctx.estimate;
  if (harnessRows.length < 2 && !(est && est.rows.length > 0)) {
    const loading = ctx.calls === undefined;
    return { question: "Is each call costing more under load?", subtitle: "Cost per turn · USD · lower is better",
      chart: html`<div className="cs-notice" aria-busy=${String(loading)}>${loading ? "Reading the calls file to price this run from its connection time…" : keyed(costMissing(steps))}</div>`, compareable: false };
  }
  const rows = harnessRows.length >= 2 ? harnessRows : est.rows;
  const priced = harnessRows.length >= 2;
  const tier = !priced && tierOf(est.tier);
  const i = Math.min(point, rows.length - 1), s = rows[i];
  const pricing = !priced && html`
    <div className="range-control pricing">
      <label>Deepgram tier
        <select className="cs-input" value=${est.tier} onChange=${e => ctx.setTier(e.target.value)}>
          ${DEEPGRAM_PRICING.tiers.map(t => html`<option key=${t.id} value=${t.id}>${t.label} · $${rateOn(t, rep.started_at).toFixed(3)}/min</option>`)}
        </select>
      </label>
      <label>Rate, $ per connected minute
        <input className="cs-input" type="number" step="0.001" min="0" value=${est.rate} onChange=${e => ctx.setRate(e.target.value === "" ? null : Number(e.target.value))}/>
      </label>
      <small>${DEEPGRAM_PRICING.plan}, billed by ${DEEPGRAM_PRICING.basis}; ${DEEPGRAM_PRICING.source.replace("https://", "")} as of ${DEEPGRAM_PRICING.fetched}.${tier.promo ? ` Standard was $${tier.promo.toFixed(3)} through ${day(tier.promoUntil + "T12:00:00Z")}, $${tier.list.toFixed(3)} after.` : ""} ${ctx.rateOverride !== null ? html`<button className="text-button" onClick=${() => ctx.setRate(null)}>Reset to the published rate</button>` : ""}</small>
    </div>`;
  return {
    question: "Is each call costing more under load?",
    subtitle: priced
      ? `Cost per turn · USD at $${s.cost.rate_per_minute.toFixed(4)} per agent-minute · lower is better`
      : `Cost per turn · USD · priced from each call's connection time at $${est.rate.toFixed(3)} per minute, Deepgram's published ${tier.label.split(" — ")[0]} rate · lower is better`,
    chart: html`<${CostLine} rows=${rows} prev=${compare && priced ? prevSteps : null} point=${i} onPick=${setPoint}/>`,
    legend: [["var(--cs-chart-efficiency)", "This run, per turn"], compare && priced && prevSteps && ["var(--cs-chart-comparison)", "Previous run"]].filter(Boolean),
    controls: html`<${Frag}>${pricing || null}${range(rows, "load") || null}<//>`,
    observation: html`<${Frag}>
      <small>SELECTED STEP</small>
      <strong>${s.name} · $${s.cost.usd_per_turn.toFixed(4)} per turn · $${(s.cost.usd_per_call || 0).toFixed(4)} per call</strong>
