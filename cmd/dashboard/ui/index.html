<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callstorm runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
  :root {
    --ground:#EEF1F4; --surface:#FBFCFD; --sunk:#E4E9EE;
    --ink:#131A24; --ink-2:#3D4854; --mute:#626E7C;
    --rule:#CBD3DB; --rule-soft:#DDE3E9;
    --signal:#0E8FA8; --ref:#7A8592;
    --pass:#2F7D53; --warn:#C08A00; --fail:#C03A2B;
    --pass-bg:rgba(47,125,83,.11); --warn-bg:rgba(192,138,0,.14); --fail-bg:rgba(192,58,43,.11);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D1317; --surface:#151D23; --sunk:#1E272E;
      --ink:#E3EAEF; --ink-2:#BDC8D1; --mute:#8B98A4;
      --rule:#2C3841; --rule-soft:#222C34;
      --signal:#3FB8D1; --ref:#8C97A3;
      --pass:#4FB87C; --warn:#C89A3C; --fail:#E0685A;
      --pass-bg:rgba(79,184,124,.13); --warn-bg:rgba(200,154,60,.14); --fail-bg:rgba(224,104,90,.13);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace; font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin-inline:auto; padding-inline:20px; }
  header { padding-block:28px 18px; border-bottom:2px solid var(--ink); }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; font-weight:600; }
  .sub { margin:8px 0 0; color:var(--ink-2); font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; max-width:62ch; }
  .eyebrow { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }

  .cols { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:28px; padding-block:24px 60px; align-items:start; }
  @media (max-width: 860px) { .cols { grid-template-columns:1fr; } }

  .runs { border-top:1px solid var(--rule); }
  .run {
    width:100%; text-align:left; background:none; border:0; cursor:pointer; color:inherit;
    font:inherit; padding:11px 10px 12px; border-bottom:1px solid var(--rule-soft);
    display:grid; grid-template-columns:1fr auto; gap:4px 10px;
  }
  .run:hover { background:var(--surface); }
  .run[aria-current="true"] { background:var(--surface); box-shadow:inset 3px 0 0 var(--signal); }
  .run .id { font-size:12px; color:var(--ink); }
  .run .meta { grid-column:1/-1; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums; }

  .pill { font-size:10px; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:2px; align-self:start; }
  .pass { color:var(--pass); background:var(--pass-bg); }
  .warn { color:var(--warn); background:var(--warn-bg); }
  .fail { color:var(--fail); background:var(--fail-bg); }

  .card { background:var(--surface); border:1px solid var(--rule-soft); border-radius:3px; padding:20px; }
  .card + .card { margin-top:18px; }
  h2 { margin:0 0 4px; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .spec { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px 22px; margin-top:16px; }
  .spec div { border-top:1px solid var(--rule); padding-block:8px 10px; }
  .spec dt { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); }
  .spec dd { margin:3px 0 0; font-variant-numeric:tabular-nums; word-break:break-word; }

  table { border-collapse:collapse; width:100%; font-size:12px; margin-top:14px; }
  th,td { padding:7px 10px 7px 0; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); border-bottom:1px solid var(--ink); font-weight:500; }
  tbody tr { border-bottom:1px solid var(--rule-soft); }
  .tablewrap { overflow-x:auto; }

  .note { margin-top:14px; padding:10px 12px; border-left:3px solid var(--warn); background:var(--sunk); font-size:12px; color:var(--ink-2); }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
  .trend { margin-top:10px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin-top:8px; }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  a { color:var(--signal); }

  .hero { padding-block:26px 4px; }

  /* The two questions are the product. Everything else on this page exists to
     support them, so they are the largest thing on it -- larger than the name,
     which is only a label. */
  .asks { margin:22px 0 0; border-top:2px solid var(--ink); border-bottom:1px solid var(--rule); padding-block:20px 22px; }
  /* The framing is light; the thing being asked carries the weight, so the
     answer a reader is here for is the boldest text on the page. */
  .ask { margin:0; font-family:"IBM Plex Serif", Georgia, serif; font-weight:400;
         font-size:clamp(21px, 3.3vw, 31px); line-height:1.25; letter-spacing:-.015em;
         color:var(--ink-2); text-wrap:balance; max-width:26ch; }
  .ask + .ask { margin-top:14px; }
  .ask span { color:var(--ink); font-weight:600; }
  .asks-lead { margin:0 0 14px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--signal); }

  .thesis { margin:20px 0 0; font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; line-height:1.6; color:var(--ink-2); max-width:68ch; }
  .caps { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1px 26px; margin-top:22px; }
  .caps div { border-top:1px solid var(--rule); padding-block:9px 11px; }
  .caps dt { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--signal); }
  .caps dd { margin:4px 0 0; font-size:12px; color:var(--ink-2); line-height:1.5; }
  .foundation { margin-top:20px; border-left:3px solid var(--signal); padding:12px 14px; background:var(--surface); font-size:12.5px; color:var(--ink-2); line-height:1.6; max-width:76ch; }
  .foundation b { color:var(--ink); }
  .links { margin-top:16px; display:flex; gap:18px; flex-wrap:wrap; font-size:12px; }
  .subhead { padding-block:26px 0; border-bottom:none; }
  .subhead h1 { font-size:20px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script>
const { useState, useEffect } = React;

// Report a failure to the server rather than to a console nobody is watching.
function report(where, err) {
  try {
    fetch("api/clienterror", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        where: where,
        message: String((err && err.message) || err),
        stack: String((err && err.stack) || ""),
      }),
    });
  } catch (_) { /* reporting must never be the thing that breaks */ }
}
window.addEventListener("error", e => report("window", e.error || e.message));
window.addEventListener("unhandledrejection", e => report("promise", e.reason));

// A dashboard that renders and then vanishes tells its operator nothing. React
// unmounts the whole tree when a render throws, so without this the symptom of
// any bug is a blank page.
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err: err }; }
  componentDidCatch(err, info) { report("render", err); console.error(err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div className="card">
      <div className="eyebrow">The dashboard broke</div>
      <h2>${String(this.state.err.message || this.state.err)}</h2>
      <pre style=${{whiteSpace:"pre-wrap",fontSize:"11px",color:"var(--mute)",marginTop:"10px"}}>${String(this.state.err.stack || "")}</pre>
    </div>`;
  }
}
const html = htm.bind(React.createElement);

const ms = n => (n || n === 0) ? Math.round(n) + "ms" : "-";
const pct = n => (n * 100).toFixed(n < 0.01 ? 1 : 1) + "%";
const when = s => new Date(s).toLocaleString();

function Pill({ v }) {
  return html`<span className="pill ${v}">${v}</span>`;
}

// Run history as a sparkline of worst p95 per run, oldest to newest. The whole
// reason the dashboard exists is the question "is this getting worse", and that
// is a shape rather than a number.
function Trend({ runs }) {
  const series = runs.filter(r => r.worst_p95_ms > 0).slice(0, 20).reverse();
  if (series.length < 2) return null;

  const W = 640, H = 120, PAD = 34;
  const max = Math.max(...series.map(r => r.worst_p95_ms)) * 1.15;
  const x = i => PAD + (i * (W - PAD - 12)) / Math.max(series.length - 1, 1);
  const y = v => H - 26 - (v / max) * (H - 48);
  const color = v => v === "fail" ? "var(--fail)" : v === "warn" ? "var(--warn)" : "var(--pass)";

  return html`
    <div className="trend">
      <div className="eyebrow">Worst p95 TTFA, last ${series.length} runs (oldest left)</div>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto"}}>
        <line x1=${PAD} y1=${H - 26} x2=${W - 12} y2=${H - 26} stroke="var(--rule)" strokeWidth="1"/>
        <text x="4" y=${y(max / 1.15) + 4} fontSize="10" fill="var(--mute)">${Math.round(max / 1.15)}</text>
        <polyline fill="none" stroke="var(--signal)" strokeWidth="2" strokeLinejoin="round"
          points=${series.map((r, i) => `${x(i)},${y(r.worst_p95_ms)}`).join(" ")}/>
        ${series.map((r, i) => html`
          <circle key=${r.id} cx=${x(i)} cy=${y(r.worst_p95_ms)} r="4.5"
            fill=${color(r.verdict)} stroke="var(--surface)" strokeWidth="2">
            <title>${r.id + "\n" + Math.round(r.worst_p95_ms) + "ms · " + r.verdict}</title>
          </circle>`)}
      </svg>
      <div className="legend">
        <span><i style=${{background:"var(--pass)"}}></i>pass</span>
        <span><i style=${{background:"var(--warn)"}}></i>warn</span>
        <span><i style=${{background:"var(--fail)"}}></i>fail</span>
      </div>
    </div>`;
}

// Component share: how p95 TTFA divides between noticing the caller stopped
// and producing a reply, one bar per step.
//
// A single TTFA number cannot tell an endpointing problem from an inference
// problem, and the two have different fixes. The stack makes the growing half
// obvious: a bar whose left segment stays put while the right one stretches is
// an LLM or TTS queue, not a VAD.
function ComponentShare({ steps }) {
  const rows = steps.filter(s =>
    s.endpointing && s.endpointing.n > 0 && s.think_speak && s.think_speak.n > 0 &&
    s.endpointing.p95_ms + s.think_speak.p95_ms > 0);
  if (rows.length < 2) return null;

  const W = 640, ROW = 30, LEFT = 64, RIGHT = 78;
  const H = rows.length * ROW + 16;
  const max = Math.max(...rows.map(s => s.endpointing.p95_ms + s.think_speak.p95_ms)) * 1.02;
  const w = v => Math.max((v / max) * (W - LEFT - RIGHT), 0);
  const base = rows[0].think_speak.p95_ms / (rows[0].endpointing.p95_ms + rows[0].think_speak.p95_ms);

  return html`
    <div className="card">
      <div className="eyebrow">Which half saturates first</div>
      <h2>p95 TTFA, split into endpointing and think/speak</h2>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"12px"}}>
        ${rows.map((s, i) => {
          const ep = s.endpointing.p95_ms, ts = s.think_speak.p95_ms;
          const share = ts / (ep + ts);
          const y = i * ROW + 6;
          const shift = (share - base) * 100;
          return html`
            <g key=${s.name}>
              <text x="0" y=${y + 14} fontSize="11" fill="var(--ink-2)">${s.name}</text>
              <rect x=${LEFT} y=${y} width=${w(ep)} height="18" fill="var(--signal)" opacity="0.34"/>
              <rect x=${LEFT + w(ep)} y=${y} width=${w(ts)} height="18" fill="var(--signal)"/>
              <text x=${W - RIGHT + 8} y=${y + 13} fontSize="11" fill="var(--ink-2)">
                ${Math.round(share * 100)}% think${i > 0 && Math.abs(shift) >= 5
                  ? (shift > 0 ? " ▲" : " ▼") + Math.abs(Math.round(shift)) : ""}
              </text>
              <title>${s.name + "\n" + Math.round(ep) + "ms endpointing + " + Math.round(ts) + "ms think/speak"}</title>
            </g>`;
        })}
      </svg>
      <div className="legend">
        <span><i style=${{background:"var(--signal)",opacity:0.34}}></i>endpointing — noticing the caller stopped</span>
        <span><i style=${{background:"var(--signal)"}}></i>think/speak — LLM plus TTS</span>
      </div>
    </div>`;
}

// Cost per turn against concurrency.
//
// Voice agents bill by the minute, so latency is a price as well as an
// experience: every second the caller waits is a second of billed session. A
// step whose cost per turn climbs is an agent getting more expensive under
// exactly the load it was bought to handle, which no latency percentile states
// in the units a budget is written in.
function CostChart({ steps }) {
  const rows = steps.filter(s => s.cost && s.cost.usd_per_turn > 0);
  if (rows.length < 2) return null;

  const W = 640, H = 150, PAD = 44;
  const max = Math.max(...rows.map(s => s.cost.usd_per_turn)) * 1.2;
  const x = i => PAD + (i * (W - PAD - 40)) / Math.max(rows.length - 1, 1);
  const y = v => H - 28 - (v / max) * (H - 50);
  const first = rows[0].cost.usd_per_turn;
  const last = rows[rows.length - 1].cost.usd_per_turn;

  return html`
    <div className="card">
      <div className="eyebrow">What the latency costs</div>
      <h2>Dollars per turn as concurrency rises</h2>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"8px"}}>
        <line x1=${PAD} y1=${H - 28} x2=${W - 40} y2=${H - 28} stroke="var(--rule)" strokeWidth="1"/>
        <text x="2" y=${y(max / 1.2) + 4} fontSize="10" fill="var(--mute)">$${(max / 1.2).toFixed(4)}</text>
        <polyline fill="none" stroke="var(--signal)" strokeWidth="2" strokeLinejoin="round"
          points=${rows.map((s, i) => `${x(i)},${y(s.cost.usd_per_turn)}`).join(" ")}/>
        ${rows.map((s, i) => html`
          <g key=${s.name}>
            <circle cx=${x(i)} cy=${y(s.cost.usd_per_turn)} r="4"
              fill="var(--signal)" stroke="var(--surface)" strokeWidth="2">
              <title>${s.name + "\n$" + s.cost.usd_per_turn.toFixed(4) + " per turn at " + s.concurrency + " concurrent"}</title>
            </circle>
            <text x=${x(i)} y=${H - 12} fontSize="10" fill="var(--mute)" textAnchor="middle">${s.concurrency}</text>
          </g>`)}
      </svg>
      <div className="note">
        A turn cost <b>$${first.toFixed(4)}</b> at ${rows[0].concurrency} concurrent and
        <b>$${last.toFixed(4)}</b> at ${rows[rows.length - 1].concurrency}
        — ${last > first ? `${((last / first - 1) * 100).toFixed(0)}% more for the same conversation`
                         : "no more than it did at rest"}.
        Priced at $${rows[0].cost.rate_per_minute.toFixed(4)} per agent-minute.
      </div>
    </div>`;
}

function ReportCard({ id }) {
  const [rep, setRep] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    if (!id) return;
    setRep(null); setErr(null);
    fetch(`api/runs/${id}.json`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(setRep).catch(e => setErr(String(e)));
  }, [id]);

  if (!id) return html`<div className="card empty">Pick a run.</div>`;
  if (err) return html`<div className="card empty">Could not load ${id}: ${err}</div>`;
  if (!rep) return html`<div className="card empty">Loading…</div>`;

  const steps = rep.steps || [];
  const degraded = steps.filter(s => s.harness_degraded);
  const anyWER = steps.some(s => s.wer && s.wer.turns > 0);
  const anyBarge = steps.some(s => s.barge_in && s.barge_in.turns > 0);
  const conv = steps.filter(s => s.conversation && s.conversation.turns > 0);

  return html`
    <div className="card">
      <div className="eyebrow">Report card</div>
      <h2>${rep.profile} · ${rep.scenario}</h2>
      <dl className="spec">
        <div><dt>Run</dt><dd>${id}</dd></div>
        <div><dt>Started</dt><dd>${when(rep.started_at)}</dd></div>
        <div><dt>Duration</dt><dd>${Math.round(rep.duration_s)}s</dd></div>
        <div><dt>Target</dt><dd>${rep.target || "deepgram voice agent"}</dd></div>
      </dl>

      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Conc</th><th>Setup</th><th>p50</th><th>p95</th><th>p99</th>
            <th>Turns</th><th>Drift</th><th>vs base</th><th>Verdict</th>
          </tr></thead>
          <tbody>
            ${steps.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}${s.name === rep.baseline ? " ←" : ""}</td>
                <td>${s.concurrency}</td>
                <td>${pct(s.setup_success)}</td>
                <td>${ms(s.ttfa.p50_ms)}</td>
                <td>${ms(s.ttfa.p95_ms)}</td>
                <td>${ms(s.ttfa.p99_ms)}</td>
                <td>${s.turns_total}</td>
                <td>${ms(s.worst_harness_drift_ms)}</td>
                <td>${s.p95_ratio ? s.p95_ratio.toFixed(2) + "×" : "-"}</td>
                <td><${Pill} v=${s.verdict}/></td>
              </tr>`)}
          </tbody>
        </table>
      </div>

      ${degraded.length > 0 && html`
        <div className="note">
          <strong>Suspect.</strong> ${degraded.map(s => s.name).join(", ")} drifted past the 100ms
          pacing limit, so ${degraded.length > 1 ? "those steps measure" : "that step measures"} the
          load generator rather than the agent. The verdict grades the agent and should not be
          believed here.
        </div>`}
    </div>

    ${conv.length > 0 && html`
      <div className="card">
        <div className="eyebrow">Conversation quality</div>
        <h2>How the calls sounded</h2>
        <div className="tablewrap">
          <table>
            <thead><tr>
              <th>Step</th><th>Agent's share</th><th>Agent pace</th><th>Caller pace</th>
              <th>Interruptions</th><th>Score /5</th><th>Dead air</th>
            </tr></thead>
            <tbody>
              ${conv.map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${pct(s.conversation.talk_ratio)}${s.conversation.talk_ratio >= 0.8 ? " ⚠" : ""}</td>
                  <td>${Math.round(s.conversation.agent_wpm)} wpm${s.conversation.agent_wpm > 190 ? " ⚠" : ""}</td>
                  <td>${Math.round(s.conversation.caller_wpm)} wpm</td>
                  <td>${s.conversation.interruptions} of ${s.conversation.turns}</td>
                  <td>${s.conversation.interruption_score.toFixed(2)}</td>
                  <td>${s.conversation.dead_air_turns > 0
                        ? `${s.conversation.dead_air_turns} turns · ${Math.round(s.conversation.dead_air_seconds)}s`
                        : "none"}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        <div className="note">
          Pace is words over that speaker's own speaking time, not wall clock, so a slow agent is
          not flattered by the caller's pauses. ⚠ marks the published breakdown thresholds: an
          agent holding <b>80%</b> or more of the floor is lecturing rather than conversing, and
          above <b>190 wpm</b> is faster than comfortable listening. Dead air counts turns where
          the line stayed silent more than two seconds after the caller finished — the point at
          which a person says "hello?".
        </div>
      </div>`}

    <${ComponentShare} steps=${steps}/>
    <${CostChart} steps=${steps}/>

    ${anyWER && html`
      <div className="card">
        <div className="eyebrow">Transcript accuracy</div>
        <h2>What the agent heard</h2>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Mean</th><th>Worst turn</th><th>Errors</th><th>Words</th><th>S / D / I</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.wer && s.wer.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${pct(s.wer.mean)}</td>
                  <td>${pct(s.wer.worst)}</td>
                  <td>${s.wer.substitutions + s.wer.deletions + s.wer.insertions}</td>
                  <td>${s.wer.ref_words}</td>
                  <td>${s.wer.substitutions} / ${s.wer.deletions} / ${s.wer.insertions}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>`}

    ${anyBarge && html`
      <div className="card">
        <div className="eyebrow">Interruption</div>
        <h2>How fast it gave the floor back</h2>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Step</th><th>Barge-ins</th><th>Yielded</th><th>p50</th><th>p95</th></tr></thead>
            <tbody>
              ${steps.filter(s => s.barge_in && s.barge_in.turns > 0).map(s => html`
                <tr key=${s.name}>
                  <td>${s.name}</td>
                  <td>${s.barge_in.turns}</td>
                  <td>${s.barge_in.yielded}${s.barge_in.yielded < s.barge_in.turns
                        ? ` — ${s.barge_in.turns - s.barge_in.yielded} never yielded` : ""}</td>
                  <td>${ms(s.barge_in.yield_p50_ms)}</td>
                  <td>${ms(s.barge_in.yield_p95_ms)}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>`}`;
}

function App() {
  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetch("api/runs.json").then(r => r.json())
      .then(rs => { setRuns(rs); if (rs.length) setSel(rs[0].id); })
      .catch(e => setErr(String(e)));
  }, []);

  return html`
    <div className="wrap">
      <header className="hero">
        <span className="eyebrow">Load testing and observability for voice AI agents</span>
        <h1>Callstorm</h1>
        <div className="asks">
          <p className="asks-lead">Two questions, not one</p>
          <p className="ask">At what concurrency does this agent <span>stop meeting its own baseline?</span></p>
          <p className="ask">And did it <span>actually do its job?</span></p>
        </div>

        <p className="thesis">Callstorm places synthetic calls against a voice agent, speaks to it
          with real text-to-speech, listens to what comes back, and stamps every instant on both
          sides of the conversation. The first question is answered in milliseconds, the second by
          reading what was actually said.</p>

        <dl className="caps">
          <div><dt>Latency</dt><dd>Time to first audio, split into endpointing and think+speak. Percentiles per step, and the breakpoint scored against the run's own baseline rather than a number someone else picked.</dd></div>
          <div><dt>Accuracy</dt><dd>Word error rate against the caller's script. Callstorm generated that audio from known text, so the reference is ground truth rather than a second transcription.</dd></div>
          <div><dt>Task success</dt><dd>An LLM judge scores plain-language criteria, and every verdict must quote the turn it was decided on &mdash; so it can be checked rather than trusted.</dd></div>
          <div><dt>Interruption</dt><dd>The caller cuts in mid-reply and the run records how long the agent kept talking, calibrated against a known injected yield.</dd></div>
          <div><dt>Personas</dt><dd>Pacing rather than costume: a caller who pauses mid-thought is what turn detection actually reacts to, and it catches endpointing tuned too tight.</dd></div>
          <div><dt>Branching</dt><dd>The caller responds to what the agent said instead of reciting. Every branch is synthesized before the call, so no speech latency lands inside the measurement.</dd></div>
          <div><dt>Scale</dt><dd>A dispatcher hands calls to a Kubernetes worker fleet over Kafka, autoscaled on queue depth and chaos-tested by killing pods mid-run.</dd></div>
          <div><dt>Observability</dt><dd>Prometheus native histograms and Grafana while a run happens; these report cards afterwards.</dd></div>
        </dl>

        <p className="foundation">Two measurements are <b>calibrated against known answers</b>:
          latency, worst error <b>3.3&nbsp;ms</b> across five concurrency levels, and barge-in yield,
          <b>15&nbsp;ms</b> at three concurrent callers. That is the foundation. A harness whose
          numbers have never been checked against something it already knows cannot be trusted about
          anything else &mdash; which is also why a run reports its own pacing drift, and marks a step
          suspect when this machine rather than the agent was the limit.</p>

        <div className="links">
          <a href="https://github.com/ai-calypse/callstorm">Source on GitHub</a>
        </div>
      </header>

      <header className="subhead">
        <span className="eyebrow">Every sweep, newest first</span>
        <h1>Run history</h1>
        <p className="sub">One run tells you how an agent behaved once; the shape across runs is what
          says whether it is getting worse.</p>
      </header>

      ${err && html`<div className="card empty">Could not load runs: ${err}</div>`}

      <div className="cols">
        <div>
          <${Trend} runs=${runs}/>
          <div className="runs">
            ${runs.length === 0 && !err && html`<div className="empty">No runs yet.</div>`}
            ${runs.map(r => html`
              <button key=${r.id} className="run" aria-current=${String(r.id === sel)}
                      onClick=${() => setSel(r.id)}>
                <span className="id">${r.profile} · ${r.scenario}</span>
                <${Pill} v=${r.verdict}/>
                <span className="meta">
                  ${when(r.started_at)} · peak ${r.peak_concurrency} · worst p95 ${ms(r.worst_p95_ms)}
                  ${r.harness_degraded ? " · harness suspect" : ""}
                  ${r.breakpoint ? ` · breaks at ${r.breakpoint}` : ""}
                </span>
              </button>`)}
          </div>
        </div>
        <div><${ReportCard} id=${sel}/></div>
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Boundary}><${App}/><//>`);
</script>
</body>
</html>
