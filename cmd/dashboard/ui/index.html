<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callstorm runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
  :root {
    --ground:#EEF1F4; --surface:#FBFCFD; --sunk:#E4E9EE;
    --ink:#131A24; --ink-2:#3D4854; --mute:#626E7C;
    --rule:#CBD3DB; --rule-soft:#DDE3E9;
    --signal:#0E8FA8; --ref:#7A8592;
    --pass:#2F7D53; --warn:#C08A00; --fail:#C03A2B;
    --pass-bg:rgba(47,125,83,.11); --warn-bg:rgba(192,138,0,.14); --fail-bg:rgba(192,58,43,.11);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D1317; --surface:#151D23; --sunk:#1E272E;
      --ink:#E3EAEF; --ink-2:#BDC8D1; --mute:#8B98A4;
      --rule:#2C3841; --rule-soft:#222C34;
      --signal:#3FB8D1; --ref:#8C97A3;
      --pass:#4FB87C; --warn:#C89A3C; --fail:#E0685A;
      --pass-bg:rgba(79,184,124,.13); --warn-bg:rgba(200,154,60,.14); --fail-bg:rgba(224,104,90,.13);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace; font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin-inline:auto; padding-inline:20px; }
  header { padding-block:28px 18px; border-bottom:2px solid var(--ink); }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; font-weight:600; }
  .sub { margin:8px 0 0; color:var(--ink-2); font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; max-width:62ch; }
  .eyebrow { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }

  .cols { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:28px; padding-block:24px 60px; align-items:start; }
  @media (max-width: 860px) { .cols { grid-template-columns:1fr; } }

  .runs { border-top:1px solid var(--rule); }
  .run {
    width:100%; text-align:left; background:none; border:0; cursor:pointer; color:inherit;
    font:inherit; padding:11px 10px 12px; border-bottom:1px solid var(--rule-soft);
    display:grid; grid-template-columns:1fr auto; gap:4px 10px;
  }
  .run:hover { background:var(--surface); }
  .run[aria-current="true"] { background:var(--surface); box-shadow:inset 3px 0 0 var(--signal); }
  .run .id { font-size:12px; color:var(--ink); }
  .run .meta { grid-column:1/-1; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums; }

  .pill { font-size:10px; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:2px; align-self:start; }
  .pass { color:var(--pass); background:var(--pass-bg); }
  .warn { color:var(--warn); background:var(--warn-bg); }
  .fail { color:var(--fail); background:var(--fail-bg); }

  .card { background:var(--surface); border:1px solid var(--rule-soft); border-radius:3px; padding:20px; }
  .card + .card { margin-top:18px; }
  h2 { margin:0 0 4px; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .spec { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px 22px; margin-top:16px; }
  .spec div { border-top:1px solid var(--rule); padding-block:8px 10px; }
  .spec dt { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); }
  .spec dd { margin:3px 0 0; font-variant-numeric:tabular-nums; word-break:break-word; }

  table { border-collapse:collapse; width:100%; font-size:12px; margin-top:14px; }
  th,td { padding:7px 10px 7px 0; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); border-bottom:1px solid var(--ink); font-weight:500; }
  tbody tr { border-bottom:1px solid var(--rule-soft); }
  .tablewrap { overflow-x:auto; }

  .note { margin-top:14px; padding:10px 12px; border-left:3px solid var(--warn); background:var(--sunk); font-size:12px; color:var(--ink-2); }

  /* A reading: what this card's numbers actually say, and what to do about it.
     Distinct from .note, which is a caveat -- this is the finding. */
  .read { margin-top:16px; border-top:1px solid var(--rule); padding-top:14px; }
  .read-verdict { font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; line-height:1.45;
                  color:var(--ink); letter-spacing:-.005em; max-width:70ch; }
  .read-verdict b { color:var(--signal); font-weight:600; }
  .read-why { margin-top:9px; font-size:12px; line-height:1.6; color:var(--ink-2); max-width:76ch; }
  .read-do { margin-top:9px; font-size:12px; line-height:1.55; color:var(--ink-2); max-width:76ch;
             border-left:3px solid var(--signal); padding:7px 0 7px 11px; background:var(--sunk); }
  .read-do b, .read-why b { color:var(--ink); }
  .read-do code, .read-why code { font-size:11.5px; background:var(--ground); padding:1px 4px; border-radius:2px; }

  /* Anatomy of a turn: two proportional segments, sized by the run's own
     numbers, so the diagram is a measurement rather than an illustration. */
  .atrack { display:flex; margin-top:16px; height:42px; border-radius:2px; overflow:hidden; }
  .aseg { display:flex; flex-direction:column; justify-content:center; gap:2px; padding:0 10px;
          min-width:0; overflow:hidden; font-size:11px; color:#fff; white-space:nowrap; }
  .aseg b { font-size:13px; font-variant-numeric:tabular-nums; }
  .aseg.ep { background:color-mix(in srgb, var(--signal) 42%, var(--surface)); color:var(--ink); }
  .aseg.ts { background:var(--signal); color:#06232A; }
  @media (prefers-color-scheme: dark) { .aseg.ts { color:#04181D; } }
  .amarks { display:flex; margin-top:6px; font-size:10px; color:var(--mute); line-height:1.35; }
  .amarks > * { min-width:0; padding-right:8px; }
  .amarks .between { display:flex; justify-content:space-between; gap:10px; }
  .amarks .between span:last-child { text-align:right; }
  .ahalves { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1px 24px; margin-top:16px; }
  .ahalves div { border-top:1px solid var(--rule); padding-block:9px 11px; }
  .ahalves dt { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--signal); }
  .ahalves dd { margin:4px 0 0; font-size:12px; color:var(--ink-2); line-height:1.55; }
  .ahalves dd em { font-style:normal; color:var(--ink); }

  /* The glossary: every number on this page, in plain words, before anyone
     scrolls into a table of them. */
  .gloss { margin-top:16px; }
  .gloss table { margin-top:0; }
  .gloss td:first-child { font-weight:500; color:var(--ink); white-space:nowrap; vertical-align:top; }
  .gloss td:nth-child(2) { text-align:left; white-space:normal; color:var(--ink-2); line-height:1.55; min-width:22ch; }
  .gloss td:last-child { text-align:left; white-space:normal; color:var(--mute); line-height:1.5; }
  .gloss .good { color:var(--pass); }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
  .trend { margin-top:10px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin-top:8px; }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  a { color:var(--signal); }

  .hero { padding-block:26px 4px; }

  /* The two questions are the product. Everything else on this page exists to
     support them, so they are the largest thing on it -- larger than the name,
     which is only a label. */
  .asks { margin:22px 0 0; border-top:2px solid var(--ink); border-bottom:1px solid var(--rule); padding-block:20px 22px; }
  /* The framing is light; the thing being asked carries the weight, so the
     answer a reader is here for is the boldest text on the page. */
  .ask { margin:0; font-family:"IBM Plex Serif", Georgia, serif; font-weight:400;
         font-size:clamp(21px, 3.3vw, 31px); line-height:1.25; letter-spacing:-.015em;
         color:var(--ink-2); text-wrap:balance; max-width:26ch; }
  .ask + .ask { margin-top:14px; }
  .ask span { color:var(--ink); font-weight:600; }
  .asks-lead { margin:0 0 14px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--signal); }

  .thesis { margin:20px 0 0; font-family:"IBM Plex Serif", Georgia, serif; font-size:15px; line-height:1.6; color:var(--ink-2); max-width:68ch; }
  .caps { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1px 26px; margin-top:22px; }
  .caps div { border-top:1px solid var(--rule); padding-block:9px 11px; }
  .caps dt { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--signal); }
  .caps dd { margin:4px 0 0; font-size:12px; color:var(--ink-2); line-height:1.5; }
  .foundation { margin-top:20px; border-left:3px solid var(--signal); padding:12px 14px; background:var(--surface); font-size:12.5px; color:var(--ink-2); line-height:1.6; max-width:76ch; }
  .foundation b { color:var(--ink); }
  .links { margin-top:16px; display:flex; gap:18px; flex-wrap:wrap; font-size:12px; }
  .subhead { padding-block:26px 0; border-bottom:none; }
  .subhead h1 { font-size:20px; }

  /* A key beneath a chart: swatches beside plain text, so no mark is read by colour alone. */
  .bandkey { display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin-top:9px; }
  .bandkey i { width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:6px; vertical-align:-1px; }

  /* One criterion the agent was graded against, with the judge's own quote
     underneath. A verdict nobody can check is an oracle, and an oracle is the
     one number on this page that could be wrong without anyone noticing. */
  .crit td:first-child { white-space:normal; text-align:left; line-height:1.5; max-width:52ch; }
  .quote { display:block; margin-top:5px; font-size:11px; color:var(--mute);
           font-style:italic; white-space:normal; line-height:1.5; }

  /* A segmented control for what a grid shows. One row, above the chart. */
  .seg { display:flex; flex-wrap:wrap; gap:0; margin-top:14px; }
  .seg button { font:inherit; font-size:11px; padding:5px 10px; background:var(--surface); color:var(--ink-2);
                border:1px solid var(--rule); margin-left:-1px; cursor:pointer; }
  .seg button:first-child { margin-left:0; border-radius:2px 0 0 2px; }
  .seg button:last-child { border-radius:0 2px 2px 0; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--surface); border-color:var(--ink); }

  /* The heatmap: one hue, lighter is lower. Cells carry their value as text, so
     the colour is never the only way to read one. A 2px surface gap separates
     adjacent fills. */
  .heat { border-collapse:separate; border-spacing:2px; }
  .heat tbody tr { border-bottom:0; }
  .heat td.hm { text-align:center; color:var(--ink); border-radius:2px; padding:9px 10px; }
  @media (prefers-color-scheme: dark) { .heat td.hm.hot { color:#04181D; } }
  .heat td:first-child { white-space:normal; line-height:1.3; }
  .heat .quote { font-style:normal; margin-top:2px; }
  .ramp { display:inline-block; width:120px; height:10px; border-radius:2px; vertical-align:-1px;
          background:linear-gradient(90deg, color-mix(in srgb, var(--signal) 6%, var(--surface)), color-mix(in srgb, var(--signal) 88%, var(--surface))); }
  .gloss code { font-size:11px; white-space:normal; }
  td.dim { color:var(--mute); }
  td.fail-text { color:var(--fail); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script>
const { useState, useEffect } = React;

// Report a failure to the server rather than to a console nobody is watching.
function report(where, err) {
  try {
    fetch("api/clienterror", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        where: where,
        message: String((err && err.message) || err),
        stack: String((err && err.stack) || ""),
      }),
    });
  } catch (_) { /* reporting must never be the thing that breaks */ }
}
window.addEventListener("error", e => report("window", e.error || e.message));
window.addEventListener("unhandledrejection", e => report("promise", e.reason));

// A dashboard that renders and then vanishes tells its operator nothing. React
// unmounts the whole tree when a render throws, so without this the symptom of
// any bug is a blank page.
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err: err }; }
  componentDidCatch(err, info) { report("render", err); console.error(err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div className="card">
      <div className="eyebrow">The dashboard broke</div>
      <h2>${String(this.state.err.message || this.state.err)}</h2>
      <pre style=${{whiteSpace:"pre-wrap",fontSize:"11px",color:"var(--mute)",marginTop:"10px"}}>${String(this.state.err.stack || "")}</pre>
    </div>`;
  }
}
const html = htm.bind(React.createElement);

const ms = n => (n || n === 0) ? Math.round(n) + "ms" : "-";
const pct = n => (n * 100).toFixed(n < 0.01 ? 1 : 1) + "%";
const when = s => new Date(s).toLocaleString();

function Pill({ v }) {
  return html`<span className="pill ${v}">${v}</span>`;
}

// Run history as a sparkline of worst p95 per run, oldest to newest. The whole
// reason the dashboard exists is the question "is this getting worse", and that
// is a shape rather than a number.
function Trend({ runs }) {
  const series = runs.filter(r => r.worst_p95_ms > 0).slice(0, 20).reverse();
  if (series.length < 2) return null;

  const W = 640, H = 120, PAD = 34;
  const max = Math.max(...series.map(r => r.worst_p95_ms)) * 1.15;
  const x = i => PAD + (i * (W - PAD - 12)) / Math.max(series.length - 1, 1);
  const y = v => H - 26 - (v / max) * (H - 48);
  const color = v => v === "fail" ? "var(--fail)" : v === "warn" ? "var(--warn)" : "var(--pass)";

  return html`
    <div className="trend">
      <div className="eyebrow">Worst p95 TTFA, last ${series.length} runs (oldest left)</div>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto"}}>
        <line x1=${PAD} y1=${H - 26} x2=${W - 12} y2=${H - 26} stroke="var(--rule)" strokeWidth="1"/>
        <text x="4" y=${y(max / 1.15) + 4} fontSize="10" fill="var(--mute)">${Math.round(max / 1.15)}</text>
        <polyline fill="none" stroke="var(--signal)" strokeWidth="2" strokeLinejoin="round"
          points=${series.map((r, i) => `${x(i)},${y(r.worst_p95_ms)}`).join(" ")}/>
        ${series.map((r, i) => html`
          <circle key=${r.id} cx=${x(i)} cy=${y(r.worst_p95_ms)} r="4.5"
            fill=${color(r.verdict)} stroke="var(--surface)" strokeWidth="2">
            <title>${r.id + "\n" + Math.round(r.worst_p95_ms) + "ms · " + r.verdict}</title>
          </circle>`)}
      </svg>
      <div className="legend">
        <span><i style=${{background:"var(--pass)"}}></i>pass</span>
        <span><i style=${{background:"var(--warn)"}}></i>warn</span>
        <span><i style=${{background:"var(--fail)"}}></i>fail</span>
      </div>
    </div>`;
}

// A reading has three parts, always in this order: what the numbers say, why
// that is what they say, and what to do about it. A dashboard that shows a
// chart and stops has handed its reader a research project.
function Reading({ verdict, why, act }) {
  // A reading is prose with values spliced through it, so htm hands back an
  // array of children rather than one element. React wants keys on any array,
  // and warns on stderr without rendering anything differently -- which is the
  // shape of every bug this dashboard has shipped. Keyed here once, so no
  // reading has to remember to wrap itself.
  const keyed = v => Array.isArray(v)
    ? v.map((c, i) => React.createElement(React.Fragment, { key: i }, c))
    : v;
  return html`
    <div className="read">
      <div className="read-verdict">${keyed(verdict)}</div>
      ${why && html`<div className="read-why">${keyed(why)}</div>`}
      ${act && html`<div className="read-do">${keyed(act)}</div>`}
    </div>`;
}

// Every number on the page, in plain words, before anyone meets it in a table.
// Assume the reader has never load-tested a voice agent: the column that
// matters is not the definition but what the number catches that no other
// number does.
const GLOSSARY = [
  ["p50 / p95 TTFA",
   "Time to first audio: you stop talking, and this is how long the line stays dead before the agent says anything. p50 is the middle turn; p95 is the turn worse than 95% of the rest.",
   "p50 is the call you usually get. p95 is the call that makes someone hang up, and it is always worse than the average suggests."],
  ["Endpointing",
   "The first half of that wait: how long the agent took to notice you had stopped, before it began working on a reply.",
   "It is a silence threshold, not computation. If this is the big half, a faster model changes nothing."],
  ["Think / speak",
   "The second half: the language model composing a reply plus the voice generating audio for it.",
   "This is the half that queues under load. If it grows while endpointing holds, the agent ran out of compute, not patience."],
  ["Agent TTFA",
   "TTFA with the network round trip taken out: every call pings the agent over its own connection, and that round trip is subtracted turn by turn.",
   "Observed TTFA moves when the test moves. This is the share the agent owns, so it is the figure to compare between runs placed from different places."],
  ["Talk ratio",
   "The agent's share of the speaking, counted in seconds of audio rather than lines of text.",
   "Published work puts half of voice agents at 0.80 or above. That is an agent delivering a monologue at a customer."],
  ["Words per minute",
   "Pace, measured over each side's own speaking time rather than the clock, so pauses do not flatter a slow agent.",
   "Above roughly 190 is faster than a person can comfortably follow on a phone line."],
  ["Interruption score",
   "0 to 5, as 5 x (1 - interruptions / turns). 5 means the agent never talked over the caller.",
   "The same formula the commercial platforms publish, so a run here can be read beside one from them."],
  ["Dead air",
   "Turns where the line stayed silent more than two seconds after the caller finished.",
   "A percentile says how slow the slow turns were. This says how often the call sounded broken, which is the thing a caller actually notices."],
  ["Word error rate",
   "How much of what the caller said the agent misheard, against the exact script the caller was given.",
   "The one failure no timing can show: an agent can answer in 300ms, fluently, to a question nobody asked."],
  ["Barge-in yield",
   "When the caller cuts in, how long the agent keeps talking before it stops.",
   "An agent that never stops has taken the floor from the person paying for the call."],
  ["Cost per turn",
   "Billable agent-minutes for the step, divided by the turns in it.",
   "Voice agents bill by the minute, so latency is a price. Verbosity is the same bill in a different disguise."],
  ["Two clocks",
   "Every step is timed twice: from the instant the caller actually stopped talking, and from the instant the agent's transcript of the caller arrived.",
   "Published latency numbers start the timer at different instants. A number is only comparable with another taken on the same clock."],
  ["Reference lines",
   "Thresholds and observations other people have published, each drawn on the clock its source defined, with its source and date.",
   "Where this agent sits against real deployments and vendor targets. They disagree with each other, so none of them is the verdict."],
  ["Phase",
   "What a step is for: smoke, ramp, stress, spike, soak or recovery. A spike jumps straight to peak, a soak holds one load for a long time, a recovery drops back to baseline afterwards.",
   "A profile of ramps only asks how much at once. It never asks what a sudden jump does, what an hour does, or whether the agent comes back."],
  ["Drift",
   "A step getting slower across its own duration while the load never changed, found by splitting its calls in half by start time.",
   "A leak, a filling queue or a cache going cold. All three look perfectly healthy in any single percentile for the step."],
  ["Task success",
   "Whether the agent did the job, graded by a language model reading the transcript against the scenario's written criteria.",
   "Every other number says how the call sounded. This is the only one that says whether it was worth making."],
  ["Heard versus done",
   "Task success split by how badly the agent misheard the caller, and the two groups compared.",
   "Whether the transcript is what is costing you tasks. A word error rate alone gives nobody a reason to act; this one either does or clears it."],
  ["Pacing drift",
   "How far the caller's audio drifted from real time. This measures the test rig, not the agent.",
   "Every other number is only worth reading while this stays near zero. A run that hides it is asking to be trusted."],
];

function Glossary() {
  const [open, setOpen] = useState(false);
  return html`
    <div className="card">
      <div className="eyebrow">Start here</div>
      <h2>What each number catches</h2>
      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        Latency percentiles say how long a caller waited. They say nothing about whether the agent
        lectured, raced, talked over the caller, misheard them, or left the line dead. Each row
        below is a failure the row above it cannot see.
      </div>
      <div className="tablewrap gloss">
        <table>
          <thead><tr><th>Term</th><th>What it means</th><th>What it catches</th></tr></thead>
          <tbody>
            ${(open ? GLOSSARY : GLOSSARY.slice(0, 4)).map(([t, m, c]) => html`
              <tr key=${t}><td>${t}</td><td>${m}</td><td>${c}</td></tr>`)}
          </tbody>
        </table>
      </div>
      <button className="run" style=${{border:"1px solid var(--rule)",marginTop:"10px",borderRadius:"2px",
              display:"block",width:"auto",padding:"7px 12px",fontSize:"11px",color:"var(--signal)"}}
              onClick=${() => setOpen(!open)}>
        ${open ? "Show fewer" : `Show all ${GLOSSARY.length} terms`}
      </button>
    </div>`;
}

// Anatomy of one turn, drawn to the run's own median so the picture is a
// measurement rather than an illustration. The split point is the thing being
// taught: TTFA is two different problems wearing one number.
function TurnAnatomy({ ep, ts }) {
  const total = ep + ts;
  if (total <= 0) return null;
  return html`
    <div>
      <div className="atrack">
        <div className="aseg ep" style=${{flex: Math.max(ep, total * 0.14)}}>
          <span>endpointing</span><b>${ms(ep)}</b>
        </div>
        <div className="aseg ts" style=${{flex: Math.max(ts, total * 0.14)}}>
          <span>think / speak</span><b>${ms(ts)}</b>
        </div>
      </div>
      <div className="amarks">
        <div style=${{flex: Math.max(ep, total * 0.14)}}>↑ you stop talking</div>
        <div className="between" style=${{flex: Math.max(ts, total * 0.14)}}>
          <span>↑ agent's transcript of you</span><span>↑ its first audio</span>
        </div>
      </div>
      <div className="ahalves">
        <div>
          <dt>Endpointing</dt>
          <dd>The agent is listening to silence and deciding whether you paused or finished.
              Nothing is being computed yet. <em>It is a configured threshold</em>, so it barely
              moves from turn to turn.</dd>
        </div>
        <div>
          <dt>Think / speak</dt>
          <dd>The language model composes a reply and the voice renders it.
              <em>This is real work</em>, so it varies with what you said and queues when the
              service is busy.</dd>
        </div>
      </div>
    </div>`;
}

// readSplit turns the two halves into the sentence a reader wants: which half
// is the problem, how it is known, and which knob it corresponds to.
//
// The tell is not size but behaviour. A configured silence threshold holds its
// value while load rises; compute does not. So the reading is driven by what
// moved between the first step and the worst one, not by which half is bigger
// at rest -- an agent can have a large, perfectly healthy endpointing setting.
function readSplit(rows) {
  const base = rows[0], peak = rows[rows.length - 1];
  const ep = peak.endpointing.p95_ms, ts = peak.think_speak.p95_ms;
  const share = ts / (ep + ts);

  if (rows.length < 2) {
    return {
      verdict: html`At ${base.concurrency} concurrent, <b>${Math.round(share * 100)}% of the wait
        is think/speak</b> and the rest is the agent noticing you stopped.`,
      why: html`One step cannot show which half gives way under load, because nothing was varied.
        The split itself is still worth knowing: it says where the time goes at rest.`,
      act: html`Run a profile with more than one concurrency step to find out which half grows.`,
    };
  }

  const epGrew = ep - base.endpointing.p95_ms;
  const tsGrew = ts - base.think_speak.p95_ms;
  const pct = (d, b) => (b > 0 ? Math.round((d / b) * 100) : 0);
  const epPct = pct(epGrew, base.endpointing.p95_ms), tsPct = pct(tsGrew, base.think_speak.p95_ms);
  const span = `${base.concurrency} to ${peak.concurrency} concurrent`;

  // Under 15% is noise on a sample this size, not a trend worth a fix.
  const moved = Math.max(Math.abs(epPct), Math.abs(tsPct)) >= 15;
  if (!moved) {
    return {
      verdict: html`Neither half gave way. From ${span} the wait held its shape:
        endpointing ${epPct >= 0 ? "+" : ""}${epPct}%, think/speak ${tsPct >= 0 ? "+" : ""}${tsPct}%.`,
      why: html`Both halves growing together, or neither growing, means this load never reached
        whatever this agent's limit is. The breakpoint is above the concurrency tested here.`,
      act: html`Push the profile higher. A sweep that never breaks has found a floor, not a ceiling.`,
    };
  }

  const thinkWon = tsGrew >= epGrew;
  return {
    verdict: thinkWon
      ? html`<b>Think/speak is the half that saturates.</b> From ${span} it
             grew ${ms(tsGrew)} (${tsPct >= 0 ? "+" : ""}${tsPct}%) while endpointing
             moved ${ms(epGrew)} (${epPct >= 0 ? "+" : ""}${epPct}%).`
      : html`<b>Endpointing is the half that saturates.</b> From ${span} it
             grew ${ms(epGrew)} (${epPct >= 0 ? "+" : ""}${epPct}%) while think/speak
             moved ${ms(tsGrew)} (${tsPct >= 0 ? "+" : ""}${tsPct}%).`,
    why: thinkWon
      ? html`That is the signature of compute queueing. Endpointing is a silence threshold: it is
             a timer, so it holds its value no matter how busy the service is. Think/speak is the
             language model and the voice doing real work, so it is what lengthens when there is
             more of that work than capacity for it.`
      : html`That is unusual, and worth checking before acting on. Endpointing is a configured
             timer, so it should not care how busy the service is. When it stretches under load
             the delay is usually transport — audio arriving late — rather than the threshold
             itself, which would make this a network finding rather than an agent one.`,
    act: thinkWon
      ? html`<b>Fix the reply, not the listening.</b> A smaller or faster model, a shorter system
             prompt, or streaming the voice so audio starts before the sentence is finished. Tuning
             the silence threshold buys nothing here: it was never the part that grew.`
      : html`<b>Check the transport before the settings.</b> Compare this against a local
             reference agent at the same concurrency. If endpointing stays flat there, the
             stretch is the network between you and the agent, not the agent.`,
  };
}

// Component share: how p95 TTFA divides between noticing the caller stopped
// and producing a reply, one bar per step.
//
// A single TTFA number cannot tell an endpointing problem from an inference
// problem, and the two have different fixes. The stack makes the growing half
// obvious: a bar whose left segment stays put while the right one stretches is
// an LLM or TTS queue, not a VAD.
function ComponentShare({ steps }) {
  const rows = steps.filter(s =>
    s.endpointing && s.endpointing.n > 0 && s.think_speak && s.think_speak.n > 0 &&
    s.endpointing.p95_ms + s.think_speak.p95_ms > 0);
  // One step still answers "what is this agent's split"; two or more answer
  // "which half moves under load". Both are worth drawing.
  if (rows.length < 1) {
    if (steps.length === 0) return null;
    return html`
      <div className="card">
        <div className="eyebrow">Which half saturates first</div>
        <h2>No split to draw</h2>
        <div className="note">
          Splitting TTFA needs the moment the agent's transcript of the caller arrived, and this
          run recorded none. A target that returns no user transcript can be timed but not
          decomposed.
        </div>
      </div>`;
  }

  const W = 640, ROW = 30, LEFT = 64, RIGHT = 78;
  const H = rows.length * ROW + 16;
  const max = Math.max(...rows.map(s => s.endpointing.p95_ms + s.think_speak.p95_ms)) * 1.02;
  const w = v => Math.max((v / max) * (W - LEFT - RIGHT), 0);
  const base = rows[0].think_speak.p95_ms / (rows[0].endpointing.p95_ms + rows[0].think_speak.p95_ms);

  return html`
    <div className="card">
      <div className="eyebrow">Which half saturates first</div>
      <h2>Anatomy of the wait</h2>
      <div className="read-why" style=${{marginTop:"8px"}}>
        The pause before an agent answers is two different problems wearing one number. Drawn to
        this run's own median turn:
      </div>
      <${TurnAnatomy} ep=${rows[0].endpointing.p50_ms} ts=${rows[0].think_speak.p50_ms}/>
      <h2 style=${{marginTop:"26px"}}>Which half moves under load</h2>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"12px"}}>
        ${rows.map((s, i) => {
          const ep = s.endpointing.p95_ms, ts = s.think_speak.p95_ms;
          const share = ts / (ep + ts);
          const y = i * ROW + 6;
          const shift = (share - base) * 100;
          return html`
            <g key=${s.name}>
              <text x="0" y=${y + 14} fontSize="11" fill="var(--ink-2)">${s.name}</text>
              <rect x=${LEFT} y=${y} width=${w(ep)} height="18" fill="var(--signal)" opacity="0.34"/>
              <rect x=${LEFT + w(ep)} y=${y} width=${w(ts)} height="18" fill="var(--signal)"/>
              <text x=${W - RIGHT + 8} y=${y + 13} fontSize="11" fill="var(--ink-2)">
                ${Math.round(share * 100)}% think${i > 0 && Math.abs(shift) >= 5
                  ? (shift > 0 ? " ▲" : " ▼") + Math.abs(Math.round(shift)) : ""}
              </text>
              <title>${s.name + "\n" + Math.round(ep) + "ms endpointing + " + Math.round(ts) + "ms think/speak"}</title>
            </g>`;
        })}
      </svg>
      <div className="legend">
        <span><i style=${{background:"var(--signal)",opacity:0.34}}></i>endpointing — noticing the caller stopped</span>
        <span><i style=${{background:"var(--signal)"}}></i>think/speak — LLM plus TTS</span>
      </div>
      <${Reading} ...${readSplit(rows)}/>
    </div>`;
}

// Cost per turn against concurrency.
//
// Voice agents bill by the minute, so latency is a price as well as an
// experience: every second the caller waits is a second of billed session. A
// step whose cost per turn climbs is an agent getting more expensive under
// exactly the load it was bought to handle, which no latency percentile states
// in the units a budget is written in.
function CostChart({ steps }) {
  const rows = steps.filter(s => s.cost && s.cost.usd_per_turn > 0);
  if (rows.length < 2) {
    // A card that silently disappears when its data is missing tells the
    // reader nothing, and looks identical to a card that is broken. Say which
    // of the two it is and what would populate it.
    const priced = steps.some(s => s.cost && s.cost.agent_minutes > 0);
    return html`
      <div className="card">
        <div className="eyebrow">What the latency costs</div>
        <h2>Not priced</h2>
        <div className="note">
          ${priced
            ? html`<span>This run counted ${steps.reduce((a, s) => a + ((s.cost && s.cost.agent_minutes) || 0), 0).toFixed(1)} agent-minutes
                   but was not given a rate. Re-run with <b>-rate-per-minute</b> to price it —
                   voice agents bill by the minute, so
                   latency is a cost as well as an experience.</span>`
            : html`<span>This run predates cost accounting. Runs placed from this version onward carry
                   billable minutes, and <b>-rate-per-minute</b> turns them into dollars.</span>`}
        </div>
      </div>`;
  }

  const W = 640, H = 150, PAD = 44;
  const max = Math.max(...rows.map(s => s.cost.usd_per_turn)) * 1.2;
  const x = i => PAD + (i * (W - PAD - 40)) / Math.max(rows.length - 1, 1);
  const y = v => H - 28 - (v / max) * (H - 50);
  const first = rows[0].cost.usd_per_turn;
  const last = rows[rows.length - 1].cost.usd_per_turn;

  return html`
    <div className="card">
      <div className="eyebrow">What the latency costs</div>
      <h2>Dollars per turn as concurrency rises</h2>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"8px"}}>
        <line x1=${PAD} y1=${H - 28} x2=${W - 40} y2=${H - 28} stroke="var(--rule)" strokeWidth="1"/>
        <text x="2" y=${y(max / 1.2) + 4} fontSize="10" fill="var(--mute)">$${(max / 1.2).toFixed(4)}</text>
        <polyline fill="none" stroke="var(--signal)" strokeWidth="2" strokeLinejoin="round"
          points=${rows.map((s, i) => `${x(i)},${y(s.cost.usd_per_turn)}`).join(" ")}/>
        ${rows.map((s, i) => html`
          <g key=${s.name}>
            <circle cx=${x(i)} cy=${y(s.cost.usd_per_turn)} r="4"
              fill="var(--signal)" stroke="var(--surface)" strokeWidth="2">
              <title>${s.name + "\n$" + s.cost.usd_per_turn.toFixed(4) + " per turn at " + s.concurrency + " concurrent"}</title>
            </circle>
            <text x=${x(i)} y=${H - 12} fontSize="10" fill="var(--mute)" textAnchor="middle">${s.concurrency}</text>
          </g>`)}
      </svg>
      <${Reading} ...${readCost(rows, steps)}/>
    </div>`;
}

// readLatency explains the headline table: what a percentile is, what the
// verdict compared against, and whether the run found a limit at all.
function readLatency(steps, rep) {
  const base = steps.find(s => s.name === rep.baseline) || steps[0];
  const worst = steps.reduce((a, s) => (s.ttfa.p95_ms > a.ttfa.p95_ms ? s : a), steps[0]);
  const bp = steps.find(s => s.verdict === "fail");
  const ratio = base.ttfa.p95_ms > 0 ? worst.ttfa.p95_ms / base.ttfa.p95_ms : 0;

  return {
    verdict: bp
      ? html`<b>It broke at ${bp.concurrency} concurrent calls.</b> p95
             reached ${ms(bp.ttfa.p95_ms)} — ${bp.p95_ratio ? bp.p95_ratio.toFixed(2) : "?"}× the
             baseline's own ${ms(base.ttfa.p95_ms)} at ${base.concurrency} concurrent.`
      : html`<b>Nothing broke.</b> The worst step, ${worst.name} at ${worst.concurrency} concurrent,
             held p95 at ${ms(worst.ttfa.p95_ms)} — ${ratio.toFixed(2)}× the baseline's ${ms(base.ttfa.p95_ms)}, inside the 2× line.`,
    why: html`p95 means 95 of every 100 turns were faster than this and 5 were slower. It is used
      instead of an average because averages hide the calls that lose customers: one turn in twenty
      is a call every hour on a busy line. The verdict compares each step against the baseline
      rather than a fixed target, because a latency that is generous for one agent is unreachable
      for another — <b>warn</b> past 1.5× the baseline, <b>fail</b> past 2×, or whenever call setup
      drops below 97%.`,
    act: bp
      ? html`That concurrency is this agent's ceiling under this scenario. Size capacity below it,
             or take the split below to find which half gave way first.`
      : html`This sweep found a floor, not a ceiling. Raise the profile's concurrency until a step
             fails, otherwise the number you can quote is "at least this", not "this".`,
  };
}

function readConversation(conv, steps) {
  // conv holds steps, not summaries: the conversation figures hang off each
  // one. Reading talk_ratio straight off the step yields NaN and prints it.
  const c = conv[conv.length - 1].conversation;
  const first = conv[0].conversation;
  const problems = [];
  if (c.talk_ratio >= 0.8) problems.push("lecturing");
  if (c.agent_wpm > 190) problems.push("rushing");
  if (c.dead_air_turns > 0) problems.push("dead air");
  if (c.interruption_score < 4.5) problems.push("interrupting");

  const pace = c.caller_wpm > 0 ? c.agent_wpm / c.caller_wpm : 1;
  return {
    verdict: problems.length === 0
      ? html`<b>It sounded like a conversation.</b> The agent held ${pct(c.talk_ratio)} of the
             speaking at ${Math.round(c.agent_wpm)} words a minute, never talked over the caller,
             and left no silence longer than two seconds.`
      : html`<b>It sounded off: ${problems.join(", ")}.</b> The agent held ${pct(c.talk_ratio)} of
             the floor at ${Math.round(c.agent_wpm)} wpm${c.dead_air_turns > 0
               ? html`, and ${c.dead_air_turns} turns left the line silent past two seconds` : ""}.`,
    why: html`None of this is visible in a latency chart. An agent can answer every turn in 300ms
      and still be unbearable: ${pct(c.talk_ratio)} of the talking means the caller
      got ${pct(1 - c.talk_ratio)} of it, and at ${Math.round(c.agent_wpm)} wpm against the
      caller's ${Math.round(c.caller_wpm)}, the agent speaks ${pace >= 1.08
        ? `${((pace - 1) * 100).toFixed(0)}% faster than` : pace <= 0.92
        ? `${((1 - pace) * 100).toFixed(0)}% slower than` : "at about the same pace as"} the
      person it is talking to. Dead air is counted separately from latency on purpose: a p95
      says how slow the slow turns were, this says how many of them sounded like a dropped call.
      ${conv.length > 1 && Math.abs(c.talk_ratio - first.talk_ratio) >= 0.03
        ? html` The ratio also moved from ${pct(first.talk_ratio)} at the lightest step, which
                means load changed how the agent spoke, not just how fast.`
        : conv.length > 1 ? html` The ratio held steady across every concurrency step.` : ""}`,
    act: problems.length === 0
      ? html`Nothing to fix here. If you want a harder test, add a scenario where the caller
             interrupts — <code>scenarios/barge-in.json</code> — since an agent only reveals
             whether it will yield the floor when something takes it.`
      : html`<b>These are prompt and voice settings, not capacity.</b>
             ${c.talk_ratio >= 0.8 ? "Cap reply length in the system prompt. " : ""}
             ${c.agent_wpm > 190 ? "Slow the voice: most providers expose a speaking-rate setting. " : ""}
             ${c.dead_air_turns > 0 ? "Dead air with healthy latency usually means a turn failed silently rather than slowly — check the failing turns above. " : ""}
             ${c.interruption_score < 4.5 ? "Lengthen the silence threshold so the agent stops cutting people off." : ""}`,
  };
}

function readCost(rows, steps) {
  const first = rows[0], last = rows[rows.length - 1];
  const rise = first.cost.usd_per_turn > 0
    ? last.cost.usd_per_turn / first.cost.usd_per_turn - 1 : 0;
  const total = steps.reduce((a, s) => a + ((s.cost && s.cost.usd) || 0), 0);
  const turns = steps.reduce((a, s) => a + (s.turns_total || 0), 0);
  // A thousand calls a day is a small deployment, and it makes a fraction of a
  // cent per turn legible as money.
  const perCall = last.cost.usd_per_call;

  return {
    verdict: rise >= 0.05
      ? html`<b>The same conversation costs ${(rise * 100).toFixed(0)}% more under load.</b>
             $${first.cost.usd_per_turn.toFixed(4)} a turn at ${first.concurrency} concurrent,
             $${last.cost.usd_per_turn.toFixed(4)} at ${last.concurrency}.`
      : html`<b>Load did not change the price.</b> A turn cost
             $${first.cost.usd_per_turn.toFixed(4)} at ${first.concurrency} concurrent and
             $${last.cost.usd_per_turn.toFixed(4)} at ${last.concurrency}.`,
    why: html`Voice agents bill for the time the session is open, so every second the caller spends
      waiting is a second you pay for. That makes latency a line item and verbosity another one:
      an agent that answers in 300ms and then talks for fifteen seconds is expensive in a way no
      percentile shows. This run billed ${steps.reduce((a, s) => a + ((s.cost && s.cost.agent_minutes) || 0), 0).toFixed(1)} agent-minutes
      across ${turns} turns at $${last.cost.rate_per_minute.toFixed(4)} a minute, or
      $${total.toFixed(2)} in total.`,
    act: html`At $${perCall.toFixed(4)} a call, <b>1,000 calls a day is about
      $${(perCall * 1000 * 30).toFixed(0)} a month</b>${rise >= 0.05
        ? html`, and that is the busy-hour price — the ${(rise * 100).toFixed(0)}% you see here is
               what the extra latency costs, so shortening replies pays twice.` : "."}${" "}Substitute your own volume; the per-call figure is the one to multiply.`,
  };
}

function readWER(rows) {
  const worst = rows.reduce((a, s) => (s.wer.mean > a.wer.mean ? s : a), rows[0]);
  const clean = worst.wer.mean <= 0.05;
  const w = worst.wer;
  // A local, because a sentence with three values in it has to fit on one line:
  // htm drops the whitespace wherever a line break lands next to a value or an
  // inline tag, and the space it drops is the one between two words.
  const errs = w.substitutions + w.deletions + w.insertions;
  return {
    verdict: clean
      ? html`<b>It heard the caller.</b> The worst step
             misheard ${pct(w.mean)} of the words: ${errs} errors across ${w.ref_words} spoken.`
      : html`<b>It misheard ${pct(w.mean)} of what was said</b> at ${worst.name}: ${errs} errors
             across ${w.ref_words} words.`,
    why: html`The caller's lines were generated from a known script, so this compares against what
      was actually spoken rather than one transcript against another. ${w.substitutions} of
      the errors are substitutions, which are the dangerous kind: a deletion usually produces a
      confused agent, but a substitution produces a confident one answering a different question.
      On an earlier run here the caller read order "four four eight one two", the agent heard
      "four four eight two", thanked them for it, and carried on toward refunding an order that
      was never named. Every timing number on that call looked healthy.`,
    act: clean
      ? html`Under 5% is the usual bar for usable recognition, so the transcript is not what is
             costing you tasks. Run with <code>-judge</code> to see whether the failures are in the
             agent's reasoning instead.`
      : html`<b>Fix the listening before the reasoning.</b> Try a stronger speech model, or supply
             domain keywords if the provider supports them — order numbers, product names and
             spelled-out digits are where these errors concentrate.`,
  };
}

function readBarge(rows) {
  const turns = rows.reduce((a, s) => a + s.barge_in.turns, 0);
  const yielded = rows.reduce((a, s) => a + s.barge_in.yielded, 0);
  const never = turns - yielded;
  const worst = rows.reduce((a, s) => Math.max(a, s.barge_in.yield_p95_ms), 0);
  return {
    verdict: never > 0
      ? html`<b>The agent kept talking ${never} of the ${turns} times it was interrupted.</b>`
      : html`<b>It stopped every time it was interrupted</b>, within ${ms(worst)} at worst.`,
    why: html`A real caller interrupts — to correct a wrong order number, to say they already tried
      that. Callstorm measures this by starting the next caller line while the agent is still
      speaking and timing how long the agent's audio keeps coming. A zero here is not a good
      score: it means the agent was never observed to stop at all, which is why it is reported as
      a failure rather than as instant.`,
    act: never > 0
      ? html`<b>This is the worst failure on the page.</b> An agent that will not yield has taken
             the floor from the person paying for the call. Check that barge-in is enabled at all,
             and that the caller's audio is reaching the agent while it speaks.`
      : html`Under about 500ms reads as a person stopping mid-sentence. Above a second the caller
             will start talking over it again, and both sides end up repeating themselves.`,
  };
}

// Reference lines: what other people have published, each read on the clock
// its source defined.
//
// This replaced a single absolute grade. That grade presented one vendor's
// latency bands as if they were settled, and applied them on a different clock
// from the vendor's own; the same acronym is published with different
// thresholds measured between different instants. So no line here is a verdict.
// Each carries its source, its date and its source's boundary, and is drawn
// only on the clock that boundary matches. The verdict stays relative.
//
// The lines live in internal/loadgen/references.json, served as
// api/references.json. A run records the lines it was read against; a run
// recorded before them is read against the served list.
const fmtS = v => (v >= 1000 ? `${(v / 1000).toFixed(v % 1000 === 0 ? 0 : 1)}s` : `${Math.round(v)}ms`);
const lineText = r => (r.to_ms > 0 ? `${fmtS(r.ms)} to ${fmtS(r.to_ms)}` : fmtS(r.ms));
const CLOCKS = [
  ["end_of_speech", "From true end of speech", "ttfa"],
  ["detection", "From detection", "think_speak"],
];
const KIND_ORDER = ["observed", "target", "perceptual"];
const KIND_LABEL = { observed: "where agents are", target: "published target", perceptual: "human reference" };

// placeRef mirrors loadgen.Place: the step's value on the line's own clock and
// percentile, or p50 and p95 both when the source states no percentile.
function placeRef(r, s) {
  const sum = s[r.axis === "detection" ? "think_speak" : "ttfa"];
  if (!sum || !(sum.n > 0)) return [];
  const top = r.to_ms > 0 ? r.to_ms : r.ms;
  const key = { 50: "p50_ms", 90: "p90_ms", 95: "p95_ms", 99: "p99_ms" };
  return (r.percentile ? [r.percentile] : [50, 95]).map(p => {
    const v = sum[key[p]] || 0;
    return { percentile: p, value_ms: v, over: v > top };
  });
}

function ReferenceLines({ steps, refs }) {
  const rows = steps.filter(s => s.ttfa && s.ttfa.n > 0);
  if (rows.length === 0) return null;
  const lines = (refs || []).slice().sort((a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind));
  if (lines.length === 0) {
    return html`
      <div className="card">
        <div className="eyebrow">Reference lines</div>
        <h2>No reference lines loaded</h2>
        <div className="note">
          The published lines are read from <code>api/references.json</code>, and it did not load.
          The verdict above does not depend on them.
        </div>
      </div>`;
  }

  const W = 640, LEFT = 104, RIGHT = 20, ROW = 20, GAP = 26, LABEL = 12;
  const vals = [];
  for (const [, , key] of CLOCKS) for (const s of rows) if (s[key] && s[key].n > 0) vals.push(s[key].p95_ms);
  for (const r of lines) vals.push(r.to_ms > 0 ? r.to_ms : r.ms);
  const axis = Math.max(...vals) * 1.08;
  const x = v => LEFT + (Math.min(Math.max(v, 0), axis) / axis) * (W - LEFT - RIGHT);
  let cursor = 0;
  const panels = CLOCKS.map(([id, title, key]) => {
    const onAxis = lines.filter(r => r.axis === id);
    const top = cursor;
    const rowsTop = top + 20 + onAxis.length * LABEL + 8;
    const bottom = rowsTop + rows.length * ROW;
    cursor = bottom + GAP;
    return { id, title, key, onAxis, top, rowsTop, bottom };
  });
  const H = cursor - GAP + 22;

  return html`
    <div className="card">
      <div className="eyebrow">Reference lines</div>
      <h2>Where this run sits against what others have published</h2>
      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        Every step is drawn twice: timed from the instant the caller actually stopped talking, and
        from the instant the agent's transcript of the caller arrived. Published thresholds disagree,
        often because they start the clock at different instants, so each line is drawn only on the
        clock its source defined, with the source beside it.
      </div>
      <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"14px"}}>
        ${panels.map(p => html`<g key=${p.id}>
          <text x="0" y=${p.top + 12} fontSize="11" fontWeight="600" fill="var(--ink)">${p.title}</text>
          ${p.onAxis.map((r, i) => html`<g key=${r.id}>
            ${r.to_ms > 0
              ? html`<rect x=${x(r.ms)} y=${p.top + 18} width=${Math.max(x(r.to_ms) - x(r.ms), 2)} height=${p.bottom - p.top - 18} fill="var(--ref)" opacity="0.18"/>`
              : html`<line x1=${x(r.ms)} y1=${p.top + 18} x2=${x(r.ms)} y2=${p.bottom} stroke="var(--ink-2)" strokeWidth="1" strokeDasharray=${r.kind === "perceptual" ? "1 3" : "4 3"}/>`}
            <text x=${Math.min(x(r.ms) + 4, W - RIGHT - 170)} y=${p.top + 20 + (i + 1) * LABEL} fontSize="9.5" fill="var(--ink-2)">${r.label} · ${lineText(r)}</text>
          </g>`)}
          ${rows.map((s, i) => {
            const sum = s[p.key];
            const y = p.rowsTop + i * ROW + ROW / 2;
            if (!sum || !(sum.n > 0)) {
              return html`<text key=${s.name} x="0" y=${y + 4} fontSize="10" fill="var(--mute)">${s.name} · no samples</text>`;
            }
            return html`<g key=${s.name}>
              <text x="0" y=${y + 4} fontSize="11" fill="var(--ink-2)">${s.name}</text>
              <line x1=${x(sum.p50_ms)} y1=${y} x2=${x(sum.p95_ms)} y2=${y} stroke="var(--signal)" strokeWidth="1.5"/>
              <circle cx=${x(sum.p95_ms)} cy=${y} r="4.5" fill="var(--surface)" stroke="var(--signal)" strokeWidth="2">
                <title>${s.name + " p95 " + Math.round(sum.p95_ms) + "ms, " + p.title.toLowerCase()}</title>
              </circle>
              <circle cx=${x(sum.p50_ms)} cy=${y} r="5" fill="var(--signal)">
                <title>${s.name + " p50 " + Math.round(sum.p50_ms) + "ms, " + p.title.toLowerCase()}</title>
              </circle>
            </g>`;
          })}
        </g>`)}
        <text x=${LEFT} y=${H - 6} fontSize="10" fill="var(--mute)">0</text>
        <text x=${W - RIGHT} y=${H - 6} fontSize="10" textAnchor="end" fill="var(--mute)">${fmtS(axis / 1.08)}</text>
      </svg>
      <div className="bandkey">
        <span><i style=${{background:"var(--signal)",borderRadius:"50%"}}></i>filled dot = p50</span>
        <span><i style=${{background:"var(--surface)",border:"2px solid var(--signal)",borderRadius:"50%"}}></i>hollow dot = p95</span>
        <span><i style=${{background:"var(--ref)",opacity:0.35}}></i>shaded = an observed range</span>
      </div>
      <div className="tablewrap gloss">
        <table>
          <thead><tr><th>Line</th><th>Its source's boundary</th><th>Why it sits on this clock</th><th>This run</th></tr></thead>
          <tbody>
            ${lines.map(r => {
              const marks = rows.flatMap(s => placeRef(r, s).map(m => ({ ...m, step: s.name })));
              const over = marks.filter(m => m.over);
              return html`<tr key=${r.id}>
                <td><b>${r.label}</b><span className="quote">${lineText(r)}${r.percentile ? ` at p${r.percentile}` : ", no percentile stated"} · ${r.axis === "detection" ? "from detection" : "from end of speech"} · ${KIND_LABEL[r.kind] || r.kind}</span>${(r.cites || []).map(c => html`<span key=${c.source + c.title} className="quote">${c.url ? html`<a href=${c.url}>${c.source}, ${c.title}</a>` : `${c.source}, ${c.title}`}, ${c.published}</span>`)}</td>
                <td>${r.boundary}</td>
                <td>${r.placement}</td>
                <td>${marks.length === 0 ? "no samples on this clock" : over.length === 0 ? "every step under" : `over at ${over.map(m => `${m.step} p${m.percentile} ${fmtS(m.value_ms)}`).join(", ")}`}</td>
              </tr>`;
            })}
          </tbody>
        </table>
      </div>
      <${Reading} ...${readReferences(rows, lines)}/>
    </div>`;
}

function readReferences(rows, lines) {
  const marksOf = r => rows.flatMap(s => placeRef(r, s).map(m => ({ ...m, step: s.name })));
  const worst = r => marksOf(r).reduce((a, m) => (!a || m.value_ms > a.value_ms ? m : a), null);
  const best = r => marksOf(r).reduce((a, m) => (!a || m.value_ms < a.value_ms ? m : a), null);
  const src = r => (r.cites && r.cites[0] ? r.cites[0].source : "its source");
  const observed = lines.find(r => r.kind === "observed");
  const human = lines.find(r => r.kind === "perceptual");
  const targets = lines.filter(r => r.kind === "target");
  const o = observed && worst(observed);
  const h = human && best(human);

  const verdict = !o
    ? html`<b>Read against ${lines.length} published lines</b>, each on its own clock.`
    : o.value_ms < observed.ms
    ? html`<b>Faster than agents in production.</b> Its slowest typical wait was ${fmtS(o.value_ms)} at ${o.step}, under the ${lineText(observed)} median ${src(observed)} observed in real deployments.`
    : o.over
    ? html`<b>Slower than agents in production.</b> Its slowest typical wait was ${fmtS(o.value_ms)} at ${o.step}, past the ${lineText(observed)} median ${src(observed)} observed in real deployments.`
    : html`<b>About where agents in production are.</b> Its slowest typical wait was ${fmtS(o.value_ms)} at ${o.step}, inside the ${lineText(observed)} median ${src(observed)} observed in real deployments.`;

  const targetText = targets.map(r => {
    const w = worst(r);
    if (!w) return `${r.label} has no samples on its clock`;
    return `${r.label} ${w.over ? "was crossed" : "held"}, worst ${fmtS(w.value_ms)} at ${w.step} p${w.percentile}`;
  }).join("; ");

  return {
    verdict: verdict,
    why: html`Start from where real agents are, not from where a person would be. Against the published targets: ${targetText || "none loaded"}.${h ? ` On the ${human.label.toLowerCase()} at ${lineText(human)}, where a person would answer, this agent's fastest typical wait was ${fmtS(h.value_ms)}.` : ""} These numbers come from different vendors measuring between different instants, so each is drawn only on the clock its source defined, and none of them decides pass or fail.`,
    act: html`<b>Quote a latency with its clock.</b> A p95 says nothing until it says where the timer started. This page gives every step on both clocks, and the appendix shows which published boundaries each Callstorm number spans. Pass and fail are still decided against this run's own baseline.`,
  };
}

// PhaseTable: the shape of each step over its own duration.
//
// Every other figure on this page is one number for a whole step, which
// quietly assumes the step was the same thing from start to finish. Two
// failures live in that assumption -- an agent that degrades while the load
// holds steady, and one that absorbs a jump but takes its time about it -- and
// both look identical to a single percentile.
function PhaseTable({ steps }) {
  const rows = steps.filter(s => s.phase && s.phase.kind);
  const informative = rows.some(s =>
    s.phase.kind !== "ramp" || (s.phase.drift && s.phase.drift !== "unknown"));
  if (!informative) return null;

  const label = { steady: "held steady", drifting: "got slower", settling: "got faster",
                  unknown: "too short to tell" };
  return html`
    <div className="card">
      <div className="eyebrow">Phase shape</div>
      <h2>What each phase did over its own duration</h2>
      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        Each step is split in half by when its calls started, and the two halves are compared.
        A step whose load never changed but whose median did is drifting, and drift is the one
        failure a single percentile for the whole step cannot show.
      </div>
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Phase</th><th>Held</th><th>First half</th><th>Second half</th>
            <th>Change</th><th>Reading</th>
          </tr></thead>
          <tbody>
            ${rows.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}</td>
                <td>${s.phase.kind}</td>
                <td>${s.phase.held_s > 0 ? Math.round(s.phase.held_s) + "s" : "-"}</td>
                <td>${s.phase.first_half && s.phase.first_half.n > 0 ? ms(s.phase.first_half.p50_ms) : "-"}</td>
                <td>${s.phase.second_half && s.phase.second_half.n > 0 ? ms(s.phase.second_half.p50_ms) : "-"}</td>
                <td>${s.phase.drift === "unknown" ? "-"
                      : `${s.phase.drift_pct >= 0 ? "+" : ""}${Math.round(s.phase.drift_pct * 100)}%`}</td>
                <td>${label[s.phase.drift] || s.phase.drift}${s.phase.kind === "recovery"
                      ? (s.phase.recovered ? " · back to baseline" : " · did not come back") : ""}</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
      <div className="note">
        The comparison is made on the median rather than p95. A half-step carries half the samples,
        and a p95 over a dozen turns is one unlucky call rather than a trend. "Too short to tell"
        is not a synonym for steady: it means the step never ran long enough to have a shape.
      </div>
      <${Reading} ...${readPhases(rows)}/>
    </div>`;
}

function readPhases(rows) {
  const drifting = rows.filter(s => s.phase.drift === "drifting");
  const recovery = rows.find(s => s.phase.kind === "recovery");
  const spike = rows.find(s => s.phase.kind === "spike");
  const soak = rows.find(s => s.phase.kind === "soak");

  const d0 = drifting[0];
  const names = drifting.map(s => s.name).join(", ");
  const own = drifting.length > 1 ? "their own durations" : "its own duration";
  const from = d0 && ms(d0.phase.first_half.p50_ms), to = d0 && ms(d0.phase.second_half.p50_ms);
  const secs = d0 && Math.round(d0.phase.held_s);

  const verdict = drifting.length > 0
    ? html`<b>${names} got slower over ${own} while the load never
           changed.</b> Its median moved from ${from} to ${to} across ${secs} seconds.`
    : recovery && !recovery.phase.recovered
    ? html`<b>It did not come back.</b> ${recovery.name} returned to the baseline's concurrency but
           held p95 at ${recovery.p95_ratio ? recovery.p95_ratio.toFixed(2) : "?"}× the baseline's,
           so whatever the load did to this agent outlasted the load.`
    : html`<b>No phase drifted.</b> Every step that ran long enough to have a shape kept it: the
           calls at the end were as fast as the calls at the start.`;

  return {
    verdict: verdict,
    why: html`A profile made only of ramps asks one question — how much at once. Three others need
      a phase of their own.${spike ? html` A ${"spike"} jumps straight to peak with no warm-up,
      which is what a marketing email does to a support line and what a ramp never reproduces.` : ""}${soak
      ? html` A ${"soak"} holds one load long enough for a leak, a filling queue or a cache going
      cold to show; none of those appear in a step that lasts ninety seconds.` : ""}${recovery
      ? html` A ${"recovery"} drops back to the baseline's own concurrency afterwards, because an
      agent that survives the peak and never returns to normal has failed in a way the peak itself
      never showed.` : ""}`,
    act: drifting.length > 0
      ? html`<b>Look for something that accumulates.</b> Memory, an unbounded queue, a connection
             pool that never gives connections back, a context window that grows with the
             conversation. A run slower at its end than its start under identical load is not a
             capacity problem, and adding capacity will not fix it — it will only make the same
             failure take longer to appear.`
      : recovery && !recovery.phase.recovered
      ? html`<b>Check what the peak left behind.</b> Retries still draining, a queue still full, or
             connections that were never closed. Extend the recovery phase: if it comes back after
             five minutes, that is the real recovery time and it belongs in the runbook.`
      : soak
      ? html`Nothing accumulating that this soak was long enough to see.
             Lengthen <code>hold_s</code> before trusting that: leaks are measured in hours,
             and ${Math.round(soak.phase.held_s)} seconds is a smoke test for one.`
      : html`Add a soak and a recovery phase — <code>profiles/hamming-local.json</code> carries all
             six — since a profile of ramps only ever asks how much at once.`,
  };
}

// WERStrip: every judged call as a dot, placed by how badly the agent misheard
// it, in two lanes for whether it finished the job.
//
// The chart is the argument. If mishearing costs the agent the task, the
// failures pile up on the right of the threshold and the successes on the
// left, and nobody has to be talked into the conclusion. If the two lanes look
// the same, the transcript is not what is costing you tasks -- which is just
// as useful and much easier to disbelieve from a table of averages.
function WERStrip({ calls, threshold }) {
  const pts = calls.filter(c => c.judged && c.ref_words > 0);
  if (pts.length === 0) return null;

  const W = 640, H = 132, LEFT = 128, RIGHT = 18, TOP = 26;
  const max = Math.max(0.1, threshold * 2, ...pts.map(c => c.wer)) * 1.12;
  const x = w => LEFT + (w / max) * (W - LEFT - RIGHT);
  const lane = met => TOP + (met ? 16 : 62);

  return html`
    <svg viewBox="0 0 ${W} ${H}" style=${{width:"100%",height:"auto",marginTop:"16px"}}>
      <text x="0" y=${lane(true) + 4} fontSize="11" fill="var(--pass)">did the job</text>
      <text x="0" y=${lane(false) + 4} fontSize="11" fill="var(--fail)">did not</text>
      <line x1=${LEFT} y1=${lane(true)} x2=${W - RIGHT} y2=${lane(true)}
        stroke="var(--rule-soft)" strokeWidth="1"/>
      <line x1=${LEFT} y1=${lane(false)} x2=${W - RIGHT} y2=${lane(false)}
        stroke="var(--rule-soft)" strokeWidth="1"/>
      <line x1=${x(threshold)} y1=${TOP - 8} x2=${x(threshold)} y2=${H - 22}
        stroke="var(--ink-2)" strokeWidth="1" strokeDasharray="3 3"/>
      <text x=${x(threshold)} y=${TOP - 13} fontSize="10" textAnchor="middle"
        fill="var(--ink-2)">${Math.round(threshold * 100)}% — usable</text>
      ${pts.map((c, i) => html`
        <circle key=${c.step + "/" + c.request_id + "/" + i} cx=${x(c.wer)}
          cy=${lane(c.met) + ((i % 3) - 1) * 5} r="5"
          fill=${c.met ? "var(--pass)" : "var(--fail)"} fillOpacity="0.75"
          stroke="var(--surface)" strokeWidth="1.5">
          <title>${c.step + " misheard " + (c.wer * 100).toFixed(1) + "% of " + c.ref_words +
                   " words, and " + (c.met ? "completed the task" : "did not")}</title>
        </circle>`)}
      <line x1=${LEFT} y1=${H - 18} x2=${W - RIGHT} y2=${H - 18} stroke="var(--rule)" strokeWidth="1"/>
      <text x=${LEFT} y=${H - 5} fontSize="10" fill="var(--mute)">0%</text>
      <text x=${W - RIGHT} y=${H - 5} fontSize="10" textAnchor="end"
        fill="var(--mute)">${(max * 100).toFixed(0)}% of words misheard</text>
    </svg>`;
}

// TaskSuccessCard answers the question the latency half of this page cannot:
// the agent was fast, but did it do what it was called to do -- and if it
// failed, was mishearing the caller the reason?
function TaskSuccessCard({ judge }) {
  if (!judge) {
    return html`
      <div className="card">
        <div className="eyebrow">Task success</div>
        <h2>This run was not judged</h2>
        <div className="note">
          Every number above says how the agent sounded. None of them says whether it did the job.
          Re-run with <code>-judge</code> and a scenario that defines <code>success_criteria</code>,
          and this card grades each conversation against them and then asks whether the calls it
          misheard are the calls it failed.
        </div>
      </div>`;
  }

  const x = judge.correlation || {};
  const calls = judge.calls || [];
  const misses = (judge.misses || []).filter(m => m.judged > 0);

  return html`
    <div className="card">
      <div className="eyebrow">Task success</div>
      <h2>Did it actually do the job?</h2>
      <dl className="spec">
        <div><dt>Conversations graded</dt><dd>${judge.judged}</dd></div>
        <div><dt>Met every criterion</dt><dd>${judge.passed} of ${judge.judged}</dd></div>
        <div><dt>Could not be graded</dt><dd>${judge.errored}</dd></div>
        <div><dt>Graded by</dt><dd>${judge.backend || "unknown"}</dd></div>
      </dl>

      ${misses.length > 0 && html`
        <div className="tablewrap">
          <table>
            <thead><tr><th>Criterion</th><th>Met</th><th>Missed</th></tr></thead>
            <tbody>
              ${misses.map(m => html`
                <tr key=${m.criterion} className="crit">
                  <td>${m.criterion}${m.missed > 0 && m.evidence
                        ? html`<span className="quote">${m.evidence}</span>` : ""}</td>
                  <td>${m.judged - m.missed}</td>
                  <td>${m.missed}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>`}

      <div className="note">
        The grader reads the transcript and nothing else, so it can only decide what words show.
        Anything about timing, pauses or whether the agent stopped when interrupted is measured
        directly elsewhere on this page — a judge asked to guess at those from text gives a
        confident wrong answer. Every verdict above carries the line it was drawn from, because a
        score nobody can check is the one number here that could be wrong unnoticed.
      </div>

      ${x.calls > 0 && html`
        <div style=${{marginTop:"22px",borderTop:"1px solid var(--rule)",paddingTop:"16px"}}>
          <div className="eyebrow">Heard versus done</div>
          <h2 style=${{marginTop:"4px"}}>Are the calls it misheard the calls it failed?</h2>
          <${WERStrip} calls=${calls} threshold=${x.threshold || 0.05}/>
          <div className="tablewrap">
            <table>
              <thead><tr><th>Group</th><th>Calls</th><th>Did the job</th><th>Rate</th></tr></thead>
              <tbody>
                <tr>
                  <td>Heard cleanly (under ${Math.round((x.threshold || 0.05) * 100)}% misheard)</td>
                  <td>${x.clean_calls}</td><td>${x.clean_passed}</td>
                  <td>${x.clean_calls > 0 ? pct(x.clean_pass_rate) : "-"}</td>
                </tr>
                <tr>
                  <td>Misheard</td>
                  <td>${x.misheard_calls}</td><td>${x.misheard_passed}</td>
                  <td>${x.misheard_calls > 0 ? pct(x.misheard_pass_rate) : "-"}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <${Reading} ...${readTaskSuccess(judge)}/>
        </div>`}

      ${!(x.calls > 0) && html`
        <${Reading} ...${readTaskSuccess(judge)}/>`}
    </div>`;
}

function readTaskSuccess(j) {
  const x = j.correlation || {};
  const worst = (j.misses || []).filter(m => m.judged > 0)
    .reduce((a, m) => (!a || m.missed > a.missed ? m : a), null);
  const allPassed = j.passed === j.judged && j.judged > 0;

  // No correlation to draw: report the task result and say plainly why the
  // join is missing, rather than leaving a card that looks half-rendered.
  if (!(x.calls > 0)) {
    return {
      verdict: allPassed
        ? html`<b>It did the job every time.</b> All ${j.judged} graded conversations met every
               criterion.`
        : html`<b>It met every criterion on ${j.passed} of ${j.judged} conversations.</b>${worst &&
               worst.missed > 0
                 ? html` The one it missed most often: ${worst.criterion}.` : ""}`,
      why: html`The transcript accuracy of these calls could not be joined to their verdicts, so
        there is nothing here to say whether mishearing caused the failures. That happens when the
        target returned no transcript of the caller, which is the usual case against a reference
        agent that does no speech recognition at all.`,
      act: html`Run the same profile against the real agent to get the join. Against a reference
        target the task verdict is still meaningful; the correlation is not.`,
    };
  }

  const gap = x.gap || 0;
  return {
    verdict: !x.conclusive
      ? html`<b>No conclusion to draw yet:</b> ${x.note}. The two groups are reported below
             because they are what was measured; nothing is read into them.`
      : gap > 0
      ? html`<b>Mishearing is costing it the task.</b> The calls it heard cleanly finished the
             job ${pct(x.clean_pass_rate)} of the time; the ones it misheard,
             only ${pct(x.misheard_pass_rate)} — a gap of ${Math.round(gap * 100)} points.`
      : html`<b>Mishearing is not what is failing these calls.</b> Cleanly heard calls
             finished ${pct(x.clean_pass_rate)} of the time and misheard
             ones ${pct(x.misheard_pass_rate)}, which is no separation worth acting on.`,
    why: html`This is the join that makes word error rate worth measuring. On its own a WER figure
      is an accuracy statistic with no action attached — nobody knows whether 6% matters. Set
      against task outcomes it either points at the transcript as the thing to fix, or shows the
      failures are somewhere else and the WER number is a distraction. The same question from the
      other side needs no threshold at all: the calls that passed were
      misheard ${pct(x.median_wer_passed)} of the time at the median, the ones that
      failed ${pct(x.median_wer_failed)}. This is an association and nothing stronger — nothing assigned
      which calls got misheard, and load degrades recognition and everything else at once.`,
    act: !x.conclusive
      ? html`Raise <code>-judge-calls</code>, or judge every call with <code>-judge-calls 0</code>.
             Splitting a handful of conversations into two groups lets one call move a pass rate
             by twenty points, which is a conclusion the data cannot carry.`
      : gap > 0
      ? html`<b>Fix the listening before the reasoning.</b> A stronger speech model, or domain
             keywords if the provider supports them — order numbers, product names and spelled-out
             digits are where these errors concentrate. Changing the prompt or the model that
             thinks will not help an agent that was answering a different question.`
      : html`<b>Look past the transcript.</b> The agent heard these callers and still did not
             finish the job, so the failure is in the reasoning, the tools or the prompt. Read the
             quoted evidence above: the judge names the criterion and the line it failed on.`,
  };
}

// What the agent contributed: observed TTFA with the network round trip taken
// out.
//
// Observed TTFA is what the caller waited through, and it includes the network
// between wherever this test ran and the agent's edge. Move the test and the
// number moves, with no change to the agent. Every call pings the agent over its
// own connection; a ping is answered by the server's WebSocket layer rather than
// the agent, so its round trip is the network's share, and subtracting it turn
// by turn leaves an estimate of the agent's. The verdict stays on the observed
// figure, which is what a caller in that place actually experiences.
function AgentLatency({ steps }) {
  const rows = steps.filter(s => s.ttfa && s.ttfa.n > 0);
  if (rows.length === 0) return null;
  const corrected = rows.filter(s => s.agent_ttfa && s.agent_ttfa.n > 0);
  if (corrected.length === 0) {
    const pinged = rows.some(s => "transport_rtt" in s);
    return html`
      <div className="card">
        <div className="eyebrow">What the agent contributed</div>
        <h2>${pinged ? "The network could not be taken out" : "Not separated from the network"}</h2>
        <div className="note">
          ${pinged
            ? html`<span>Every call pinged the agent over its own connection and no pong came back, so this run's TTFA cannot be corrected for the network. The observed figures include the round trip between the test and the agent's edge.</span>`
            : html`<span>This run predates round-trip measurement, so its TTFA includes the network between the test and the agent's edge with no way to take it out. Runs placed from this version onward ping the agent on every call.</span>`}
        </div>
      </div>`;
  }

  return html`
    <div className="card">
      <div className="eyebrow">What the agent contributed</div>
      <h2>The wait, with the network taken out</h2>
      <div className="read-why" style=${{marginTop:"8px",maxWidth:"78ch"}}>
        Observed TTFA is what the caller waited through, and it includes the network between wherever this test ran and the agent. Every call pings the agent over its own connection, and the round trip it measures is subtracted turn by turn to estimate the agent's own share.
      </div>
      <div className="tablewrap">
        <table>
          <thead><tr>
            <th>Step</th><th>Observed p50</th><th>Observed p95</th><th>Round trip p50</th>
            <th>Agent p50</th><th>Agent p95</th><th>Corrected</th>
          </tr></thead>
          <tbody>
            ${rows.map(s => html`
              <tr key=${s.name}>
                <td>${s.name}</td>
                <td>${ms(s.ttfa.p50_ms)}</td>
                <td>${ms(s.ttfa.p95_ms)}</td>
                <td>${s.transport_rtt && s.transport_rtt.n > 0 ? ms(s.transport_rtt.p50_ms) : "-"}</td>
                <td>${s.agent_ttfa && s.agent_ttfa.n > 0 ? ms(s.agent_ttfa.p50_ms) : "-"}</td>
                <td>${s.agent_ttfa && s.agent_ttfa.n > 0 ? ms(s.agent_ttfa.p95_ms) : "-"}</td>
                <td>${s.agent_ttfa ? s.agent_ttfa.n : 0} of ${s.ttfa.n} turns</td>
              </tr>`)}
          </tbody>
        </table>
      </div>
      <div className="note">
        The correction is an estimate. A ping travels the same connection as the audio, so it waits in the same queues, and its pong is read by the same code that times the agent's reply, so the harness's own delay cancels too. It cannot see inside the agent: speech recognition, the model and the voice stay together in the agent's share. Think/speak needs no correction, because both of its instants arrive over the same connection.
      </div>
      <${Reading} ...${readAgentLatency(corrected)}/>
    </div>`;
}

function readAgentLatency(rows) {
  const peak = rows.reduce((a, s) => (s.ttfa.p50_ms > a.ttfa.p50_ms ? s : a), rows[0]);
  const rtt = peak.transport_rtt && peak.transport_rtt.n > 0 ? peak.transport_rtt.p50_ms : 0;
  const share = peak.ttfa.p50_ms > 0 ? rtt / peak.ttfa.p50_ms : 0;
  const big = share >= 0.2;
  return {
    verdict: big
      ? html`<b>The network is ${Math.round(share * 100)}% of the wait.</b> At ${peak.name} the caller usually waited ${ms(peak.ttfa.p50_ms)}, the round trip to the agent was ${ms(rtt)}, and the agent's own share was ${ms(peak.agent_ttfa.p50_ms)}.`
      : html`<b>The wait is the agent's.</b> At ${peak.name} the round trip was ${ms(rtt)} of a typical ${ms(peak.ttfa.p50_ms)} wait, leaving ${ms(peak.agent_ttfa.p50_ms)} as the agent's own share.`,
    why: html`A latency measured from one place includes the path from that place. The same agent tested from a laptop on hotel Wi-Fi and from a server beside its edge gets two observed TTFAs and one agent TTFA, which is what makes the agent figure comparable between runs placed from different machines. The observed figure is still the one a caller in that place experiences, so it is the one the verdict is scored on.`,
    act: big
      ? html`<b>Do not tune the agent for this share.</b> Run the test closer to the agent, or quote the agent figure beside the observed one. No endpointing threshold or model choice moves a round trip.`
      : html`Tune the agent, not the path: nearly all of this wait happens inside it. The split further down says whether it goes on noticing the caller stopped or on composing the reply.`,
  };
}

// The impairment heatmap: every cohort crossed with every step.
//
// Load runs along one axis and the caller's network along the other, so a
// reader can see in one grid whether the agent breaks under calls, under a bad
// line, or only under both. Each row ran the same calls at the same concurrency,
// minutes apart, with only the network changed -- which is what lets a cell be
// read against the clean row above it at all.
const HEAT_METRICS = [
  ["p50", "p50 TTFA", s => s.ttfa && s.ttfa.p50_ms, v => ms(v)],
  ["p90", "p90 TTFA", s => s.ttfa && s.ttfa.p90_ms, v => ms(v)],
  ["p95", "p95 TTFA", s => s.ttfa && s.ttfa.p95_ms, v => ms(v)],
  ["agent_p95", "agent p95", s => s.agent_ttfa && s.agent_ttfa.p95_ms, v => ms(v)],
  ["vs_clean", "p95 × clean", s => s.vs_clean, v => v.toFixed(2) + "×"],
];

const describeNet = p => {
  const parts = [];
  if (p.delay_ms > 0 || p.jitter_ms > 0) parts.push(`+${p.delay_ms || 0}ms${p.jitter_ms > 0 ? ` ±${p.jitter_ms}ms` : ""}`);
  if (p.loss_pct > 0) parts.push(`${p.loss_pct}% loss`);
  return parts.length ? parts.join(", ") : "unimpaired";
};

function ImpairmentHeatmap({ rep }) {
  const [picked, setPicked] = useState("p95");
  const m = rep.matrix;
  if (!m || !m.cohorts || m.cohorts.length === 0) {
    return html`
      <div className="card">
        <div className="eyebrow">Network impairment</div>
        <h2>Placed on an unimpaired network</h2>
        <div className="note">
          Every call in this run left over whatever network the harness happened to have. Re-run
          with <code>-impairments profiles/impairments.json</code> from a Linux pod with NET_ADMIN
          (<code>deploy/k8s/60-impair-job.yaml</code>) and the same profile runs once per network
          condition, clean first, drawn here as a grid of load against network.
        </div>
      </div>`;
  }

  const metric = HEAT_METRICS.find(x => x[0] === (picked || "p95")) || HEAT_METRICS[2];
  const [, label, get, fmt] = metric;
  const steps = m.cohorts[0].steps || [];
  const values = m.cohorts.flatMap(c => (c.steps || []).map(get)).filter(v => v > 0);
  const top = Math.max(...values, 0);
  // Anchored so small differences do not saturate the scale: latency runs from
  // zero to at least a second, the ratio from parity to at least 2.5x.
  const intensity = v => metric[0] === "vs_clean"
    ? Math.min(Math.max((v - 1) / Math.max(top - 1, 1.5), 0), 1)
    : Math.min(v / Math.max(top, 1000), 1);
  const fill = t => `color-mix(in srgb, var(--signal) ${Math.round(6 + t * 82)}%, var(--surface))`;

  return html`
    <div className="card">
      <div className="eyebrow">Network impairment</div>
      <h2>Load against network</h2>
