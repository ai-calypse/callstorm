apiVersion: v1
kind: ServiceAccount
metadata:
  name: callstorm-prometheus
  namespace: callstorm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: callstorm-prometheus
  namespace: callstorm
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: callstorm-prometheus
  namespace: callstorm
subjects:
  - kind: ServiceAccount
    name: callstorm-prometheus
    namespace: callstorm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: callstorm-prometheus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: callstorm-prometheus
  namespace: callstorm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: callstorm
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: callstorm-prometheus
      # The image runs as "nobody" by name; pin the uid so runAsNonRoot can be verified.
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=4GB
            # Reached through `kubectl port-forward svc/prometheus 9090:9090`.
            # Without this, links the UI builds to itself use the pod's
            # hostname, which resolves nowhere outside the cluster.
            - --web.external-url=http://localhost:9090/
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: callstorm-prometheus }
        - name: data
          persistentVolumeClaim: { claimName: callstorm-prometheus }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: callstorm
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: callstorm
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/provisioning/dashboards/callstorm.json }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: provider, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true }
            - { name: dashboard, mountPath: /etc/grafana/provisioning/dashboards/callstorm.json, subPath: callstorm.json, readOnly: true }
      volumes:
        - name: datasource
          configMap: { name: callstorm-grafana-datasources }
        - name: provider
          configMap: { name: callstorm-grafana-provider }
        - name: dashboard
          configMap: { name: callstorm-grafana-dashboard }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: callstorm
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
