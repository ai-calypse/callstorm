# Scale on calls waiting to be placed, rather than on CPU.
#
# Consumer lag on the assignment topic is the number of calls the dispatcher has
# handed out that no worker has picked up yet. That is the load, directly: it
# rises the moment a step out-runs the fleet and falls the moment the fleet
# catches up, with none of CPU's blindness to a caller asleep on a socket.
#
# Requires KEDA. Apply after: kubectl apply --server-side -f \
#   https://github.com/kedacore/keda/releases/download/v2.15.1/keda-2.15.1.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: callstorm-worker
  namespace: callstorm
spec:
  scaleTargetRef:
    name: callstorm-worker
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: redpanda.callstorm.svc.cluster.local:9092
        consumerGroup: callstorm-workers
        topic: callstorm.assignments
        # One waiting call per worker is the trigger. Calls are slow -- tens of
        # seconds each -- so a queue that is even slightly behind is already
        # costing wall-clock on the run.
        lagThreshold: "1"
        offsetResetPolicy: earliest
